标志或采用印刷、模压等方式加施的CCC 标志，工厂应保存使用记录。对于下列产品，不得加施CCC 标志或放行：(a)未获认证的强制性产品认证目录内产品；(b)获证后的变更需经认证机构确认，但未"}},{"id":555,"type":1,"num":57,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，关于检验试验仪器设备的功能检查，下列说法正确的有（）。","opts":["必要时，工厂应按规定要求对例行检验设备实施功能检查","当发现功能检查结果不能满足要求时，应能追溯至已检测过的产品","必要时，应对这些产品重新检测","工厂应规定操作人员在发现仪器设备功能失效时需采取的措施"],"ans":"ABCD","src":{"label":"《汇编》第224页","text":"或检定，校准或检定周期可按仪器设备的使用频率、前次校准情况等设定；对内部校准的，工厂应规定校准方法、验收准则和校准周期等；校准或检定应溯源至国家或国际基准。仪器设备的校准或检定状态应能被使用及管理人员方便识别。工厂应保存仪器设备的校准或检定记录。对于委托外部机构进行的校准或检定活动，工厂应确保外部机构的能力满足校准或检定要求，并保存相关能力评价结果。注：对于生产过程控制中的关键监视测量装置，工厂应根据产品认证实施规则/细则的要求进行管理。3.6.3 功能检查必要时，工厂应按规定要求对例行检验设备实施功能检查。"}},{"id":556,"type":1,"num":58,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，工厂应建立并保持文件化的程序，对最终产品的例行检验和/或确认检验进行控制；检验程序应符合规定要求，程序的内容应包括（）等。","opts":["检验频次","检验项目、内容","检验方法","判定"],"ans":"ABCD","src":{"label":"《汇编》第222页","text":"相应的能力；关键工序的控制应确保认证产品与标准的符合性、产品一致性；如果关键工序没有文件规定就不能保证认证产品质量时，则应制定相应的作业指导书，使生产过程受控。3.4.2 产品生产过程如对环境条件有要求,工厂应保证工作环境满足规定要求。3.4.3 必要时，工厂应对适宜的过程参数进行监视、测量。3.4.4 工厂应建立并保持对生产设备的维护保养制度，以确保设备的能力持续满足生产要求。3.4.5 必要时，工厂应按规定要求在生产的适当阶段对产品及其特性进行检查、监视、测量，以确保产品与标准的符合性及产品一致性。"}},{"id":557,"type":1,"num":59,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，对于采购关键件的质量特性，工厂应选择适当的控制方式以确保持续满足关键件的技术要求，适当的控制方式可包括（）。","opts":["获得CCC 证书或可为最终产品强制性认证承认的自愿性产品认证结果，工厂应确保其证书状态的有效","没有获得相关证书的关键件，其定期确认检验应符合产品认证实施规则/细则的要求","工厂自身制定控制方案，其控制效果不低于前两种方式的要求","不采取任何控制方式"],"ans":"ABC","src":{"label":"《汇编》第220页","text":"对于采购的关键件，工厂应识别并在采购文件中明确其技术要求，该技术要求还应确保最终产品满足认证要求。工厂应建立、保持关键件合格生产者/生产企业名录并从中采购关键件，工厂应保存关键件采购、使用等记录，如进货单、出入库单、台帐等。3.3.2 关键件的质量控制3.2.2.1 工厂应建立并保持文件化的程序，在进货（入厂）时完成对采购关键件的技术要求进行验证和/或检验并保存相关记录。3.3.2.2 对于采购关键件的质量特性，工厂应选择适当的控制方式以确保持续满足关键件的技术要求，以及最终产品满足认证要求，并保存相关记录。"}},{"id":558,"type":1,"num":60,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，工厂在采购、生产制造、检验等环节所进行的产品防护，如（）等应符合规定要求。","opts":["标识","搬运","包装、贮存","保护"],"ans":"ABCD","src":{"label":"《汇编》第227页","text":"付等适用的质量环节，对产品一致性进行控制，以确保产品持续符合认证依据标准要求。3.10 产品防护与交付工厂在采购、生产制造、检验等环节所进行的产品防护，如标识、搬运、包装、贮存、保护等应符合规定要求。必要时，工厂应按规定要求对产品的交付过程进行控制。3.11CCC 证书和标志工厂对CCC 证书和标志的管理及使用应符合《强制性产品认证管理规定》、《强制性产品认证标志管理办法》等规定。对于统一印制的标准规格CCC 标志或采用印刷、模压等方式加施的CCC 标志，工厂应保存使用记录。对于下列产品，不得加施CCC 标志或放行：(a)未获认证的强制性产品认证目录内产品；(b)获证后的变更需经认证机构确认，但未"}},{"id":559,"type":1,"num":61,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，关于工厂职责的确定，下列说法正确的有（）。","opts":["工厂应规定与认证要求有关的各类人员职责、权限及相互关系","工厂应在本组织管理层中指定质量负责人","质量负责人应具有充分的能力胜任本职工作","质量负责人不得同时担任认证技术负责人"],"ans":"ABC","src":{"label":"《汇编》第217页","text":"标准要求，并保证认证产品与型式试验样品一致。工厂应接受并配合认证机构依据本实施规则及相关产品认证实施规则/细则所实施的各类工厂现场检查、市场检查、抽样检测。3.1 职责和资源3.1.1 职责工厂应规定与认证要求有关的各类人员职责、权限及相互关系，并在本组织管理层中指定质量负责人，无论该成员在其它方面的职责如何，应使其具有以下方面的职责和权限：(a)确保本文件的要求在工厂得到有效地建立、实施和保持；(b)确保产品一致性以及产品与标准的符合性；(c)正确使用CCC 证书和标志，确保加施CCC 标志产品的证书状态持续有效。"}},{"id":560,"type":1,"num":62,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，关键件是对产品满足认证依据标准要求起关键作用的（）等的统称。","opts":["元器件","零部件","原材料","包装材料"],"ans":"ABC","src":{"label":"《汇编》第216页","text":"品认证实施规则/细则的要求，实施抽样检验。2.4 确认检验为验证认证产品是否持续符合认证依据标准所进行的抽样检验。2.5 关键件定期确认检验为验证关键件的质量特性是否持续符合认证依据标准和/或技术要求所进行的定期抽样检验。注：关键件是对产品满足认证依据标准要求起关键作用的元器件、零部件、原材料等的统称。2.6 功能检查为判断检验试验仪器设备的预期功能是否满足规定要求所进行的检查。"}},{"id":561,"type":1,"num":63,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，对于采购的关键件，下列说法正确的有（）。","opts":["工厂应识别并在采购文件中明确其技术要求","该技术要求还应确保最终产品满足认证要求","无需在采购文件中明确关键件的技术要求","采购文件仅需载明采购数量"],"ans":"AB","src":{"label":"《汇编》第220页","text":"对于采购的关键件，工厂应识别并在采购文件中明确其技术要求，该技术要求还应确保最终产品满足认证要求。工厂应建立、保持关键件合格生产者/生产企业名录并从中采购关键件，工厂应保存关键件采购、使用等记录，如进货单、出入库单、台帐等。3.3.2 关键件的质量控制3.2.2.1 工厂应建立并保持文件化的程序，在进货（入厂）时完成对采购关键件的技术要求进行验证和/或检验并保存相关记录。3.3.2.2 对于采购关键件的质量特性，工厂应选择适当的控制方式以确保持续满足关键件的技术要求，以及最终产品满足认证要求，并保存相关记录。"}},{"id":562,"type":1,"num":64,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，关于例行检验，下列说法正确的有（）。","opts":["为剔除生产过程中偶然性因素造成的不合格品","通常在生产的最终阶段，对认证产品进行的100%检验","例行检验允许用经验证后确定的等效、快速的方法进行","对于特殊产品，例行检验可以按照产品认证实施规则/细则的要求，实施抽样检验"],"ans":"ABCD","src":{"label":"《汇编》第215页","text":"据之一。2.术语和定义2.1 认证技术负责人属于生产者和/或生产企业内部人员，掌握认证依据标准要求，依据产品认证实施规则/细则规定的职责范围，对认证产品变更进行确认批准并承担相应责任的人。2.2 认证产品一致性（产品一致性）生产的认证产品与型式试验样品保持一致，产品一致性的具体要求由产品认证实施规则/细则规定。2.3 例行检验为剔除生产过程中偶然性因素造成的不合格品，通常在生产的最终阶段，对认证产品进行的100%检验。"}},{"id":563,"type":1,"num":65,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，对于需以租赁方式使用的外部资源，下列说法正确的有（）。","opts":["工厂应确保外部资源的持续可获得性和正确使用","工厂应保存与外部资源相关的记录","外部资源相关的记录包括合同协议、使用记录等","工厂无需保存外部资源相关记录"],"ans":"ABC","src":{"label":"《汇编》第218页","text":"作，质量负责人可同时担任认证技术负责人。3.1.2 资源工厂应配备必须的生产设备、检验试验仪器设备以满足稳定生产符合认证依据标准要求产品的需要；应配备相应的人力资源，确保从事对产品认证质量有影响的工作人员具备必要的能力；应建立并保持适宜的产品生产、检验试验、储存等必备的环境和设施。对于需以租赁方式使用的外部资源，工厂应确保外部资源的持续可获得性和正确使用；工厂应保存与外部资源相关的记录，如合同协议、使用记录等。3.2 文件和记录3.2.1 工厂应建立并保持文件化的程序，确保对本文件要求的文件、必要的外来文件和记录进行有效控制。"}},{"id":564,"type":1,"num":66,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，对可能影响产品一致性的主要内容，工厂应有必要的（）等设计文件，并确保文件的持续有效性。","opts":["图纸","样板","关键件清单","工艺文件、作业指导书"],"ans":"ABCD","src":{"label":"《汇编》第219页","text":"品一致性的主要内容，工厂应有必要的图纸、样板、关键件清单、工艺文件、作业指导书等设计文件，并确保文件的持续有效性。3.2.2 工厂应确保文件的充分性、适宜性及使用文件的有效版本。3.2.3 工厂应确保记录的清晰、完整、可追溯，以作为产品符合规定要求的证据。与质量相关的记录保存期应满足法律法规的要求，确保在本次检查中能够获得前次检查后的记录，且至少不低于24 个月。3.2.4 工厂应识别并保存与产品认证相关的重要文件和质量信息，如型式试验报告、工厂检查结果、CCC 证书状态信息（有效、暂停、撤销、注销等）、认证变更批准信息、监督抽样检测报告、产品质量投诉及处理结果等。"}},{"id":565,"type":1,"num":67,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，下列属于来自外部的认证产品不合格信息的有（）。","opts":["国家级和省级监督抽查","产品召回","顾客投诉及抱怨","企业内部自检发现"],"ans":"ABC","src":{"label":"《汇编》第213页","text":"编号：CNCA-00C-005强制性产品认证实施规则工厂质量保证能力要求2014-01-02 发布2014-09-01 实施中国国家认证认可监督管理委员会发布"}},{"id":566,"type":1,"num":68,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，工厂应识别并保存与产品认证相关的重要文件和质量信息，如（）等。","opts":["型式试验报告","工厂检查结果","CCC 证书状态信息（有效、暂停、撤销、注销等）、认证变更批准信息","监督抽样检测报告、产品质量投诉及处理结果"],"ans":"ABCD","src":{"label":"《汇编》第219页","text":"品一致性的主要内容，工厂应有必要的图纸、样板、关键件清单、工艺文件、作业指导书等设计文件，并确保文件的持续有效性。3.2.2 工厂应确保文件的充分性、适宜性及使用文件的有效版本。3.2.3 工厂应确保记录的清晰、完整、可追溯，以作为产品符合规定要求的证据。与质量相关的记录保存期应满足法律法规的要求，确保在本次检查中能够获得前次检查后的记录，且至少不低于24 个月。3.2.4 工厂应识别并保存与产品认证相关的重要文件和质量信息，如型式试验报告、工厂检查结果、CCC 证书状态信息（有效、暂停、撤销、注销等）、认证变更批准信息、监督抽样检测报告、产品质量投诉及处理结果等。"}},{"id":567,"type":1,"num":69,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则 SO/IEC 17025）相关要求；(b)指定适当的人员负责工厂实验室管理并支持以上测试的运作；(c)确保工厂实验室人员遵从指定认证机构、实验室人员的检测安排；(d)作为三方协议中的一方，确保测试过程符合要求；(e)保持其相应认可能力范围的更新及有效。2.5.2 责任利用工厂检测资源进行样品检测，并不免除、减轻或转移《强制性产品认证管理规定》中规定的指定实验室、认证机构对检测结果、认证结果应负的责任。"}},{"id":575,"type":1,"num":77,"stem":"依据CNCA-00C-004:2013《强制性产品认证实施规则生产企业检测资源及其他认证结果的利用》，WMT 方式除与TMP 方式相同的条件要求外，还要求（）。","opts":["工厂实验室施检人员应熟悉产品结构、检测标准，具备有一定的检测经验","工厂实验室的检测记录格式能满足来现场进行工作的指定实验室对检测信息的要求","工厂应配备高级检查员","工厂应建立检测实验室管理体系"],"ans":"AB","src":{"label":"《汇编》第205页","text":"205(b)工厂质量手册应有利用工厂检测资源程序相关的规定，且与CCC认证程序要求相符；(c)工厂实验室满足GB/T 27025（ISO/IEC17025）第5章技术能力要求；(d)工厂实验室应具有相关检测项目标准要求的精度要求的仪器和设备，并良好受控。（符合GB/T 27025（ISO/IEC 17025）的技术要求部分对检测设备的所有要求）；(e)工厂实验室施检人员应熟悉产品结构、检测标准，具备有一定的检测经验；(f)工厂实验室的检测记录格式能满足来现场进行工作的指定实验室对检测信息的要求。2.4 资格获得和维持2.4.1 工厂应向认证机构提出申请，并按以上条件进行自查，将自查结果及相关资料随申请提交认证机构审查。"}},{"id":576,"type":1,"num":78,"stem":"依据CNCA-00C-004:2013《强制性产品认证实施规则生产企业检测资源及其他认证结果的利用》，本规则中所指的其他认证结果为","opts":["获得认监委批准的认证机构颁发的产品认证证书","获得认监委批准的认证机构颁发的管理体系认证证书","证书在有效期内","已过期的认证证书"],"ans":"ABC","src":{"label":"《汇编》第201页","text":"称工厂实验室）。本规则中所指的其他认证结果为获得认监委批准的认证机构颁发的产品认证证书、管理体系认证证书，且证书在有效期内。1. 术语和定义1.1 TMP 方式指定实验室直接利用工厂实验室检测设备实施检测方式(简称TMP)1.2 WMT 方式指定实验室利用工厂实验室检测设备目击检测方式(简称WMT)2. 工厂检测资源利用2.1 适用范围2.1.1 型式试验：仅限于以下CCC认证产品(a)样品体积大或易损坏，运输费用高，运送困难；或(b)产品季节性强，生命周期短；或"}},{"id":577,"type":1,"num":79,"stem":"依据CNCA-00C-004:2013《强制性产品认证实施规则生产企业检测资源及其他认证结果的利用》，下列可以利用工厂检测资源的检测活动有（）。","opts":["型式试验（符合限定范围）","获证后监督抽样检测","证书扩展和变更时补充的差异测试","日常例行检验"],"ans":"ABC","src":{"label":"《汇编》第199页","text":"编号：CNCA-00C-004强制性产品认证实施规则生产企业检测资源及其他认证结果的利用2013-09-24 发布2013-10-01 实施中国国家认证认可监督管理委员会发布"}},{"id":578,"type":1,"num":80,"stem":"依据CNCA-00C-004:2013《强制性产品认证实施规则生产企业检测资源及其他认证结果的利用》，关于利用工厂检测资源进行样品检测的责任，下列说法正确的有（）。","opts":["并不免除、减轻或转移《强制性产品认证管理规定》中规定的指定实验室对检测结果应负的责任","并不免除、减轻或转移《强制性产品认证管理规定》中规定的认证机构对认证结果应负的责任","利用工厂检测资源后，指定实验室、认证机构不再承担任何责任","由工厂实验室对检测结果承担全部责任"],"ans":"AB","src":{"label":"《汇编》第208页","text":"208(a) 确保工厂实验室符合GB/T 27025（ISO/IEC 17025）相关要求；(b)指定适当的人员负责工厂实验室管理并支持以上测试的运作；(c)确保工厂实验室人员遵从指定认证机构、实验室人员的检测安排；(d)作为三方协议中的一方，确保测试过程符合要求；(e)保持其相应认可能力范围的更新及有效。2.5.2 责任利用工厂检测资源进行样品检测，并不免除、减轻或转移《强制性产品认证管理规定》中规定的指定实验室、认证机构对检测结果、认证结果应负的责任。"}},{"id":579,"type":1,"num":81,"stem":"依据CNCA-00C-004:2013《强制性产品认证实施规则生产企业检测资源及其他认证结果的利用》，关于利用其他认证结果的责任和实施要求，下列说法正确的有（）。","opts":["利用自愿性认证结果，并不免除、减轻或转移《强制性产品认证管理规定》中规定的指定实验室、认证机构应对检测结果、认证结果应负的责任","指定认证机构应建立利用其他认证结果的管理程序","指定认证机构应保存利用其他认证结果活动记录","每年度将利用其他认证结果的情况（作为年度工作总结的一部分内容）报认监委"],"ans":"ABCD","src":{"label":"《汇编》第212页","text":"指定认证机构应建立利用其他认证结果的管理程序，保存利用其他认证结果活动记录，并每年度将利用其他认证结果的情况（作为年度工作总结的一部分内容）报认监委。3.4 收费对利用自愿性认证结果而减免的项目及内容，指定认证机构及指定实验室应对照国家有关收费规定在认证及检测环节中予以免除或减少收费。"}},{"id":580,"type":1,"num":82,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，认证机构在设计认证方案时，应在（）等方面应用生产企业分类管理结果。","opts":["认证模式确定","认证单元的划分","生产企业自有检测资源的利用","获证后监督的方案"],"ans":"ABCD","src":{"label":"《汇编》第168页","text":"编号：CNCA-00C-003强制性产品认证实施规则生产企业分类管理、认证模式选择与确定2013-09-24 发布2013-10-01 实施中国国家认证认可监督管理委员会发布"}},{"id":581,"type":1,"num":83,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，认证机构在对获证企业设计获证后监督方案时，应结合认证风险控制能力及生产企业分类管理结果确定（）。","opts":["获证后监督中所使用的不同的认证要素","不同的获证后跟踪检查方式","不同的获证后跟踪检查频次","其他"],"ans":"ABCD","src":{"label":"《汇编》第179页","text":"强制性产品认证实施规则仅明确了单元划分的基本要求。认证机构应结合认证风险控制能力及生产企业分类管理结果，在实施细则中逐级严格和细化认证单元划分要求，降低认证风险。3.5.3 生产企业自有检测资源的利用当强制性产品认证实施规则中允许实验室利用企业自有检测资源实施检测（包括型式试验和监督抽样检测等）的，认证机构应结合认证风险控制能力及生产企业分类管理结果，在实施细则中明确利用企业检测资源进行检测的条件和要求。3.5.4 获证后监督的方案认证机构在对获证企业设计获证后监督方案时，应结合认证风险控制能力及生产企业分类管理结果确定：(a)获证后监督中所使用的不同的认证要"}},{"id":582,"type":1,"num":84,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，获证产品的质量信息包括（）。","opts":["国家级、省级等各类产品质量监督抽查结果等信息","与获得强制性认证的产品及企业有关的司法判决、申投诉仲裁","消费者协会发布的信息","媒体曝光的信息"],"ans":"ABCD","src":{"label":"《汇编》第175页","text":"各类产品质量监督抽查结果等信息。以及与获得强制性认证的产品及企业有关的司法判决、申投诉仲裁、消费者协会发布、媒体曝光等信息。原则上，认证机构应对社会获得的质量信息予以核实或得到企业确认。3.3 生产企业分类管理信息的收集、分析评估和保存认证机构应建立生产企业分类管理信息的收集、分析评估和保存制度，以确保生产企业分类管理机制的有效运行。3.3.1 信息的收集认证机构可参考3.2 所列相关质量信息采集渠道，对获证企业和产品质量信息进行有效的跟踪和收集，并对信息的准确性做出验证。"}},{"id":583,"type":1,"num":85,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，认证模式由（）等认证要素组成。","opts":["型式试验","企业质量保证能力和产品一致性检查","获证后的跟踪检查","设计鉴定"],"ans":"ABCD","src":{"label":"《汇编》第168页","text":"编号：CNCA-00C-003强制性产品认证实施规则生产企业分类管理、认证模式选择与确定2013-09-24 发布2013-10-01 实施中国国家认证认可监督管理委员会发布"}},{"id":584,"type":1,"num":86,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，本规则规定了以下内容：（）。","opts":["认证机构在建立生产企业分类管理机制时应满足的基本要求","基于基本认证模式，认证机构针对生产企业所生产的产品选择和确定具体实施用认证模式的通用要求","认证收费标准","认证证书的样式"],"ans":"AB","src":{"label":"《汇编》第170页","text":"170(b)基于基本认证模式，认证机构针对生产企业所生产的产品选择和确定具体实施用认证模式的通用要求。2. 术语和定义2.1 生产企业分类管理本实施规则所称的生产企业分类管理，是指针对同类别产品的生产企业，认证机构根据其生产企业质量保证能力、诚信守法状况及所生产产品的质量状况等与质量相关的信息进行综合评价，对生产企业进行分类，从而对不同类别生产企业所生产的产品在认证模式选择、单元划分原则和获证后监督等方面实施差异化管理，以实现控制认证风险、提高认证活动的质量和效率、确保获证产品持续符合认证要求的目标。"}},{"id":585,"type":1,"num":87,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，获证后监督的质量信息可能来源于（）。","opts":["获证后的跟踪检查时获得样品的一致性","生产企业质量保证能力的持续符合性","抽样检测/检查结果的标准符合性","企业广告宣传情况"],"ans":"ABC","src":{"label":"《汇编》第174页","text":"可能来源于样品的标准符合性、生产企业的质量保证能力水平等。其中，样品检测的标准符合性可以考虑所获样品真伪、检测结果不符合项的程度等方面；生产企业的质量保证能力水平可以考虑生产产品所用原材料、零部件及其供应商的管理和控制，企业生产设备及人力资源配置的满足程度和实施连续生产的稳定性，企业质量控制和检验能力等。获证后监督的质量信息可能来源于获证后的跟踪检查时获得样品的一致性、生产企业质量保证能力的持续符合性、抽样检测/检查结果的标准符合性等情况。企业对检测/检查不符合项的整改情况、企业在检测/检查过程中与认证机构的沟通、配合的情况等也可作为参考信息使用。"}},{"id":586,"type":1,"num":88,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，生产企业分类涉及的质量信息至少应包括认证实施各环节，以及（）等方面公布或反映的质量信息。","opts":["各级政府","社会","媒体","公众"],"ans":"ABCD","src":{"label":"《汇编》第173页","text":"设置，应结合具体产品及行业特点做出规定。原则上，同一实施规则下的分类条件及分类级别保持一致。生产企业分类管理不应针对生产企业规模、产能等设置任何歧视性分类条件。生产企业分类等级仅作为认证机构对生产企业管理的依据。企业不得在市场推广、宣传等活动中使用认证机构对其的分类管理的结果，以免误导消费者。3.2 生产企业分类涉及的质量信息生产企业分类涉及的质量信息至少应包括认证实施各环节，以及各级政府、社会、媒体、公众等方面公布或反映的质量信息。3.2.1 认证实施获得的质量信息认证实施获得的质量信息包括认证机构在发证前的认证实施以及获证后监督各环节所获取的生产企业和产品质量信息。"}},{"id":587,"type":1,"num":89,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，通过生产企业分类管理，对不同类别生产企业所生产的产品在（）等方面实施差异化管理。","opts":["认证模式选择","单元划分原则","获证后监督","认证收费"],"ans":"ABC","src":{"label":"《汇编》第168页","text":"编号：CNCA-00C-003强制性产品认证实施规则生产企业分类管理、认证模式选择与确定2013-09-24 发布2013-10-01 实施中国国家认证认可监督管理委员会发布"}},{"id":588,"type":1,"num":90,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，较高风险产品等级的确定主要基于以下因素：（）。","opts":["产品成熟度一般（标准体系有待完善，并未完全与国际标准接轨）","行业欠规范、小企业/作坊式企业所占比重较大","产品工艺控制较复杂或质量依赖于原材料质量，生产控制保证能力较低","产品使用场所相对不固定、环境的安全可靠性欠缺，产品与一般消费者直接接触机会较多"],"ans":"ABCD","src":{"label":"《汇编》第187页","text":"187(b)行业欠规范、小企业/作坊式企业所占比重较大；(c)产品工艺控制较复杂或质量依赖于原材料质量，生产控制保证能力较低；(d)产品使用场所相对不固定、环境的安全可靠性欠缺，产品与一般消费者直接接触机会较多，普通消费者可自行安装、操作、使用；(e)产品不符合标准时发生严重人身、财产危害的可能性较大。原则上，具备上述三个或三个以上特征的产品为较高风险产品。对于较高风险产品确定基本认证模式时，结合产品和生产的实际特点，可考虑在获证前的认证模式中使用较为全面的认证要素，以达到有效控制认证风险的目的；获证后监督的认证要素可重点考虑使用生产现场/市场抽样检测或者检查、获证后跟踪检查，必要时，可考"}},{"id":589,"type":1,"num":91,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，认证模式还包括（）等认证要素。","opts":["生产现场抽取样品检测或者检查","市场抽样检测或者检查","认证收费","证书管理"],"ans":"AB","src":{"label":"《汇编》第168页","text":"编号：CNCA-00C-003强制性产品认证实施规则生产企业分类管理、认证模式选择与确定2013-09-24 发布2013-10-01 实施中国国家认证认可监督管理委员会发布"}},{"id":590,"type":1,"num":92,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，认证机构应建立生产企业分类管理信息的（）制度，以确保生产企业分类管理机制的有效运行。","opts":["收集","分析评估","保存","对外发布"],"ans":"ABC","src":{"label":"《汇编》第168页","text":"编号：CNCA-00C-003强制性产品认证实施规则生产企业分类管理、认证模式选择与确定2013-09-24 发布2013-10-01 实施中国国家认证认可监督管理委员会发布"}},{"id":591,"type":1,"num":93,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，一般风险产品等级的确定主要基于以下因素：（）。","opts":["产品较为成熟（安全标准完备、能够与国际标准接轨）","行业较为规范、自律意识较强的企业所占比重大","产品生产质量控制保证能力较好","产品使用场所相对固定、环境较为安全可靠，产品与普通消费者直接接触机会较少"],"ans":"ABCD","src":{"label":"《汇编》第185页","text":"家组研究确定，并通过具体产品认证实施规则予以发布。4.2.1 产品风险定级强制性产品认证目录内产品分为一般风险产品和较高风险产品等级。4.2.1.1 一般风险产品一般风险产品等级的确定主要基于以下因素：(a)产品较为成熟（安全标准完备、能够与国际标准接轨）；(b)行业较为规范、自律意识较强的企业所占比重大；(c)产品生产质量控制保证能力较好；(d)产品使用场所相对固定、环境较为安全可靠，产品与普通消费者直接接触机会较少，一般为专业人员安装、操作、使用；(e)产品不符合标准时发生严重人身、财产"}},{"id":592,"type":1,"num":94,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，发证前的认证实施过程所获得的质量信息可能来源于（）。","opts":["样品的标准符合性","生产企业的质量保证能力水平","企业财务状况","产品销售情况"],"ans":"AB","src":{"label":"《汇编》第168页","text":"编号：CNCA-00C-003强制性产品认证实施规则生产企业分类管理、认证模式选择与确定2013-09-24 发布2013-10-01 实施中国国家认证认可监督管理委员会发布"}},{"id":593,"type":1,"num":95,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，对于诚信缺失的生产企业，认证机构可在具体实施用的认证模式中选择任何必要认证要素，在认证模式的选择和确定方面，可考虑（）。","opts":["以确保能够获得生产企业真实的认证信息为目标","以提高发现存在不符合的概率为目标","以对诚信缺失的惩罚为目标","避免使用设计鉴定、利用工厂检测资源等简化方式实施认证"],"ans":"ABCD","src":{"label":"《汇编》第192页","text":"1924.3 认证模式与生产企业分类管理基本认证模式确定的前提是生产企业诚信自律、有效管理、稳定生产，而认证机构实际使用的认证模式则可基于生产企业分类管理做出进一步调整。认证机构在对生产企业进行分类管理评价过程中，若有证据、信息能够证明生产企业存在诚信缺失、产品质量管理存在风险等情况时，认证机构有必要在具体实施用的认证模式中增加认证要素控制认证风险。4.3.1 生产企业诚信缺失生产企业诚信自律是实施强制性产品认证的基础。对于诚信缺失的生产企业，认证机构可在具体实施用的认证模式中选择任何必要认证要素，以控制并促进认证结果能够持续符合认证要求。"}},{"id":594,"type":1,"num":96,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，认证机构应按照“（）”的原则建立生产企业分类管理办法及实施机制。","opts":["控制认证风险","实行差异管理","提高认证效能","统一认证标准"],"ans":"ABC","src":{"label":"《汇编》第168页","text":"编号：CNCA-00C-003强制性产品认证实施规则生产企业分类管理、认证模式选择与确定2013-09-24 发布2013-10-01 实施中国国家认证认可监督管理委员会发布"}},{"id":595,"type":1,"num":97,"stem":"依据CNCA-00C-001:2008《强制性产品认证证书注销、暂停、撤销实施规则》，认证证书注销的情形还包括（）。","opts":["认证证书有效期届满，认证委托人未申请延期使用的","认证委托人申请注销的","认证委托人申请暂停认证证书的","监督检查结果证明违反CCC 认证实施规则但通过整改可以达到认证要求的"],"ans":"AB","src":{"label":"《汇编》第147页","text":"自行制定的有关技术性、程序性文件，若与本规则不相符的，应以本规则为准。3 职责各认证机构依据本规则的规定，具体实施CCC 认证证书注销、暂停、撤销有关工作。国家认监委负责对各认证机构实施证书注销、暂停、撤销工作进行监督管理。4 认证证书的注销4.1当出现以下情形之一的，认证机构应当注销认证证书：（1）认证证书有效期届满，认证委托人未申请延期使用的；（2）认证委托人/生产厂由于企业破产、倒闭、解散、生产结构调整等原因致使获证产品不再生产，认证委托人主动放弃保持认证证书的；（3）获证产品型号已列入国家明令淘汰或"}},{"id":596,"type":1,"num":98,"stem":"依据CNCA-00C-001:2008《强制性产品认证证书注销、暂停、撤销实施规则》，认证证书暂停的情形还包括（）。","opts":["认证委托人/相关方无正当理由不接受或不能在规定的期限内接受国家有关部门或认证机构未事先通知的监督检查或监督抽样检测的","认证委托人/相关方不配合国家有关部门或认证机构依据CCC 认证实施规则在市场或销售场所抽取样品进行检测的","认证证书的信息发生变更或有证据表明生产厂的组织结构、质量保证体系发生重大变化，认证委托人未向认证机构申请变更批准或备案的","由于生产的季节性、按订单生产等原因，认证委托人申请暂停认证证书的"],"ans":"ABCD","src":{"label":"《汇编》第150页","text":"150（6）认证委托人/相关方不配合国家有关部门或认证机构依据CCC 认证实施规则在市场或销售场所抽取样品进行检测的；（7）认证证书的信息（如申请人/生产者/生产厂的名称或地址，获证产品型号或规格等）发生变更或有证据表明生产厂的组织结构、质量保证体系发生重大变化，认证委托人未向认证机构申请变更批准或备案的；（8）由于生产的季节性、按订单生产等原因，认证委托人申请暂停认证证书的；（9）其他应当暂停认证证书的情形。5.2认证证书暂停的有关规定（1）认证证书暂停期间应视为无效，暂停期间内不得出厂、进口认证证书覆盖的产品，对于已经出厂、进口的认证证书覆盖产品，认证机构须根据证书暂停原因评价产品可能存在的安全隐患，对可能对人体健康和生命安全造"}},{"id":597,"type":1,"num":99,"stem":"依据CNCA-00C-001:2008《强制性产品认证证书注销、暂停、撤销实施规则》，当出现以下情形之一的，认证机构应当注销认证证书：（）。","opts":["认证证书有效期届满，认证委托人未申请延期使用的","认证委托人/生产厂由于企业破产、倒闭、解散、生产结构调整等原因致使获证产品不再生产，认证委托人主动放弃保持认证证书的","获证产品型号已列入国家明令淘汰或者禁止生产的产品目录的","认证委托人申请注销的"],"ans":"ABCD","src":{"label":"《汇编》第147页","text":"自行制定的有关技术性、程序性文件，若与本规则不相符的，应以本规则为准。3 职责各认证机构依据本规则的规定，具体实施CCC 认证证书注销、暂停、撤销有关工作。国家认监委负责对各认证机构实施证书注销、暂停、撤销工作进行监督管理。4 认证证书的注销4.1当出现以下情形之一的，认证机构应当注销认证证书：（1）认证证书有效期届满，认证委托人未申请延期使用的；（2）认证委托人/生产厂由于企业破产、倒闭、解散、生产结构调整等原因致使获证产品不再生产，认证委托人主动放弃保持认证证书的；（3）获证产品型号已列入国家明令淘汰或"}},{"id":598,"type":1,"num":100,"stem":"依据CNCA-00C-001:2008《强制性产品认证证书注销、暂停、撤销实施规则》，国家认监委信息中心应及时对外公布有关信息，以使各关注方（如（））能有效获得有关认证证书的状态及其状态变化的信息。","opts":["地方执法部门","销售者","消费者","认证机构"],"ans":"ABC","src":{"label":"《汇编》第155页","text":"1558 信息沟通认证机构应在做出注销、暂停（含恢复）、撤销认证证书当日以适当方式通知证书持有人，并在认证证书被注销、暂停（含恢复）、撤销之日起的5 个工作日内以书面方式正式通知认证证书持有人，告知其原因及下一步要采取的必要措施，并以适当方式保留认证证书持有人已获知该信息的记录。认证机构及在认证证书被注销、暂停（含恢复）、撤销之后，须按照国家认监委CCC 认证信息数据上报工作的要求，及时报送国家认监委信息中心，以及省、自治区、直辖市质量技术监督局和各直属检验检疫局认证监管机构。国家认监委信息中心应及时对外公布有关信息，以使各关注方（如地方执法部门、销售者、消费者等）能有效获得有关认证证书的状态及其状态变化的信息（包括变化的时间、原"}},{"id":599,"type":1,"num":101,"stem":"依据CNCA-00C-001:2008《强制性产品认证证书注销、暂停、撤销实施规则》，认证证书的撤销情形还包括（）。","opts":["认证委托人/相关方违反国家法律法规、国家级或省级监督抽查结果证明产品出现严重缺陷、产品安全检测项目不合格或一致性存在严重问题的","获证产品出现缺陷而导致质量安全事故的","认证委托人/相关方未按规定使用认证证书、认证标志，出租、出借或者转让认证证书、认证标志，情节严重的","弄虚作假，采用欺骗、贿赂等不正当手段获取认证证书，或存在其他直接影响认证结果有效性的严重违法违规行为的"],"ans":"ABCD","src":{"label":"《汇编》第153页","text":"规、国家级或省级监督抽查结果证明产品出现严重缺陷、产品安全检测项目不合格或一致性存在严重问题的；（6）获证产品出现缺陷而导致质量安全事故的；（7）对由于5.1（5）、（6）条款被暂停认证证书后，仍拒绝接受监督检查或监督抽样检测，或仍不配合在市场或销售场所抽取样品进行检测的；（8）认证委托人/相关方未按规定使用认证证书、认证标志，出租、出借或者转让认证证书、认证标志，情节严重的；（9）弄虚作假，采用欺骗、贿赂等不正当手段获取认证证书，或存在其他直接影响认证结果有效性的严重违法违规行为的；（10）其他应撤销认证证书的情形。"}},{"id":600,"type":1,"num":102,"stem":"依据CNCA-00C-001:2008《强制性产品认证证书注销、暂停、撤销实施规则》，当出现以下情形之一的，认证机构应当暂停认证证书：（）。","opts":["认证委托人/相关方违反国家法律法规、国家级或省级监督抽查结果证明产品存在不合格，但不需要立即撤销认证证书的","认证产品适用的认证依据或者认证实施规则换版或变更，认证委托人在规定期限内未按要求履行变更程序，或产品未符合变更要求的","监督检查结果证明认证委托人违反CCC 认证实施规则的规定（包括产品抽样检测不合格、工厂监督检查不合格、产品一致性存在问题等）或认证机构相关要求，但通过整改可以达到认证要求的","认证委托人/相关方未按规定使用认证证书和认证标志，视情节需要开展调查的"],"ans":"ABCD","src":{"label":"《汇编》第149页","text":"律法规、国家级或省级监督抽查结果证明产品存在不合格，但不需要立即撤销认证证书的；（2）认证产品适用的认证依据或者认证实施规则换版或变更，认证委托人在规定期限内未按要求履行变更程序，或产品未符合变更要求的；（3）监督检查结果证明认证委托人违反CCC 认证实施规则的规定（包括产品抽样检测不合格、工厂监督检查不合格、产品一致性存在问题等）或认证机构相关要求，但通过整改可以达到认证要求的；（4）认证委托人/相关方未按规定使用认证证书和认证标志，视情节需要开展调查的；（5）认证委托人/相关方无正当理由不接受或不能在规定的期限内接受国家有关部门或认证机构未事先通知的监督检查或监督抽样检测的；"}},{"id":601,"type":1,"num":103,"stem":"依据CNCA-00C-001:2008《强制性产品认证证书注销、暂停、撤销实施规则》，关于认证证书注销、暂停、撤销的其他规定，下列说法正确的有（）。","opts":["认证机构应当制定严格有效的工作程序和流程，保证与认证证书注销、暂停（含恢复）、撤销有关的活动在受控的条件下正确实施","认证机构应当严格执行本规则的要求，不得擅自放宽条件","认证委托人如对认证证书的注销、暂停（含恢复）、撤销有异议的，可以向国家认监委或相关认证机构提出申诉","本规则由国家认监委负责解释"],"ans":"ABCD","src":{"label":"《汇编》第156页","text":"因、期限等）。认证机构在日常工作中应与地方认证监管部门、执法（稽查）部门加强信息沟通合作，及时收集监管执法、各级专项监督抽查、相关方投诉、媒体曝光及其他市场或行业监管部门的违法信息，对涉及强制性认证产品的，认证机构应协助对违法行为进行调查，并按相应规定对相关认证证书采取暂停、撤销等后续处理措施。9 其他事项9.1认证机构应当制定严格有效的工作程序和流程，保证与认证证书注销、暂停（含恢复）、撤销有关的活动在受控的条件下正确实施。"}},{"id":602,"type":1,"num":104,"stem":"依据CNCA-00C-001:2008《强制性产品认证证书注销、暂停、撤销实施规则》，关于被撤销认证证书的产品重新申请认证，下列说法正确的有（）。","opts":["经过整改后，认证委托人可以向认证机构重新申请认证","对被撤销认证证书的产品，相应产品型式试验报告和工厂检查报告不再有效","任何认证机构在6 个月内不得受理该产品的认证委托","受理持有产品型式试验报告和工厂检查报告的认证申请时，要制定严格的审核程序，认真确认申请认证的产品是否已被撤销认证证书"],"ans":"ABCD","src":{"label":"《汇编》第154页","text":"154（1）自认证证书撤销之日起，不得出厂、销售、进口或者在其他经营活动中使用认证证书覆盖的产品。认证机构须根据证书撤销原因评价产品可能存在的安全隐患，对可能对人体健康和生命安全造成损害的，应依照有关规定及时向质检部门进行通报或采取相应措施。（2）认证证书被撤销后，不能以任何理由恢复。经过整改后，认证委托人可以向认证机构重新申请认证。对被撤销认证证书的产品，相应产品型式试验报告和工厂检查报告不再有效。任何认证机构在6 个月内不得受理该产品的认证委托。认证机构受理持有产品型式试验报告和工厂检查报告的认证申请时，要制定严格的审核程序，认真确认申请认证的产品是否已被撤销认证证书，相应的产品型式试验报告和工厂检查报告是否有效。"}},{"id":603,"type":1,"num":105,"stem":"依据CNCA-00C-001:2008《强制性产品认证证书注销、暂停、撤销实施规则》，认证机构在日常工作中应与地方认证监管部门、执法（稽查）部门加强信息沟通合作，及时收集（）及其他市场或行业监管部门的违法信息。","opts":["监管执法信息","各级专项监督抽查信息","相关方投诉","媒体曝光"],"ans":"ABCD","src":{"label":"《汇编》第156页","text":"因、期限等）。认证机构在日常工作中应与地方认证监管部门、执法（稽查）部门加强信息沟通合作，及时收集监管执法、各级专项监督抽查、相关方投诉、媒体曝光及其他市场或行业监管部门的违法信息，对涉及强制性认证产品的，认证机构应协助对违法行为进行调查，并按相应规定对相关认证证书采取暂停、撤销等后续处理措施。9 其他事项9.1认证机构应当制定严格有效的工作程序和流程，保证与认证证书注销、暂停（含恢复）、撤销有关的活动在受控的条件下正确实施。"}},{"id":604,"type":1,"num":106,"stem":"依据CNCA-00C-001:2008《强制性产品认证证书注销、暂停、撤销实施规则》，关于认证证书撤销的有关事项，下列说法正确的有（）。","opts":["自认证证书撤销之日起，不得出厂、销售、进口或者在其他经营活动中使用认证证书覆盖的产品","认证机构须根据证书撤销原因评价产品可能存在的安全隐患","对可能对人体健康和生命安全造成损害的，应依照有关规定及时向质检部门进行通报或采取相应措施","认证证书被撤销后，不能以任何理由恢复"],"ans":"ABCD","src":{"label":"《汇编》第154页","text":"154（1）自认证证书撤销之日起，不得出厂、销售、进口或者在其他经营活动中使用认证证书覆盖的产品。认证机构须根据证书撤销原因评价产品可能存在的安全隐患，对可能对人体健康和生命安全造成损害的，应依照有关规定及时向质检部门进行通报或采取相应措施。（2）认证证书被撤销后，不能以任何理由恢复。经过整改后，认证委托人可以向认证机构重新申请认证。对被撤销认证证书的产品，相应产品型式试验报告和工厂检查报告不再有效。任何认证机构在6 个月内不得受理该产品的认证委托。认证机构受理持有产品型式试验报告和工厂检查报告的认证申请时，要制定严格的审核程序，认真确认申请认证的产品是否已被撤销认证证书，相应的产品型式试验报告和工厂检查报告是否有效。"}},{"id":605,"type":1,"num":107,"stem":"依据CNCA-00C-001:2008《强制性产品认证证书注销、暂停、撤销实施规则》，当出现以下情形之一的，认证机构应当撤销认证证书：（）。","opts":["在认证证书暂停期限届满，认证委托人未提出认证证书恢复申请、未采取整改措施或者整改后仍不合格的","获证产品的关键元器件、规格和型号，以及涉及整机安全或者电磁兼容的设计、结构、工艺及重要材料/原材料生产企业等发生变更，导致产品存在严重安全隐患的","认证机构的跟踪检查结果证明工厂质量保证能力存在严重缺陷的","认证委托人提供虚假样品，获证产品与型式实验样品不一致的"],"ans":"ABCD","src":{"label":"《汇编》第152页","text":"改并符合相关要求的，认证机构应当恢复其认证证书。7 认证证书的撤销7.1当出现以下情形之一的，认证机构应当撤销认证证书：（1）在认证证书暂停期限届满，认证委托人未提出认证证书恢复申请、未采取整改措施或者整改后仍不合格的；（2）获证产品的关键元器件、规格和型号，以及涉及整机安全或者电磁兼容的设计、结构、工艺及重要材料/原材料生产企业等发生变更，导致产品存在严重安全隐患的；（3）认证机构的跟踪检查结果证明工厂质量保证能力存在严重缺陷的；（4）认证委托人提供虚假样品，获证产品与型式实验样品不一致的；（5）认证委托人/相关方违反国家法律法"}},{"id":606,"type":1,"num":108,"stem":"依据CNCA-00C-001:2008《强制性产品认证证书注销、暂停、撤销实施规则》，认证证书的暂停情形还包括（）。","opts":["其他应当暂停认证证书的情形","认证产品适用的认证依据或者认证实施规则换版或变更，认证委托人在规定期限内未按要求履行变更程序，或产品未符合变更要求的","认证委托人申请注销的","获证产品型号已列入国家明令淘汰或者禁止生产的产品目录的"],"ans":"AB","src":{"label":"《汇编》第149页","text":"律法规、国家级或省级监督抽查结果证明产品存在不合格，但不需要立即撤销认证证书的；（2）认证产品适用的认证依据或者认证实施规则换版或变更，认证委托人在规定期限内未按要求履行变更程序，或产品未符合变更要求的；（3）监督检查结果证明认证委托人违反CCC 认证实施规则的规定（包括产品抽样检测不合格、工厂监督检查不合格、产品一致性存在问题等）或认证机构相关要求，但通过整改可以达到认证要求的；（4）认证委托人/相关方未按规定使用认证证书和认证标志，视情节需要开展调查的；（5）认证委托人/相关方无正当理由不接受或不能在规定的期限内接受国家有关部门或认证机构未事先通知的监督检查或监督抽样检测的；"}},{"id":607,"type":1,"num":109,"stem":"依据CNCA-00C-001:2008《强制性产品认证证书注销、暂停、撤销实施规则》，认证机构在认证证书被注销、暂停（含恢复）、撤销之后，须按照国家认监委CCC 认证信息数据上报工作的要求，及时报送（）。","opts":["国家认监委信息中心","省、自治区、直辖市质量技术监督局","各直属检验检疫局认证监管机构","中国认证认可协会"],"ans":"ABC","src":{"label":"《汇编》第155页","text":"1558 信息沟通认证机构应在做出注销、暂停（含恢复）、撤销认证证书当日以适当方式通知证书持有人，并在认证证书被注销、暂停（含恢复）、撤销之日起的5 个工作日内以书面方式正式通知认证证书持有人，告知其原因及下一步要采取的必要措施，并以适当方式保留认证证书持有人已获知该信息的记录。认证机构及在认证证书被注销、暂停（含恢复）、撤销之后，须按照国家认监委CCC 认证信息数据上报工作的要求，及时报送国家认监委信息中心，以及省、自治区、直辖市质量技术监督局和各直属检验检疫局认证监管机构。国家认监委信息中心应及时对外公布有关信息，以使各关注方（如地方执法部门、销售者、消费者等）能有效获得有关认证证书的状态及其状态变化的信息（包括变化的时间、原"}},{"id":608,"type":1,"num":110,"stem":"国务院认证认可监督管理部门和地方认证监督管理部门及其工作人员，滥用职权、徇私舞弊、玩忽职守，有下列哪些行为之一的，依法给予行政处分；构成犯罪的，依法追究刑事责任？","opts":["发现认证机构以及与认证有关的检查机构、实验室出具虚假结论或者严重失实结论，不予查处的","不按照本条例规定的条件和程序，实施批准和指定的","发现认证机构不再符合本条例规定的批准或者指定条件，不撤销批准文件或者指定的","发现指定的实验室不再符合本条例规定的指定条件，不撤销指定的"],"ans":"ABCD","src":{"label":"《汇编》第28页","text":"28（二）发现认证机构不再符合本条例规定的批准或者指定条件，不撤销批准文件或者指定的；（三）发现指定的实验室不再符合本条例规定的指定条件，不撤销指定的；（四）发现认证机构以及与认证有关的检查机构、实验室出具虚假的认证以及与认证有关的检查、检测结论或者出具的认证以及与认证有关的检查、检测结论严重失实，不予查处的；（五）发现本条例规定的其他认证认可违法行为，不予查处的。第七十条伪造、冒用、买卖认证标志或者认证证书的，依照《中华人民共和国产品质量法》等法律的规定查处。第七十一条本条例规定的行政处罚，由国务院认证认可监督管理部门或者其授权的地方认证监督管理部门按照各自职责实施。"}},{"id":609,"type":1,"num":111,"stem":"国务院认证认可监督管理部门指定的从事列入目录产品认证活动的认证机构以及与认证有关的实验室，应当符合下列哪些要求？","opts":["应当确保在每一列入目录产品领域至少指定两家符合本条例规定条件的机构","长期从事相关业务、无不良记录","具备从事相关认证活动能力","已经依照本条例的规定取得认可"],"ans":"ABCD","src":{"label":"《汇编》第14页","text":"程序，统一标志，统一收费标准。统一的产品目录（以下简称目录）由国务院认证认可监督管理部门会同国务院有关部门制定、调整，由国务院认证认可监督管理部门发布，并会同有关方面共同实施。第二十九条列入目录的产品，必须经国务院认证认可监督管理部门指定的认证机构进行认证。列入目录产品的认证标志，由国务院认证认可监督管理部门统一规定。第三十条列入目录的产品，涉及进出口商品检验目录的，应当在进出口商品检验时简化检验手续。第三十一条国务院认证认可监督管理部门指定的从事列入目录产品认证活动的认证机构以及与认证有关的实验室（以下简称指定的认证机构、实验室），应当是长期从事相关业务、无不良记录，且已经依照本条例的规定取得认可、具备从事相关认证活动能力的机构。"}},{"id":610,"type":1,"num":112,"stem":"为了保护（），国家规定相关产品必须经过认证的，应当经过认证并标注认证标志后，方可出厂、销售、进口或者在其他经营活动中使用。","opts":["防止欺诈行为","动植物生命或者健康、环境","人体健康或者安全","国家安全"],"ans":"ABCD","src":{"label":"《汇编》第13页","text":"关文字、符号，误导公众认为其产品、服务已通过认证。第二十五条认证机构可以自行制定认证标志。认证机构自行制定的认证标志的式样、文字和名称，不得违反法律、行政法规的规定，不得与国家推行的认证标志相同或者近似，不得妨碍社会管理，不得有损社会道德风尚。第二十六条认证机构应当对其认证的产品、服务、管理体系实施有效的跟踪调查，认证的产品、服务、管理体系不能持续符合认证要求的，认证机构应当暂停其使用直至撤销认证证书，并予公布。第二十七条为了保护国家安全、防止欺诈行为、保护人体健康或者安全、保护动植物生命或者健康、保护环境，国家规定相关产品必须经过认证的，应当经过认证并标注认证标志后，方可出厂、销售、进口或者在其他经营活动中使用。"}},{"id":611,"type":1,"num":113,"stem":"下列哪些认证认可活动不适用本条例？","opts":["实验动物质量合格认证","药品生产、经营企业质量管理规范认证","军工产品的认证","从事军工产品校准、检测的实验室及其人员的认可"],"ans":"ABCD","src":{"label":"《汇编》第29页","text":"第七十二条认证人员自被撤销执业资格之日起5 年内，认可机构不再受理其注册申请。第七十三条认证机构未对其认证的产品实施有效的跟踪调查，或者发现其认证的产品不能持续符合认证要求，不及时暂停或者撤销认证证书和要求其停止使用认证标志给消费者造成损失的，与生产者、销售者承担连带责任。第七章附则第七十四条药品生产、经营企业质量管理规范认证，实验动物质量合格认证，军工产品的认证，以及从事军工产品校准、检测的实验室及其人员的认可，不适用本条例。依照本条例经批准的认证机构从事矿山、危险化学品、烟花爆竹生产经营单位管理体系认证，由国务院安全生产监督管理部门结合安全生产的特殊要求组织；从事矿山、危险化学品、烟花爆竹生产经营单位安全生产综合评价的认证机构，经国务院安全生产监督管理部门推荐，方可取得认可机构的认可。"}},{"id":612,"type":1,"num":114,"stem":"认证基本规范、认证规则由国务院认证认可监督管理部门制定；涉及国务院有关部门职责的，国务院认证认可监督管理部门应当会同国务院有关部门制定。关于认证基本规范、认证规则，下列哪些说法符合本条例规定？","opts":["认证机构应当按照认证基本规范、认证规则从事认证活动","属于认证新领域，前款规定的部门尚未制定认证规则的，认证机构可以自行制定认证规则","认证机构可以自行决定不适用认证基本规范","认证机构自行制定的认证规则应当报国务院认证认可监督管理部门备案"],"ans":"ABD","src":{"label":"《汇编》第11页","text":"第十七条认证机构应当按照认证基本规范、认证规则从事认证活动。认证基本规范、认证规则由国务院认证认可监督管理部门制定；涉及国务院有关部门职责的，国务院认证认可监督管理部门应当会同国务院有关部门制定。属于认证新领域，前款规定的部门尚未制定认证规则的，认证机构可以自行制定认证规则，并报国务院认证认可监督管理部门备案。第十八条任何法人、组织和个人可以自愿委托依法设立的认证机构进行产品、服务、管理体系认证。第十九条认证机构不得以委托人未参加认证咨询或者认证培训等为理由，拒绝提供本认证机构业务范围内的认证服务，也不得向委托人提出与认证活动无关的要求或者限制条件。第二十条认证机构应当公开认证基本规范、认证规则、收费标准等信息。"}},{"id":613,"type":1,"num":115,"stem":"取得认证机构资质，应当符合下列哪些条件？","opts":["有符合认证认可要求的管理制度","注册资本不得少于人民币300 万元，有10 名以上相应领域的专职认证人员","取得法人资格","有固定的场所和必要的设施"],"ans":"ABCD","src":{"label":"《汇编》第8页","text":"第八条从事认证认可活动的机构及其人员，对其所知悉的国家秘密和商业秘密负有保密义务。第二章认证机构第九条取得认证机构资质，应当经国务院认证认可监督管理部门批准，并在批准范围内从事认证活动。未经批准，任何单位和个人不得从事认证活动。第十条取得认证机构资质，应当符合下列条件：（一）取得法人资格；（二）有固定的场所和必要的设施；（三）有符合认证认可要求的管理制度；（四）注册资本不得少于人民币300 万元；（五）有10 名以上相应领域的专职认证人员。"}},{"id":614,"type":1,"num":116,"stem":"关于认证证书，下列哪些说法符合本条例规定？","opts":["认证结论为产品、服务、管理体系符合认证要求的，认证机构应当及时向委托人出具认证证书","认证机构应当对其认证的产品、服务、管理体系实施有效的跟踪调查","获得认证证书的，应当在认证范围内使用认证证书和认证标志","认证的产品、服务、管理体系不能持续符合认证要求的，认证机构应当暂停其使用直至撤销认证证书，并予公布"],"ans":"ABCD","src":{"label":"《汇编》第13页","text":"关文字、符号，误导公众认为其产品、服务已通过认证。第二十五条认证机构可以自行制定认证标志。认证机构自行制定的认证标志的式样、文字和名称，不得违反法律、行政法规的规定，不得与国家推行的认证标志相同或者近似，不得妨碍社会管理，不得有损社会道德风尚。第二十六条认证机构应当对其认证的产品、服务、管理体系实施有效的跟踪调查，认证的产品、服务、管理体系不能持续符合认证要求的，认证机构应当暂停其使用直至撤销认证证书，并予公布。第二十七条为了保护国家安全、防止欺诈行为、保护人体健康或者安全、保护动植物生命或者健康、保护环境，国家规定相关产品必须经过认证的，应当经过认证并标注认证标志后，方可出厂、销售、进口或者在其他经营活动中使用。"}},{"id":615,"type":1,"num":117,"stem":"国务院认证认可监督管理部门可以采取下列哪些方式，对认证机构遵守本条例的情况进行监督？","opts":["对认证活动和认证结果进行抽查","向被认证企业征求意见","组织同行评议","要求认证机构以及与认证有关的检查机构、实验室报告业务活动情况"],"ans":"ABCD","src":{"label":"《汇编》第19页","text":"认可的机构进行复评审，以验证其是否持续符合认可条件。取得认可的机构和人员不再符合认可条件的，认可机构应当撤销认可证书，并予公布。取得认可的机构的从业人员和主要负责人、设施、自行制定的认证规则等与认可条件相关的情况发生变化的，应当及时告知认可机构。第四十八条认可机构不得接受任何可能对认可活动的客观公正产生影响的资助。第四十九条境内的认证机构、检查机构、实验室取得境外认可机构认可的，应当向国务院认证认可监督管理部门备案。第五章监督管理第五十条国务院认证认可监督管理部门可以采取组织同行评议，向被认证企业征求意见，对认证活动和认证结果进行抽查，要求认证机构以及与认证有关的检查机构、实验室报告业务活动情况的方式，对其遵守本条例的情况进行监督。"}},{"id":616,"type":1,"num":118,"stem":"下列哪些属于本条例规定的、国家规定相关产品必须经过认证所保护的法益？","opts":["保护动植物生命或者健康、保护环境","保护人体健康或者安全","防止欺诈行为","国家安全"],"ans":"ABCD","src":{"label":"《汇编》第13页","text":"关文字、符号，误导公众认为其产品、服务已通过认证。第二十五条认证机构可以自行制定认证标志。认证机构自行制定的认证标志的式样、文字和名称，不得违反法律、行政法规的规定，不得与国家推行的认证标志相同或者近似，不得妨碍社会管理，不得有损社会道德风尚。第二十六条认证机构应当对其认证的产品、服务、管理体系实施有效的跟踪调查，认证的产品、服务、管理体系不能持续符合认证要求的，认证机构应当暂停其使用直至撤销认证证书，并予公布。第二十七条为了保护国家安全、防止欺诈行为、保护人体健康或者安全、保护动植物生命或者健康、保护环境，国家规定相关产品必须经过认证的，应当经过认证并标注认证标志后，方可出厂、销售、进口或者在其他经营活动中使用。"}},{"id":617,"type":1,"num":119,"stem":"认可机构有下列哪些情形的，责令改正，对主要负责人和负有责任的人员给予警告？","opts":["未对认可过程作出完整记录，归档留存的","发现取得认可的机构不当使用认可证书和认可标志，不及时暂停其使用或者撤销认可证书并予公布的","未在公布的时间内完成认可活动，或者未公开认可条件、认可程序、收费标准等信息的","受理认可申请，向申请人提出与认可活动无关的要求或者限制条件的"],"ans":"ABCD","src":{"label":"《汇编》第27页","text":"第六十八条认可机构有下列情形之一的，责令改正；对主要负责人和负有责任的人员给予警告：（一）受理认可申请，向申请人提出与认可活动无关的要求或者限制条件的；（二）未在公布的时间内完成认可活动，或者未公开认可条件、认可程序、收费标准等信息的；（三）发现取得认可的机构不当使用认可证书和认可标志，不及时暂停其使用或者撤销认可证书并予公布的；（四）未对认可过程作出完整记录，归档留存的。第六十九条国务院认证认可监督管理部门和地方认证监督管理部门及其工作人员，滥用职权、徇私舞弊、玩忽职守，有下列行为之一的，对直接负责的主管人员和其他直接责任人员，依法给予降级或者撤职的行政处分；构成犯罪的，依法追究刑事责任：（一）不按照本条例规定的条件和程序，实施批准和指定的；"}},{"id":618,"type":1,"num":120,"stem":"下列哪些说法符合本条例关于认可证书和认可标志的规定？","opts":["认可证书应当包括认可范围、认可标准、认可领域和有效期限","取得认可的机构可以在取得认可的范围内外随意使用认可证书和认可标志","取得认可的机构不当使用认可证书和认可标志的，认可机构应当暂停其使用直至撤销认可证书，并予公布","取得认可的机构应当在取得认可的范围内使用认可证书和认可标志"],"ans":"ACD","src":{"label":"《汇编》第18页","text":"规定，完成对认证机构、检查机构、实验室的评审，作出是否给予认可的决定，并对认可过程作出完整记录，归档留存。认可机构应当确保认可的客观公正和完整有效，并对认可结论负责。认可机构应当向取得认可的认证机构、检查机构、实验室颁发认可证书，并公布取得认可的认证机构、检查机构、实验室名录。第四十四条认可机构应当按照国家标准和国务院认证认可监督管理部门的规定，对从事评审、审核等认证活动的人员进行考核，考核合格的，予以注册。第四十五条认可证书应当包括认可范围、认可标准、认可领域和有效期限。第四十六条取得认可的机构应当在取得认可的范围内使用认可证书和认可标志。取得认可的机构不当使用认可证书和认可标志的，认可机构应当暂停其使用直至撤销认可证书，并予公布。"}},{"id":619,"type":1,"num":121,"stem":"认证机构有下列哪些情形的，责令限期改正；逾期未改正的，处2 万元以上10 万元以下的罚款？","opts":["未公开认证基本规范、认证规则、收费标准等信息的","以委托人未参加认证咨询或者认证培训等为理由，拒绝提供本认证机构业务范围内的认证服务，或者向委托人提出与认证活动无关的要求或者限制条件的","未及时向其认证的委托人出具认证证书的","自行制定的认证标志的式样、文字和名称，与国家推行的认证标志相同或者近似，或者妨碍社会管理，或者有损社会道德风尚的"],"ans":"ABCD","src":{"label":"《汇编》第23页","text":"23（一）超出批准范围从事认证活动的；（二）增加、减少、遗漏认证基本规范、认证规则规定的程序的；（三）未对其认证的产品、服务、管理体系实施有效的跟踪调查，或者发现其认证的产品、服务、管理体系不能持续符合认证要求，不及时暂停其使用或者撤销认证证书并予公布的；（四）聘用未经认可机构注册的人员从事认证活动的。与认证有关的检查机构、实验室增加、减少、遗漏认证基本规范、认证规则规定的程序的，依照前款规定处罚。第六十条认证机构有下列情形之一的，责令限期改正；逾期未改正的，处2 万元以上10 万元以下的罚款：（一）以委托人未参加认证咨询或者认证培训等为理由，拒绝提供本认证机构业务范围内的认证服务，或者向委托人提出与认证活动无关的要求或者限制条件的；"}},{"id":620,"type":1,"num":122,"stem":"关于国际互认，下列哪些说法符合本条例规定？","opts":["指定的认证机构、实验室开展国际互认活动，应当在国务院认证认可监督管理部门或者经授权的国务院有关部门对外签署的国际互认协议框架内进行","国家鼓励平等互利地开展认证认可国际互认活动","认证认可国际互认活动不得损害国家安全和社会公共利益","国际互认活动可以不受任何限制"],"ans":"ABC","src":{"label":"《汇编》第16页","text":"时的认证、检查、检测服务，不得拖延，不得歧视、刁难委托人，不得牟取不当利益。指定的认证机构不得向其他机构转让指定的认证业务。第三十五条指定的认证机构、实验室开展国际互认活动，应当在国务院认证认可监督管理部门或者经授权的国务院有关部门对外签署的国际互认协议框架内进行。第四章认可第三十六条国务院认证认可监督管理部门确定的认可机构（以下简称认可机构），独立开展认可活动。除国务院认证认可监督管理部门确定的认可机构外，其他任何单位不得直接或者变相从事认可活动。其他单位直接或者变相从事认可活动的，其认可结果无效。"}},{"id":621,"type":1,"num":123,"stem":"指定的认证机构、实验室应当在指定业务范围内，为委托人提供方便、及时的认证、检查、检测服务，不得（）。","opts":["拖延","歧视、刁难委托人","向其他机构转让指定的认证业务","牟取不当利益"],"ans":"ABCD","src":{"label":"《汇编》第16页","text":"时的认证、检查、检测服务，不得拖延，不得歧视、刁难委托人，不得牟取不当利益。指定的认证机构不得向其他机构转让指定的认证业务。第三十五条指定的认证机构、实验室开展国际互认活动，应当在国务院认证认可监督管理部门或者经授权的国务院有关部门对外签署的国际互认协议框架内进行。第四章认可第三十六条国务院认证认可监督管理部门确定的认可机构（以下简称认可机构），独立开展认可活动。除国务院认证认可监督管理部门确定的认可机构外，其他任何单位不得直接或者变相从事认可活动。其他单位直接或者变相从事认可活动的，其认可结果无效。"}},{"id":622,"type":1,"num":124,"stem":"关于认证人员，下列哪些说法符合本条例规定？","opts":["认证人员从事认证活动，不在认证机构执业或者同时在两个以上认证机构执业的，责令改正，给予停止执业6 个月以上2 年以下的处罚","认证人员从事认证活动，应当在一个认证机构执业，不得同时在两个以上认证机构执业","从事评审、审核等认证活动的人员，应当经认可机构注册后，方可从事相应的认证活动","认证人员可以同时在两个以上认证机构执业"],"ans":"ABC","src":{"label":"《汇编》第25页","text":"第六十二条认证人员从事认证活动，不在认证机构执业或者同时在两个以上认证机构执业的，责令改正，给予停止执业6 个月以上2年以下的处罚，仍不改正的，撤销其执业资格。第六十三条认证机构以及与认证有关的实验室未经指定擅自从事列入目录产品的认证以及与认证有关的检查、检测活动的，责令改正，处10 万元以上50 万元以下的罚款，有违法所得的，没收违法所得。认证机构未经指定擅自从事列入目录产品的认证活动的，撤销批准文件，并予公布。第六十四条指定的认证机构、实验室超出指定的业务范围从事列入目录产品的认证以及与认证有关的检查、检测活动的，责令改正，处10 万元以上50 万元以下的罚款，有违法所得的，没收违法所得；情节严重的，撤销指定直至撤销批准文件，并予公布。"}},{"id":623,"type":1,"num":125,"stem":"认证机构有下列哪些情形的，责令改正，处5 万元以上20 万元以下的罚款？","opts":["超出批准范围从事认证活动的","聘用未经认可机构注册的人员从事认证活动的","未对其认证的产品、服务、管理体系实施有效的跟踪调查，或者发现其认证的产品、服务、管理体系不能持续符合认证要求，不及时暂停其使用或者撤销认证证书并予公布的","增加、减少、遗漏认证基本规范、认证规则规定的程序的"],"ans":"ABCD","src":{"label":"《汇编》第23页","text":"23（一）超出批准范围从事认证活动的；（二）增加、减少、遗漏认证基本规范、认证规则规定的程序的；（三）未对其认证的产品、服务、管理体系实施有效的跟踪调查，或者发现其认证的产品、服务、管理体系不能持续符合认证要求，不及时暂停其使用或者撤销认证证书并予公布的；（四）聘用未经认可机构注册的人员从事认证活动的。与认证有关的检查机构、实验室增加、减少、遗漏认证基本规范、认证规则规定的程序的，依照前款规定处罚。第六十条认证机构有下列情形之一的，责令限期改正；逾期未改正的，处2 万元以上10 万元以下的罚款：（一）以委托人未参加认证咨询或者认证培训等为理由，拒绝提供本认证机构业务范围内的认证服务，或者向委托人提出与认证活动无关的要求或者限制条件的；"}},{"id":624,"type":1,"num":126,"stem":"获得认证证书的，应当在认证范围内使用认证证书和认证标志。下列哪些说法符合本条例规定？","opts":["可以转让认证证书","不得利用产品、服务认证证书、认证标志和相关文字、符号，误导公众认为其管理体系已通过认证","不得利用管理体系认证证书、认证标志和相关文字、符号，误导公众认为其产品、服务已通过认证","可以在认证范围外使用认证证书和认证标志"],"ans":"BC","src":{"label":"《汇编》第12页","text":"检查、检测活动，应当完成认证基本规范、认证规则规定的程序，确保认证、检查、检测的完整、客观、真实，不得增加、减少、遗漏程序。认证机构以及与认证有关的检查机构、实验室应当对认证、检查、检测过程作出完整记录，归档留存。第二十二条认证机构及其认证人员应当及时作出认证结论，并保证认证结论的客观、真实。认证结论经认证人员签字后，由认证机构负责人签署。认证机构及其认证人员对认证结果负责。第二十三条认证结论为产品、服务、管理体系符合认证要求的，认证机构应当及时向委托人出具认证证书。第二十四条获得认证证书的，应当在认证范围内使用认证证书和认证标志，不得利用产品、服务认证证书、认证标志和相关文字、符号，误导公众认为其管理体系已通过认证，也不得利用管理体系认证证书、认证标志和相"}},{"id":625,"type":1,"num":127,"stem":"关于认证活动，下列哪些说法符合本条例规定？","opts":["认证结论经认证人员签字后，由认证机构负责人签署","认证机构应当公开认证基本规范、认证规则、收费标准等信息","认证机构及其认证人员应当及时作出认证结论，并保证认证结论的客观、真实","认证机构应当对认证、检查、检测过程作出完整记录，归档留存"],"ans":"ABCD","src":{"label":"《汇编》第12页","text":"检查、检测活动，应当完成认证基本规范、认证规则规定的程序，确保认证、检查、检测的完整、客观、真实，不得增加、减少、遗漏程序。认证机构以及与认证有关的检查机构、实验室应当对认证、检查、检测过程作出完整记录，归档留存。第二十二条认证机构及其认证人员应当及时作出认证结论，并保证认证结论的客观、真实。认证结论经认证人员签字后，由认证机构负责人签署。认证机构及其认证人员对认证结果负责。第二十三条认证结论为产品、服务、管理体系符合认证要求的，认证机构应当及时向委托人出具认证证书。第二十四条获得认证证书的，应当在认证范围内使用认证证书和认证标志，不得利用产品、服务认证证书、认证标志和相关文字、符号，误导公众认为其管理体系已通过认证，也不得利用管理体系认证证书、认证标志和相"}},{"id":626,"type":1,"num":128,"stem":"认证机构不得有下列哪些行为？","opts":["接受任何可能对认证活动的客观公正产生影响的资助","与认证委托人存在资产、管理方面的利益关系","从事任何可能对认证活动的客观公正产生影响的产品开发、营销等活动","与行政机关存在利益关系"],"ans":"ABCD","src":{"label":"《汇编》第10页","text":"第十三条认证机构不得与行政机关存在利益关系。认证机构不得接受任何可能对认证活动的客观公正产生影响的资助；不得从事任何可能对认证活动的客观公正产生影响的产品开发、营销等活动。认证机构不得与认证委托人存在资产、管理方面的利益关系。第十四条认证人员从事认证活动，应当在一个认证机构执业，不得同时在两个以上认证机构执业。第十五条向社会出具具有证明作用的数据和结果的检查机构、实验室，应当具备有关法律、行政法规规定的基本条件和能力，并依法经认定后，方可从事相应活动，认定结果由国务院认证认可监督管理部门公布。"}},{"id":627,"type":1,"num":129,"stem":"认证机构自行制定的认证标志的式样、文字和名称，（）。","opts":["不得与国家推行的认证标志相同或者近似","不得违反法律、行政法规的规定","不得有损社会道德风尚","不得妨碍社会管理"],"ans":"ABCD","src":{"label":"《汇编》第13页","text":"关文字、符号，误导公众认为其产品、服务已通过认证。第二十五条认证机构可以自行制定认证标志。认证机构自行制定的认证标志的式样、文字和名称，不得违反法律、行政法规的规定，不得与国家推行的认证标志相同或者近似，不得妨碍社会管理，不得有损社会道德风尚。第二十六条认证机构应当对其认证的产品、服务、管理体系实施有效的跟踪调查，认证的产品、服务、管理体系不能持续符合认证要求的，认证机构应当暂停其使用直至撤销认证证书，并予公布。第二十七条为了保护国家安全、防止欺诈行为、保护人体健康或者安全、保护动植物生命或者健康、保护环境，国家规定相关产品必须经过认证的，应当经过认证并标注认证标志后，方可出厂、销售、进口或者在其他经营活动中使用。"}},{"id":628,"type":1,"num":130,"stem":"认可机构有下列哪些情形的，责令改正；情节严重的，对主要负责人和负有责任的人员撤职或者解聘？","opts":["对不符合认可条件的机构和人员予以认可的","受理认可申请，向申请人提出与认可活动无关的要求或者限制条件的","接受可能对认可活动的客观公正产生影响的资助的","发现取得认可的机构和人员不符合认可条件，不及时撤销认可证书，并予公布的"],"ans":"ACD","src":{"label":"《汇编》第26页","text":"六十五条认证机构、检查机构、实验室取得境外认可机构认可，未向国务院认证认可监督管理部门备案的，给予警告，并予公布。第六十六条列入目录的产品未经认证，擅自出厂、销售、进口或者在其他经营活动中使用的，责令限期改正，处5 万元以上20 万元以下的罚款；未经认证的违法产品货值金额不足1 万元的，处货值金额2 倍以下的罚款；有违法所得的，没收违法所得。第六十七条认可机构有下列情形之一的，责令改正；情节严重的，对主要负责人和负有责任的人员撤职或者解聘：（一）对不符合认可条件的机构和人员予以认可的；（二）发现取得认可的机构和人员不符合认可条件，不及时撤销认可证书，并予公布的；（三）接受可能对认可活动的客观公正产生影响的资助的。"}},{"id":629,"type":1,"num":131,"stem":"关于认可机构，下列哪些说法符合本条例规定？","opts":["国务院认证认可监督管理部门确定的认可机构，独立开展认可活动","认可机构应当公开认可条件、认可程序、收费标准等信息","认可机构委托他人完成与认可有关的具体评审业务的，由认可机构对评审结论负责","认可机构应当按照国家标准和国务院认证认可监督管理部门的规定，对从事评审、审核等认证活动的人员进行考核，考核合格的，予以注册"],"ans":"ABCD","src":{"label":"《汇编》第17页","text":"第三十八条从事评审、审核等认证活动的人员，应当经认可机构注册后，方可从事相应的认证活动。第三十九条认可机构应当具有与其认可范围相适应的质量体系，并建立内部审核制度，保证质量体系的有效实施。第四十条认可机构根据认可的需要，可以选聘从事认可评审活动的人员。从事认可评审活动的人员应当是相关领域公认的专家，熟悉有关法律、行政法规以及认可规则和程序，具有评审所需要的良好品德、专业知识和业务能力。第四十一条认可机构委托他人完成与认可有关的具体评审业务的，由认可机构对评审结论负责。第四十二条认可机构应当公开认可条件、认可程序、收费标准等信息。认可机构受理认可申请，不得向申请人提出与认可活动无关的要求或者限制条件。"}},{"id":630,"type":1,"num":132,"stem":"认证机构资质申请和批准程序包括下列哪些内容？","opts":["国务院认证认可监督管理部门应当公布依法取得认证机构资质的企业名录","国务院认证认可监督管理部门自受理认证机构资质申请之日起45 日内，应当作出是否批准的决定","涉及国务院有关部门职责的，应当征求国务院有关部门的意见","申请人应当向国务院认证认可监督管理部门提出书面申请，并提交符合本条例规定条件的证明文件"],"ans":"ABCD","src":{"label":"《汇编》第9页","text":"第十一条认证机构资质的申请和批准程序：（一）认证机构资质的申请人，应当向国务院认证认可监督管理部门提出书面申请，并提交符合本条例第十条规定条件的证明文件；（二）国务院认证认可监督管理部门自受理认证机构资质申请之日起45 日内，应当作出是否批准的决定。涉及国务院有关部门职责的，应当征求国务院有关部门的意见。决定批准的，向申请人出具批准文件，决定不予批准的，应当书面通知申请人，并说明理由。国务院认证认可监督管理部门应当公布依法取得认证机构资质的企业名录。第十二条境外认证机构在中华人民共和国境内设立代表机构，须向市场监督管理部门依法办理登记手续后，方可从事与所从属机构的业务范围相关的推广活动，但不得从事认证活动。"}},{"id":631,"type":1,"num":133,"stem":"国家对必须经过认证的产品，（）。","opts":["统一标志","统一产品目录","统一收费标准","统一技术规范的强制性要求、标准和合格评定程序"],"ans":"ABCD","src":{"label":"《汇编》第33页","text":"督管理和综合协调。县级以上地方市场监督管理部门负责所辖区域内强制性产品认证活动的监督管理工作。第四条国家对实施强制性产品认证的产品，统一产品目录（以下简称目录），统一技术规范的强制性要求、标准和合格评定程序，统一认证标志，统一收费标准。市场监管总局会同国务院有关部门制定和调整目录，目录由市场监管总局发布,并会同有关方面共同实施。第五条国家鼓励开展平等互利的强制性产品认证国际互认活动，互认活动应当在市场监管总局或者其授权的有关部门对外签署的国际互认协议框架内进行。"}},{"id":632,"type":1,"num":134,"stem":"产品或者其包装上的标识必须真实，并符合下列哪些要求？","opts":["使用不当，容易造成产品本身损坏或者可能危及人身、财产安全的产品，应当有警示标志或者中文警示说明","有中文标明的产品名称、生产厂厂名和厂址","有产品质量检验合格证明","限期使用的产品，应当在显著位置清晰地标明生产日期和安全使用期或者失效日期"],"ans":"ABCD","src":null},{"id":633,"type":1,"num":135,"stem":"关于产品质量检验机构、认证机构，下列哪些说法符合本法规定？","opts":["产品质量检验机构、认证机构必须依法按照有关标准，客观、公正地出具检验结果或者认证证明","产品质量认证机构应当依照国家规定对准许使用认证标志的产品进行认证后的跟踪检查","产品质量检验机构可以向社会推荐生产者的产品","对不符合认证标准而使用认证标志的，要求其改正；情节严重的，取消其使用认证标志的资格"],"ans":"ABD","src":{"label":"《汇编》第4页","text":"质量仍不合格的，吊销营业执照。监督抽查的产品有严重质量问题的，依照本法第五章的有关规定处罚。第十九条产品质量检验机构必须具备相应的检测条件和能力，经省级以上人民政府产品质量监督部门或者其授权的部门考核合格后，方可承担产品质量检验工作。法律、行政法规对产品质量检验机构另有规定的，依照有关法律、行政法规的规定执行。第二十条从事产品质量检验、认证的社会中介机构必须依法设立，不得与行政机关和其他国家机关存在隶属关系或者其他利益关系。第二十一条产品质量检验机构、认证机构必须依法按照有关标准，客观、公正地出具检验结果或者认证证明。"}},{"id":634,"type":1,"num":136,"stem":"关于产品质量监督抽查，下列哪些说法符合本法规定？","opts":["上级监督抽查的产品，下级不得另行重复抽查","检验抽取样品的数量不得超过检验的合理需要，并不得向被检查人收取检验费用","国家监督抽查的产品，地方不得另行重复抽查","监督抽查所需检验费用按照国务院规定列支"],"ans":"ABCD","src":{"label":"《汇编》第3页","text":"律的规定执行。国家监督抽查的产品，地方不得另行重复抽查；上级监督抽查的产品，下级不得另行重复抽查。根据监督抽查的需要，可以对产品进行检验。检验抽取样品的数量不得超过检验的合理需要，并不得向被检查人收取检验费用。监督抽查所需检验费用按照国务院规定列支。生产者、销售者对抽查检验的结果有异议的，可以自收到检验结果之日起十五日内向实施监督抽查的产品质量监督部门或者其上级产品质量监督部门申请复检，由受理复检的产品质量监督部门作出复检结论。第十七条依照本法规定进行监督抽查的产品质量不合格的，由实施监督抽查的产品质量监督部门责令其生产者、销售者限期改正。逾期不改正的，由省级以上人民政府产品质量监督部门予以公告；公告后经复查仍不合格的，责令停业，限期整顿；整顿期满后经复查产品"}},{"id":635,"type":1,"num":137,"stem":"售出的产品有下列哪些情形的，销售者应当负责修理、更换、退货？","opts":["产品价格明显低于同类产品市场价格的","不符合以产品说明、实物样品等方式表明的质量状况的","不具备产品应当具备的使用性能而事先未作说明的","不符合在产品或者其包装上注明采用的产品标准的"],"ans":"BCD","src":null},{"id":636,"type":1,"num":138,"stem":"生产者能够证明有下列哪些情形的，不承担赔偿责任？","opts":["未将产品投入流通的","产品投入流通时，引起损害的缺陷尚不存在的","将产品投入流通时的科学技术水平尚不能发现缺陷的存在的","消费者使用不当造成损害的"],"ans":"ABC","src":null},{"id":637,"type":1,"num":139,"stem":"关于销售者，下列哪些说法符合本法规定？","opts":["销售者不得伪造或者冒用认证标志等质量标志","销售者不得销售国家明令淘汰并停止销售的产品和失效、变质的产品","销售者销售产品，不得掺杂、掺假，不得以假充真、以次充好，不得以不合格产品冒充合格产品","销售者不得伪造产地，不得伪造或者冒用他人的厂名、厂址"],"ans":"ABCD","src":{"label":"《汇编》第5页","text":"行认证后的跟踪检查；对不符合认证标准而使用认证标志的，要求其改正；情节严重的，取消其使用认证标志的资格。第三十条生产者不得伪造产地，不得伪造或者冒用他人的厂名、厂址。第三十一条生产者不得伪造或者冒用认证标志等质量标志。"}},{"id":638,"type":1,"num":140,"stem":"下列哪些主体对因产品不符合认证标准或者不符合其承诺、保证的质量要求给消费者造成的损失，与产品的生产者、销售者承担连带责任？","opts":["产品质量认证机构违反本法第二十一条第二款的规定，对不符合认证标准而使用认证标志的产品，未依法要求其改正或者取消其使用认证标志资格的","依法客观、公正出具检验结果的产品质量检验机构","对产品质量作出承诺、保证，而该产品又不符合其承诺、保证的质量要求，给消费者造成损失的社会团体","对产品质量作出承诺、保证，而该产品又不符合其承诺、保证的质量要求，给消费者造成损失的社会中介机构"],"ans":"ACD","src":null},{"id":639,"type":1,"num":141,"stem":"产品质量应当符合下列哪些要求？","opts":["不存在危及人身、财产安全的不合理的危险，有保障人体健康和人身、财产安全的国家标准、行业标准的，应当符合该标准","符合以产品说明、实物样品等方式表明的质量状况","符合在产品或者其包装上注明采用的产品标准","具备产品应当具备的使用性能，但是，对产品存在使用性能的瑕疵作出说明的除外"],"ans":"ABCD","src":null},{"id":640,"type":1,"num":142,"stem":"依照本法规定进行监督抽查的产品质量不合格的，由实施监督抽查的市场监督管理部门责令其生产者、销售者限期改正。逾期不改正的，可以采取的后续措施包括（）。","opts":["由省级以上人民政府市场监督管理部门予以公告","整顿期满后经复查产品质量仍不合格的，吊销营业执照","公告后经复查仍不合格的，责令停业，限期整顿","直接没收其生产、销售的产品"],"ans":"ABC","src":{"label":"《汇编》第3页","text":"律的规定执行。国家监督抽查的产品，地方不得另行重复抽查；上级监督抽查的产品，下级不得另行重复抽查。根据监督抽查的需要，可以对产品进行检验。检验抽取样品的数量不得超过检验的合理需要，并不得向被检查人收取检验费用。监督抽查所需检验费用按照国务院规定列支。生产者、销售者对抽查检验的结果有异议的，可以自收到检验结果之日起十五日内向实施监督抽查的产品质量监督部门或者其上级产品质量监督部门申请复检，由受理复检的产品质量监督部门作出复检结论。第十七条依照本法规定进行监督抽查的产品质量不合格的，由实施监督抽查的产品质量监督部门责令其生产者、销售者限期改正。逾期不改正的，由省级以上人民政府产品质量监督部门予以公告；公告后经复查仍不合格的，责令停业，限期整顿；整顿期满后经复查产品"}},{"id":641,"type":1,"num":143,"stem":"关于因产品存在缺陷造成损害的赔偿，下列哪些说法符合本法规定？","opts":["受害人可以向产品的生产者要求赔偿，也可以向产品的销售者要求赔偿","属于产品的生产者的责任，产品的销售者赔偿的，产品的销售者有权向产品的生产者追偿","销售者不能指明缺陷产品的生产者也不能指明缺陷产品的供货者的，销售者应当承担赔偿责任","由于销售者的过错使产品存在缺陷，造成人身、他人财产损害的，销售者应当承担赔偿责任"],"ans":"ABCD","src":null},{"id":642,"type":1,"num":144,"stem":"因产品存在缺陷造成受害人人身伤害的，侵害人应当赔偿下列哪些费用？","opts":["医疗费、治疗期间的护理费","因误工减少的收入","造成残疾的，残疾者生活自助具费、生活补助费、残疾赔偿金","造成受害人死亡的，丧葬费、死亡赔偿金"],"ans":"ABCD","src":null},{"id":643,"type":1,"num":145,"stem":"县级以上市场监督管理部门对涉嫌违反本法规定的行为进行查处时，可以行使下列哪些职权？","opts":["查阅、复制当事人有关的合同、发票、帐簿以及其他有关资料","对当事人涉嫌从事违反本法的生产、销售活动的场所实施现场检查","对有根据认为不符合保障人体健康和人身、财产安全的国家标准、行业标准的产品予以查封或者扣押","向当事人的法定代表人、主要负责人和其他有关人员调查、了解与涉嫌从事违反本法的生产、销售活动有关的情况"],"ans":"ABCD","src":null},{"id":644,"type":1,"num":146,"stem":"关于生产者，下列哪些说法符合本法规定？","opts":["生产者不得生产国家明令淘汰的产品","生产者生产产品，不得掺杂、掺假，不得以假充真、以次充好，不得以不合格产品冒充合格产品","生产者不得伪造或者冒用认证标志等质量标志","生产者不得伪造产地，不得伪造或者冒用他人的厂名、厂址"],"ans":"ABCD","src":{"label":"《汇编》第5页","text":"行认证后的跟踪检查；对不符合认证标准而使用认证标志的，要求其改正；情节严重的，取消其使用认证标志的资格。第三十条生产者不得伪造产地，不得伪造或者冒用他人的厂名、厂址。第三十一条生产者不得伪造或者冒用认证标志等质量标志。"}},{"id":645,"type":1,"num":147,"stem":"各级人民政府工作人员和其他国家机关工作人员有下列哪些情形的，依法给予行政处分；构成犯罪的，依法追究刑事责任？","opts":["包庇、放纵产品生产、销售中违反本法规定行为的","向从事违反本法规定的生产、销售活动的当事人通风报信，帮助其逃避查处的","阻挠、干预市场监督管理部门依法对产品生产、销售中违反本法规定的行为进行查处，造成严重后果的","依法对产品生产、销售中违反本法规定的行为进行查处的"],"ans":"ABC","src":null},{"id":646,"type":1,"num":148,"stem":"下列行为中属于本法禁止的有（）。","opts":["伪造或者冒用认证标志等质量标志","在生产、销售的产品中掺杂、掺假，以假充真，以次充好","伪造或者冒用他人的厂名、厂址","伪造产品的产地"],"ans":"ABCD","src":{"label":"《汇编》第1页","text":"中华人民共和国产品质量法（摘录）第四条生产者、销售者依照本法规定承担产品质量责任。第五条禁止伪造或者冒用认证标志等质量标志；禁止伪造产品的产地，伪造或者冒用他人的厂名、厂址；禁止在生产、销售的产品中掺杂、掺假，以假充真，以次充好。第十二条产品质量应当检验合格，不得以不合格产品冒充合格产品。第十四条国家根据国际通用的质量管理标准，推行企业质量体系认证制度。企业根据自愿原则可以向国务院产品质量监督部门认可的或者国务院产品质量监督部门授权的部门认可的认证机构申请企业质量体系认证。"}},{"id":647,"type":1,"num":149,"stem":"省、自治区、直辖市人民政府标准化行政主管部门可以向国务院标准化行政主管部门提出强制性国家标准的立项建议，由国务院标准化行政主管部门会同国务院有关行政主管部门决定。此外，可以向国务院标准化行政主管部门提出强制性国家标准立项建议的主体包括（）。","opts":["外国企业","社会团体","企业事业单位","公民"],"ans":"BCD","src":null},{"id":648,"type":1,"num":150,"stem":"标准化行政主管部门、有关行政主管部门应当向社会公开受理举报、投诉的（），并安排人员受理举报、投诉。","opts":["电话","信箱","办公地址","电子邮件地址"],"ans":"ABD","src":null},{"id":649,"type":1,"num":151,"stem":"企业执行自行制定的企业标准的，还应当公开（）。","opts":["产品的性能指标","产品生产成本","产品全部技术参数","产品的功能指标"],"ans":"AD","src":null},{"id":650,"type":1,"num":152,"stem":"制定标准应当做到（）。","opts":["有利于科学合理利用资源","做到技术上先进、经济上合理","推广科学技术成果","增强产品的安全性、通用性、可替换性"],"ans":"ABCD","src":null},{"id":651,"type":1,"num":153,"stem":"关于标准化工作，下列哪些说法符合本法规定？","opts":["国家积极推动参与国际标准化活动","县级以上人民政府应当将标准化工作经费纳入本级预算","县级以上人民政府应当将标准化工作纳入本级国民经济和社会发展规划","国家鼓励企业、社会团体和教育、科研机构等开展或者参与标准化工作"],"ans":"ABCD","src":null},{"id":652,"type":1,"num":154,"stem":"下列哪些主体未依照本法规定对标准进行编号的，由标准化行政主管部门责令限期改正；逾期不改正的，由省级以上人民政府标准化行政主管部门撤销相关标准编号？","opts":["国务院标准化行政主管部门","企业","行业协会","社会团体"],"ans":"BD","src":null},{"id":653,"type":1,"num":155,"stem":"对保障下列哪些安全的技术要求，应当制定强制性国家标准？","opts":["商业秘密安全","生态环境安全","国家安全","人身健康和生命财产安全"],"ans":"BCD","src":null},{"id":654,"type":1,"num":156,"stem":"下列哪些标准属于推荐性标准？","opts":["行业标准","强制性国家标准","地方标准", 标志的决定，并予以公布。第十八条获得产品认证的组织应当在广告、产品介绍等宣传材料中正确使用产品认证标志，可以在通过认证的产品及其包装上标注产品认证标志，但不得利用产品认证标志误导公众认为其服务、管理体系通过认证。第十九条获得服务认证的组织应当在广告等有关宣传中正确使用服务认证标志，可以将服务认证标志悬挂在获得服务认证的区域内，但不得利用服务认证标志误导公众认为其产品、管理体系通过认证。第二十条获得管理体系认证的组织应当在广告等有关宣传中正确使用管理体系认证标志，不得在产品上标注管理体系认证标志，只有在注明获证组织通过相关管理体系认证的情"}},{"id":667,"type":1,"num":169,"stem":"依据《认证证书和认证标志管理办法》，下列属于国家专有认证标志的有（）。","opts":["强制性认证标志","国家统一的自愿性认证标志","认证机构自行制定的认证标志","产品认证标志"],"ans":"AB","src":{"label":"《汇编》第102页","text":"第三章认证标志第十三条认证标志分为强制性认证标志和自愿性认证标志。自愿性认证标志包括国家统一的自愿性认证标志和认证机构自行制定的认证标志。强制性认证标志和国家统一的自愿性认证标志属于国家专有认证标志。认证机构自行制定的认证标志是指认证机构专有的认证标志。第十四条强制性认证标志和国家统一的自愿性认证标志的制定和使用，由国家市场监督管理总局依法规定，并予以公布。第十五条认证机构自行制定的认证标志的式样（包括使用的符号）、文字和名称，应当遵守以下规定：（一）不得与强制性认证标志、国家统一"}},{"id":668,"type":1,"num":170,"stem":"依据《认证证书和认证标志管理办法》，本办法适用于认证证书和认证标志的（）。","opts":["制定","发布","使用","监督检查"],"ans":"ABCD","src":{"label":"《汇编》第98页","text":"服务、管理体系通过认证所获得的证明性文件。认证证书包括产品认证证书、服务认证证书和管理体系认证证书。本办法所称的认证标志是指证明产品、服务、管理体系通过认证的专有符号、图案或者符号、图案以及文字的组合。认证标志包括产品认证标志、服务认证标志和管理体系认证标志。第三条本办法适用于认证证书和认证标志的制定、发布、使用和监督检查。第四条国家市场监督管理总局依法负责认证证书和认证标志的管理、监督和综合协调工作。"}},{"id":669,"type":1,"num":171,"stem":"依据《认证证书和认证标志管理办法》，认证标志包括（）。","opts":["产品认证标志","过程认证标志","服务认证标志","管理体系认证标志"],"ans":"ACD","src":{"label":"《汇编》第98页","text":"服务、管理体系通过认证所获得的证明性文件。认证证书包括产品认证证书、服务认证证书和管理体系认证证书。本办法所称的认证标志是指证明产品、服务、管理体系通过认证的专有符号、图案或者符号、图案以及文字的组合。认证标志包括产品认证标志、服务认证标志和管理体系认证标志。第三条本办法适用于认证证书和认证标志的制定、发布、使用和监督检查。第四条国家市场监督管理总局依法负责认证证书和认证标志的管理、监督和综合协调工作。"}},{"id":670,"type":1,"num":172,"stem":"依据《认证证书和认证标志管理办法》，认证证书包括（）。","opts":["产品认证证书","服务认证证书","管理体系认证证书","自愿性认证证书"],"ans":"ABC","src":{"label":"《汇编》第98页","text":"服务、管理体系通过认证所获得的证明性文件。认证证书包括产品认证证书、服务认证证书和管理体系认证证书。本办法所称的认证标志是指证明产品、服务、管理体系通过认证的专有符号、图案或者符号、图案以及文字的组合。认证标志包括产品认证标志、服务认证标志和管理体系认证标志。第三条本办法适用于认证证书和认证标志的制定、发布、使用和监督检查。第四条国家市场监督管理总局依法负责认证证书和认证标志的管理、监督和综合协调工作。"}},{"id":671,"type":1,"num":173,"stem":"依据《认证及认证培训、咨询人员管理办法》，出现哪些行为，可撤销执业资格（）。","opts":["出具虚假或失实结论，编造虚假文件记录","同时在3 个认证机构执业","接受客户大额礼金","客观公正开展认证活动"],"ans":"ABC","src":{"label":"《汇编》第118页","text":"认证及认证培训、咨询人员管理办法（2004 年5 月24 日国家质量监督检验检疫总局令第61 号公布根据2022 年9 月29 日国家市场监督管理总局令第61 号修订）"}},{"id":672,"type":1,"num":174,"stem":"依据《认证及认证培训、咨询人员管理办法》，认证及认证培训咨询人员包含（）。","opts":["管理体系审核员","产品认证检查员","认证培训教员","认证咨询师、业务管理人员"],"ans":"ABCD","src":{"label":"《汇编》第119页","text":"认证及认证培训、咨询人员管理办法第一条为规范认证及认证培训、咨询人员的执业行为，加强对认证市场的管理，根据《中华人民共和国认证认可条例》，制定本办法。第二条本办法所称的认证及认证培训、咨询人员，是指管理体系认证审核员、产品认证检查员、认证培训教员和认证咨询师等从事认证及认证培训、咨询活动的人员，以及认证及认证培训、咨询机构的业务管理人员。本办法所称认证及认证培训、咨询人员执业，是指受聘于认证及认证培训、咨询机构的人员从事的认证及认证培训、咨询和业务管理的活动。"}},{"id":673,"type":1,"num":175,"stem":"依据《认证及认证培训、咨询人员管理办法》，认证及认证培训咨询人员禁止行为（）。","opts":["无注册资格开展执业活动","出具虚假失实结论、编造虚假文件记录","接受客户礼金及其他不当利益","隐瞒本人执业真实情况"],"ans":"ABCD","src":{"label":"《汇编》第126页","text":"承诺谋取利益；（六）接受认证及认证培训、咨询客户及其相关利益方的礼金或者其他形式的利益；（七）在认证机构执业的认证人员与认证咨询机构、认证咨询活动存在或者发生经济利益关系；在认证咨询机构执业的人员与认证机构、认证活动存在或者发生经济利益关系；（八）认证机构的工作人员在认证活动中与认证咨询机构的工作人员存在利害关系或者可能对认证公正性产生影响，未进行回避；（九）对所在执业的认证及认证培训、咨询机构隐瞒本人执业真实情况；（十）恶意诽谤或者诋毁其他认证及认证培训、咨询机构及其人员；（十一）其他违反认证及认证培训、咨询有关规定的行为。"}},{"id":674,"type":1,"num":176,"stem":"依据《认证及认证培训、咨询人员管理办法》，机构聘用执业人员，应当（）。","opts":["查验证明申明材料真实性有效性","归档留存材料","签订劳务合同明确权责","解除聘用关系的，应当依法终止劳务合同"],"ans":"ABCD","src":{"label":"《汇编》第124页","text":"任何方式从事认证活动。第十一条特殊领域的认证及认证培训、咨询人员的执业，应当经国家市场监督管理总局批准。第十二条认证及认证培训、认证咨询人员受聘于认证及认证培训、咨询机构时，应当出具有关证明文件以及其他申明材料，并保证上述材料的真实、有效。认证及认证培训、咨询机构在决定聘用执业人员时，应当查验所聘用的执业人员提供的证明文件以及其他申明材料是否真实、有效，并归档留存。认证及认证培训、咨询人员与认证及认证培训、咨询机构之间建立聘用关系的，应当依法签订劳务合同，明确规定双方的权利、义务；聘用关系解除的，应当依法终止劳务合同。"}},{"id":675,"type":1,"num":177,"stem":"依据《认证及认证培训、咨询人员管理办法》，执业分为专职、兼职，专职人员描述正确（）。","opts":["将相关业务作为本职","和一个机构签订劳务合同","固定在该机构开展工作","可以同时与多家机构签合同"],"ans":"ABC","src":{"label":"《汇编》第122页","text":"专职认证及认证培训、咨询人员是指将认证及认证培训、咨询和有关业务管理活动作为本职工作，与1 个认证、认证培训或者认证咨询机构签订劳务合同，并固定在该机构工作的人员；兼职认证及认证培训、咨询人员是指在不脱离本职工作的情况下与1 个认证、认证培训或者认证咨询机构签订劳务合同，从事认证、认证培训或者认证咨询活动的人员。国家公务员不得从事认证、认证咨询和认证培训活动。第八条认证人员从事认证活动应当在1 个认证机构执业，不得同时在2 个或者2 个以上认证机构执业。在认证机构执业的专职或者兼职认证人员，具备相关认证培训教员资格的，经所在认证机构与认证培训机构签订合同后，可以在1 个认证培训机构从事认证培训活动。"}},{"id":676,"type":1,"num":178,"stem":"依据《认证及认证培训、咨询人员管理办法》，市场监管部门可以就投诉、发现问题，向（）询问有关事项。","opts":["执业人员","执业人员执业的机构","无关第三方","消费者"],"ans":"AB","src":{"label":"《汇编》第118页","text":"认证及认证培训、咨询人员管理办法（2004 年5 月24 日国家质量监督检验检疫总局令第61 号公布根据2022 年9 月29 日国家市场监督管理总局令第61 号修订）"}},{"id":677,"type":1,"num":179,"stem":"认证机构有下列哪些情形之一的，地方认证监督管理部门应当责令其改正，并处3万元罚款？","opts":["违反本办法规定，向认证对象出具认证证书的","在监督检查工作中不予配合和协助，拒绝、隐瞒或者不如实提供相关材料和信息的","受到告诫或者警告后仍未改正的","发现认证对象未正确使用认证证书和认证标志，未采取有效措施纠正的"],"ans":"ABCD","src":{"label":"《汇编》第94页","text":"四条规定，向国务院认证认可监督管理部门报送信息和报告的。第三十八条认证机构有下列情形之一的，地方认证监督管理部门应当责令其改正，并处3 万元罚款：（一）受到告诫或者警告后仍未改正的；（二）违反本办法第十七条规定，向认证对象出具认证证书的；（三）违反本办法第二十条规定，发现认证对象未正确使用认证证书和认证标志，未采取有效措施纠正的；（四）违反本办法第二十五条规定，在监督检查工作中不予配合和协助，拒绝、隐瞒或者不如实提供相关材料和信息的。"}},{"id":678,"type":1,"num":180,"stem":"认证机构有下列哪些情形之一的，国务院认证认可监督管理部门应当责令其限期改正，给予警告并予公布？","opts":["未依照本办法规定，办理变更手续的","认证人员能力不能持续符合国家职业资格的相关要求，或者聘用国家法律法规和国家政策禁止或者限制从事认证活动的人员的","未依照本办法规定，将认证规则相关信息报国务院认证认可监督管理部门备案的","未依照本办法规定，向国务院认证认可监督管理部门报送信息和报告的"],"ans":"ABCD","src":{"label":"《汇编》第93页","text":"材料申请认证机构资质的，国务院认证认可监督管理部门不予受理或者不予批准，并给予警告；申请人在1 年内不得再次申请认证机构资质。第三十七条认证机构有下列情形之一的，国务院认证认可监督管理部门应当责令其限期改正，给予警告并予公布：（一）未依照本办法第十条第二款规定，将认证规则相关信息报国务院认证认可监督管理部门备案的；（二）未依照本办法第十一条规定，办理变更手续的；（三）未依照本办法第十四条规定，认证人员能力不能持续符合国家职业资格的相关要求，或者聘用国家法律法规和国家政策禁止或者限制从事认证活动的人员的；（四）未依照本办法第二十三条、第二十"}},{"id":679,"type":1,"num":181,"stem":"有下列哪些情形之一的，属于出具虚假或者严重失实的认证结论？","opts":["伪造认证档案、记录和资料的","认证人员未按照认证规则要求，应当进入现场而未进入现场进行审核、检查或者审查的","认证证书载明的事项内容严重失实的","冒名顶替其他认证人员实施审核、检查或者审查的"],"ans":"ABCD","src":{"label":"《汇编》第84页","text":"严重失实的认证结论。有下列情形之一的，属于出具虚假或者严重失实的认证结论：（一）认证人员未按照认证规则要求，应当进入现场而未进入现场进行审核、检查或者审查的；（二）冒名顶替其他认证人员实施审核、检查或者审查的；（三）伪造认证档案、记录和资料的；（四）认证证书载明的事项内容严重失实的；（五）向未通过认证的认证对象出卖或者转让认证证书的。第十九条认证结论符合认证要求的，认证机构应当及时向认证对象出具认证证书。"}},{"id":680,"type":1,"num":182,"stem":"认证机构在从事认证活动时，应当对认证对象的下列哪些情况进行核实？","opts":["具备相关法定资质、资格","未列入严重违法失信名单","注册资本情况","委托认证的产品、服务、管理体系等符合相关法律法规的要求"],"ans":"ABD","src":{"label":"《汇编》第83页","text":"性产品认证相关信息。第十六条认证机构从事认证活动，应当符合认证基本规范、认证规则规定的程序要求，确保认证过程完整、客观、真实，不得增加、减少或者遗漏程序要求。第十七条认证机构在从事认证活动时，应当对认证对象的下列情况进行核实：（一）具备相关法定资质、资格；（二）委托认证的产品、服务、管理体系等符合相关法律法规的要求；（三）未列入严重违法失信名单。认证对象不符合上述要求的，认证机构不得向其出具认证证书。第十八条认证机构及其认证人员应当及时作出认证结论，保证其客观、真实并承担相应法律责任。"}},{"id":681,"type":1,"num":183,"stem":"下列哪些说法符合本办法关于严重违法失信名单的规定？","opts":["认证机构资质的申请人及其法定代表人、主要负责人、认证人员等列入严重违法失信名单的，对其认证机构资质申请不予批准","列入严重违法失信名单不影响认证机构资质申请","认证机构及其法定代表人、主要负责人、认证人员列入严重违法失信名单的，对其认证领域扩大申请不予批准","认证机构及其法定代表人、主要负责人、认证人员列入严重违法失信名单的，对其认证机构资质延续申请不予批准"],"ans":"ACD","src":{"label":"《汇编》第89页","text":"第二十八条国务院认证认可监督管理部门在其网站公布以下信息：（一）依法取得资质的认证机构名录；（二）认证机构依据本办法第二十四条规定报送的报告；（三）随机抽查结果；（四）对认证机构及其认证人员的行政处罚信息；（五）认证机构及其法定代表人、主要负责人、认证人员严重违法失信名单。第二十九条认证机构资质的申请人及其法定代表人、主要负责人、认证人员等列入严重违法失信名单的，对其认证机构资质申请不予批准。"}},{"id":682,"type":1,"num":184,"stem":"国务院认证认可监督管理部门应当在其网站公布下列哪些信息？","opts":["随机抽查结果","依法取得资质的认证机构名录","认证机构依照本办法规定报送的报告","对认证机构及其认证人员的行政处罚信息"],"ans":"ABCD","src":{"label":"《汇编》第89页","text":"第二十八条国务院认证认可监督管理部门在其网站公布以下信息：（一）依法取得资质的认证机构名录；（二）认证机构依据本办法第二十四条规定报送的报告；（三）随机抽查结果；（四）对认证机构及其认证人员的行政处罚信息；（五）认证机构及其法定代表人、主要负责人、认证人员严重违法失信名单。第二十九条认证机构资质的申请人及其法定代表人、主要负责人、认证人员等列入严重违法失信名单的，对其认证机构资质申请不予批准。"}},{"id":683,"type":1,"num":185,"stem":"关于认证活动，下列哪些说法符合本办法规定？","opts":["认证结论符合认证要求的，认证机构应当及时向认证对象出具认证证书","认证机构从事认证活动，应当符合认证基本规范、认证规则规定的程序要求，确保认证过程完整、客观、真实，不得增加、减少或者遗漏程序要求","认证机构应当要求认证对象正确使用认证证书和认证标志，对未按照规定使用的，认证机构应当采取有效的纠正措施","认证机构应当通过其网站或者其他形式，向公众提供查询认证证书有效性的方式"],"ans":"ABCD","src":{"label":"《汇编》第84页","text":"严重失实的认证结论。有下列情形之一的，属于出具虚假或者严重失实的认证结论：（一）认证人员未按照认证规则要求，应当进入现场而未进入现场进行审核、检查或者审查的；（二）冒名顶替其他认证人员实施审核、检查或者审查的；（三）伪造认证档案、记录和资料的；（四）认证证书载明的事项内容严重失实的；（五）向未通过认证的认证对象出卖或者转让认证证书的。第十九条认证结论符合认证要求的，认证机构应当及时向认证对象出具认证证书。"}},{"id":684,"type":1,"num":186,"stem":"认证机构应当及时向国务院认证认可监督管理部门报送并保证真实、有效的信息包括（）。","opts":["设立承担其认证活动的分支机构信息","认证证书的有效、暂停、注销或者撤销状态信息","认证计划信息","与认证结果相关的认证活动、认证人员、认证对象信息"],"ans":"ABCD","src":{"label":"《汇编》第86页","text":"保存具有法律效力的原件。第二十三条认证机构应当及时向国务院认证认可监督管理部门报送以下信息，并保证其真实、有效：（一）认证计划信息；（二）与认证结果相关的认证活动、认证人员、认证对象信息；（三）认证证书的有效、暂停、注销或者撤销状态信息；（四）设立承担其认证活动的分支机构信息。认证机构在获得批准的认证领域内，与境外认证机构签订认证结果仅在境外使用的分包合约，应当自签订分包合约之日起10 日内向国务院认证认可监督管理部门报送信息。"}},{"id":685,"type":1,"num":187,"stem":"有下列哪些情形之一的，国务院认证认可监督管理部门根据利害关系人的请求或者依据职权，可以撤销《认证机构批准书》？","opts":["超越法定职权出具的","对不具备申请资格或者不符合法定条件的申请人出具的","违反法定程序出具的","国务院认证认可监督管理部门工作人员滥用职权、玩忽职守出具的"],"ans":"ABCD","src":{"label":"《汇编》第90页","text":"第三十条国务院认证认可监督管理部门、地方认证监督管理部门在监督检查中发现认证机构有下列情形之一的，应当给予告诫，并责令其改正：（一）未依照本办法第十五条规定，公布信息的；（二）未依照本办法第十九条第二款规定，向公众提供认证证书有效性查询方式的。第三十一条有下列情形之一的，国务院认证认可监督管理部门根据利害关系人的请求或者依据职权，可以撤销《认证机构批准书》：（一）国务院认证认可监督管理部门工作人员滥用职权、玩忽职守出具的；（二）超越法定职权出具的；（三）违反法定程序出具的；（四）对不具备申请资格或者不符合法定条件的申请人出具的；"}},{"id":686,"type":1,"num":188,"stem":"取得认证机构资质，应当符合下列哪些条件？","opts":["注册资本不得少于人民币300 万元，有10 名以上相应领域的专职认证人员","有固定的办公场所和必要的设施","取得法人资格","有符合认证认可要求的管理制度"],"ans":"ABCD","src":{"label":"《汇编》第8页","text":"第八条从事认证认可活动的机构及其人员，对其所知悉的国家秘密和商业秘密负有保密义务。第二章认证机构第九条取得认证机构资质，应当经国务院认证认可监督管理部门批准，并在批准范围内从事认证活动。未经批准，任何单位和个人不得从事认证活动。第十条取得认证机构资质，应当符合下列条件：（一）取得法人资格；（二）有固定的场所和必要的设施；（三）有符合认证认可要求的管理制度；（四）注册资本不得少于人民币300 万元；（五）有10 名以上相应领域的专职认证人员。"}},{"id":687,"type":1,"num":189,"stem":"认证机构应当通过其网站或者其他形式公布并保证真实、有效的信息包括（）。","opts":["依法从事认证活动的自我声明","认证收费标准","认证领域、认证规则、认证证书样式、认证标志样式","认证证书有效、暂停、注销或者撤销的状态"],"ans":"ABCD","src":{"label":"《汇编》第82页","text":"员管理制度，定期对认证人员进行培训，保证其能力持续符合国家关于认证人员职业资格的相关要求。认证机构不得聘用国家法律法规和国家政策禁止或者限制从事认证活动的人员。第十五条认证机构应当通过其网站或者其他形式公布以下信息并保证其真实、有效：（一）依法从事认证活动的自我声明；（二）认证领域、认证规则、认证证书样式、认证标志样式；（三）设立的承担其认证活动的分支机构名称、地址和认证活动内容；（四）认证收费标准；（五）认证证书有效、暂停、注销或者撤销的状态。"}},{"id":688,"type":1,"num":190,"stem":"认证机构有下列哪些情形之一的，国务院认证认可监督管理部门应当办理《认证机构批准书》注销手续？","opts":["认证机构申请注销的","认证机构依法终止的","《认证机构批准书》依法被撤销的","《认证机构批准书》有效期届满，未申请延续或者复查不予延续的"],"ans":"ABCD","src":{"label":"《汇编》第91页","text":"91（五）认证机构已不具备或者不能持续符合法定条件和能力的；（六）依法可以撤销的其他情形。以欺骗、贿赂等不正当手段取得认证机构资质的，国务院认证认可监督管理部门应当撤销《认证机构批准书》；申请人在3 年内不得再次申请认证机构资质。第三十二条认证机构有下列情形之一的，国务院认证认可监督管理部门应当办理《认证机构批准书》注销手续：（一）《认证机构批准书》有效期届满，未申请延续或者复查不予延续的；（二）《认证机构批准书》依法被撤销的；（三）认证机构申请注销的；（四）认证机构依法终止的；（五）法律法规规定应当注销的其他情形。"}},{"id":689,"type":1,"num":191,"stem":"依据《认监委关于强制性产品认证依据用标准修订时有关要求的公告》（2012 年第4 号），下列关于各指定认证机构制订标准制修订转换期认证实施方案的说法，正确的有（）。","opts":["应依据《关于标准修订时强制性产品认证有关问题的通知》（国认科联[2005]18号）的有关规定","应按照相应产品的强制性产品认证技术专家组确定的相关技术决议","自行制订的认证实施方案应由国家认监委统一制订并公布","认证实施方案公布实施之前，应将方案报国家认监委认证监管部备案"],"ans":"ABD","src":{"label":"《汇编》第279页","text":"认监委关于强制性产品认证依据用标准修订时有关要求的公告（2012 年第4 号）为进一步完善强制性产品认证依据用标准修订时的认证工作，确保强制性产品认证制度的有效实施，现就有关要求公告如下：一、各指定认证机构负责跟踪强制性产品认证依据用标准的制修订情况，并依据《关于标准修订时强制性产品认证有关问题的通知》（国认科联[2005]18 号）的有关规定，按照相应产品的强制性产品认证技术专家组确定的相关技术决议，自行制订标准制修订转换期的认证实施方案，并向社会公布。公布实施之前，各指定认证机构应将自行制订的标准制修订转换期的强制性认证工作方案报我委认证监管部备案。"}},{"id":690,"type":1,"num":192,"stem":"依据《认监委关于强制性产品认证依据用标准修订时有关要求的公告》（2012 年第4 号），各申请强制性产品认证的组织或已获强制性产品认证的组织，应按照（）发布的实施方案进行认证申请或换版申请。","opts":["受理认证的指定认证机构","发证的指定认证机构","国家认监委","地方质检部门"],"ans":"AB","src":{"label":"《汇编》第280页","text":"详细、准确的关于标准主要变化情况的相关信息。三、对于新修订的认证依据用标准将引起强制性产品认证的有关政策、目录范围改变的情况，由我委统一发布相关要求的公告。四、标准修订后的认证收费须执行国家发改委规定的现行有效的收费标准。五、各申请强制性产品认证的组织或已获强制性产品认证的组织，应按照受理认证或发证的指定认证机构发布的实施方案进行认证申请或换版申请。六、各相关指定实验室应在执行新版标准前，向我委认证监管部上报依据新版标准检测能力情况，以及获得实验室资质认定和认可的情况。"}},{"id":691,"type":1,"num":193,"stem":"依据《认监委关于强制性产品认证依据用标准修订时有关要求的公告》（2012 年第4 号），各相关指定实验室应在执行新版标准前，向国家认监委认证监管部上报的内容包括（）。","opts":["依据新版标准的检测能力情况","获得实验室资质认定的情况","获得实验室认可的情况","实验室人员数量情况"],"ans":"ABC","src":{"label":"《汇编》第280页","text":"详细、准确的关于标准主要变化情况的相关信息。三、对于新修订的认证依据用标准将引起强制性产品认证的有关政策、目录范围改变的情况，由我委统一发布相关要求的公告。四、标准修订后的认证收费须执行国家发改委规定的现行有效的收费标准。五、各申请强制性产品认证的组织或已获强制性产品认证的组织，应按照受理认证或发证的指定认证机构发布的实施方案进行认证申请或换版申请。六、各相关指定实验室应在执行新版标准前，向我委认证监管部上报依据新版标准检测能力情况，以及获得实验室资质认定和认可的情况。"}},{"id":692,"type":1,"num":194,"stem":"依据《认监委关于明确强制性产品认证采信国际电工委员会（IEC）合格评定体系评价结果有关要求的通知》，实施机构应当（）。","opts":["建立采信管理措施，制定管理方案文件","原始报告、评定材料作为认证档案留存","不予采信也要做好相应记录","接受监督评审时提供采信相关文件记录"],"ans":"ABCD","src":{"label":"《汇编》第330页","text":"认监委关于明确强制性产品认证采信国际电工委员会（IEC）合格评定体系评价结果有关要求的通知国认监函〔2023〕1 号相关强制性产品认证指定认证机构和实验室：自我国加入国际电工委员会电工产品及元件测试和认证体系（IECEE）、防爆电气安全认证体系（IECEx）以来，各相关强制性产品认证指定认证机构和实验室（以下称实施机构）在认监委统一指导下，通过实质性参与IEC 相关体系活动，积极推动有关检测、检查结果在强制性产品认证中的采信，有效降低了企业获证成本，提升了贸易便利化水平，树立了较好的国际形象。"}},{"id":693,"type":1,"num":195,"stem":"依据《认监委关于明确强制性产品认证采信国际电工委员会（IEC）合格评定体系评价结果有关要求的通知》，采信三项总体原则（）。","opts":["应采尽采","协调一致","对等合作","全部采信"],"ans":"ABC","src":{"label":"《汇编》第330页","text":"认监委关于明确 和专项检查等形式。第十八条任何单位和个人对强制性产品认证检查员在检查活动中的违法违规行为，有权向国家认监委和地方认证监督管理部门举报。国家认监委和地方认证监督管理部门应当及时调查处理，并为举报人保密。"}},{"id":719,"type":1,"num":221,"stem":"依据《强制性产品认证机构和实验室管理办法》，专家委员会成员应当具备的条件有（）。","opts":["良好专业知识和职业道德修养","高级专业技术职称或者同等技术资格","熟悉行业现状、监管制度、机构资源分布","必须为在职政府公务人员"],"ans":"ABC","src":{"label":"《汇编》第67页","text":"别组成相应的专家委员会。第十六条专家委员会一般由7 至13 人组成，为非常设的临时性组织，负责申请机构的评审工作。评审工作结束后，专家委员会即行解散。第十七条专家委员会成员应当符合以下条件：（一）具有良好的专业知识和职业道德修养；（二）具备高级专业技术职称或者同等技术资格；（三）熟悉有关行业现状、相关产品的监管制度、技术机构资源配置与分布等情况。第十八条专家委员会对申请机构的评审采用会议讨论、听证、文件调阅等方式。"}},{"id":720,"type":1,"num":222,"stem":"依据《强制性产品认证机构和实验室管理办法》，指定计划包含内容（）。","opts":["拟指定机构业务领域与数量","产品范围","对申请机构要求","指定程序和时限、专家委员会组成"],"ans":"ABCD","src":{"label":"《汇编》第60页","text":"国家质检总局第65 号令强制性产品认证机构和实验室管理办法（2004 年6 月23 日国家质量监督检验检疫总局令第65 号公布根据2022 年9 月29 日国家市场监督管理总局令第61 号修订）。"}},{"id":721,"type":1,"num":223,"stem":"依据《强制性产品认证机构和实验室管理办法》，专家委员会评审应当充分考虑（）。","opts":["行业发展特点","企业分布","监管制度衔接","成本‑效率，做出科学评审结论"],"ans":"ABCD","src":{"label":"《汇编》第60页","text":"国家质检总局第65 号令强制性产品认证机构和实验室管理办法（2004 年6 月23 日国家质量监督检验检疫总局令第65 号公布根据2022 年9 月29 日国家市场监督管理总局令第61 号修订）。"}},{"id":722,"type":1,"num":224,"stem":"依据《强制性产品认证机构和实验室管理办法》，指定认证机构、实验室应当及时向国家市场监督管理总局提供（）。","opts":["强制性产品认证信息","检测活动信息","配合监督检查","可选择性提供监管需要材料"],"ans":"ABC","src":{"label":"《汇编》第60页","text":"国家质检总局第65 号令强制性产品认证机构和实验室管理办法（2004 年6 月23 日国家质量监督检验检疫总局令第65 号公布根据2022 年9 月29 日国家市场监督管理总局令第61 号修订）。"}},{"id":723,"type":1,"num":225,"stem":"依据《强制性产品认证机构和实验室管理办法》，指定认证机构、实验室应当遵守的行为规范包括（）。","opts":["在指定范围内开展业务","不得转让或变相转让指定业务","区分强制性、自愿性业务","可以歧视刁难部分认证委托人"],"ans":"ABC","src":{"label":"《汇编》第70页","text":"第四章行为规范第二十三条经国家市场监督管理总局指定的强制性产品认证机构、实验室（以下简称指定的认证机构、实验室）应当在指定范围内按照认证基本规范和认证规则的要求为认证委托人提供服务，不得转让或者变相转让指定的认证、检测业务。第二十四条指定的认证机构、实验室应当制订管理制度和程序，对强制性产品认证、检测活动和自愿性产品认证、委托检测活动明确区分，不得利用其指定的资格，开发或者从事自愿性产品认证以及检测业务。第二十五条指定的认证机构在对外宣传中应当严格区分强制性产品认证业务与自愿性产品认证业务。"}},{"id":724,"type":1,"num":226,"stem":"依据《强制性产品认证机构和实验室管理办法》，国家市场监督管理总局对指定机构监督检查方式包含（）。","opts":["每年定期监督检查","不定期工作质量调查","组织同行评议，公布评议结果","专项抽查，公布抽查结果"],"ans":"ABCD","src":{"label":"《汇编》第60页","text":"国家质检总局第65 号令强制性产品认证机构和实验室管理办法（2004 年6 月23 日国家质量监督检验检疫总局令第65 号公布根据2022 年9 月29 日国家市场监督管理总局令第61 号修订）。"}},{"id":725,"type":1,"num":227,"stem":"依据《强制性产品认证机构和实验室管理办法》，专家委员会评审可以采取哪些方式（）。","opts":["会议讨论","听证","文件调阅","根据需要建议组织现场调查"],"ans":"ABCD","src":{"label":"《汇编》第60页","text":"国家质检总局第65 号令强制性产品认证机构和实验室管理办法（2004 年6 月23 日国家质量监督检验检疫总局令第65 号公布根据2022 年9 月29 日国家市场监督管理总局令第61 号修订）。"}},{"id":726,"type":1,"num":228,"stem":"依据《强制性产品认证机构和实验室管理办法》，指定机构年度工作报告应当包括（）。","opts":["内部审核","管理评审","接受监管问询配合材料","无关企业商业经营机密"],"ans":"ABC","src":{"label":"《汇编》第60页","text":"国家质检总局第65 号令强制性产品认证机构和实验室管理办法（2004 年6 月23 日国家质量监督检验检疫总局令第65 号公布根据2022 年9 月29 日国家市场监督管理总局令第61 号修订）。"}},{"id":727,"type":1,"num":229,"stem":"依据《强制性产品认证机构和实验室管理办法》，指定认证机构对外宣传，应当严格区分（）业务。","opts":["强制性产品认证","自愿性产品认证","企业内部质量考核","企业产品广告宣传"],"ans":"AB","src":{"label":"《汇编》第60页","text":"国家质检总局第65 号令强制性产品认证机构和实验室管理办法（2004 年6 月23 日国家质量监督检验检疫总局令第65 号公布根据2022 年9 月29 日国家市场监督管理总局令第61 号修订）。"}},{"id":728,"type":1,"num":230,"stem":"依据《强制性产品认证机构和实验室管理办法》，指定实验室开展强制认证检测，应当具备（）。","opts":["承担对应产品检测全部设备设施，或获得授权可独立使用","人员经过教育培训，掌握标准规范实施规则","公正独立实施检测的组织架构","可将强制认证检测业务转包未指定实验室"],"ans":"ABC","src":{"label":"《汇编》第60页","text":"国家质检总局第65 号令强制性产品认证机构和实验室管理办法（2004 年6 月23 日国家质量监督检验检疫总局令第65 号公布根据2022 年9 月29 日国家市场监督管理总局令第61 号修订）。"}},{"id":729,"type":1,"num":231,"stem":"依据《强制性产品认证机构和实验室管理办法》，指定认证机构、实验室出现下列（）情形，责令改正并处2 万元以上3 万元以下罚款。","opts":["缺乏必要制度区分强制性与自愿性认证检测活动","利用强制性认证业务宣传推广自愿性认证业务","故意拖延、歧视刁难委托人牟取不当利益","积极配合监督检查，如实报送全部材料"],"ans":"ABC","src":{"label":"《汇编》第74页","text":"第六章罚则第三十七条指定的认证机构、实验室有下列情形之一的，责令改正，并处以2 万元以上3万元以下罚款：（一）缺乏必要的管理制度和程序区分强制性产品认证、检测活动与自愿性产品认证、委托检测活动的；（二）利用强制性产品认证业务宣传、推广自愿性产品认证业务的；（三）未向认证委托人提供及时、有效的认证、检测服务，故意拖延的或者歧视、刁难认证委托人，并牟取不当利益的；（四）对执法监督检查活动不予配合，拒不提供相关信息的；（五）未按照要求提交年度工作报告或者提供强制性产品认证、检测信息的。"}},{"id":730,"type":1,"num":232,"stem":"依据《强制性产品认证机构和实验室管理办法》，申请强制性产品认证检测的实验室，应当具备条件（）。","opts":["经依法认定，具备法律行政法规规定的基本条件和能力","相关领域检测2 年以上或出具相关报告20 份以上","申请前6 个月内无不良记录","组织结构无需保证检测活动独立公正"],"ans":"ABC","src":{"label":"《汇编》第64页","text":"动的实验室（以下简称实验室），应当具备下列条件：（一）具有法律、行政法规规定的基本条件和能力，并经依法认定；（二）具有相关领域检测经验，从事检测工作2 年以上或者对外出具相关领域检测报告20 份以上；（三）符合国家标准中对实验室技术能力的通用要求；（四）在申请前6 个月内无不良记录；（五）本单位的法人性质、产权构成以及组织结构能够保证其公正、独立地实施检测活动；（六）具备承担相应产品认证检测活动所需的全部设备、设施，或者经相关设备、设施所有权单位的授权，可以独立使用设备、设施；"}},{"id":731,"type":1,"num":233,"stem":"依据《强制性产品认证机构和实验室管理办法》，当认证机构与实验室属于同一法人，应当（）。","opts":["分别取得指定资格","建立管理制度保证认证、检测独立实施","保证认证人员、检测人员独立开展活动","认证与检测岗位人员可以完全混同不做隔离"],"ans":"ABC","src":{"label":"《汇编》第71页","text":"的实验室签署书面协议，明确各自的权利义务和法律责任，并保证其使用的实验室的检测活动符合国家强制性产品认证规范和认证规则的要求，保证其使用的实验室（包括同一法人内的）享有平等权利和履行同等义务。第二十七条指定的认证机构、实验室为同一个法人时，指定的机构应当制订相关管理制度并保证其持续有效运行，保证认证、检测活动独立实施，保证认证人员、检测人员独立开展活动。第二十八条指定的认证机构、实验室应当在指定的业务范围内从事强制性产品认证活动，保证为认证委托人提供及时、有效的认证、检测服务，不得歧视、刁难认证委托人，不得牟取不当利益。"}},{"id":732,"type":1,"num":234,"stem":"依据《强制性产品认证机构和实验室管理办法》，任何单位个人可以向市场监管部门举报指定机构哪些行为（）。","opts":["违法违规从事强制认证活动","弄虚作假出具报告","不遵守行为规范","依法依规完成检测工作"],"ans":"ABC","src":{"label":"《汇编》第60页","text":"国家质检总局第65 号令强制性产品认证机构和实验室管理办法（2004 年6 月23 日国家质量监督检验检疫总局令第65 号公布根据2022 年9 月29 日国家市场监督管理总局令第61 号修订）。"}},{"id":733,"type":1,"num":235,"stem":"依据《强制性产品认证机构和实验室管理办法》，申请强制性产品认证机构应当具备的条件包括（）。","opts":["依照条例设立，具有相应领域2 年以上认证经历或颁发相关证书20 份以上","符合国家标准对认证机构技术能力通用要求","申请前6 个月内无不良记录","可以不具备独立调配使用的检测检查资源"],"ans":"ABC","src":{"label":"《汇编》第63页","text":"认证机构应当具备下列条件：（一）依照条例规定设立，具有相应领域2年以上认证经历或者颁发相关产品认证证书20份以上；（二）符合国家标准中对认证机构技术能力的通用要求；（三）在申请前6 个月内无不良记录；（四）本机构的法人性质、产权构成和组织结构等能够保证其强制性认证活动的客观公正；（五）具备能够公正、独立和有效地从事强制性产品认证活动的技术与管理能力；（六）具备从事强制性产品认证活动所需要并且可以独立调配使用的检测、检查资源，拥有与强制性产品认证工作任务相适应的符合条例规定的认证人员和稳定的财力资源。"}},{"id":734,"type":1,"num":236,"stem":"依据《强制性产品认证机构服务工作规范指南》，认证机构应当通过官方网站、业务系统或者办事窗口等主动公开的信息包括（）。","opts":["CCC 认证业务范围","认证实施程序、认证收费标准","证书状态、投诉举报渠道","企业生产内部涉密工艺文件"],"ans":"ABC","src":{"label":"《强制性产品认证机构服务工作规范指南》第6页","text":"（二十四)认证机构应当建立认证委托人反馈与申诉投诉处理机制,公开服务监督渠道,及时受理和处理认证委托人对认证服务的意见建议、举报投诉,并将反馈情况纳入内部整改和风险管理,主动向监管部门报告包括但不限于涉及伪造资料、利益输送、重复违规等重大风险的服务问题。 (二十五)认证机构应当通过其官方网站、业务系统或者办事窗口等主动公开CCC 认证业务范围、认证实施程序、认证收费标准、证书状态、投诉举报渠道等信息,明确表明无任何合作中介代理机构,接受监管部门和社会公众监督。"}},{"id":735,"type":1,"num":237,"stem":"依据《强制性产品认证机构服务工作规范指南》，认证机构在依法提供认证服务时，应当严格执行国家认监委发布的哪些文件，确保服务内容与实施规则规定的认证全过程要求保持一致（）。","opts":["CCC 认证实施规则","技术决议","认证依据标准","企业自行编制产品技术文件"],"ans":"AB","src":{"label":"《强制性产品认证机构服务工作规范指南》第1页","text":"性产品认证（CCC 认证）指定认证机构（以下简称认证机构）服务活动，提高CCC 认证实施过程中的服务质量，压实认证机构发证主体责任，推动CCC 认证制度的权威性、公信力和友好性提升，现制定工作规范指南如下：  一、依法提供认证服务 （一）认证机构应当严格遵守《中华人民共和国认证认可条例》《强制性产品认证管理规定》《强制性产品认证机构和实验室管理办法》《认证机构管理办法》《认证及认证培训、咨询人员管理办法》《强制性产品认证检查员管理办法》等行政法规、部门规章和行政规范性文件的规定，合法合规提供必要的政策解读宣贯和程序指导服务，不得影响CCC 认证的公正性、有效性。  （二）认证机构应当严格执行国家认监委发布的CCC 认证实施规则、技术决议及相关文件，确保服务内容与实施规则规定的认证全过程要求保持一致，不得擅自增加、减少或者遗漏认证程序要求。"}},{"id":736,"type":1,"num":238,"stem":"依据《强制性产品认证机构服务工作规范指南》，认证机构严禁以任何形式参与认证委托人的整改活动，不得提供下列哪些技术咨询服务（）。","opts":["资料预审","内部评估预判","整改建议","检查技术指导"],"ans":"ABCD","src":{"label":"《强制性产品认证机构服务工作规范指南》第3页","text":"在监督检查结论出具后，对检查中发现的问题、评价依据及整改要求进行解释，帮助认证委托人、生产者、生产企业理解整改流程和问题内容。  （九）在认证结果采信阶段，认证机构应当按照有关规定主动采信或者承认在我国与国际电工委员会（IEC）相关合格评定结果互认体系范围内的检测、检查结果，必要时可补充相应检测、检查活动，避免重复评价。  三、严禁触碰工作底线 （十）认证机构不得要求认证委托人通过中介代理机构提交认证委托。认证机构禁止代替、唆使、默许认证委托人编造、修改、隐瞒或者伪造委托资料、检测资料、生产记录、质量管理文件等，不得协助认证委托人规避认证要求。 （十一）认证机构应当严格管理检测活动、工厂检查活动、跟踪检查、抽样检测活动，不得出于经济利益影响检测、检查或者认证决定的独立性和客观性。"}},{"id":737,"type":1,"num":239,"stem":"认证证书应当包括下列哪些基本内容？","opts":["产品名称和产品系列、规格、型号","产品生产者（制造商）名称、地址","认证委托人名称、地址","发证日期和有效期限"],"ans":"ABCD","src":{"label":"《汇编》第40页","text":"情况等因素，对获证产品及其生产企业进行跟踪检查的分类管理，确定合理的跟踪检查频次。第三章认证证书和认证标志第二十条市场监管总局统一规定强制性产品认证证书（以下简称认证证书）的格式、内容和强制性产品认证标志（以下简称认证标志）的式样、种类。第二十一条认证证书应当包括以下基本内容：（一）认证委托人名称、地址；（二）产品生产者（制造商）名称、地址；（三）被委托生产企业名称、地址（需要时）；（四）产品名称和产品系列、规格、型号；（五）认证依据；（六）认证模式（需要时）；"}},{"id":738,"type":1,"num":240,"stem":"强制性产品认证应当适用的认证模式包括（）。","opts":["型式试验","设计鉴定","生产现场抽取样品检测或者检查","市场抽样检测或者检查"],"ans":"ABCD","src":{"label":"《汇编》第34页","text":"义务。第二章认证实施第七条强制性产品认证基本规范、认证规则由市场监管总局制定、发布。第八条强制性产品认证应当适用以下单一认证模式或者多项认证模式的组合，具体模式包括：（一）设计鉴定；（二）型式试验；（三）生产现场抽取样品检测或者检查；（四）市场抽样检测或者检查；（五）企业质量保证能力和产品一致性检查；（六）获证后的跟踪检查。"}},{"id":739,"type":1,"num":241,"stem":"认证机构、实验室有下列哪些情形之一的，市场监管总局应当责令其停业整顿？","opts":["未对其认证的产品实施有效的跟踪调查，或者发现其认证的产品不能持续符合认证要求，不及时暂停或者撤销认证证书并予以公布的","对不属于目录内产品进行强制性产品认证的","增加、减少、遗漏或者变更认证基本规范、认证规则规定的程序的","使用未取得相应资质的人员从事认证、检测活动的，情节严重的"],"ans":"ABCD","src":{"label":"《汇编》第52页","text":"停业整顿期间不得从事指定范围内的强制性产品认证、检测活动：（一）增加、减少、遗漏或者变更认证基本规范、认证规则规定的程序的；（二）未对其认证的产品实施有效的跟踪调查，或者发现其认证的产品不能持续符合认证要求，不及时暂停或者撤销认证证书并予以公布的；（三）未对认证、检测过程作出完整记录，归档留存，情节严重的；（四）使用未取得相应资质的人员从事认证、检测活动的，情节严重的；（五）未对认证委托人提供样品的真实性进行有效审查的；（六）阻挠、干扰监管部门认证执法检查的；（七）对不属于目录内产品进行强制性产"}},{"id":740,"type":1,"num":242,"stem":"有下列哪些情形之一的，由县级以上地方市场监督管理部门责令其限期改正，逾期未改正的，处2 万元以下罚款？","opts":["转让认证业务的","未按照规定使用认证标志的","获证产品及其销售包装上标注的认证证书所含内容与认证证书内容不一致的","认证委托人提供的样品与实际生产的产品不一致的"],"ans":"BC","src":{"label":"《汇编》第57页","text":"厂、销售、进口或者在其他经营活动中使用列入目录产品的；（三）违反本规定第二十五条规定，未按照规定向认证机构申请认证证书扩展，擅自出厂、销售、进口或者在其他经营活动中使用列入目录产品的。第五十五条有下列情形之一的，由县级以上地方市场监督管理部门责令其限期改正，逾期未改正的，处2 万元以下罚款。（一）违反本规定第二十三条规定，获证产品及其销售包装上标注的认证证书所含内容与认证证书内容不一致的；（二）违反本规定第三十二条规定，未按照规定使用认证标志的。"}},{"id":741,"type":1,"num":243,"stem":"关于认证机构对获证产品的跟踪检查，下列哪些说法符合本规定？","opts":["认证机构应当通过现场产品检测或者检查、市场产品抽样检测或者检查、质量保证能力检查等方式实施跟踪检查","认证机构应当对跟踪检查全过程作出完整记录，归档留存","对于不能持续符合认证要求的，认证机构应当根据相应情形作出予以暂停或者撤销认证证书的处理，并予公布","认证机构应当按照认证规则的规定，根据获证产品的安全等级、产品质量稳定性等因素确定合理的跟踪检查频次"],"ans":"ABCD","src":{"label":"《汇编》第39页","text":"认证机构及其有关人员应当对其作出的认证结论负责。第十七条认证机构应当通过现场产品检测或者检查、市场产品抽样检测或者检查、质量保证能力检查等方式，对获证产品及其生产企业实施分类管理和有效的跟踪检查，控制并验证获证产品与型式试验样品的一致性、生产企业的质量保证能力持续符合认证要求。第十八条认证机构应当对跟踪检查全过程作出完整记录，归档留存，保证认证过程和结果具有可追溯性。对于不能持续符合认证要求的，认证机构应当根据相应情形作出予以暂停或者撤销认证证书的处理，并予公布。"}},{"id":742,"type":1,"num":244,"stem":"有下列哪些情形之一的，列入目录产品的生产者、进口商、销售商或者其代理人可以向所在地市场监督管理部门提出免予办理强制性产品认证申请？","opts":["工厂生产线/成套生产线配套所需的设备/部件（不包含办公用品）","为考核技术引进生产线所需的零部件","直接为最终用户维修目的所需的产品","为科研、测试所需的产品"],"ans":"ABCD","src":{"label":"《汇编》第50页","text":"织驻华机构及其外交人员的自用物品；（二）香港、澳门特别行政区政府驻大陆官方机构及其工作人员的自用物品；（三）入境人员随身从境外带入境内的自用物品；（四）外国政府援助、赠送的物品；（五）其他依法无需办理强制性产品认证的情形。第四十二条有下列情形之一的，列入目录产品的生产者、进口商、销售商或者其代理人可以向所在地市场监督管理部门提出免予办理强制性产品认证申请，提交相关证明材料、责任担保书、产品符合性声明（包括型式试验报告）等资料，并根据需要进行产品检测，经批准取得《免予办理强制性产品认证证明》后，方可进口，并按照申报用途使用：（一）为科研、测试所需的产品；"}},{"id":743,"type":1,"num":245,"stem":"认证机构、实验室有下列哪些情形之一的，市场监管总局应当责令其停业整顿？","opts":["未对认证、检测过程作出完整记录，归档留存，情节严重的","停业整顿期间不得从事指定范围内的强制性产品认证、检测活动","未对认证委托人提供样品的真实性进行有效审查的","阻挠、干扰监管部门认证执法检查的"],"ans":"ACD","src":{"label":"《汇编》第52页","text":"停业整顿期间不得从事指定范围内的强制性产品认证、检测活动：（一）增加、减少、遗漏或者变更认证基本规范、认证规则规定的程序的；（二）未对其认证的产品实施有效的跟踪调查，或者发现其认证的产品不能持续符合认证要求，不及时暂停或者撤销认证证书并予以公布的；（三）未对认证、检测过程作出完整记录，归档留存，情节严重的；（四）使用未取得相应资质的人员从事认证、检测活动的，情节严重的；（五）未对认证委托人提供样品的真实性进行有效审查的；（六）阻挠、干扰监管部门认证执法检查的；（七）对不属于目录内产品进行强制性产"}},{"id":744,"type":1,"num":246,"stem":"有下列哪些情形之一的，认证委托人应当向认证机构申请认证证书的变更？","opts":["获证产品的关键元器件、规格和型号，以及涉及整机安全或者电磁兼容的设计、结构、工艺和材料或者原材料生产企业等发生变更的","获证产品命名方式改变导致产品名称、型号变化或者获证产品的生产者、生产企业名称、地址名称发生变更的","获证产品型号变更，但不涉及安全性能和电磁兼容内部结构变化的","获证产品生产企业地点或者其质量保证体系、生产条件等发生变更的"],"ans":"ABCD","src":{"label":"《汇编》第42页","text":"证机构根据不同情况作出相应处理：（一）获证产品命名方式改变导致产品名称、型号变化或者获证产品的生产者、生产企业名称、地址名称发生变更的，经认证机构核实后，变更认证证书；（二）获证产品型号变更，但不涉及安全性能和电磁兼容内部结构变化；或者获证产品减少同种产品型号的，经认证机构确认后，变更认证证书；（三）获证产品的关键元器件、规格和型号，以及涉及整机安全或者电磁兼容的设计、结构、工艺和材料或者原材料生产企业等发生变更的，经认证机构重新检测合格后，变更认证证书；（四）获证产品生产企业地点或者其质量保证体系、生产条件等发生变更的，经认证机构重新工厂检查合格后，变更认证证书；"}},{"id":745,"type":1,"num":247,"stem":"认证机构、实验室有下列哪些情形之一的，市场监管总局应当责令其改正，情节严重的，撤销对其指定直至撤销认证机构批准文件？","opts":["停业整顿期满后，经检查仍不符合整改要求的","超出指定的业务范围从事列入目录产品的认证以及与认证有关的检测活动的","停业整顿期间继续从事指定范围内的强制性产品认证、检测活动的","转让指定认证业务的"],"ans":"ABCD","src":{"label":"《汇编》第58页","text":"负有直接责任的人员，撤销相应从业资格；构成犯罪的，依法追究刑事责任；造成损失的，承担相应的赔偿责任。第五十七条认证机构、实验室有下列情形之一的，市场监管总局应当责令其改正，情节严重的，撤销对其指定直至撤销认证机构批准文件。（一）超出指定的业务范围从事列入目录产品的认证以及与认证有关的检测活动的；（二）转让指定认证业务的；（三）停业整顿期间继续从事指定范围内的强制性产品认证、检测活动的；（四）停业整顿期满后，经检查仍不符合整改要求的。"}},{"id":746,"type":1,"num":248,"stem":"关于强制性产品认证的监督管理，下列哪些说法符合本规定？","opts":["列入目录产品的生产者、销售商发现其生产、销售的产品存在安全隐患的，应当向社会公布有关信息，主动采取召回产品等救济措施","市场监管总局对认证机构、实验室的认证、检测活动实施年度监督检查和不定期的专项监督检查","认证机构应当将获证产品的认证委托人、获证产品及其生产企业，以及认证证书被注销、暂停或者撤销的信息向市场监管总局和省级市场监督管理部门进行通报","县级以上地方市场监督管理部门进行强制性产品认证监督检查时，可以依法进入生产经营场所实施现场检查"],"ans":"ABCD","src":{"label":"《汇编》第47页","text":"标注认证标志。第三十三条任何单位和个人不得伪造、变造、冒用、买卖和转让认证证书和认证标志。第四章监督管理第三十四条市场监管总局对认证机构、实验室的认证、检测活动实施年度监督检查和不定期的专项监督检查。第三十五条认证机构应当将获证产品的认证委托人、获证产品及其生产企业，以及认证证书被注销、暂停或者撤销的信息向市场监管总局和省级市场监督管理部门进行通报。第三十六条市场监管总局统一计划，采取定期或者不定期的方式对获证产品进行监督检查。"}},{"id":747,"type":1,"num":249,"stem":"关于实验室，下列哪些说法符合本规定？","opts":["实验室应当对检测全过程作出完整记录，归档留存","实验室对样品进行产品型式试验，应当确保检测结论的真实、准确","实验室及其有关人员应当对其作出的检测报告内容以及检测结论负责","实验室对样品真实性有疑义的，应当向认证机构说明情况，并作出相应处理"],"ans":"ABCD","src":{"label":"《汇编》第38页","text":"实验室及其有关人员应当对其作出的检测报告内容以及检测结论负责，对样品真实性有疑义的，应当向认证机构说明情况，并作出相应处理。第十五条需要进行工厂检查的，认证机构应当委派具有国家注册资格的强制性产品认证检查员，对产品生产企业的质量保证能力、生产产品与型式试验样品的一致性等情况，依照具体产品认证规则进行检查。认证机构及其强制性产品认证检查员应当对检查结论负责。第十六条认证机构完成产品型式试验和工厂检查后，对符合认证要求的，一般情况下自受理认证委托起90 天内向认证委托人出具认证证书。"}},{"id":748,"type":1,"num":250,"stem":"有下列哪些情形之一的，认证机构应当按照认证规则规定的期限暂停认证证书，并对外公布？","opts":["跟踪检查中发现认证委托人违反认证规则等规定的","产品适用的认证依据或者认证规则发生变更，规定期限内产品未符合变更要求的","认证委托人申请暂停的","无正当理由拒绝接受跟踪检查或者跟踪检查发现产品不能持续符合认证要求的"],"ans":"ABCD","src":{"label":"《汇编》第44页","text":"44（四）认证委托人申请注销的；（五）其他依法应当注销的情形。第二十七条有下列情形之一的，认证机构应当按照认证规则规定的期限暂停认证证书，并对外公布：（一）产品适用的认证依据或者认证规则发生变更，规定期限内产品未符合变更要求的；（二）跟踪检查中发现认证委托人违反认证规则等规定的；（三）无正当理由拒绝接受跟踪检查或者跟踪检查发现产品不能持续符合认证要求的；（四）认证委托人申请暂停的；（五）其他依法应当暂停的情形。"}},{"id":749,"type":1,"num":251,"stem":"关于认证委托人向认证机构提供材料，下列哪些说法符合本规定？","opts":["认证委托人无需向认证机构提供任何材料","销售者、进口商作为认证委托人时，还应当向认证机构提供销售者与生产者或者进口商与生产者订立的相关合同副本","认证委托人应当按照具体产品认证规则的规定，向认证机构提供相关技术材料","委托其他企业生产列入目录产品的，认证委托人还应当向认证机构提供委托企业与被委托企业订立的相关合同副本"],"ans":"BCD","src":{"label":"《汇编》第36页","text":"36（十二）其他规定。第十条列入目录产品的生产者或者销售者、进口商（以下统称认证委托人）应当委托经市场监管总局指定的认证机构（以下简称认证机构）对其生产、销售或者进口的产品进行认证。委托其他企业生产列入目录产品的，委托企业或者被委托企业均可以向认证机构进行认证委托。第十一条认证委托人应当按照具体产品认证规则的规定，向认证机构提供相关技术材料。销售者、进口商作为认证委托人时，还应当向认证机构提供销售者与生产者或者进口商与生产者订立的相关合同副本。"}},{"id":750,"type":1,"num":252,"stem":"认证证书还应当包括下列哪些基本内容？","opts":["证书编号","认证委托人全部财务信息","认证依据","发证机构"],"ans":"ACD","src":null},{"id":751,"type":1,"num":253,"stem":"有下列哪些情形之一的，由县级以上地方市场监督管理部门责令其改正，处3 万元以下的罚款？","opts":["未按照规定向认证机构申请认证证书变更，擅自出厂、销售、进口或者在其他经营活动中使用列入目录产品的","未按照规定向认证机构申请认证证书扩展，擅自出厂、销售、进口或者在其他经营活动中使用列入目录产品的","获证产品及其销售包装上标注的认证证书所含内容与认证证书内容不一致的","认证委托人提供的样品与实际生产的产品不一致的"],"ans":"ABD","src":{"label":"《汇编》第57页","text":"厂、销售、进口或者在其他经营活动中使用列入目录产品的；（三）违反本规定第二十五条规定，未按照规定向认证机构申请认证证书扩展，擅自出厂、销售、进口或者在其他经营活动中使用列入目录产品的。第五十五条有下列情形之一的，由县级以上地方市场监督管理部门责令其限期改正，逾期未改正的，处2 万元以下罚款。（一）违反本规定第二十三条规定，获证产品及其销售包装上标注的认证证书所含内容与认证证书内容不一致的；（二）违反本规定第三十二条规定，未按照规定使用认证标志的。"}},{"id":752,"type":1,"num":254,"stem":"强制性产品认证认证模式还包括（）。","opts":["获证后的跟踪检查","工厂检查","免予认证","企业质量保证能力和产品一致性检查"],"ans":"AD","src":{"label":"《汇编》第34页","text":"义务。第二章认证实施第七条强制性产品认证基本规范、认证规则由市场监管总局制定、发布。第八条强制性产品认证应当适用以下单一认证模式或者多项认证模式的组合，具体模式包括：（一）设计鉴定；（二）型式试验；（三）生产现场抽取样品检测或者检查；（四）市场抽样检测或者检查；（五）企业质量保证能力和产品一致性检查；（六）获证后的跟踪检查。"}},{"id":753,"type":1,"num":255,"stem":"关于获证产品被注销、暂停或者撤销认证证书后的处理，下列哪些说法符合本规定？","opts":["认证证书暂停期间，不符合认证要求的产品不得继续出厂、销售、进口或者在其他经营活动中使用","获证产品被注销、暂停或者撤销认证证书的，认证机构应当确定不符合认证要求的产品类别和范围","不符合认证要求的产品可以在整改合格后继续出厂、销售","自认证证书注销、撤销之日起，不符合认证要求的产品不得继续出厂、销售、进口或者在其他经营活动中使用"],"ans":"ABD","src":{"label":"《汇编》第45页","text":"45（二）跟踪检查中发现获证产品与认证委托人提供的样品不一致的；（三）认证证书暂停期间，认证委托人未采取整改措施或者整改后仍不合格的；（四）认证委托人以欺骗、贿赂等不正当手段获得认证证书的；（五）其他依法应当撤销的情形。第二十九条获证产品被注销、暂停或者撤销认证证书的，认证机构应当确定不符合认证要求的产品类别和范围。自认证证书注销、撤销之日起或者认证证书暂停期间，不符合认证要求的产品，不得继续出厂、销售、进口或者在其他经营活动中使用。"}},{"id":754,"type":1,"num":256,"stem":"认证规则还应当包括下列哪些内容？","opts":["获证后跟踪检查的要求","抽样和送样要求","工厂检查的要求","认证证书有效期的要求"],"ans":"ABCD","src":{"label":"《汇编》第35页","text":"的危害程度、产品的生命周期、生产、进口产品的风险状况等综合因素，按照科学、便利等原则予以确定。第九条认证规则应当包括以下内容：（一）适用的产品范围；（二）适用的产品所对应的国家标准、行业标准和国家技术规范的强制性要求；（三）认证模式；（四）申请单元划分原则或者规定；（五）抽样和送样要求；（六）关键元器件或者原材料的确认要求（需要时）；（七）检测标准的要求（需要时）；（八）工厂检查的要求；（九）获证后跟踪检查的要求；（十）认证证书有效期的要求；（十一）获证产品标注认证标志的要求；"}},{"id":755,"type":1,"num":257,"stem":"有下列哪些情形之一的，市场监管总局根据利害关系人的请求或者依据职权，可以撤销对认证机构、实验室的指定？","opts":["工作人员滥用职权、玩忽职守作出指定决定的","违反法定程序作出指定决定的","对不具备指定资格的认证机构、实验室准予指定的","超越法定职权作出指定决定的"],"ans":"ABCD","src":{"label":"《汇编》第53页","text":"品认证的；（八）其他违反法律法规规定的。第四十四条有下列情形之一的，市场监管总局根据利害关系人的请求或者依据职权，可以撤销对认证机构、实验室的指定：（一）工作人员滥用职权、玩忽职守作出指定决定的；（二）超越法定职权作出指定决定的；（三）违反法定程序作出指定决定的；（四）对不具备指定资格的认证机构、实验室准予指定的；（五）依法可以撤销指定决定的其他情形。第四十五条认证机构或者实验室以欺骗、贿赂等不正当手段获得指定的，由市场监管总局撤销指定，并予以公布。"}},{"id":756,"type":1,"num":258,"stem":"认证规则应当包括下列哪些内容？","opts":["认证模式","适用的产品所对应的国家标准、行业标准和国家技术规范的强制性要求","申请单元划分原则或者规定","适用的产品范围"],"ans":"ABCD","src":{"label":"《汇编》第35页","text":"的危害程度、产品的生命周期、生产、进口产品的风险状况等综合因素，按照科学、便利等原则予以确定。第九条认证规则应当包括以下内容：（一）适用的产品范围；（二）适用的产品所对应的国家标准、行业标准和国家技术规范的强制性要求；（三）认证模式；（四）申请单元划分原则或者规定；（五）抽样和送样要求；（六）关键元器件或者原材料的确认要求（需要时）；（七）检测标准的要求（需要时）；（八）工厂检查的要求；（九）获证后跟踪检查的要求；（十）认证证书有效期的要求；（十一）获证产品标注认证标志的要求；"}},{"id":757,"type":1,"num":259,"stem":"列入目录产品的生产者、进口商、销售商或者其代理人还可以就下列哪些情形提出免予办理强制性产品认证申请？","opts":["仅用于商业展示，但不销售的产品","以整机全数出口为目的而用进料或者来料加工方式进口的零部件","以整机全数出口为目的而用一般贸易方式进口的零部件","暂时进口后需退运出关的产品（含展览品）"],"ans":"ABCD","src":{"label":"《汇编》第51页","text":"51（二）为考核技术引进生产线所需的零部件；（三）直接为最终用户维修目的所需的产品；（四）工厂生产线/成套生产线配套所需的设备/部件（不包含办公用品）；（五）仅用于商业展示，但不销售的产品；（六）暂时进口后需退运出关的产品（含展览品）；（七）以整机全数出口为目的而用一般贸易方式进口的零部件；（八）以整机全数出口为目的而用进料或者来料加工方式进口的零部件；（九）其他因特殊用途免予办理强制性产品认证的情形。"}},{"id":758,"type":1,"num":260,"stem":"有下列哪些情形之一的，认证机构应当注销认证证书，并对外公布？","opts":["认证委托人申请注销的","获证产品不再生产的","认证证书有效期届满，认证委托人未申请延续使用的","获证产品型号已列入国家明令淘汰或者禁止生产的产品目录的"],"ans":"ABCD","src":{"label":"《汇编》第43页","text":"43（五）其他应当变更的情形。第二十五条认证委托人需要扩展其获证产品覆盖范围的，应当向认证机构申请认证证书的扩展，认证机构应当核查扩展产品与原获证产品的一致性，确认原认证结果对扩展产品的有效性。经确认合格后，可以根据认证委托人的要求单独出具认证证书或者重新出具认证证书。认证机构可以按照认证规则的要求，针对差异性补充进行产品型式试验或者工厂检查。第二十六条有下列情形之一的，认证机构应当注销认证证书，并对外公布：（一）认证证书有效期届满，认证委托人未申请延续使用的；（二）获证产品不再生产的；（三）获证产品型号已列入国家明令淘汰或者禁止生产的产品目录的；"}},{"id":759,"type":1,"num":261,"stem":"有下列哪些情形之一的，认证机构应当撤销认证证书，并对外公布？","opts":["认证委托人以欺骗、贿赂等不正当手段获得认证证书的","跟踪检查中发现获证产品与认证委托人提供的样品不一致的","认证证书暂停期间，认证委托人未采取整改措施或者整改后仍不合格的","获证产品存在缺陷，导致质量安全事故的"],"ans":"ABCD","src":{"label":"《汇编》第45页","text":"45（二）跟踪检查中发现获证产品与认证委托人提供的样品不一致的；（三）认证证书暂停期间，认证委托人未采取整改措施或者整改后仍不合格的；（四）认证委托人以欺骗、贿赂等不正当手段获得认证证书的；（五）其他依法应当撤销的情形。第二十九条获证产品被注销、暂停或者撤销认证证书的，认证机构应当确定不符合认证要求的产品类别和范围。自认证证书注销、撤销之日起或者认证证书暂停期间，不符合认证要求的产品，不得继续出厂、销售、进口或者在其他经营活动中使用。"}},{"id":760,"type":1,"num":262,"stem":"列入目录的进境物品符合下列哪些情形之一的，入境时无需办理强制性产品认证？","opts":["入境人员随身从境外带入境内的自用物品","外国政府援助、赠送的物品","外国驻华使馆、领事馆或者国际组织驻华机构及其外交人员的自用物品","香港、澳门特别行政区政府驻大陆官方机构及其工作人员的自用物品"],"ans":"ABCD","src":{"label":"《汇编》第50页","text":"织驻华机构及其外交人员的自用物品；（二）香港、澳门特别行政区政府驻大陆官方机构及其工作人员的自用物品；（三）入境人员随身从境外带入境内的自用物品 志，颜色为白色底版、黑色图案，尺寸分为五种规格（见下表）。注：A 和B 分别指CCC 标志椭圆形外廓的长轴和短轴长度，单位为mm。（二）印刷/模压CCC 标志指采用印刷、模压、模制、丝印、喷漆、蚀刻、雕刻、烙印等技术工艺在产品规定位置直接加施的CCC 标志，颜色可根据产品外观或铭牌总体设计情况合理选用，尺寸可按比例放大或缩小。（三）电子标注CCC 标志指在产品的集成屏幕（屏幕拆卸后，产品不可正常使用）上以电子方式显示的CCC 标志，颜色可根据产品外观或屏幕显示情况"}},{"id":779,"type":1,"num":281,"stem":"依据《国家认监委关于强制性产品认证实施有关要求的通知》（国认证〔2014〕84号），各指定认证机构应进一步加大证后监督力度，除认证实施规则要求的获证后跟踪检查外，还应采取（）等多种方式对认证结果进行有效监督。","opts":["市场抽样检测","国抽和委抽数据质量分析","增加认证收费","减少工厂检查"],"ans":"AB","src":{"label":"《汇编》第286页","text":"度，除认证实施规则要求的获证后跟踪检查外，还应采取如市场抽样检测、国抽和委抽数据质量分析等多种方式对认证结果进行有效监督。同时应定期开展指定业务领域的质量分析工作，从产品、区域、企业、认证环节等各个方面进行多维度的梳理分析，查找认证实施的薄弱环节，并针对薄弱环节进行重点控制，确保认证结果持续符合相关要求。二、全面提升服务水平，有序开展市场竞争各指定机构应进一步优化内部工作流程，提升工作效率，全面提升自身服务水平，服务前移，以服务促发展，公平有序的开展市场竞争。禁止采取不正当手段开展恶性竞争，具体要求如下。"}},{"id":780,"type":1,"num":282,"stem":"依据《国家认监委关于强制性产品认证实施有关要求的通知》（国认证〔2014〕84号），认证委托人向拟转入的指定认证机构提出CCC 证书转换申请时，应提交的必要文件资料主要包括（）。","opts":["CCC 认证证书复印件","有效的型式试验报告、最近一次的工厂检查/监督报告","认证实施规则要求的认证委托材料","认证委托人自愿转换证书和质量保证声明"],"ans":"ABCD","src":{"label":"《汇编》第288页","text":"状态时，在认证委托人自愿申请的情况下，具备相应产品指定业务范围的指定认证机构，经过相应评价程序可以对原指定认证机构颁发的CCC 认证证书进行转换。各指定认证机构应尊重企业的自主意愿，加强相互间协作，建立证书转入转出协调和管理机制，规范开展CCC 认证证书转换工作。CCC 认证证书转换应体现对原有认证结果的科学合理利用，具体按以下程序实施：（一）认证委托人向拟转入的指定认证机构提出CCC 证书转换申请，并提交必要的文件资料主要包括：1.CCC 认证证书复印件；2.有效的型式试验报告、最近一次的工厂检查/监督报告；3.认证实施规则要求的认证委托材料；4.认证委托人自愿转换证书和质量保证声"}},{"id":781,"type":1,"num":283,"stem":"依据《国家认监委关于强制性产品认证实施有关要求的通知》（国认证〔2014〕84号），各指定认证机构应进一步完善检查员行为规范方面的管理制度、培训要求、监督措施等制度要求，科学调整工厂检查员交通费报销方式。加强对工厂检查员的监督，采取（）等多种方式对工厂检查员行为规范进行监督。","opts":["定期或不定期回访","\"背靠背\"调查","现场全程陪同","公开评议"],"ans":"AB","src":{"label":"《汇编》第285页","text":"规范方面的管理制度、培训要求、监督措施等制度要求，科学调整工厂检查员交通费报销方式。加强对工厂检查员的监督，采取定期或不定期回访、“背靠背”调查等多种方式对工厂检查员行为规范进行监督。当发现工厂检查员存在潜在风险时，应立即暂停业务派遣；一旦发现工厂检查员存在违法违规行为，应及时报告认监委，一经查实，严肃处理。（五）严格CCC 认证证书和标志管理各指定认证机构应严格CCC 认证证书管理，当认证证书状态变更时，应及时予以公告并报送至CCC 认证信息化管理平台。在认证实施过程中，要加强对CCC 标志使用情况的检查，避免乱用标志或非法买卖CCC 标志等情况发生。"}},{"id":782,"type":1,"num":284,"stem":"依据《国家认监委关于强制性产品认证实施有关要求的通知》（国认证〔2014〕84号），各指定认证机构应组织建立兼顾政策、法规、认证、标准和检测等方面的专家队伍，结合认证机构自身和认证产品特点，在强制性产品认证实施规则的框架下，科学制订认证实施细则。实施细则应重点就（）等关键环节做出清晰和明确的规定。","opts":["企业分类管理","单元划分","认证模式选择","不符合项判定和处置"],"ans":"ABCD","src":{"label":"《汇编》第284页","text":"伍，结合认证机构自身和认证产品特点，在强制性产品认证实施规则的框架下，科学制订认证实施细则。实施细则应重点就企业分类管理、单元划分、认证模式选择、不符合项判定和处置等关键环节做出清晰和明确的规定，以便利认证委托人理解相关要求和申请认证。（三）强化过程控制，严把认证实施工作质量各指定机构要遵守强制性产品认证相关法律法规的规定，把强制性产品认证各项管理措施和工作要求落到实处，严格按照认证实施规则、实施细则和检测规程的相关要求，强化过程控制，做好认证实施和检测各个环节工作，严把认证/检测质量。"}},{"id":783,"type":1,"num":285,"stem":"依据《国家认监委关于强制性产品认证实施有关要求的通知》（国认证〔2014〕84号），拟转入认证机构对认证委托人的证书转换申请进行资料审核和评价，审核和评价的主要内容至少应包括（）。","opts":["申请资料和相关信息的真实性","证书是否处于有效状态","产品检测、工厂检查结果是否符合强制性产品认证相关要求","证书覆盖的产品范围是否符合认证的相关要求"],"ans":"ABCD","src":{"label":"《汇编》第289页","text":"明。必要时，提供认证委托人在拟转出的指定认证机构的分类管理情况。（二）拟转入认证机构对认证委托人的证书转换申请进行资料审核和评价，并作出是否颁发证书的决定。审核和评价的主要内容至少应包括：1.申请资料和相关信息的真实性；2.证书是否处于有效状态；3.产品检测、工厂检查结果是否符合强制性产品认证相关要求；4.证书覆盖的产品范围是否符合认证的相关要求。必要时，拟转入指定认证机构可安排补充产品检测或工厂现场检查活动，进行评价。"}},{"id":784,"type":1,"num":286,"stem":"依据《国家认监委关于强化强制性产品认证自我声明评价方式实验室检测质量主体责任的公告》，风险控制应当重点关注（）。","opts":["型式试验客观公正性，符合CCC 要求","报告完整有效、原始记录报告可追溯","标准换版后及时更新设备、人员培训","专人专岗落实、职业道德、风险识别应对"],"ans":"ABCD","src":{"label":"《汇编》第349页","text":"三、CCC 标志的印制及标注列入《强制性产品认证目录》的产品，按规定获得强制性产品认证（含自我声明）并标注CCC 标志后，方可出厂、销售、进口或者在其他经营活动中使用。获证组织可结合产品特点从下列方式中选用适合的方式标注CCC 标志，认证规则对CCC 标志标注方式有明确规定的，从其规定。（一）标准规格CCC 标志方式标准规格CCC 标志由指定认证机构组织印制。指定认证机构应确保标准规格CCC 标志印刷质量符合法律法规及相关国家标准规定；有可识别的防伪措施；标志图案清晰、完整、耐擦拭；标志可牢固粘贴。获证产品的生产企业凭有效强制性产品认证证书（或自我声明）向指定认证机构购买标准规格CCC 标志，可用于本企业的"}},{"id":785,"type":1,"num":287,"stem":"依据《国家认监委关于强化强制性产品认证自我声明评价方式实验室检测质量主体责任的公告》，自我声明检测业务至少设置专人专岗包括（）。","opts":["受理委托和合同评审岗","自我声明检测方案制定岗","自我声明检测报告审核和签发岗","自我声明检测报告上传岗"],"ans":"ABCD","src":{"label":"《汇编》第351页","text":"加施标准规格CCC标志或者印刷/模压CCC 标志。四、CCC 标志的管理获证产品的生产企业应当建立CCC 标志管理制度，对CCC 标志的使用情况如实记录和存档。获证组织可在获证产品的包装、广告、产品介绍等处使用CCC 标志，不得利用CCC 标志误导、欺诈消费者。指定认证机构应指导获证组织正确使用CCC 标志，在获证后监督中对获证组织CCC 标志的使用情况进行检查。指定认证机构应对标准规格CCC 标志的印刷、发放等情况如实记录和存档，并可追溯到获证产品的生产企业。各级市场监督管理部门结合强制性产品认证领域监督检查工作，对辖区CCC 标志的使用情况实施监督检查，依法查处违法行为。"}},{"id":786,"type":1,"num":288,"stem":"依据《国家认监委关于强化强制性产品认证自我声明评价方式实验室检测质量主体责 （以下简称“CCC 认证”）管理机制，保障CCC 认证目录内产品质量安全，突出强制性产品认证指定认证机构（以下简称“指定认证机构”）对发证结果的首负责任，助推CCC 认证制度长远健康发展，国家认监委在广泛征求各方意见基础上，现就指定认证机构在CCC 认证领域建立和落实主体责任，提出如下指导意见。"}},{"id":794,"type":1,"num":296,"stem":"依据《国家认监委关于建立和落实强制性产品认证指定认证机构主体责任的指导意见》（国认证〔2015〕78 号），关于建立对发证结果负总责的运行机制，下列说法正确的有（）。","opts":["指定认证机构是CCC 发证结果和有效性的第一责任人","认证受理、型式试验、工厂检查和证后监督、认证评定等环节的负责人员是相应认证活动的责任主体","认证机构对从事CCC 认证检测的签约实验室负有业务管理职责","认证机构对发证工作中使用的检测报告的有效性负有评价责任"],"ans":"ABCD","src":{"label":"《汇编》第299页","text":"指定认证机构是CCC 发证结果和有效性的第一责任人，认证受理、型式试验、工厂检查和证后监督、认证评定等环节的负责人员是相应认证活动的责任主体。认证机构对从事CCC认证检测的签约实验室负有业务管理职责，对发证工作中使用的检测报告的有效性负有评价责任。（六）建立健全覆盖全过程的责任追溯机制。明确认证流程各环节的责任人，规定其职责和权限，保留覆盖认证全过程的信息记录，确保相关责任的有效追溯。对于使用的外部资源，应有文件化的规定，明确相关责任。（七）明确认证实施工作要求。"}},{"id":795,"type":1,"num":297,"stem":"依据《国家认监委关于建立和落实强制性产品认证指定认证机构主体责任的指导意见》（国认证〔2015〕78 号），关于对机构间转换证书的风险控制，下列说法正确的有（）。","opts":["各指定认证机构应建立证书转换评价程序。","企业提出证书转换委托后，指定认证机构应经过评价程序进行评价，以保证转换证书结果的有效性。必要时，拟转入证书的指定认证机构可安排补充产品检测或工厂检查活动进行评价。","拟转入证书的指定认证机构应重点关注原证书的有效状态、以及指定认证机构间实施细则的差异和企业分类的结果。","指定认证机构间应建立有效的信息沟通渠道，及时通报证书转换的相关信息。"],"ans":"ABCD","src":{"label":"《汇编》第302页","text":"构应经过评价程序进行评价，以保证转换证书结果的有效性。必要时，拟转入证书的指定认证机构可安排补充产品检测或工厂检查活动进行评价。3.拟转入证书的指定认证机构应重点关注原证书的有效状态、以及指定认证机构间实施细则的差异和企业分类的结果。4.指定认证机构间应建立有效的信息沟通渠道，及时通报证书转换的相关信息。（十二）利用信息化手段，收集认证过程信息和产品质量信息，监控认证质量。1.指定认证机构结合实际情况和产品认证领域的特点，建立和完善符合认证相关要求的信息化系统，发挥信息化系统的优势，对认证环节进行有效记录和监控。"}},{"id":796,"type":1,"num":298,"stem":"依据《关于标准修订时强制性产品认证有关问题的通知》（国认科联[2005]18号），对于新版标准实施前已经出厂、投放市场并且已经不再生产的获证产品，下列说法正确的有（）。","opts":["无需按新版标准重新进行确认","无需换发新的认证证书","需要按新版标准重新进行确认","需要换发新的认证证书"],"ans":"AB","src":{"label":"《汇编》第278页","text":"版标准实施认证。三、对已经按老版标准获证的产品，应在新版标准正式实施后、下一次跟踪检查之前，完成按新版标准的产品确认工作，换发新的认证证书。在下一次跟踪检查日期后未取得新的认证证书的，原认证证书自动失效。四、对于新版标准实施前已经出厂、投放市场并且已经不再生产的获证产品，无需按新版标准重新进行确认和换发新的认证证书。"}},{"id":797,"type":1,"num":299,"stem":"依据《关于标准修订时强制性产品认证有关问题的通知》（国认科联[2005]18号），关于新版标准发布后、正式实施前转换期的认证，下列说法正确的有（）。","opts":["可根据申请人的意愿，按老版标准实施认证","可根据申请人的意愿，按新版标准实施认证","只能按新版标准实施认证","只能按老版标准实施认证"],"ans":"AB","src":{"label":"《汇编》第277页","text":"关于标准修订时强制性产品认证有关问题的通知国认科联[2005]18 号各直属检验检疫局，各省、自治区、直辖市、计划单列市及副省级城市质量技术监督局，新疆生产建设兵团质量技术监督局，各强制性认证产品指定认证机构：为保证强制性产品认证制度的有效实施，规范强制性产品认证依据用标准修订转换期的认证活动，现就有关问题通知如下：一、强制性产品认证依据用标准修订后，自标准实施之日起，按照修订后的新版标准实施认证。"}},{"id":798,"type":1,"num":300,"stem":"依据《关于标准修订时强制性产品认证有关问题的通知》（国认科联[2005]18号），对已经按老版标准获证的产品，下列说法正确的有（）。","opts":["应在新版标准正式实施后、下一次跟踪检查之前，完成按新版标准的产品确认工作","应换发新的认证证书","在下一次跟踪检查日期后未取得新的认证证书的，原认证证书自动失效","在下一次跟踪检查日期后未取得新的认证证书的，原认证证书继续有效"],"ans":"ABC","src":{"label":"《汇编》第278页","text":"版标准实施认证。三、对已经按老版标准获证的产品，应在新版标准正式实施后、下一次跟踪检查之前，完成按新版标准的产品确认工作，换发新的认证证书。在下一次跟踪检查日期后未取得新的认证证书的，原认证证书自动失效。四、对于新版标准实施前已经出厂、投放市场并且已经不再生产的获证产品，无需按新版标准重新进行确认和换发新的认证证书。"}},{"id":799,"type":2,"num":1,"stem":"CCC 认证证书数据由指定认证机构每月报送一次。","opts":null,"ans":"错误","src":{"label":"《汇编》第245页","text":"体包括各地方质检两局CCC 认证执法监管典型案例、CCC 免办信息以及CCC 认证产品质量风险信息等。4.CCC 认证信息报送CCC 认证信息报送包括CCC 质量基础信息、CCC 产品质量监督信息和CCC 认证行政监管信息报送。4.1CCC 质量基础信息CCC 质量基础信息包括CCC 证书数据、CCC质量分析数据、指定实验室检测质量评价数据，由指定认证机构、指定实验室、认证认可协会和标志发放管理中心向国家认监委认证监管部上报。4.1.1CCC 认证证书数据CCC 认证证书数据由指定认证机构实时报送，每周两报。"}},{"id":800,"type":2,"num":2,"stem":"指定实验室检测质量评价数据由指定认证机构每年报送一次。","opts":null,"ans":"错误","src":{"label":"《汇编》第246页","text":"246（国认信技函〔2009〕3 号）要求上报认监委CCC 证书数据库。4.1.2CCC 质量分析数据CCC 质量分析数据由指定认证机构、实验室、认证认可协会每年11 月5 日前通过认监委“强制性产品认证质量分析信息化系统”（cccq.cnca.cn）报送，数据统计周期为上一年度11 月1 日至当年10 月31 日，报送内容详见附件1。具体要求见《关于加强强制性产品认证基础数据和质量数据统计上报工作的通知》（国认证〔2012〕42 号）。4.1.3 指定实验室检测质量评价数据指定实验室检测质量评价数据由指定认证机构向认监委认证监管部每季度报送一次，报送时间为季度后第一个月的15 日之前，数据统计周期为上一季度的数据/信息，报送内容详见附件2。"}},{"id":801,"type":2,"num":3,"stem":"指定认证机构应通过网站实时公告与CCC 认证相关的需向社会公众公告的相关信息。","opts":null,"ans":"正确","src":{"label":"《汇编》第249页","text":"方式。6.CCC 认证信息公开CCC 认证信息公开是指定认证机构为方便认证企业、广大消费者获得认证信息，发挥社会监督作用，通过网站向社会公布获证企业产品及证书信息。与CCC 认证相关的需向社会公众公告的相关信息，主要包括获证企业证书信息、证书暂停、恢复、撤销与注销信息、认证机构认证实施细则、标准换版实施方案、认证收费标准等，具体见附件5。"}},{"id":802,"type":2,"num":4,"stem":"工厂检查计划数据通过CCC 证书执法查询系统报送，每周上报一次。","opts":null,"ans":"正确","src":{"label":"《汇编》第247页","text":"2474.2CCC 产品质量监督信息CCC 产品质量监督信息由指定认证机构向地方质检两局报送，报送内容主要包括CCC 认证工厂检查计划以及证书暂停、撤销、注销等信息，报送内容详见附件3。工厂检查计划数据通过C
