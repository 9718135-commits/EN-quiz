<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCC认证法律法规及典型案例 · 刷题与模拟考试</title>
<style>
:root{
  --green:#16a34a; --green-bg:#dcfce7;
  --red:#dc2626; --red-bg:#fee2e2;
  --gray:#9ca3af; --gray-bg:#f3f4f6;
  --blue:#2563eb; --blue-bg:#dbeafe;
  --amber:#d97706;
  --ink:#1f2937; --sub:#6b7280; --line:#e5e7eb;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;background:#f1f5f9;color:var(--ink);min-height:100vh;}
header{position:sticky;top:0;z-index:50;background:#0f172a;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 2px 6px rgba(0,0,0,.2);}
header h1{font-size:17px;font-weight:700;white-space:nowrap;}
nav{display:flex;gap:4px;flex-wrap:wrap;}
nav button{background:transparent;border:none;color:#cbd5e1;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:14px;}
nav button:hover{background:#1e293b;color:#fff;}
nav button.active{background:var(--blue);color:#fff;}
main{max-width:960px;margin:0 auto;padding:18px 14px 60px;}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.hidden{display:none!important;}
.btn{display:inline-block;border:none;border-radius:8px;padding:9px 18px;font-size:14px;cursor:pointer;background:var(--blue);color:#fff;}
.btn:hover{opacity:.88;}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);}
.btn.green{background:var(--green);}
.btn.red{background:var(--red);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn.sm{padding:5px 12px;font-size:13px;}

/* 首页 */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0;}
.stat{background:var(--gray-bg);border-radius:10px;padding:14px;text-align:center;}
.stat b{display:block;font-size:24px;margin-bottom:4px;}
.stat span{font-size:13px;color:var(--sub);}
.mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:8px;}
.mode-card{border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;transition:.15s;background:#fff;}
.mode-card:hover{border-color:var(--blue);box-shadow:0 4px 12px rgba(37,99,235,.12);transform:translateY(-2px);}
.mode-card h3{font-size:16px;margin-bottom:6px;}
.mode-card p{font-size:13px;color:var(--sub);line-height:1.6;}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--blue-bg);color:var(--blue);margin-right:6px;}
.tag.green{background:var(--green-bg);color:var(--green);}
.tag.red{background:var(--red-bg);color:var(--red);}
.tag.amber{background:#fef3c7;color:var(--amber);}

/* 练习 */
.practice-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px;}
.progress-wrap{height:8px;background:var(--gray-bg);border-radius:99px;overflow:hidden;margin-bottom:14px;}
.progress-bar{height:100%;background:var(--blue);border-radius:99px;transition:width .2s;}
.q-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:13px;color:var(--sub);}
.q-stem{font-size:16px;line-height:1.8;margin-bottom:16px;white-space:pre-wrap;}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:10px;cursor:pointer;font-size:15px;line-height:1.6;transition:.12s;background:#fff;}
.opt:hover{border-color:var(--blue);}
.opt .key{flex:none;width:24px;height:24px;border-radius:50%;background:var(--gray-bg);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;}
.opt.sel{border-color:var(--blue);background:var(--blue-bg);}
.opt.sel .key{background:var(--blue);color:#fff;}
.opt.right{border-color:var(--green);background:var(--green-bg);}
.opt.right .key{background:var(--green);color:#fff;}
.opt.wrong{border-color:var(--red);background:var(--red-bg);}
.opt.wrong .key{background:var(--red);color:#fff;}
.opt.locked{cursor:default;}
.explain{margin-top:14px;border-left:4px solid var(--blue);background:#f8fafc;border-radius:0 10px 10px 0;padding:12px 14px;font-size:14px;line-height:1.8;}
.explain .ans-line{font-weight:700;margin-bottom:6px;}
.explain .src-label{color:var(--blue);font-weight:600;}
.explain .src-text{color:#374151;white-space:pre-wrap;}
.explain .src-none{color:var(--amber);font-weight:600;}
.practice-nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap;}
.fav-btn{background:none;border:none;cursor:pointer;font-size:20px;color:#d1d5db;}
.fav-btn.on{color:#f59e0b;}

/* 题号面板 */
.panel-toggle{position:fixed;right:14px;bottom:14px;z-index:60;background:#0f172a;color:#fff;border:none;border-radius:99px;padding:12px 18px;font-size:14px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3);}
.panel-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:70;display:none;}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);background:#fff;z-index:80;padding:16px;overflow-y:auto;display:none;}
.panel.open{display:block;}
.panel-mask.open{display:block;}
.panel h3{font-size:15px;margin-bottom:4px;}
.panel .legend{font-size:12px;color:var(--sub);margin-bottom:12px;display:flex;gap:12px;flex-wrap:wrap;}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle;}
.num-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
.num-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:13px;cursor:pointer;background:var(--gray-bg);color:#6b7280;border:1.5px solid transparent;}
.num-cell.right{background:var(--green);color:#fff;}
.num-cell.wrong{background:var(--red);color:#fff;}
.num-cell.current{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-bg);}

/* 考试 */
.exam-banner{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border-radius:12px;padding:20px;text-align:center;}
.exam-banner h2{font-size:20px;margin-bottom:8px;}
.timer{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:2px;}
.timer.danger{color:#fca5a5;animation:blink 1s infinite;}
@keyframes blink{50%{opacity:.5;}}
.exam-info{display:flex;justify-content:center;gap:22px;margin-top:10px;font-size:14px;flex-wrap:wrap;}
.score-big{font-size:52px;font-weight:800;text-align:center;margin:10px 0;}
.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0;}
.result-grid .stat b{font-size:20px;}
table.log{width:100%;border-collapse:collapse;font-size:13px;}
table.log th,table.log td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;}
table.log th{color:var(--sub);font-weight:600;}
.empty-tip{text-align:center;color:var(--sub);padding:40px 0;font-size:14px;line-height:2;}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.filter-row .btn.sm.active{background:#0f172a;}
h2.section-title{font-size:18px;margin-bottom:12px;}
.mt8{margin-top:8px;}.mt16{margin-top:16px;}.mb12{margin-bottom:12px;}
@media (max-width:600px){ .num-grid{grid-template-columns:repeat(5,1fr);} header h1{font-size:14px;} }
</style>
</head>

<header>
  <h1>CCC 认证法律法规及典型案例 · 刷题</h1>
  <nav id="nav">

    <button data-view="practice">顺序练习</button>

</aside>

所从属机构的业务范围相关的推广活动，但不得从事认证活动。"}},{"id":13,"type":0,"num":14,"stem":"因产品存在缺陷造成损害要求赔偿的诉讼时效期间为二年，自（）起计算。","opts":["产品购买之日","当事人知道或者应当知道其权益受到损害时","损害发生之日","缺陷产品交付之日"],"ans":"B","src":null},{"id":14,"type":0,"num":15,"stem":"因产品存在缺陷造成损害要求赔偿的请求权，在造成损害的缺陷产品交付最初消费者满（）丧失；但是，尚未超过明示的安全使用期的除外。","opts":["十年","二十年","二年","五年"],"ans":"A","src":null},{"id":15,"type":0,"num":16,"stem":"限期使用的产品，应当在显著位置清晰地标明生产日期和（）或者失效日期。","opts":["检验日期","安全使用期","保质期","出厂日期"],"ans":"B","src":null},{"id":16,"type":0,"num":17,"stem":"生产者、销售者对抽查检验的结果有异议的，可以自收到检验结果之日起（）内向实施监督抽查的市场监督管理部门或者其上级市场监督管理部门申请复检。","opts":["十日","十五日","三十日","七日"],"ans":"B","src":{"label":"《汇编》第3页","text":"律的规定执行。国家监督抽查的产品，地方不得另行重复抽查；上级监督抽查的产品，下级不得另行重复抽查。根据监督抽查的需要，可以对产品进行检验。检验抽取样品的数量不得超过检验的合理需要，并不得向被检查人收取检验费用。监督抽查所需检验费用按照国务院规定列支。生产者、销售者对抽查检验的结果有异议的，可以自收到检验结果之日起十五日内向实施监督抽查的产品质量监督部门或者其上级产品质量监督部门申请复检，由受理复检的产品质量监督部门作出复检结论。第十七条依照本法规定进行监督抽查的产品质量不合格的，由实施监督抽查的产品质量监督部门责令其生产者、销售者限期改正。逾期不改正的，由省级以上人民政府产品质量监督部门予以公告；公告后经复查仍不合格的，责令停业，限期整顿；整顿期满后经复查产品"}},{"id":17,"type":0,"num":18,"stem":"标准的复审周期一般不超过（）。","opts":["三年","十年","二年","五年"],"ans":"D","src":null},{"id":18,"type":0,"num":19,"stem":"依据《认证及认证培训、咨询人员管理办法》，人员被撤销执业资格，自撤销之日起（）内不再受理注册申请。","opts":["3 年","5 年","8 年","10 年"],"ans":"B","src":{"label":"《汇编》第118页","text":"认证及认证培训、咨询人员管理办法（2004 年5 月24 日国家质量监督检验检疫总局令第61 号公布根据2022 年9 月29 日国家市场监督管理总局令第61 号修订）"}},{"id":19,"type":0,"num":20,"stem":"依据《认证及认证培训、咨询人员管理办法》，人员违反规定同时在多家机构执业，可给予停止执业资格（）处罚。","opts":["6 个月","1 年","3 年","终身"],"ans":"B","src":{"label":"《汇编》第127页","text":"诉及其在监督管理工作中发现的问题，就有关事项询问认证及认证培训、咨询人员及其执业的机构，有关人员和机构应当积极配合。第十六条认证及认证培训、咨询人员违反本办法第八条、第九条和第十条规定的，责令限期改正，给予停止执业资格1 年的处罚；情节严重的，给予停止执业资格2 年的处罚；逾期未改正的，给予撤销执业资格的处罚。第十七条认证及认证培训、咨询人员违反本办法第十四条第（三）项规定的，给予撤销执业资格的处罚。第十八条认证及认证培训、咨询人员，违反本办法第十四条其他规定的，责令限期改正；逾期未改正的，给予停止执业6 个月以上1 年以下的处罚；情节严重的，给予停止执业资格2年直至撤销执业资格的处罚。"}},{"id":20,"type":0,"num":21,"stem":"依据《认证及认证培训、咨询人员管理办法》，本办法施行日期（）。","opts":["2004‑08‑01","2005‑03‑01","2018‑01‑17","2023‑01‑06"],"ans":"A","src":{"label":"《汇编》第118页","text":"认证及认证培训、咨询人员管理办法（200 num":116,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，工厂应配备足够的检验试验仪器设备，确保在采购、生产制造、最终检验试验等环节中使用的仪器设备能力满足认证产品（）时的检验试验要求。","opts":["试生产","单件生产","设计开发","批量生产"],"ans":"D","src":{"label":"《汇编》第223页","text":"程序应符合规定要求，程序的内容应包括检验频次、项目、内容、方法、判定等。工厂应实施并保存相关检验记录。对于委托外部机构进行的检验，工厂应确保外部机构的能力满足检验要求，并保存相关能力的评价结果，如实验室认可证明等。3.6 检验试验仪器设备3.6.1 基本要求工厂应配备足够的检验试验仪器设备，确保在采购、生产制造、最终检验试验等环节中使用的仪器设备能力满足认证产品批量生产时的检验试验要求。检验试验人员应能正确使用仪器设备，掌握检验试验要求并有效实施。"}},{"id":116,"type":0,"num":117,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，对于国家级和省级监督抽查、产品召回、顾客投诉及抱怨等来自外部的认证产品不合格信息，工厂应（），并采取适当的纠正措施。","opts":["立即召回产品","暂停生产","分析不合格产生的原因","向认证机构报告"],"ans":"C","src":{"label":"《汇编》第225页","text":"时，应对这些产品重新检测。工厂应规定操作人员在发现仪器设备功能失效时需采取的措施。工厂应保存功能检查结果及仪器设备功能失效时所采取措施的记录。3.7 不合格品的控制3.7.1 对于采购、生产制造、检验等环节中发现的不合格品，工厂应采取标识、隔离、处置等措施，避免不合格品的非预期使用或交付。返工或返修后的产品应重新检验。3.7.2 对于国家级和省级监督抽查、产品召回、顾客投诉及抱怨等来自外部的认证产品不合格信息，工厂应分析不合格产生的原因，并采取适当的纠正措施。"}},{"id":117,"type":0,"num":118,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，工厂应识别并保存与产品认证相关的重要文件和质量信息，如（）等。","opts":["员工考勤记录","型式试验报告、工厂检查结果、CCC 证书状态信息、认证变更批准信息等","产品销售合同","产品广告资料"],"ans":"B","src":{"label":"《汇编》第219页","text":"品一致性的主要内容，工厂应有必要的图纸、样板、关键件清单、工艺文件、作业指导书等设计文件，并确保文件的持续有效性。3.2.2 工厂应确保文件的充分性、适宜性及使用文件的有效版本。3.2.3 工厂应确保记录的清晰、完整、可追溯，以作为产品符合规定要求的证据。与质量相关的记录保存期应满足法律法规的要求，确保在本次检查中能够获得前次检查后的记录，且至少不低于24 个月。3.2.4 工厂应识别并保存与产品认证相关的重要文件和质量信息，如型式试验报告、工厂检查结果、CCC 证书状态信息（有效、暂停、撤销、注销等）、认证变更批准信息、监督抽样检测报告、产品质量投诉及处理结果等。"}},{"id":118,"type":0,"num":119,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，对内部质量审核中发现的问题，工厂应采取适当的（）。","opts":["教育培训措施","纠正措施、预防措施","处罚措施","整改措施"],"ans":"B","src":{"label":"《汇编》第213页","text":"编号：CNCA-00C-005强制性产品认证实施规则工厂质量保证能力要求2014-01-02 发布2014-09-01 实施中国国家认证认可监督管理委员会发布"}},{"id":119,"type":0,"num":120,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，对可能影响产品一致性的主要内容，工厂应有必要的（）等设计文件，并确保文件的持续有效性。","opts":["销售记录","财务资料","人员档案","图纸、样板、关键件清单、工艺文件、作业指导书"],"ans":"D","src":{"label":"《汇编》第219页","text":"品一致性的主要内容，工厂应有必要的图纸、样板、关键件清单、工艺文件、作业指导书等设计文件，并确保文件的持续有效性。3.2.2 工厂应确保文件的充分性、适宜性及使用文件的有效版本。3.2.3 工厂应确保记录的清晰、完整、可追溯，以作为产品符合规定要求的证据。与质量相关的记录保存期应满足法律法规的要求，确保在本次检查中能够获得前次检查后的记录，且至少不低于24 个月。3.2.4 工厂应识别并保存与产品认证相关的重要文件和质量信息，如型式试验报告、工厂检查结果、CCC 证书状态信息（有效、暂停、撤销、注销等）、认证变更批准信息、监督抽样检测报告、产品质量投诉及处理结果等。"}},{"id":120,"type":0,"num":121,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，工厂应建立并保持文件化的程序，对最终产品的例行检验和/或确认检验进行控制；检验程序应符合规定要求，程序的内容应包括（）等。","opts":["检验收费标准","检验频次、项目、内容、方法、判定","检验人员数量","检验设备清单"],"ans":"B","src":{"label":"《汇编》第222页","text":"相应的能力；关键工序的控制应确保认证产品与标准的符合性、产品一致性；如果关键工序没有文件规定就不能保证认证产品质量时，则应制定相应的作业指导书，使生产过程受控。3.4.2 产品生产过程如对环境条件有要求,工厂应保证工作环境满足规定要求。3.4.3 必要时，工厂应对适宜的过程参数进行监视、测量。3.4.4 工厂应建立并保持对生产设备的维护保养制度，以确保设备的能力持续满足生产要求。3.4.5 必要时，工厂应按规定要求在生产的适当阶段对产品及其特性进行检查、监视、测量，以确保产品与标准的符合性及产品一致性。"}},{"id":121,"type":0,"num":122,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，没有获得相关证书的关键件，其（）应符合产品认证实施规则/细则的要求。","opts":["进货检验","出厂检验","例行检验","定期确认检验"],"ans":"D","src":{"label":"《汇编》第221页","text":"证书状态的有效。(b)没有获得相关证书的关键件，其定期确认检验应符合产品认证实施规则/细则的要求。(c)工厂自身制定控制方案，其控制效果不低于3.3.2.2(a)或(b)的要求。3.3.2.3 当从经销商、贸易商采购关键件时，工厂应采取适当措施以确保采购关键件的一致性并持续满足其技术要求。对于委托分包方生产的关键部件、组件、分总成、总成、半成品等，工厂应按采购关键件进行控制，以确保所分包的产品持续满足规定要求。对于自产的关键件，按3.4 进行控制。3.4 生产过程控制3.4.1 工厂应对影响认证产品质量的工序（简称关键工序）进行识别，所识别的关键工序应符合规定要求。"}},{"id":122,"type":0,"num":123,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，工厂应保存关键件采购、使用等记录，如（）等。","opts":["进货单、出入库单、台帐","销售发票","广告合同","人员考勤"],"ans":"A","src":{"label":"《汇编》第213页","text":"编号：CNCA-00C-005强制性产品认证实施规则工厂质量保证能力要求2014-01-02 发布2014-09-01 实施中国国家认证认可监督管理委员会发布"}},{"id":123,"type":0,"num":124,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，产品生产过程如对环境条件有要求，工厂应保证（）满足规定要求。","opts":["运输环境","办公环境","工作环境","贮存环境"],"ans":"C","src":{"label":"《汇编》第213页","text":"编号：CNCA-00C-005强制性产品认证实施规则工厂质量保证能力要求2014-01-02 发布2014-09-01 实施中国国家认证认可监督管理委员会发布"}},{"id":124,"type":0,"num":125,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，工厂应建立并保持对生产设备的（）制度，以确保设备的能力持续满足生产要求。","opts":["维护保养","报废更新","校准检定","使用登记"],"ans":"A","src":{"label":"《汇编》第222页","text":"相应的能力；关键工序的控制应确保认证产品与标准的符合性、产品一致性；如果关键工序没有文件规定就不能保证认证产品质量时，则应制定相应的作业指导书，使生产过程受控。3.4.2 产品生产过程如对环境条件有要求,工厂应保证工作环境满足规定要求。3.4.3 必要时，工厂应对适宜的过程参数进行监视、测量。3.4.4 工厂应建立并保持对生产设备的维护保养制度，以确保设备的能力持续满足生产要求。3.4.5 必要时，工厂应按规定要求在生产的适当阶段对产品及其特性进行检查、监视、测量，以确保产品与标准的符合性及产品一致性。"}},{"id":125,"type":0,"num":126,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，工厂在采购、生产制造、检验等环节所进行的产品防护，如（）等应符合规定要求。","opts":["标识、搬运、包装、贮存、保护","设计、开发、验证","销售、服务、回访","采购、验收、入库"],"ans":"A","src":{"label":"《汇编》第227页","text":"付等适用的质量环节，对产品一致性进行控制，以确保产品持续符合认证依据标准要求。3.10 产品防护与交付工厂在采购、生产制造、检验等环节所进行的产品防护，如标识、搬运、包装、贮存、保护等应符合规定要求。必要时，工厂应按规定要求对产品的交付过程进行控制。3.11CCC 证书和标志工厂对CCC 证书和标志的管理及使用应符合《强制性产品认证管理规定》、《强制性产品认证标志管理办法》等规定。对于统一印制的标准规格CCC 标志或采用印刷、模压等方式加施的CCC 标志，工厂应保存使用记录。对于下列产品，不得加施CCC 标志或放行：(a)未获认证的强制性产品认证目录内产品；(b)获证后的变更需经认证机构确认，但未"}},{"id":126,"type":0,"num":127,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，产品设计标准或规范应（）该产品的认证依据标准要求。","opts":["参照","不高于","不低于","等同于"],"ans":"C","src":{"label":"《汇编》第213页","text":"编号：CNCA-00C-005强制性产品认证实施规则工厂质量保证能力要求2014-01-02 发布2014-09-01 实施中国国家认证认可监督管理委员会发布"}},{"id":127,"type":0,"num":128,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，例行检验是指为剔除生产过程中偶然性因素造成的不合格品，通常在生产的最终阶段，对认证产品进行的（）检验。","opts":["抽样","定期","100%","随机"],"ans":"C","src":{"label":"《汇编》第215页","text":"据之一。2.术语和定义2.1 认证技术负责人属于生产者和/或生产企业内部人员，掌握认证依据标准要求，依据产品认证实施规则/细则规定的职责范围，对认证产品变更进行确认批准并承担相应责任的人。2.2 认证产品一致性（产品一致性）生产的认证产品与型式试验样品保持一致，产品一致性的具体要求由产品认证实施规则/细则规定。2.3 例行检验为剔除生产过程中偶然性因素造成的不合格品，通常在生产的最终阶段，对认证产品进行的100%检验。"}},{"id":128,"type":0,"num":129,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，对于委托外部机构进行的检验，工厂应确保外部机构的能力满足检验要求，并保存相关能力的评价结果，如（）等。","opts":["检验收费凭证","检验合同","实验室认可证明","检验报告"],"ans":"C","src":{"label":"《汇编》第223页","text":"程序应符合规定要求，程序的内容应包括检验频次、项目、内容、方法、判定等。工厂应实施并保存相关检验记录。对于委托外部机构进行的检验，工厂应确保外部机构的能力满足检验要求，并保存相关能力的评价结果，如实验室认可证明等。3.6 检验试验仪器设备3.6.1 基本要求工厂应配备足够的检验试验仪器设备，确保在采购、生产制造、最终检验试验等环节中使用的仪器设备能力满足认证产品批量生产时的检验试验要求。检验试验人员应能正确使用仪器设备，掌握检验试验要求并有效实施。"}},{"id":129,"type":0,"num":130,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，工厂应规定与认证要求有关的各类人员职责、权限及相互关系 持续满足关键件的技术要求，以及最终产品满足认证要求，并保存相关记录。"}},{"id":139,"type":0,"num":140,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，下列属于不得加施CCC 标志或放行的产品是（）。","opts":["符合认证要求的产品","未获认证的强制性产品认证目录内产品","已获认证的产品","证书状态有效的产品"],"ans":"B","src":{"label":"《汇编》第213页","text":"编号：CNCA-00C-005强制性产品认证实施规则工厂质量保证能力要求2014-01-02 发布2014-09-01 实施中国国家认证认可监督管理委员会发布"}},{"id":140,"type":0,"num":141,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，如果关键工序没有文件规定就不能保证认证产品质量时，则应制定相应的（），使生产过程受控。","opts":["管理制度","作业指导书","检验规程","工艺卡"],"ans":"B","src":{"label":"《汇编》第222页","text":"相应的能力；关键工序的控制应确保认证产品与标准的符合性、产品一致性；如果关键工序没有文件规定就不能保证认证产品质量时，则应制定相应的作业指导书，使生产过程受控。3.4.2 产品生产过程如对环境条件有要求,工厂应保证工作环境满足规定要求。3.4.3 必要时，工厂应对适宜的过程参数进行监视、测量。3.4.4 工厂应建立并保持对生产设备的维护保养制度，以确保设备的能力持续满足生产要求。3.4.5 必要时，工厂应按规定要求在生产的适当阶段对产品及其特性进行检查、监视、测量，以确保产品与标准的符合性及产品一致性。"}},{"id":141,"type":0,"num":142,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，工厂指定的质量负责人应具有的职责和权限之一是（）。","opts":["确保本文件的要求在工厂得到有效地建立、实施和保持","负责产品设计开发","负责原材料采购","负责产品销售"],"ans":"A","src":{"label":"《汇编》第217页","text":"标准要求，并保证认证产品与型式试验样品一致。工厂应接受并配合认证机构依据本实施规则及相关产品认证实施规则/细则所实施的各类工厂现场检查、市场检查、抽样检测。3.1 职责和资源3.1.1 职责工厂应规定与认证要求有关的各类人员职责、权限及相互关系，并在本组织管理层中指定质量负责人，无论该成员在其它方面的职责如何，应使其具有以下方面的职责和权限：(a)确保本文件的要求在工厂得到有效地建立、实施和保持；(b)确保产品一致性以及产品与标准的符合性；(c)正确使用CCC 证书和标志，确保加施CCC 标志产品的证书状态持续有效。"}},{"id":142,"type":0,"num":143,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，与质量相关的记录保存期应满足法律法规的要求，确保在本次检查中能够获得前次检查后的记录，且至少不低于（）。","opts":["24 个月","12 个月","36 个月","6 个月"],"ans":"A","src":{"label":"《汇编》第219页","text":"品一致性的主要内容，工厂应有必要的图纸、样板、关键件清单、工艺文件、作业指导书等设计文件，并确保文件的持续有效性。3.2.2 工厂应确保文件的充分性、适宜性及使用文件的有效版本。3.2.3 工厂应确保记录的清晰、完整、可追溯，以作为产品符合规定要求的证据。与质量相关的记录保存期应满足法律法规的要求，确保在本次检查中能够获得前次检查后的记录，且至少不低于24 个月。3.2.4 工厂应识别并保存与产品认证相关的重要文件和质量信息，如型式试验报告、工厂检查结果、CCC 证书状态信息（有效、暂停、撤销、注销等）、认证变更批准信息、监督抽样检测报告、产品质量投诉及处理结果等。"}},{"id":143,"type":0,"num":144,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，工厂应对影响认证产品质量的工序（简称（））进行识别。","opts":["关键工序","重点工序","特殊工序","重要工序"],"ans":"A","src":{"label":"《汇编》第213页","text":"编号：CNCA-00C-005强制性 量保证能力/产品一致性检查也可称为初始工厂检查。"}},{"id":181,"type":0,"num":182,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，原则上，同一实施规则下的分类条件及分类级别应（）。","opts":["自行规定","动态变化","保持一致","各不相同"],"ans":"C","src":{"label":"《汇编》第168页","text":"编号：CNCA-00C-003强制性产品认证实施规则生产企业分类管理、认证模式选择与确定2013-09-24 发布2013-10-01 实施中国国家认证认可监督管理委员会发布"}},{"id":182,"type":0,"num":183,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，根据认证机构对生产企业分类管理的实际，对符合管理规范、诚信守法、产品质量稳定等条件的企业生产的产品，应按照（）实施认证。","opts":["简化认证模式","严格认证模式","特殊认证模式","基本认证模式"],"ans":"D","src":{"label":"《汇编》第171页","text":"有效管理、稳定生产为前提，以确保产品持续符合强制性认证标准要求为目标，基于产品固有安全风险特点以及企业普遍采用的生产工艺所确定的产品认证基本要素的组合。基本认证模式在具体产品强制性认证实施规则中予以明确。根据认证机构对生产企业分类管理的实际，对符合管理规范、诚信守法、产品质量稳定等条件的企业生产的产品，应按照基本认证模式实施认证。2.3 认证模式本实施规则所称的认证模式是认证机构针对生产企业所生产的产品选择和确定具体实施用认证模式的简称。为有效控制认证风险、提高认证结果持续符合性，认证机构根据自身对生产企业分类管理的实际情况，对不宜使用基本认证模式实施认证的认证对象，通过对不符合发生时可能引"}},{"id":183,"type":0,"num":184,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，对初次申请认证、尚未获得任何质量信息的生产企业，认证机构根据认证风险评估结果确定其（）和相应的认证模式。","opts":["认证单元","认证证书","认证收费","初次认证分类等级"],"ans":"D","src":{"label":"《汇编》第177页","text":"发布。对生产企业分类管理信息进行分析评估后，认证机构应对生产企业分类等级确定和调整的决定进行审核。认证机构根据生产企业分类等级确定其产品实施强制性认证时适用的认证模式，并将必要的方案及信息在认证实施前告知认证委托人。认证实施过程中，如有相关质量信息影响到生产企业分类等级结果的，认证机构应及时对认证模式做出调整。对初次申请认证、尚未获得任何质量信息的生产企业，认证机构根据认证风险评估结果确定其初次认证分类等级和相应的认证模式。生产企业分类管理等级确定/调整后应告知生产企业或（必要时）相关方。"}},{"id":184,"type":0,"num":185,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，原则上，认证机构应对社会获得的质量信息予以（）或得到企业确认。","opts":["公布","通报","采信","核实"],"ans":"D","src":{"label":"《汇编》第168页","text":"编号：CNCA-00C-003强制性产品认证实施规则生产企业分类管理、认证模式选择与确定2013-09-24 发布2013-10-01 实施中国国家认证认可监督管理委员会发布"}},{"id":185,"type":0,"num":186,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，一般情况下，认证对象发生不符合的可能性越高、后果越严重，其认证模式就（）。","opts":["越严格","越简化","越宽松","不变"],"ans":"A","src":{"label":"《汇编》第172页","text":"起风险的评估，在基本认证模式的基础上逐级选择增加必要的认证要素、强化监督要求，从而确定具体实施用认证模式。一般情况下，认证对象发生不符合的可能性越高、后果越严重，其认证模式就越严格。3. 生产企业分类管理3.1 基本原则生产企业分类管理的建立应基于认证机构所能获取的所有与生产企业及获证产品质量相关的信息。认证机构应按照“控制认证风险、实行差异管理、提高认证效能”的原则建立生产企业分类管理办法及实施机制。对生产企业分类管理还应体现对生产企业分类等级动态调整的原则，以达到对生产企业管理能力、自律意识、产品质量持续提升的作用。"}},{"id":186,"type":0,"num":187,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，生产企业分类等级仅作为认证机构对生产企业管理的（）。","opts":["依据","结果","参考","目标"],"ans":"A","src":{"label":"《汇编》第168页","text":"编号：CNCA-00C-003强制性产品认证实施规则生产企业分类管理、认证模式选择与确定2013-09-24 发布2013-10-01 实施中国国家认证认可监督管理委员会发布"}},{"id":187,"type":0,"num":188,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，设计鉴定是依据相关标准采用验证比较、验证评估的方式，证明产品符合认证依据标准要求的评价活动。根据判定结果的可靠性，设计鉴定可以（）全部或部分型式试验项目。","opts":["替代","增加","减少","补充"],"ans":"A","src":{"label":"《汇编》第184页","text":"市场抽样检测或者检查是认证机构对获得认证证书并已出厂、销售、进口的产品所进行的抽样检测或者检查，应作为获证后监督的一种有效手段。对于需要通过进行市场抽样检测或者检查的方式实施获证后监督的产品，认证机构应设计方案以保证能够从市场中抽取到一定比例的获证产品进行检测或者检查。4.1.6 设计鉴定设计鉴定是依据相关标准采用验证比较、验证评估的方式，证明产品符合认证依据标准要求的评价活动。根据判定结果的可靠性，设计鉴定可以替代全部或部分型式试验项目。4.2 基本认证模式的确定基本认证模式是在对产品风险定级的基础上，考虑认证可操作性、经济性等因素综合确定的。"}},{"id":188,"type":0,"num":189,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，本实施规则所称的生产企业分类管理，是指针对同类别产品的生产企业，认证机构根据其生产企业质量保证能力、诚信守法状况及所生产产品的质量状况等与质量相关的信息进行（），对生产企业进行分类。","opts":["综合评价","现场核查","抽样检测","日常检查"],"ans":"A","src":{"label":"《汇编》第170页","text":"170(b)基于基本认证模式，认证机构针对生产企业所生产的产品选择和确定具体实施用认证模式的通用要求。2. 术语和定义2.1 生产企业分类管理本实施规则所称的生产企业分类管理，是指针对同类别产品的生产企业，认证机构根据其生产企业质量保证能力、诚信守法状况及所生产产品的质量状况等与质量相关的信息进行综合评价，对生产企业进行分类，从而对不同类别生产企业所生产的产品在认证模式选择、单元划分原则和获证后监督等方面实施差异化管理，以实现控制认证风险、提高认证活动的质量和效率、确保获证产品持续符合认证要求的目标。"}},{"id":189,"type":0,"num":190,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，企业不得在市场推广、宣传等活动中使用认证机构对其的分类管理的结果，以免（）。","opts":["影响形象","误导消费者","影响销售","造成纠纷"],"ans":"B","src":{"label":"《汇编》第173页","text":"设置，应结合具体产品及行业特点做出规定。原则上，同一实施规则下的分类条件及分类级别保持一致。生产企业分类管理不应针对生产企业规模、产能等设置任何歧视性分类条件。生产企业分类等级仅作为认证机构对生产企业管理的依据。企业不得在市场推广、宣传等活动中使用认证机构对其的分类管理的结果，以免误导消费者。3.2 生产企业分类涉及的质量信息生产企业分类涉及的质量信息至少应包括认证实施各环节，以及各级政府、社会、媒体、公众等方面公布或反映的质量信息。3.2.1 认证实施获得的质量信息认证实施获得的质量信息包括认证机构在发证前的认证实施以及获证后监督各环节所获取的生产企业和产品质量信息。"}},{"id":190,"type":0,"num":191,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模 同）违反国家法"}},{"id":211,"type":0,"num":212,"stem":"依据CNCA-00C-001:2008《强制性产品认证证书注销、暂停、撤销实施规则》，认证证书有效期届满，认证委托人（）的，认证机构应当注销认证证书。","opts":["申请继续使用","未申请延期使用","申请换发新证","申请延期使用"],"ans":"B","src":{"label":"《汇编》第147页","text":"自行制定的有关技术性、程序性文件，若与本规则不相符的，应以本规则为准。3 职责各认证机构依据本规则的规定，具体实施CCC 认证证书注销、暂停、撤销有关工作。国家认监委负责对各认证机构实施证书注销、暂停、撤销工作进行监督管理。4 认证证书的注销4.1当出现以下情形之一的，认证机构应当注销认证证书：（1）认证证书有效期届满，认证委托人未申请延期使用的；（2）认证委托人/生产厂由于企业破产、倒闭、解散、生产结构调整等原因致使获证产品不再生产，认证委托人主动放弃保持认证证书的；（3）获证产品型号已列入国家明令淘汰或"}},{"id":212,"type":0,"num":213,"stem":"依据CNCA-00C-001:2008《强制性产品认证证书注销、暂停、撤销实施规则》，认证机构的跟踪检查结果证明工厂质量保证能力存在严重缺陷的，认证机构应当（）认证证书。","opts":["撤销","收回","注销","暂停"],"ans":"A","src":{"label":"《汇编》第152页","text":"改并符合相关要求的，认证机构应当恢复其认证证书。7 认证证书的撤销7.1当出现以下情形之一的，认证机构应当撤销认证证书：（1）在认证证书暂停期限届满，认证委托人未提出认证证书恢复申请、未采取整改措施或者整改后仍不合格的；（2）获证产品的关键元器件、规格和型号，以及涉及整机安全或者电磁兼容的设计、结构、工艺及重要材料/原材料生产企业等发生变更，导致产品存在严重安全隐患的；（3）认证机构的跟踪检查结果证明工厂质量保证能力存在严重缺陷的；（4）认证委托人提供虚假样品，获证产品与型式实验样品不一致的；（5）认证委托人/相关方违反国家法律法"}},{"id":213,"type":0,"num":214,"stem":"依据CNCA-00C-001:2008《强制性产品认证证书注销、暂停、撤销实施规则》，本规则发布之前由国家认监委所制定的有关CCC 认证实施规则等规范性文件，以及各认证机构自行制定的有关技术性、程序性文件，若与本规则不相符的，应（）。","opts":["以原有文件为准","由认证机构自行决定","以本规则为准","报国家认监委裁定"],"ans":"C","src":{"label":"《汇编》第146页","text":"附件：强制性产品认证证书注销、暂停、撤销实施规则1 目的为规范和明确强制性产品认证（以下简称CCC 认证）活动中有关认证证书的注销、暂停、撤销条件及其有关事项，统一各指定强制性产品认证机构（以下简称认证机构）相关活动，制定本规则。2 适用范围本规则适用于各认证机构在CCC 认证过程中涉及的证书注销、暂停、撤销等有关活动。本规则发布之前由国家认证认可监督管理委员会（以下简称国家认监委）所制定的有关CCC认证实施规则等规范性文件，以及各认证机构"}},{"id":214,"type":0,"num":215,"stem":"依据CNCA-00C-001:2008《强制性产品认证证书注销、暂停、撤销实施规则》，自认证证书撤销之日起，不得（）认证证书覆盖的产品。","opts":["销售、进口","出厂、销售","出厂、销售、进口或者在其他经营活动中使用","出厂、进口"],"ans":"C","src":{"label":"《汇编》第154页","text":"154（1）自认证证书撤销之日起，不得出厂、销售、进口或者在其他经营活动中使用认证证书覆盖的产品。认证机构须根据证书撤销原因评价产品可能存在的安全隐患，对可能对人体健康和生命安全造成损害的，应依照有关规定及时向质检部门进行通报或采取相应措施。（2）认证证书被撤销后，不能以任何理由恢复。经过整改后，认证委托人可以向认证机构重新申请认证。对被撤销认证证书的产品，相应产品型式试验报告和工厂检查报告不再有效。任何认证机构在6 个月内不得受理该产品的认证委托。认证机构受理持有产品型式试验报告和工厂检查报告的认证申请时，要制定严格的审核程序，认真确认申请认证的产品是否已被撤销认证证书，相应的产品型式试验报告和工厂检查报告是否有效。"}},{"id":215,"type":0,"num":216,"stem":"认证机构应当公开认证基本规范、认证规则、（）等信息。","opts":["认证委托人名单","内部管理制度","认证结论","收费标准"],"ans":"D","src":{"label":"《汇编》第11页","text":"第十七条认证机构应当按照认证基本规范、认证规则从事认证活动。认证基本规范、认证规则由国务院认证认可监督管理部门制定；涉及国务院有关部门职责的，国务院认证认可监督管理部门应当会同国务院有关部门制定。属于认证新领域，前款规定的部门尚未制定认证规则的，认证机构可以自行制定认证规则，并报国务院认证认可监督管理部门备案。第十八条任何法人、组织和个人可以自愿委托依法设立的认证机构进行产品、服务、管理体系认证。第十九条认证机构不得以委托人未参加认证咨询或者认证培训等为理由，拒绝提供本认证机构业务范围内的认证服务，也不得向委托人提出与认证活动无关的要求或者限制条件。第二十条认证机构应当公开认证基本规范、认证规则、收费标准等信息。"}},{"id":216,"type":0,"num":217,"stem":"认证认可活动应当遵循（）的原则。","opts":["自愿公平、等价有偿、诚实信用","公开公平、公正高效、诚实信用","依法合规、客观公正、诚实信用","客观独立、公开公正、诚实信用"],"ans":"D","src":{"label":"《汇编》第7页","text":"范、相关技术规范的强制性要求或者标准的合格评定活动。本条例所称认可，是指由认可机构对认证机构、检查机构、实验室以及从事评审、审核等认证活动人员的能力和执业资格，予以承认的合格评定活动。第三条在中华人民共和国境内从事认证认可活动，应当遵守本条例。第四条国家实行统一的认证认可监督管理制度。国家对认证认可工作实行在国务院认证认可监督管理部门统一管理、监督和综合协调下，各有关方面共同实施的工作机制。第五条国务院认证认可监督管理部门应当依法对认证培训机构、认证咨询机构的活动加强监督管理。第六条认证认可活动应当遵循客观独立、公开公正、诚实信用的原则。"}},{"id":217,"type":0,"num":218,"stem":"县级以上地方人民政府市场监督管理部门在国务院认证认可监督管理部门的授权范围内，依照本条例的规定对（）实施监督管理。","opts":["认证人员","认证活动","认可活动","认证机构"],"ans":"B","src":{"label":"《汇编》第21页","text":"事项询问认可机构、认证机构、检查机构、实验室的主要负责人，调查了解情况，给予告诫，有关人员应当积极配合。第五十四条县级以上地方人民政府市场监督管理部门在国务院认证认可监督管理部门的授权范围内，依照本条例的规定对认证活动实施监督管理。国务院认证认可监督管理部门授权的县级以上地方人民政府市场监督管理部门，以下称地方认证监督管理部门。第五十五条任何单位和个人对认证认可违法行为，有权向国务院认证认可监督管理部门和地方认证监督管理部门举报。国务院认证认可监督管理部门和地方认证监督管理部门应当及时调查处理，并为举报人保密。第六章法律责任第五十六条未经批准擅自从事认证活动的，予以取缔，处10 万元以上50 万元以下的罚款，有违法所得的，没收违法所得。"}},{"id":218,"type":0,"num":219,"stem":"认证机构自行制定的认证标志的式样、文字和名称，不得违反法律、行政法规的规定，不得与国家推行的认证标志相同或者近似，不得妨碍社会管理，不得有损（）。","opts":["企业形象","公共秩序","行业秩序","社会道德风尚"],"ans":"D","src":{"label":"《汇编》第13页","text":"关文字、符号，误导公众认为其产品、服务已通过认证。第二十五条认证机构可以自行制定认证标志。认证机构自行制定的认证标志的式样、文字和名称，不得违反法律、行政法规的规定，不得与国家推行的认证标志相同或者近似，不得妨碍社会管理，不得有损社会道德风尚。第二十六条认证机构应当对其认证的产品、服务、管理体系实施有效的跟踪调查，认证的产品、服务、管理体系不能持续符合认证要求的，认证机构应当暂停其使用直至撤销认证证书，并予公布。第二十七条为了保护国家安全、防止欺诈行为、保护人体健康或者安全、保护动植物生命或者健康、保护环境，国家规定相关产品必须经过认证的，应当经过认证并标注认证标志后，方可出厂、销售、进口或者在其他经营活动中使用。"}},{"id":219,"type":0,"num":220,"stem":"任何法人、组织和个人可以（）委托依法设立的认证机构进行产品、服务、管理体系认证。","opts":["自愿","经批准","依法","强制"],"ans":"A","src":{"label":"《汇编》第11页","text":"第十七条认证机构应当按照认证基本规范、认证规则从事认证活动。认证基本规范、认证规则由国务院认证认可监督管理部门制定；涉及国务院有关部门职责的，国务院认证认可监督管理部门应当会同国务院有关部门制定。属于认证新领域，前款规定的部门尚未制定认证规则的，认证机构可以自行制定认证规则，并报国务院认证认可监督管理部门备案。第十八条任何法人、组织和个人可以自愿委托依法设立的认证机构进行产品、服务、管理体系认证。第十九条认证机构不得以委托人未参加认证咨询或者认证培训等为理由，拒绝提供本认证机构业务范围内的认证服务，也不得向委托人提出与认证活动无关的要求或者限制条件。第二十条认证机构应当公开认证基本规范、认证规则、收费标准等信息。"}},{"id":220,"type":0,"num":221,"stem":"境外认证机构在中华人民共和国境内设立代表机构，须向（）依法办理登记手续后，方可从事与所从属机构的业务范围相关的推广活动，但不得从事认证活动。","opts":["海关","商务部门","市场监督管理部门","国务院认证认可监督管理部门"],"ans":"C","src":{"label":"《汇编》第9页","text":"第十一条认证机构资质的申请和批准程序：（一）认证机构资质的申请人，应当向国务院认证认可监督管理部门提出书面申请，并提交符合本条例第十条规定条件的证明文件；（二）国务院认证认可监督管理部门自受理认证机构资质申请之日起45 日内，应当作出是否批准的决定。涉及国务院有关部门职责的，应当征求国务院有关部门的意见。决定批准的，向申请人出具批准文件，决定不予批准的，应当书面通知申请人，并说明理由。国务院认证认可监督管理部门应当公布依法取得认证机构资质的企业名录。第十二条境外认证机构在中华人民共和国境内设立代表机构，须向市场监督管理部门依法办理登记手续后，方可从事与所从属机构的业务范围相关的推广活动，但不得从事认证活动。"}},{"id":221,"type":0,"num":222,"stem":"从事评审、审核等认证活动的人员，应当经（）注册后，方可从事相应的认证活动。","opts":["行业协会","国务院认证认可监督管理部门","认证机构","认可机构"],"ans":"D","src":{"label":"《汇编》第17页","text":"第三十八条从事评审、审核等认证活动的人员，应当经认可机构注册后，方可从事相应的认证活动。第三十九条认可机构应当具有与其认可范围相适应的质量体系，并建立内部审核制度，保证质量体系的有效实施。第四十条认可机构根据认可的需要，可以选聘从事认可评审活动的人员。从事认可评审活动的人员应当是相关领域公认的专家，熟悉有关法律、行政法规以及认可规则和程序，具有评审所需要的良好品德、专业知识和业务能力。第四十一条认可机构委托他人完成与认可有关的具体评审业务的，由认可机构对评审结论负责。第四十二条认可机构应当公开认可条件、认可程序、收费标准等信息。认可机构受理认可申请，不得向申请人提出与认可活动无关的要求或者限制条件。"}},{"id":222,"type":0,"num":223,"stem":"取得认证机构资质，应当符合的条件包括：有（）以上相应领域的专职认证人员。","opts":["20 名","15 名","5 名","10 名"],"ans":"D","src":{"label":"《汇编》第8页","text":"第八条从事认证认可活动的机构及其人员，对其所知悉的国家秘密和商业秘密负有保密义务。第二章认证机构第九条取得认证机构资质，应当经国务院认证认可监督管理部门批准，并在批准范围内从事认证活动。未经批准，任何单位和个人不得从事认证活动。第十条取得认证机构资质，应当符合下列条件：（一）取得法人资格；（二）有固定的场所和必要的设施；（三）有符合认证认可要求的管理制度；（四）注册资本不得少于人民币300 万元；（五）有10 名以上相应领域的专职认证人员。"}},{"id":223,"type":0,"num":224,"stem":"认证结论经认证人员签字后，由（）签署。","opts":["认证委托人","认证机构负责人","认可机构","认证人员"],"ans":"B","src":{"label":"《汇编》第12页","text":"检查、检测活动，应当完成认证基本规范、认证规则规定的程序，确保认证、检查、检测的完整、客观、真实，不得增加、减少、遗漏程序。认证机构以及与认证有关的检查机构、实验室应当对认证、检查、检测过程作出完整记录，归档留存。第二十二条认证机构及其认证人员应当及时作出认证结论，并保证认证结论的客观、真实。认证结论经认证人员签字后，由认证机构负责人签署。认证机构及其认证人员对认证结果负责。第二十三条认证结论为产品、服务、管理体系符合认证要求的，认证机构应当及时向委托人出具认证证书。第二十四条获得认证证书的，应当在认证范围内使用认证证书和认证标志，不得利用产品、服务认证证书、认证标志和相关文字、符号，误导公众认为其管理体系已通过认证，也不得利用管理体系认证证书、认证标志和相"}},{"id":224,"type":0,"num":225,"stem":"国家鼓励平等互利地开展认证认可国际互认活动。认证认可国际互认活动不得损害（）。","opts":["行业利益","国家利益","企业利益","国家安全和社会公共利益"],"ans":"D","src":{"label":"《汇编》第7页","text":"范、相关技术规范的强制性要求或者标准的合格评定活动。本条例所称认可，是指由认可机构对认证机构、检查机构、实验室以及从事评审、审核等认证活动人员的能力和执业资格，予以承认的合格评定活动。第三条在中华人民共和国境内从事认证认可活动，应当遵守本条例。第四条国家实行统一的认证认可监督管理制度。国家对认证认可工作实行在国务院认证认可监督管理部门统一管理、监督和综合协调下，各有关方面共同实施的工作机制。第五条国务院认证认可监督管理部门应当依法对认证培训机构、认证咨询机构的活动加强监督管理。第六条认证认可活动应当遵循客观独立、公开公正、诚实信用的原则。"}},{"id":225,"type":0,"num":226,"stem":"指定的认证机构不得向（）转让指定的认证业务。","opts":["其他机构","其分支机构","合作机构","境外机构"],"ans":"A","src":{"label":"《汇编》第16页","text":"时的认证、检查、检测服务，不得拖延，不得歧视、刁难委托人，不得牟取不当利益。指定的认证机构不得向其他机构转让指定的认证业务。第三十五条指定的认证机构、实验室开展国际互认活动，应当在国务院认证认可监督管理部门或者经授权的国务院有关部门对外签署的国际互认协议框架内进行。第四章认可第三十六条国务院认证认可监督管理部门确定的认可机构（以下简称认可机构），独立开展认可活动。除国务院认证认可监督管理部门确定的认可机构外，其他任何单位不得直接或者变相从事认可活动。其他单位直接或者变相从事认可活动的，其认可结果无效。"}},{"id":226,"type":0,"num":227,"stem":"国家对必须经过认证的产品，统一产品目录，统一技术规范的强制性要求、标准和合格评定程序，统一标志，统一（）。","opts":["收费标准","认证机构","认证模式","认证证书"],"ans":"A","src":{"label":"《汇编》第33页","text":"督管理和综合协调。县级以上地方市场监督管理部门负责所辖区域内强制性产品认证活动的监督管理工作。第四条国家对实施强制性产品认证的产品，统一产品目录（以下简称目录），统一技术规范的强制性要求、标准和合格评定程序，统一认证标志，统一收费标准。市场监管总局会同国务院有关部门制定和调整目录，目录由市场监管总局发布,并会同有关方面共同实施。第五条国家鼓励开展平等互利的强制性产品认证国际互认活动，互认活动应当在市场监管总局或者其授权的有关部门对外签署的国际互认协议框架内进行。"}},{"id":227,"type":0,"num":228,"stem":"认证机构未对其认证的产品实施有效的跟踪调查，或者发现其认证的产品不能持续符合认证要求，不及时暂停或者撤销认证证书和要求其停止使用认证标志给消费者造成损失的，与（）承担连带责任。","opts":["进口商","认证委托人","经营使用者","生产者、销售者"],"ans":"D","src":{"label":"《汇编》第29页","text":"第七十二条认证人员自被撤销执业资格之日起5 年内，认可机构不再受理其注册申请。第七十三条认证机构未对其认证的产品实施有效的跟踪调查，或者发现其认证的产品不能持续符合认证要求，不及时暂停或者撤销认证证书和要求其停止使用认证标志给消费者造成损失的，与生产者、销售者承担连带责任。第七章附则第七十四条药品生产、经营企业质量管理规范认证，实验动物质量合格认证，军工产品的认证，以及从事军工产品校准、检测的实验室及其人员的认可，不适用本条例。依照本条例经批准的认证机构从事矿山、危险化学品、烟花爆竹生产经营单位管理体系认证，由国务院安全生产监督管理部门结合安全生产的特殊要求组织；从事矿山、危险化学品、烟花爆竹生产经营单位安全生产综合评价的认证机构，经国务院安全生产监督管理部门推荐，方可取得认可机构的认可。"}},{"id":228,"type":0,"num":229,"stem":"认证机构应当按照（）从事认证活动。","opts":["认证收费标准","国家标准","国际标准","认证基本规范、认证规则"],"ans":"D","src":{"label":"《汇编》第11页","text":"第十七条认证机构应当按照认证基本规范、认证规则从事认证活动。认证基本规范、认证规则由国务院认证认可监督管理部门制定；涉及国务院有关部门职责的，国务院认证认可监督管理部门应当会同国务院有关部门制定。属于认证新领域，前款规定的部门尚未制定认证规则的，认证机构可以自行制定认证规则，并报国务院认证认可监督管理部门备案。第十八条任何法人、组织和个人可以自愿委托依法设立的认证机构进行产品、服务、管理体系认证。第十九条认证机构不得以委托人未参加认证咨询或者认证培训等为理由，拒绝提供本认证机构业务范围内的认证服务，也不得向委托人提出与认证活动无关的要求或者限制条件。第二十条认证机构应当公开认证基本规范、认证规则、收费标准等信息。"}},{"id":229,"type":0,"num":230,"stem":"列入目录的产品，必须经（）指定的认证机构进行认证。","opts":["行业协会","国务院市场监督管理部门","国家认可机构","国务院认证认可监督管理部门"],"ans":"D","src":{"label":"《汇编》第14页","text":"标准和合格评定程序，统一标志，统一收费标准。统一的产品目录（以下简称目录）由国务院认证认可监督管理部门会同国务院有关部门制定、调整，由国务院认证认可监督管理部门发布，并会同有关方面共同实施。第二十九条列入目录的产品，必须经国务院认证认可监督管理部门指定的认证机构进行认证。列入目录产品的认证标志，由国务院认证认可监督管理部门统一规定。第三十条列入目录的产品，涉及进出口商品检验目录的，应当在进出口商品检验时简化检验手续。第三十一条国务院认证认可监督管理部门指定的从事列入目录产品认证活动的认证机构以及与认证有关的实验室（以下简称指定的认证机构、实验室），应当是长期从事相关业务、无不良记录，且已经依照本条例的规定取得认可、具备从事相关认证活动能力的机构。"}},{"id":230,"type":0,"num":231,"stem":"认证机构以及与认证有关的检查机构、实验室从事认证以及与认证有关的检查、检测活动，应当完成认证基本规范、认证规则规定的程序，确保认证、检查、检测的完整、客观、真实，不得（）程序。","opts":["简化","变更","增加、减少、遗漏","重复执行"],"ans":"C","src":{"label":"《汇编》第12页","text":"检查、检测活动，应当完成认证基本规范、认证规则规定的程序，确保认证、检查、检测的完整、客观、真实，不得增加、减少、遗漏程序。认证机构以及与认证有关的检查机构、实验室应当对认证、检查、检测过程作出完整记录，归档留存。第二十二条认证机构及其认证人员应当及时作出认证结论，并保证认证结论的客观、真实。认证结论经认证人员签字后，由认证机构负责人签署。认证机构及其认证人员对认证结果负责。第二十三条认证结论为产品、服务、管理体系符合认证要求的，认证机构应当及时向委托人出具认证证书。第二十四条获得认证证书的，应当在认证范围内使用认证证书和认证标志，不得利用产品、服务认证证书、认证标志和相关文字、符号，误导公众认为其管理体系已通过认证，也不得利用管理体系认证证书、认证标志和相"}},{"id":231,"type":0,"num":232,"stem":"国务院认证认可监督管理部门指定从事列入目录产品认证活动的认证机构，应当确保在每一列入目录产品领域至少指定（）符合本条例规定条件的机构。","opts":["五家","三家","一家","两家"],"ans":"D","src":{"label":"《汇编》第15页","text":"录产品认证活动的认证机构，应当确保在每一列入目录产品领域至少指定两家符合本条例规定条件的机构。国务院认证认可监督管理部门指定前款规定的认证机构、实验室，应当事先公布有关信息，并组织在相关领域公认的专家组成专家评审委员会，对符合前款规定要求的认证机构、实验室进行评审；经评审并征求国务院有关部门意见后，按照资源合理利用、公平竞争和便利、有效的原则，在公布的时间内作出决定。第三十二条国务院认证认可监督管理部门应当公布指定的认证机构、实验室名录及指定的业务范围。未经指定的认证机构、实验室不得从事列入目录产品的认证以及与认证有关的检查、检测活动。第三十三条列入目录产品的生产者或者销售者、进口商，均可自行委托指定的认证机构进行认证。"}},{"id":232,"type":0,"num":233,"stem":"属于认证新领域，国务院认证认可监督管理部门等尚未制定认证规则的，认证机构可以自行制定认证规则，并报（）备案。","opts":["国家认可机构","国务院认证认可监督管理部门","国务院标准化行政主管部门","行业协会"],"ans":"B","src":{"label":"《汇编》第80页","text":"属于认证新领域，国务院认证认可监督管理部门尚未制定认证规则的，认证机构可以自行制定认证规则，并在认证规则发布后30 日内，将认证规则相关信息报国务院认证认可监督管理部门备案。第十一条认证机构有下列情形之一的，应当自变更之日起30 日内，向国务院认证认可监督管理部门申请办理《认证机构批准书》变更手续：（一）缩小批准认证领域的；（二）变更法人性质、股东、注册资本的；（三）合并或者分立的；（四）变更名称、住所、法定代表人的。"}},{"id":233,"type":0,"num":234,"stem":"从事认证认可活动的机构及其人员，对其所知悉的（）负有保密义务。","opts":["国家秘密和商业秘密","商业秘密和技术秘密","国家秘密和个人隐私","技术秘密和经营信息"],"ans":"A","src":{"label":"《汇编》第8页","text":"第八条从事认证认可活动的机构及其人员，对其所知悉的国家秘密和商业秘密负有保密义务。第二章认证机构第九条取得认证机构资质，应当经国务院认证认可监督管理部门批准，并在批准范围内从事认证活动。未经批准，任何单位和个人不得从事认证活动。第十条取得认证机构资质，应当符合下列条件：（一）取得法人资格；（二）有固定的场所和必要的设施；（三）有符合认证认可要求的管理制度；（四）注册资本不得少于人民币300 万元；（五）有10 名以上相应领域的专职认证人员。"}},{"id":234,"type":0,"num":235,"stem":"取得认证机构资质，应当经（）批准，并在批准范围内从事认证活动。","opts":["国务院认证认可监督管理部门","国务院市场监督管理部门","省级认证认可监督管理部门","国家认可机构"],"ans":"A","src":{"label":"《汇编》第8页","text":"第八条从事认证认可活动的机构及其人员，对其所知悉的国家秘密和商业秘密负有保密义务。第二章认证机构第九条取得认证机构资质，应当经国务院认证认可监督管理部门批准，并在批准范围内从事认证活动。未经批准，任何单位和个人不得从事认证活动。第十条取得认证机构资质，应当符合下列条件：（一）取得法人资格；（二）有固定的场所和必要的设施；（三）有符合认证认可要求的管理制度；（四）注册资本不得少于人民币300 万元；（五）有10 名以上相应领域的专职认证人员。"}},{"id":235,"type":0,"num":236,"stem":"本条例所称认可，是指由认可机构对认证机构、检查机构、实验室以及从事评审、审核等认证活动人员的（），予以承认的合格评定活动。","opts":["能力和执业资格","资质条件","注册资格","从业记录"],"ans":"A","src":{"label":"《汇编》第7页","text":"范、相关技术规范的强制性要求或者标准的合格评定活动。本条例所称认可，是指由认可机构对认证机构、检查机构、实验室以及从事评审、审核等认证活动人员的能力和执业资格，予以承认的合格评定活动。第三条在中华人民共和国境内从事认证认可活动，应当遵守本条例。第四条国家实行统一的认证认可监督管理制度。国家对认证认可工作实行在国务院认证认可监督管理部门统一管理、监督和综合协调下，各有关方面共同实施的工作机制。第五条国务院认证认可监督管理部门应当依法对认证培训机构、认证咨询机构的活动加强监督管理。第六条认证认可活动应当遵循客观独立、公开公正、诚实信用的原则。"}},{"id":236,"type":0,"num":237,"stem":"认证机构不得以委托人未参加认证咨询或者认证培训等为理由，拒绝提供本认证机构业务范围内的认证服务，也不得向委托人提出与（）无关的要求或者限制条件。","opts":["认证活动","认证收费","经营活动","合同履行"],"ans":"A","src":{"label":"《汇编》第11页","text":"第十七条认证机构应当按照认证基本规范、认证规则从事认证活动。认证基本规范、认证规则由国务院认证认可监督管理部门制定；涉及国务院有关部门职责的，国务院认证认可监督管理部门应当会同国务院有关部门制定。属于认证新领域，前款规定的部门尚未制定认证规则的，认证机构可以自行制定认证规则，并报国务院认证认可监督管理部门备案。第十八条任何法人、组织和个人可以自愿委托依法设立的认证机构进行产品、服务、管理体系认证。第十九条认证机构不得以委托人未参加认证咨询或者认证培训等为理由，拒绝提供本认证机构业务范围内的认证服务，也不得向委托人提出与认证活动无关的要求或者限制条件。第二十条认证机构应当公开认证基本规范、认证规则、收费标准等信息。"}},{"id":237,"type":0,"num":238,"stem":"列入目录的产品未经认证，擅自出厂、销售、进口或者在其他经营活动中使用的，责令限期改正，处（）的罚款。","opts":["5 万元以上20 万元以下","3 万元以上10 万元以下","10 万元以上50 万元以下","5 万元以上10 万元以下"],"ans":"A","src":{"label":"《汇编》第26页","text":"第六十五条认证机构、检查机构、实验室取得境外认可机构认可，未向国务院认证认可监督管理部门备案的，给予警告，并予公布。第六十六条列入目录的产品未经认证，擅自出厂、销售、进口或者在其他经营活动中使用的，责令限期改正，处5 万元以上20 万元以下的罚款；未经认证的违法产品货值金额不足1 万元的，处货值金额2 倍以下的罚款；有违法所得的，没收违法所得。第六十七条认可机构有下列情形之一的，责令改正；情节严重的，对主要负责人和负有责任的人员撤职或者解聘：（一）对不符合认可条件的机构和人员予以认可的；（二）发现取得认可的机构和人员不符合认可条件，不及时撤销认可证书，并予公布的；（三）接受可能对认可活动的客观公正产生影响的资助的。"}},{"id":238,"type":0,"num":239,"stem":"认可证书应当包括（）。","opts":["认可标准、认可领域、认可费用和有效期限","认可范围、认可标准、认可领域和有效期限","认可范围、认可标准、认可机构和注册时间","认可范围、认可机构、认可时间和有效期限"],"ans":"B","src":{"label":"《汇编》第18页","text":"部门的规定，完成对认证机构、检查机构、实验室的评审，作出是否给予认可的决定，并对认可过程作出完整记录，归档留存。认可机构应当确保认可的客观公正和完整有效，并对认可结论负责。认可机构应当向取得认可的认证机构、检查机构、实验室颁发认可证书，并公布取得认可的认证机构、检查机构、实验室名录。第四十四条认可机构应当按照国家标准和国务院认证认可监督管理部门的规定，对从事评审、审核等认证活动的人员进行考核，考核合格的，予以注册。第四十五条认可证书应当包括认可范围、认可标准、认可领域和有效期限。第四十六条取得认可的机构应当在取得认可的范围内使用认可证书和认可标志。取得认可的机构不当使用认可证书和认可标志的，认可机构应当暂停其使用直至撤销认可证书，并予公布。"}},{"id":239,"type":0,"num":240,"stem":"从事产品认证活动的认证机构，还应当具备与从事相关产品认证活动相适应的（）等技术能力。","opts":["生产、制造","销售、服务","检测、检查","设计、开发"],"ans":"C","src":{"label":"《汇编》第78页","text":"列条件：（一）取得法人资格；（二）有固定的办公场所和必要的设施；（三）有符合认证认可要求的管理制度；（四）注册资本不得少于人民币300 万元；（五）有10 名以上相应领域的专职认证人员。从事产品认证活动的认证机构，还应当具备与从事相关产品认证活动相适应的检测、检查等技术能力。第九条认证机构资质审批程序：（一）认证机构资质的申请人（以下简称申请人）应当向国务院认证认可监督管理部门提出申请，提交符合本办法第八条规定条件的相关证明文件，并对其真实性、有效性、合法性负责。"}},{"id":240,"type":0,"num":241,"stem":"认证人员从事认证活动，应当在一个认证机构执业，不得（）执业。","opts":["跨领域","同时在两个以上认证机构","在两个认证机构","跨省"],"ans":"B","src":{"label":"《汇编》第10页","text":"第十三条认证机构不得与行政机关存在利益关系。认证机构不得接受任何可能对认证活动的客观公正产生影响的资助；不得从事任何可能对认证活动的客观公正产生影响的产品开发、营销等活动。认证机构不得与认证委托人存在资产、管理方面的利益关系。第十四条认证人员从事认证活动，应当在一个认证机构执业，不得同时在两个以上认证机构执业。第十五条向社会出具具有证明作用的数据和结果的检查机构、实验室，应当具备有关法律、行政法规规定的基本条件和能力，并依法经认定后，方可从事相应活动，认定结果由国务院认证认可监督管理部门公布。"}},{"id":241,"type":0,"num":242,"stem":"国家根据经济和社会发展的需要，推行（）认证。","opts":["产品、服务、管理体系","产品、技术、服务","产品、过程、服务","质量、环境、职业健康安全"],"ans":"A","src":{"label":"《汇编》第10页","text":"第十三条认证机构不得与行政机关存在利益关系。认证机构不得接受任何可能对认证活动的客观公正产生影响的资助；不得从事任何可能对认证活动的客观公正产生影响的产品开发、营销等活动。认证机构不得与认证委托人存在资产、管理方面的利益关系。第十四条认证人员从事认证活动，应当在一个认证机构执业，不得同时在两个以上认证机构执业。第十五条向社会出具具有证明作用的数据和结果的检查机构、实验室，应当具备有关法律、行政法规规定的基本条件和能力，并依法经认定后，方可从事相应活动，认定结果由国务院认证认可监督管理部门公布。"}},{"id":242,"type":0,"num":243,"stem":"为了保护国家安全、防止欺诈行为、保护人体健康或者安全、保护动植物生命或者健康、保护环境，国家规定相关产品必须经过认证的，应当经过认证并标注认证标志后，方可出厂、销售、进口或者在（）中使用。","opts":["运输活动","其他经营活动","仓储活动","展览活动"],"ans":"B","src":{"label":"《汇编》第13页","text":"关文字、符号，误导公众认为其产品、服务已通过认证。第二十五条认证机构可以自行制定认证标志。认证机构自行制定的认证标志的式样、文字和名称，不得违反法律、行政法规的规定，不得与国家推行的认证标志相同或者近似，不得妨碍社会管理，不得有损社会道德风尚。第二十六条认证机构应当对其认证的产品、服务、管理体系实施有效的跟踪调查，认证的产品、服务、管理体系不能持续符合认证要求的，认证机构应当暂停其使用直至撤销认证证书，并予公布。第二十七条为了保护国家安全、防止欺诈行为、保护人体健康或者安全、保护动植物生命或者健康、保护环境，国家规定相关产品必须经过认证的，应当经过认证并标注认证标志后，方可出厂、销售、进口或者在其他经营活动中使用。"}},{"id":243,"type":0,"num":244,"stem":"认证结论为产品、服务、管理体系符合认证要求的，认证机构应当及时向（）出具认证证书。","opts":["销售者","委托人","生产者","进口商"],"ans":"B","src":{"label":"《汇编》第12页","text":"检查、检测活动，应当完成认证基本规范、认证规则规定的程序，确保认证、检查、检测的完整、客观、真实，不得增加、减少、遗漏程序。认证机构以及与认证有关的检查机构、实验室应当对认证、检查、检测过程作出完整记录，归档留存。第二十二条认证机构及其认证人员应当及时作出认证结论，并保证认证结论的客观、真实。认证结论经认证人员签字后，由认证机构负责人签署。认证机构及其认证人员对认证结果负责。第二十三条认证结论为产品、服务、管理体系符合认证要求的，认证机构应当及时向委托人出具认证证书。第二十四条获得认证证书的，应当在认证范围内使用认证证书和认证标志，不得利用产品、服务认证证书、认证标志和相关文字、符号，误导公众认为其管理体系已通过认证，也不得利用管理体系认证证书、认证标志和相"}},{"id":244,"type":0,"num":245,"stem":"取得认证机构资质，应当符合的条件包括：注册资本不得少于人民币（）万元。","opts":["300","100","1000","500"],"ans":"A","src":{"label":"《汇编》第8页","text":"第八条从事认证认可活动的机构及其人员，对其所知悉的国家秘密和商业秘密负有保密义务。第二章认证机构第九条取得认证机构资质，应当经国务院认证认可监督管理部门批准，并在批准范围内从事认证活动。未经批准，任何单位和个人不得从事认证活动。第十条取得认证机构资质，应当符合下列条件：（一）取得法人资格；（二）有固定的场所和必要的设施；（三）有符合认证认可要求的管理制度；（四）注册资本不得少于人民币300 万元；（五）有10 名以上相应领域的专职认证人员。"}},{"id":245,"type":0,"num":246,"stem":"伪造、冒用、买卖认证标志或者认证证书的，依照（）等法律的规定查处。","opts":["《中华人民共和国标准化法》","《中华人民共和国反不正当竞争法》","《中华人民共和国产品质量法》","《中华人民共和国广告法》"],"ans":"C","src":{"label":"《汇编》第28页","text":"28（二）发现认证机构不再符合本条例规定的批准或者指定条件，不撤销批准文件或者指定的；（三）发现指定的实验室不再符合本条例规定的指定条件，不撤销指定的；（四）发现认证机构以及与认证有关的检查机构、实验室出具虚假的认证以及与认证有关的检查、检测结论或者出具的认证以及与认证有关的检查、检测结论严重失实，不予查处的；（五）发现本条例规定的其他认证认可违法行为，不予查处的。第七十条伪造、冒用、买卖认证标志或者认证证书的，依照《中华人民共和国产品质量法》等法律的规定查处。第七十一条本条例规定的行政处罚，由国务院认证认可监督管理部门或者其授权的地方认证监督管理部门按照各自职责实施。"}},{"id":246,"type":0,"num":247,"stem":"未经批准擅自从事认证活动的，予以取缔，处（）的罚款，有违法所得的，没收违法所得。","opts":["20 万元以上50 万元以下","5 万元以上10 万元以下","10 万元以上50 万元以下","5 万元以上20 万元以下"],"ans":"C","src":{"label":"《汇编》第21页","text":"事项询问认可机构、认证机构、检查机构、实验室的主要负责人，调查了解情况，给予告诫，有关人员应当积极配合。第五十四条县级以上地方人民政府市场监督管理部门在国务院认证认可监督管理部门的授权范围内，依照本条例的规定对认证活动实施监督管理。国务院认证认可监督管理部门授权的县级以上地方人民政府市场监督管理部门，以下称地方认证监督管理部门。第五十五条任何单位和个人对认证认可违法行为，有权向国务院认证认可监督管理部门和地方认证监督管理部门举报。国务院认证认可监督管理部门和地方认证监督管理部门应当及时调查处理，并为举报人保密。第六章法律责任第五十六条未经批准擅自从事认证活动的，予以取缔，处10 万元以上50 万元以下的罚款，有违法所得的，没收违法所得。"}},{"id":247,"type":0,"num":248,"stem":"境内的认证机构、检查机构、实验室取得境外认可机构认可的，应当向（）备案。","opts":["国务院标准化行政主管部门","国务院认证认可监督管理部门","国家认可机构","行业协会"],"ans":"B","src":{"label":"《汇编》第19页","text":"认可的机构进行复评审，以验证其是否持续符合认可条件。取得认可的机构和人员不再符合认可条件的，认可机构应当撤销认可证书，并予公布。取得认可的机构的从业人员和主要负责人、设施、自行制定的认证规则等与认可条件相关的情况发生变化的，应当及时告知认可机构。第四十八条认可机构不得接受任何可能对认可活动的客观公正产生影响的资助。第四十九条境内的认证机构、检查机构、实验室取得境外认可机构认可的，应当向国务院认证认可监督管理部门备案。第五章监督管理第五十条国务院认证认可监督管理部门可以采取组织同行评议，向被认证企业征求意见，对认证活动和认证结果进行抽查，要求认证机构以及与认证有关的检查机构、实验室报告业务活动情况的方式，对其遵守本条例的情况进行监督。"}},{"id":248,"type":0,"num":249,"stem":"未经指定的认证机构、实验室不得从事（）的认证以及与认证有关的检查、检测活动。","opts":["强制性产品","进出口商品","全部产品","列入目录产品"],"ans":"D","src":{"label":"《汇编》第15页","text":"录产品认证活动的认证机构，应当确保在每一列入目录产品领域至少指定两家符合本条例规定条件的机构。国务院认证认可监督管理部门指定前款规定的认证机构、实验室，应当事先公布有关信息，并组织在相关领域公认的专家组成专家评审委员会，对符合前款规定要求的认证机构、实验室进行评审；经评审并征求国务院有关部门意见后，按照资源合理利用、公平竞争和便利、有效的原则，在公布的时间内作出决定。第三十二条国务院认证认可监督管理部门应当公布指定的认证机构、实验室名录及指定的业务范围。未经指定的认证机构、实验室不得从事列入目录产品的认证以及与认证有关的检查、检测活动。第三十三条列入目录产品的生产者或者销售者、进口商，均可自行委托指定的认证机构进行认证。"}},{"id":249,"type":0,"num":250,"stem":"国务院认证认可监督管理部门确定的认可机构，独立开展认可活动。除国务院认证认可监督管理部门确定的认可机构外，其他任何单位不得直接或者变相从事认可活动。其他单位直接或者变相从事认可活动的，其认可结果（）。","opts":["有效但需备案","有效","无效","待定"],"ans":"C","src":{"label":"《汇编》第16页","text":"时的认证、检查、检测服务，不得拖延，不得歧视、刁难委托人，不得牟取不当利益。指定的认证机构不得向其他机构转让指定的认证业务。第三十五条指定的认证机构、实验室开展国际互认活动，应当在国务院认证认可监督管理部门或者经授权的国务院有关部门对外签署的国际互认协议框架内进行。第四章认可第三十六条国务院认证认可监督管理部门确定的认可机构（以下简称认可机构），独立开展认可活动。除国务院认证认可监督管理部门确定的认可机构外，其他任何单位不得直接或者变相从事认可活动。其他单位直接或者变相从事认可活动的，其认可结果无效。"}},{"id":250,"type":0,"num":251,"stem":"列入目录产品的生产者或者销售者、进口商，均可（）委托指定的认证机构进行认证。","opts":["经批准","联合","协商一致后","自行"],"ans":"D","src":{"label":"《汇编》第15页","text":"录产品认证活动的认证机构，应当确保在每一列入目录产品领域至少指定两家符合本条例规定条件的机构。国务院认证认可监督管理部门指定前款规定的认证机构、实验室，应当事先公布有关信息，并组织在相关领域公认的专家组成专家评审委员会，对符合前款规定要求的认证机构、实验室进行评审；经评审并征求国务院有关部门意见后，按照资源合理利用、公平竞争和便利、有效的原则，在公布的时间内作出决定。第三十二条国务院认证认可监督管理部门应当公布指定的认证机构、实验室名录及指定的业务范围。未经指定的认证机构、实验室不得从事列入目录产品的认证以及与认证有关的检查、检测活动。第三十三条列入目录产品的生产者或者销售者、进口商，均可自行委托指定的认证机构进行认证。"}},{"id":251,"type":0,"num":252,"stem":"认证机构不得与（）存在利益关系。","opts":["消费者组织","生产企业","行政机关","销售企业"],"ans":"C","src":{"label":"《汇编》第10页","text":"第十三条认证机构不得与行政机关存在利益关系。认证机构不得接受任何可能对认证活动的客观公正产生影响的资助；不得从事任何可能对认证活动的客观公正产生影响的产品开发、营销等活动。认证机构不得与认证委托人存在资产、管理方面的利益关系。第十四条认证人员从事认证活动，应当在一个认证机构执业，不得同时在两个以上认证机构执业。第十五条向社会出具具有证明作用的数据和结果的检查机构、实验室，应当具备有关法律、行政法规规定的基本条件和能力，并依法经认定后，方可从事相应活动，认定结果由国务院认证认可监督管理部门公布。"}},{"id":252,"type":0,"num":253,"stem":"为了规范认证认可活动，提高产品、服务的质量和管理水平，促进经济和社会的发展，制定本条例。本条例所称认证，是指由认证机构证明产品、服务、管理体系符合（）的合格评定活动。","opts":["国家标准","认证规则","强制性产品认证目录","相关技术规范、相关技术规范的强制性要求或者标准"],"ans":"D","src":{"label":"《汇编》第6页","text":"中华人民共和国认证认可条例（2023 年修订版）（2003 年9 月3 日中华人民共和国国务院令第390 号公布根据2016 年2 月6 日《国务院关于修改部分行政法规的决定》第一次修订根据2020 年11 月29 日《国务院关于修改和废止部分行政法规的决定》第二次修订根据2023 年7 月20 日《国务院关于修改和废止部分行政法规的决定》第三次修订）)第一章总则第一条为了规范认证认可活动，提高产品、服务的质量和管理水平，促进经济和社会的发展，制定本条例。"}},{"id":253,"type":0,"num":254,"stem":"在中华人民共和国境内从事认证认可活动，应当遵守本条例。国家实行（）的认证认可监督管理制度。","opts":["分散","独立","统一","分级"],"ans":"C","src":{"label":"《汇编》第7页","text":"范、相关技术规范的强制性要求或者标准的合格评定活动。本条例所称认可，是指由认可机构对认证机构、检查机构、实验室以及从事评审、审核等认证活动人员的能力和执业资格，予以承认的合格评定活动。第三条在中华人民共和国境内从事认证认可活动，应当遵守本条例。第四条国家实行统一的认证认可监督管理制度。国家对认证认可工作实行在国务院认证认可监督管理部门统一管理、监督和综合协调下，各有关方面共同实施的工作机制。第五条国务院认证认可监督管理部门应当依法对认证培训机构、认证咨询机构的活动加强监督管理。第六条认证认可活动应当遵循客观独立、公开公正、诚实信用的原则。"}},{"id":254,"type":0,"num":255,"stem":"监督抽查的样品应当在市场上或者企业成品仓库内的（）中随机抽取。","opts":["已售产品","待销产品","在制品","全部产品"],"ans":"B","src":{"label":"《汇编》第2页","text":"书。国家参照国际先进的产品标准和技术要求，推行产品质量认证制度。企业根据自愿原则可以向国务院产品质量监督部门认可的或者国务院产品质量监督部门授权的部门认可的认证机构申请产品质量认证。经认证合格的，由认证机构颁发产品质量认证证书，准许企业在产品或者其包装上使用产品质量认证标志。第十五条国家对产品质量实行以抽查为主要方式的监督检查制度，对可能危及人体健康和人身、财产安全的产品，影响国计民生的重要工业产品以及消费者、有关组织反映有质量问题的产品进行抽查。抽查的样品应当在市场上或者企业成品仓库内的待销产品中随机抽取。监督抽查工作由国务院产品质量监督部门规划和组织。"}},{"id":255,"type":0,"num":256,"stem":"因产品质量发生民事纠纷时，当事人不愿通过协商、调解解决或者协商、调解不成的，可以根据当事人各方的协议向（）申请仲裁。","opts":["消费者协会","市场监督管理部门","仲裁机构","人民法院"],"ans":"C","src":null},{"id":256,"type":0,"num":257,"stem":"从事产品质量检验、认证的社会中介机构必须依法设立，不得与（）存在隶属关系或者其他利益关系。","opts":["销售企业","生产企业","行政机关和其他国家机关","消费者组织"],"ans":"C","src":{"label":"《汇编》第4页","text":"质量仍不合格的，吊销营业执照。监督抽查的产品有严重质量问题的，依照本法第五章的有关规定处罚。第十九条产品质量检验机构必须具备相应的检测条件和能力，经省级以上人民政府产品质量监督部门或者其授权的部门考核合格后，方可承担产品质量检验工作。法律、行政法规对产品质量检验机构另有规定的，依照有关法律、行政法规的规定执行。第二十条从事产品质量检验、认证的社会中介机构必须依法设立，不得与行政机关和其他国家机关存在隶属关系或者其他利益关系。第二十一条产品质量检验机构、认证机构必须依法按照有关标准，客观、公正地出具检验结果或者认证证明。"}},{"id":257,"type":0,"num":258,"stem":"本法所称产品是指经过加工、制作，用于销售的产品。建设工程不适用本法规定；但是，建设工程使用的（），属于前款规定的产品范围的，适用本法规定。","opts":["设计图纸文件","建筑材料、建筑构配件和设备","全部材料设备","施工机械设备"],"ans":"B","src":null},{"id":258,"type":0,"num":259,"stem":"产品质量认证机构应当依照国家规定对准许使用认证标志的产品进行认证后的（）。","opts":["监督抽查","免检管理","跟踪检查","定期复查"],"ans":"C","src":{"label":"《汇编》第4页","text":"质量仍不合格的，吊销营业执照。监督抽查的产品有严重质量问题的，依照本法第五章的有关规定处罚。第十九条产品质量检验机构必须具备相应的检测条件和能力，经省级以上人民政府产品质量监督部门或者其授权的部门考核合格后，方可承担产品质量检验工作。法律、行政法规对产品质量检验机构另有规定的，依照有关法律、行政法规的规定执行。第二十条从事产品质量检验、认证的社会中介机构必须依法设立，不得与行政机关和其他国家机关存在隶属关系或者其他利益关系。第二十一条产品质量检验机构、认证机构必须依法按照有关标准，客观、公正地出具检验结果或者认证证明。"}},{"id":259,"type":0,"num":260,"stem":"任何单位和个人有权对违反本法规定的行为，向（）或者其他有关部门检举。","opts":["仲裁机构","公安机关","人民法院","市场监督管理部门"],"ans":"D","src":{"label":"《汇编》第73页","text":"第三十三条国家市场监督管理总局对指定的认证机构、实验室的认证、检测工作的质量进行不定期调查，并征求有关认证委托人和认证证书持有人的意见和建议。第三十四条国家市场监督管理总局对指定的认证机构、实验室的技术能力、服务质量、工作效率、工作人员职业道德以及认证基本规范和认证规则的执行等情况组织进行 系不能持续符合认证要求，不及时暂停其使用认证证书和认证标志，或者不及时撤销认证证书或者停止其使用认证标志的，依照条例第五十九条规定处罚。"}},{"id":312,"type":0,"num":313,"stem":"依据《认证及认证培训、咨询人员管理办法》，国家市场监督管理总局负责执业资格注册制度的（）工作。","opts":["具体注册","批准","考试组织","人员培训"],"ans":"B","src":{"label":"《汇编》第120页","text":"法。第四条国家对管理体系认证审核员、产品认证检查员、认证培训教员和认证咨询师等从事认证及认证培训、咨询活动的人员实施统一的执业资格注册制度；对认证及认证培训、咨询人员的执业行为实行统一的监督管理。第五条国家市场监督管理总局负责对从事认证及认证培训、咨询活动人员执业资格注册制度的批准工作；对认证及认证培训、咨询人员执业行为实施监督管理。县级以上地方市场监督管理部门对所辖区域内的认证及认证培训、咨询人员的执业行为实施监督检查。中国认证人员与培训机构国家认可委员会承担对从事认证及认证培训、咨询活动人员的执业资格注册工作。"}},{"id":313,"type":0,"num":314,"stem":"依据《认证及认证培训、咨询人员管理办法》，从事认证、培训、咨询相关活动人员，应当申请执业资格（）。","opts":["备案","注册","告知","登记"],"ans":"B","src":{"label":"《汇编》第119页","text":"认证及认证培训、咨询人员管理办法第一条为规范认证及认证培训、咨询人员的执业行为，加强对认证市场的管理，根据《中华人民共和国认证认可条例》，制定本办法。第二条本办法所称的认证及认证培训、咨询人员，是指管理体系认证审核员、产品认证检查员、认证培训教员和认证咨询师等从事认证及认证培训、咨询活动的人员，以及认证及认证培训、咨询机构的业务管理人员。本办法所称认证及认证培训、咨询人员执业，是指受聘于认证及认证培训、咨询机构的人员从事的认证及认证培训、咨询和业务管理的活动。"}},{"id":314,"type":0,"num":315,"stem":"依据《认证及认证培训、咨询人员管理办法》，国家公务员（）从事认证、认证咨询和认证培训活动。。","opts":["可以兼职","不得","经单位批准可兼职","可以担任顾问"],"ans":"B","src":{"label":"《汇编》第122页","text":"专职认证及认证培训、咨询人员是指将认证及认证培训、咨询和有关业务管理活动作为本职工作，与1 个认证、认证培训或者认证咨询机构签订劳务合同，并固定在该机构工作的人员；兼职认证及认证培训、咨询人员是指在不脱离本职工作的情况下与1 个认证、认证培训或者认证咨询机构签订劳务合同，从事认证、认证培训或者认证咨询活动的人员。国家公务员不得从事认证、认证咨询和认证培训活动。第八条认证人员从事认证活动应当在1 个认证机构执业，不得同时在2 个或者2 个以上认证机构执业。在认证机构执业的专职或者兼职认证人员，具备相关认证培训教员资格的，经所在认证机构与认证培训机构签订合同后，可以在1 个认证培训机构从事认证培训活动。"}},{"id":315,"type":0,"num":316,"stem":"依据《认证及认证培训、咨询人员管理办法》，认证人员从事认证活动，应当在（）认证机构执业。","opts":["1 个","不超过2 个","最多3 个","不限数量"],"ans":"A","src":{"label":"《汇编》第122页","text":"专职认证及认证培训、咨询人员是指将认证及认证培训、咨询和有关业务管理活动作为本职工作，与1 个认证、认证培训或者认证咨询机构签订劳务合同，并固定在该机构工作的人员；兼职认证及认证培训、咨询人员是指在不脱离本职工作的情况下与1 个认证、认证培训或者认证咨询机构签订劳务合同，从事认证、认证培训或者认证咨询活动的人员。国家公务员不得从事认证、认证咨询和认证培训活动。第八条认证人员从事认证活动应当在1 个认证机构执业，不得同时在2 个或者2 个以上认证机构执业。在认证机构执业的专职或者兼职认证人员，具备相关认证培训教员资格的，经所在认证机构与认证培训机构签订合同后，可以在1 个认证培训机构从事认证培训活动。"}},{"id":316,"type":0,"num":317,"stem":"依据《认证及认证培训、咨询人员管理办法》，（）承担执业资格注册工作。","opts":["中国认证人员与培训机构国家认可委员会","国家市场监督管理总局","地方市场监管局","行业协会"],"ans":"A","src":{"label":"《汇编》第120页","text":"法。第四条国家对管理体系认证审核员、产品认证检查员、认证培训教员和认证咨询师等从事认证及认证培训、咨询活动的人员实施统一的执业资格注册制度；对认证及认证培训、咨询人员的执业行为实行统一的监督管理。第五条国家市场监督管理总局负责对从事认证及认证培训、咨询活动人员执业资格注册制度的批准工作；对认证及认证培训、咨询人员执业行为实施监督管理。县级以上地方市场监督管理部门对所辖区域内的认证及认证培训、咨询人员的执业行为实施监督检查。中国认证人员与培训机构国家认可委员会承担对从事认证及认证培训、咨询活动人员的执业资格注册工作。"}},{"id":317,"type":0,"num":318,"stem":"依据《认证及认证培训、咨询人员管理办法》，认证咨询人员应当仅在（）咨询机构执业。","opts":["1 个","2 个","3 个","多个"],"ans":"A","src":{"label":"《汇编》第118页","text":"认证及认证培训、咨询人员管理办法（2004 年5 月24 日国家质量监督检验检疫总局令第61 号公布根据2022 年9 月29 日国家市场监督管理总局令第61 号修订）"}},{"id":318,"type":0,"num":319,"stem":"依据《认证及认证培训、咨询人员管理办法》，认证人员（）受聘于认证咨询机构或者从事认证咨询活动。","opts":["可以兼职","不得","经客户同意可以","机构同意可以"],"ans":"B","src":{"label":"《汇编》第122页","text":"专职认证及认证培训、咨询人员是指将认证及认证培训、咨询和有关业务管理活动作为本职工作，与1 个认证、认证培训或者认证咨询机构签订劳务合同，并固定在该机构工作的人员；兼职认证及认证培训、咨询人员是指在不脱离本职工作的情况下与1 个认证、认证培训或者认证咨询机构签订劳务合同，从事认证、认证培训或者认证咨询活动的人员。国家公务员不得从事认证、认证咨询和认证培训活动。第八条认证人员从事认证活动应当在1 个认证机构执业，不得同时在2 个或者2 个以上认证机构执业。在认证机构执业的专职或者兼职认证人员，具备相关认证培训教员资格的，经所在认证机构与认证培训机构签订合同后，可以在1 个认证培训机构从事认证培训活动。"}},{"id":319,"type":0,"num":320,"stem":"以欺骗、贿赂等不正当手段取得认证机构资质的，国务院认证认可监督管理部门应当撤销《认证机构批准书》；申请人在（）内不得再次申请认证机构资质。","opts":["2 年","3 年","1 年","5 年"],"ans":"B","src":{"label":"《汇编》第91页","text":"91（五）认证机构已不具备或者不能持续符合法定条件和能力的；（六）依法可以撤销的其他情形。以欺骗、贿赂等不正当手段取得认证机构资质的，国务院认证认可监督管理部门应当撤销《认证机构批准书》；申请人在3 年内不得再次申请认证机构资质。第三十二条认证机构有下列情形之一的，国务院认证认可监督管理部门应当办理《认证机构批准书》注销手续：（一）《认证机构批准书》有效期届满，未申请延续或者复查不予延续的；（二）《认证机构批准书》依法被撤销的；（三）认证机构申请注销的；（四）认证机构依法终止的；（五）法律法规规定应当注销的其他情形。"}},{"id":320,"type":0,"num":321,"stem":"认证机构（）超出批准范围从事认证活动。","opts":["不得","应当","可以","经批准可以"],"ans":"A","src":{"label":"《汇编》第81页","text":"认证机构需要延续《认证机构批准书》有效期的，应当在《认证机构批准书》有效期届满30 日前向国务院认证认可监督管理部门提出申请。国务院认证认可监督管理部门应当对提出延续申请的认证机构依照本办法规定的资质条件和审批程序进行书面复查，并在《认证机构批准书》有效期届满前作出是否准予延续的决定。第三章行为规范第十三条认证机构应当建立风险防范机制，对其从事认证活动可能引发的风险和责任，采取合理、有效措施，并承担相应的社会责任。"}},{"id":321,"type":0,"num":322,"stem":"认证机构在从事认证活动时，应当对认证对象是否具备相关法定资质、资格等情况进行核实；认证对象不符合要求的，认证机构（）向其出具认证证书。","opts":["不得","无需","暂缓","可以"],"ans":"A","src":{"label":"《汇编》第83页","text":"性产品认证相关信息。第十六条认证机构从事认证活动，应当符合认证基本规范、认证规则规定的程序要求，确保认证过程完整、客观、真实，不得增加、减少或者遗漏程序要求。第十七条认证机构在从事认证活动时，应当对认证对象的下列情况进行核实：（一）具备相关法定资质、资格；（二）委托认证的产品、服务、管理体系等符合相关法律法规的要求；（三）未列入严重违法失信名单。认证对象不符合上述要求的，认证机构不得向其出具认证证书。第十八条认证机构及其认证人员应当及时作出认证结论，保证其客观、真实并承担相应法律责任。"}},{"id":322,"type":0,"num":323,"stem":"取得认证机构资质，应当符合的条件包括：有（）以上相应领域的专职认证人员。","opts":["20 名","10 名","5 名","15 名"],"ans":"B","src":{"label":"《汇编》第8页","text":"第八条从事认证认可活动的机构及其人员，对其所知悉的国家秘密和商业秘密负有保密义务。第二章认证机构第九条取得认证机构资质，应当经国务院认证认可监督管理部门批准，并在批准范围内从事认证活动。未经批准，任何单位和个人不得从事认证活动。第十条取得认证机构资质，应当符合下列条件：（一）取得法人资格；（二）有固定的场所和必要的设施；（三）有符合认证认可要求的管理制度；（四）注册资本不得少于人民币300 万元；（五）有10 名以上相应领域的专职认证人员。"}},{"id":323,"type":0,"num":324,"stem":"本办法所称认证机构，是指依法取得资质，对产品、服务和管理体系是否符合标准、相关技术规范要求，独立进行合格评定的具有（）的证明机构。","opts":["法人资格","执业资格","检验能力","批准资质"],"ans":"A","src":{"label":"《汇编》第76页","text":"认证机构管理办法（2017 年11 月14 日国家质量监督检验检疫总局令第193 号公布，根据2020 年10 月23日国家市场监督管理总局令第31 号修订）第一章总则第一条为了加强对认证机构的监督管理，规范认证活动，提高认证有效性，根据《中华人民共和国认证认可条例》（以下简称《认证认可条例》）等有关法律、行政法规的规定，制定本办法。第二条本办法所称认证机构，是指依法取得资质，对产品、服务和管理体系是否符合标准、相关技术规范要求，独立进行合格评定的具有法人资格的证明机构。"}},{"id":324,"type":0,"num":325,"stem":"取得认证机构资质，应当符合的条件包括：注册资本不得少于人民币（）万元。","opts":["300","500","1000","100"],"ans":"A","src":{"label":"《汇编》第8页","text":"第八条从事认证认可活动的机构及其人员，对其所知悉的国家秘密和商业秘密负有保密义务。第二章认证机构第九条取得认证机构资质，应当经国务院认证认可监督管理部门批准，并在批准范围内从事认证活动。未经批准，任何单位和个人不得从事认证活动。第十条取得认证机构资质，应当符合下列条件：（一）取得法人资格；（二）有固定的场所和必要的设施；（三）有符合认证认可要求的管理制度；（四）注册资本不得少于人民币300 万元；（五）有10 名以上相应领域的专职认证人员。"}},{"id":325,"type":0,"num":326,"stem":"认证机构从事认证活动应当遵循（）的原则，维护社会信用体系。","opts":["公正公开、客观独立、诚实信用","依法合规、客观独立、诚实信用","自愿平等、公开公正、诚实信用","客观独立、公开公正、诚实信用"],"ans":"A","src":{"label":"《汇编》第77页","text":"活动的认证机构及其监督管理，适用本办法。第四条国务院认证认可监督管理部门主管认证机构的资质审批及监督管理工作。县级以上地方认证监督管理部门依照本办法的规定，负责所辖区域内认证机构从事认证活动的监督管理。第五条认证机构从事认证活动应当遵循公正公开、客观独立、诚实信用的原则，维护社会信用体系。第六条认证机构及其人员对其认证活动中所知悉的国家秘密、商业秘密负有保密义务。第二章资质审批第七条取得认证机构资质，应当经国务院认证认可监督管理部门批准。"}},{"id":326,"type":0,"num":327,"stem":"认证机构及其认证人员不得出具虚假或者严重失实的认证结论。下列属于出具虚假或者严重失实的认证结论的情形是（）。","opts":["认证人员按照认证规则要求进入现场进行审核的","认证记录真实、准确的","认证证书载明的事项内容真实准确的","认证人 认证、检测服务，不得歧视、刁难认证委托人，不得牟取不当利益。"}},{"id":386,"type":0,"num":387,"stem":"依据《强制性产品认证机构和实验室管理办法》，指定的认证机构、实验室（）转让或者变相转让指定的认证、检测业务。","opts":["经批准可以","不得","内部可以","可委托第三方间接"],"ans":"B","src":{"label":"《汇编》第70页","text":"第四章行为规范第二十三条经国家市场监督管理总局指定的强制性产品认证机构、实验室（以下简称指定的认证机构、实验室）应当在指定范围内按照认证基本规范和认证规则的要求为认证委托人提供服务，不得转让或者变相转让指定的认证、检测业务。第二十四条指定的认证机构、实验室应当制订管理制度和程序，对强制性产品认证、检测活动和自愿性产品认证、委托检测活动明确区分，不得利用其指定的资格，开发或者从事自愿性产品认证以及检测业务。第二十五条指定的认证机构在对外宣传中应当严格区分强制性产品认证业务与自愿性产品认证业务。"}},{"id":387,"type":0,"num":388,"stem":"依据《强制性产品认证机构和实验室管理办法》，专家委员会成员与申请机构有利害关系的，应当（）。","opts":["继续参与评审","回避","仅发表意见不投票","可经申请机构同意后参与"],"ans":"B","src":{"label":"《汇编》第68页","text":"专家委员会成员与申请机构有利害关系的（包括所在单位为申请机构等），相关专家委员会成员应当回避。第十九条专家委员会对申请机构进行评审，评审应当充分考虑相关领域行业发展特点、生产企业分布、认证制度与其他监管方式有效衔接等因素，保证认证制度有效实施、资源合理利用、便利认证委托人。评审应当结合申请机构的技术能力和相关声誉、信誉等情况，在成本效率分析的基础上作出科学、合理、准确的评审结论。专家委员会应当采用不计名投票以三分之二通过的方式作出评审结论。"}},{"id":388,"type":0,"num":389,"stem":"依据《强制性产品认证机构和实验室管理办法》，专家委员会一般由（）人组成，为非常设临时性组织。","opts":["3‑5","5‑7","7‑13","13‑15"],"ans":"C","src":{"label":"《汇编》第60页","text":"国家质检总局第65 号令强制性产品认证机构和实验室管理办法（2004 年6 月23 日国家质量监督检验检疫总局令第65 号公布根据2022 年9 月29 日国家市场监督管理总局令第61 号修订）。"}},{"id":389,"type":0,"num":390,"stem":"依据《强制性产品认证机构和实验室管理办法》，专家委员会评审结论采用不计名投票，需（）通过。","opts":["二分之一","三分之二","四分之三","全部"],"ans":"B","src":{"label":"《汇编》第60页","text":"国家质检总局第65 号令强制性产品认证机构和实验室管理办法（2004 年6 月23 日国家质量监督检验检疫总局令第65 号公布根据2022 年9 月29 日国家市场监督管理总局令第61 号修订）。"}},{"id":390,"type":0,"num":391,"stem":"依据《强制性产品认证机构和实验室管理办法》，指定的认证机构应当与指定实验室签署（），明确权利义务与法律责任。","opts":["口头约定","书面协议","框架备忘录","合作意向书"],"ans":"B","src":{"label":"《汇编》第61页","text":"强制性产品认证机构和实验室管理办法第一章总则第一条为规范强制性产品认证机构、实验室的管理，合理利用社会资源，保证强制性产品认证制度的有效实施，根据《中华人民共和国认证认可条例》（以下简称条例）的规定，制定本办法。第二条本办法所称的强制性产品认证机构、实验室是指从事强制性产品认证以及相关活动的认证机构、实验室。第三条本办法适用于中华人民共和国境内的强制性产品认证机构、实验室的指定和监督管理。"}},{"id":391,"type":0,"num":392,"stem":"依据《强制性产品认证机构和实验室管理办法》，指定机构不再具备指定条件，国家市场监督管理总局应当（）其指定。","opts":["警告","责令整改","撤销","约谈"],"ans":"C","src":{"label":"《汇编》第60页","text":"国家质检总局第65 号令强制性产品认证机构和实验室管理办法（2004 年6 月23 日国家质量监督检验检疫总局令第65 号公布根据2022 年9 月29 日国家市场监督管理总局令第61 号修订）。"}},{"id":392,"type":0,"num":393,"stem":"依据《强制性产品认证机构和实验室管理办法》，（）负责强制性产品认证机构、实验室指定制度的建立、实施及其监督管理工作。","opts":["中国认证人员与培训机构国家认可委员会","国家市场监督管理总局","中国合格评定国家认可中心","地方市场监管局"],"ans":"B","src":{"label":"《汇编》第62页","text":"第五条国家市场监督管理总局负责强制性产品认证机构、实验室指定制度的建立、实施及其监督管理工作。第六条强制性产品认证机构、实验室应当符合条例及其他法律、行政法规规定的条件和能力，经国家市场监督管理总局指定后，方可从事强制性产品认证活动和从事与强制性产品认证有关的检测活动。第七条强制性产品认证机构、实验室的指定工作遵循资源合理利用和实际需要、公平竞争、公开公正和便利、有效的原则。第八条认证机构、实验室为同一法人时，其从事强制性产品认证以及与认证有关的检测活动的资格应当分别指定。"}},{"id":393,"type":0,"num":394,"stem":"依据《强制性产品认证机构和实验室管理办法》，申请机构在申请指定前（）内无不良记录，是认证机构申请指定的条件之一。","opts":["3 个月","6 个月","12 个月","24 个月"],"ans":"B","src":{"label":"《汇编》第60页","text":"国家质检总局第65 号令强制性产品认证机构和实验室管理办法（2004 年6 月23 日国家质量监督检验检疫总局令第65 号公布根据2022 年9 月29 日国家市场监督管理总局令第61 号修订）。"}},{"id":394,"type":0,"num":395,"stem":"依据《强制性产品认证机构和实验室管理办法》，申请强制性产品认证机构，应当具有相应领域（）以上认证经历或者颁发相关产品认证证书20 份以上。","opts":["1 年","2 年","3 年","5 年"],"ans":"B","src":{"label":"《汇编》第63页","text":"认证机构应当具备下列条件：（一）依照条例规定设立，具有相应领域2年以上认证经历或者颁发相关产品认证证书20份以上；（二）符合国家标准中对认证机构技术能力的通用要求；（三）在申请前6 个月内无不良记录；（四）本机构的法人性质、产权构成和组织结构等能够保证其强制性认证活动的客观公正；（五）具备能够公正、独立和有效地从事强制性产品认证活动的技术与管理能力；（六）具备从事强制性产品认证活动所需要并且可以独立调配使用的检测、检查资源，拥有与强制性产品认证工作任务相适应的符合条例规定的认证人员和稳定的财力资源。"}},{"id":395,"type":0,"num":396,"stem":"依据《强制性产品认证机构和实验室管理办法》，申请从事强制性产品认证检测活动的实验室，应当从事检测工作（）以上或者对外出具相关领域检测报告20 份以上。","opts":["1 年","2 年","3 年","4 年"],"ans":"B","src":{"label":"《汇编》第64页","text":"动的实验室（以下简称实验室），应当具备下列条件：（一）具有法律、行政法规规定的基本条件和能力，并经依法认定；（二）具有相关领域检测经验，从事检测工作2 年以上或者对外出具相关领域检测报告20 份以上；（三）符合国家标准中对实验室技术能力的通用要求；（四）在申请前6 个月内无不良记录；（五）本单位的法人性质、产权构成以及组织结构能够保证其公正、独立地实施检测活动；（六）具备承担相应产品认证检测活动所需的全部设备、设施，或者经相关设备、设施所有权单位的授权，可以独立使用设备、设施；"}},{"id":396,"type":0,"num":397,"stem":"依据《强制性产品认证机构服务工作规范指南》，认证费用及相关检测费用应当在相关主体之间直接结算，不得通过（）代收或者转付。","opts":["第三方中介代理机构","获证生产企业","认证委托人","检测实验室"],"ans":"A","src":{"label":"《强制性产品认证机构服务工作规范指南》第5页","text":"（十八）认证机构禁止将CCC 认证业务与绩效收入挂钩，确保CCC 认证活动不受经济利益驱动，保障认证结果客观公正。  四、建立长效服务机制  （十九）认证机构应当规范CCC 认证收费行为，认证费用及相关检测费用应当在认证机构、认证委托人、生产者、生产企业和承担检测任务的实验室之间直接结算，不得通过第三方中介代理机构代收或者转付。  （二十）认证机构应当建立合理的成本测算机制，依据核算情况确定、公开认证收费标准，并严格按照标准执行。 （二十一）认证机构应当加强中介代理机构管理，在认证实施过程中发现中介代理机构代写委托资料、体系文件或者记录，派员参与或者干预工厂检查活动等情形，应当立即终止当前的认证活动，直到中介代理机构不再参与本条款所提及的相关活动后方可恢复认证活动。"}},{"id":397,"type":0,"num":398,"stem":"依据《强制性产品认证机构服务工作规范指南》，在工厂检查阶段，认证机构对工厂检查依据、方式及结论等进行解释时，不得涉及（）。","opts":["检查的范围、程序、资料准备等相关要求","具体整改方案或者技术指导","对判定依据的说明","对标准条款的说明"],"ans":"B","src":{"label":"《强制性产品认证机构服务工作规范指南》第2页","text":"必要时，指定实验室可对检测相关事项予以进一步解释。  （六）在工厂检查阶段，认证机构应当在检查前为认证委托人、生产者、生产企业提供工厂检查依据、检查方式的解读服务，说明检查的范围、程序、资料准备等相关要求。在工厂检查结论出具后，对检查发现的问题类别、判定依据及整改要求进行解释，解释应当限于对判定依据和标准条款的说明，不得涉及具体整改方案或者技术指导。认证机构可以组织工厂检查组与认证委托人、生产者、生产企业沟通人员分工、时间安排及现场配合事项，帮助其准确理解生产企业质量保证能力、产品一致性管控等检查要点。  （七）在认证决定阶段，认证机构应当为认证委托人提供评价程序、评价标准及评价要点的解读服务，说明对认证委托材料、型式试验报告、初始工厂检查结论的评价要求，帮助认证委托人理解评价结论的含义。"}},{"id":398,"type":0,"num":399,"stem":"依据《强制性产品认证机构服务工作规范指南》，认证机构禁止将CCC 认证业务与（）挂钩，确保CCC 认证活动不受经济利益驱动，保障认证结果客观公正。","opts":["机构年度评审","绩效收入","内部质量考核","服务质量评价"],"ans":"B","src":{"label":"《强制性产品认证机构服务工作规范指南》第5页","text":"（十八）认证机构禁止将CCC 认证业务与绩效收入挂钩，确保CCC 认证活动不受经济利益驱动，保障认证结果客观公正。  四、建立长效服务机制  （十九）认证机构应当规范CCC 认证收费行为，认证费用及相关检测费用应当在认证机构、认证委托人、生产者、生产企业和承担检测任务的实验室之间直接结算，不得通过第三方中介代理机构代收或者转付。  （二十）认证机构应当建立合理的成本测算机制，依据核算情况确定、公开认证收费标准，并严格按照标准执行。 （二十一）认证机构应当加强中介代理机构管理，在认证实施过程中发现中介代理机构代写委托资料、体系文件或者记录，派员参与或者干预工厂检查活动等情形，应当立即终止当前的认证活动，直到中介代理机构不再参与本条款所提及的相关活动后方可恢复认证活动。"}},{"id":399,"type":0,"num":400,"stem":"依据《强制性产品认证机构服务工作规范指南》，认证机构在认证实施过程中发现中介代理机构代写委托资料、体系文件或者记录，派员参与或者干预工厂检查活动等情形，应当（）。","opts":["口头警告中介机构后继续认证","立即终止当前的认证活动","直接撤销委托人认证申请","向市场监管部门直接立案处罚"],"ans":"B","src":{"label":"《强制性产品认证机构服务工作规范指南》第5页","text":"（十八）认证机构禁止将CCC 认证业务与绩效收入挂钩，确保CCC 认证活动不受经济利益驱动，保障认证结果客观公正。  四、建立长效服务机制  （十九）认证机构应当规范CCC 认证收费行为，认证费用及相关检测费用应当在认证机构、认证委托人、生产者、生产企业和承担检测任务的实验室之间直接结算，不得通过第三方中介代理机构代收或者转付。  （二十）认证机构应当建立合理的成本测算机制，依据核算情况确定、公开认证收费标准，并严格按照标准执行。 （二十一）认证机构应当加强中介代理机构管理，在认证实施过程中发现中介代理机构代写委托资料、体系文件或者记录，派员参与或者干预工厂检查活动等情形，应当立即终止当前的认证活动，直到中介代理机构不再参与本条款所提及的相关活动后方可恢复认证活动。"}},{"id":400,"type":0,"num":401,"stem":"依据《强制性产品认证机构服务工作规范指南》，认证机构应当签署（），严格履行有关承诺，并承担违反承诺后产生的法律责任。","opts":["CCC 认证业务服务告知书","《强制性产品认证指定认证机构合规从业承诺书》","工厂检查廉洁从业承诺书","认证人员职业行为承诺书"],"ans":"B","src":{"label":"《强制性产品认证机构服务工作规范指南》第1页","text":"制定工作规范指南如下：  一、依法提供认证服务 （一）认证机构应当严格遵守《中华人民共和国认证认可条例》《强制性产品认证管理规定》《强制性产品认证机构和实验室管理办法》《认证机构管理办法》《认证及认证培训、咨询人员管理办法》《强制性产品认证检查员管理办法》等行政法规、部门规章和行政规范性文件的规定，合法合规提供必要的政策解读宣贯和程序指导服务，不得影响CCC 认证的公正性、有效性。  （二）认证机构应当严格执行国家认监委发布的CCC 认证实施规则、技术决议及相关文件，确保服务内容与实施规则规定的认证全过程要求保持一致，不得擅自增加、减少或者遗漏认证程序要求。  （三）认证机构应当签署《强制性产品认证指定认证机构合规从业承诺书》（详见附件），严格履行有关承诺，并承担违反承诺后产生的法律责任。"}},{"id":401,"type":0,"num":402,"stem":"任何单位和个人不得（）认证证书和认证标志。","opts":["使用、标注、印制和宣传","复制、引用、展示和说明","伪造、变造、冒用、买卖和转让","申请、变更、延续和注销"],"ans":"C","src":{"label":"《汇编》第47页","text":"标注认证标志。第三十三条任何单位和个人不得伪造、变造、冒用、买卖和转让认证证书和认证标志。第四章监督管理第三十四条市场监管总局对认证机构、实验室的认证、检测活动实施年度监督检查和不定期的专项监督检查。第三十五条认证机构应当将获证产品的认证委托人、获证产品及其生产企业，以及认证证书被注销、暂停或者撤销的信息向市场监管总局和省级市场监督管理部门进行通报。第三十六条市场监管总局统一计划，采取定期或者不定期的方式对获证产品进行监督检查。"}},{"id":402,"type":0,"num":403,"stem":"列入目录的产品未经认证，擅自出厂、销售、进口或者在其他经营活动中使用的，由县级以上地方市场监督管理部门依照（）第六十六条规定予以处罚。","opts":["《中华人民共和国认证认可条例》","《中华人民共和国标准化法》","《中华人民共和国进出口商品检验法》","《中华人民共和国产品质量法》"],"ans":"A","src":{"label":"《汇编》第54页","text":"第四十六条从事强制性产品认证活动的人员出具虚假或者不实结论，编造虚假或者不实文件、记录的，予以撤销执业资格；自撤销之日起5 年内，中国认证认可协会认证人员注册机构不再受理其注册申请。第四十七条认证委托人对认证机构的认证决定有异议的，可以向认证机构提出申诉。第四十八条任何单位和个人对强制性产品认证活动中的违法违规行为，有权向市场监督管理部门举报，市场监督管理部门应当及时调查处理，并为举报人保密。第五章罚则第四十九条列入目录的产品未经认证，擅自出厂、销售、进口或者在其他经营活动中使用的，由县级以上地方市场监督管理部门依照认证认可条例第六十六条规定予以处罚。"}},{"id":403,"type":0,"num":404,"stem":"有下列情形之一的，认证机构应当（）认证证书，并对外公布：获证产品存在缺陷，导致质量安全事故的。","opts":["吊销","撤销","暂停","注销"],"ans":"B","src":{"label":"《汇编》第44页","text":"44（四）认证委托人申请注销的；（五）其他依法应当注销的情形。第二十七条有下列情形之一的，认证机构应当按照认证规则规定的期限暂停认证证书，并对外公布：（一）产品适用的认证依据或者认证规则发生变更，规定期限内产品未符合变更要求的；（二）跟踪检查中发现认证委托人违反认证规则等规定的；（三）无正当理由拒绝接受跟踪检查或者跟踪检查发现产品不能持续符合认证要求的；（四）认证委托人申请暂停的；（五）其他依法应当暂停的情形。"}},{"id":404,"type":0,"num":405,"stem":"强制性产品认证应当适用的认证模式不包括下列哪项？","opts":["设计鉴定","获证后的跟踪检查","型式试验","自愿性认证"],"ans":"D","src":null},{"id":405,"type":0,"num":406,"stem":"市场监管总局统一规定强制性产品认证证书的（）和强制性产品认证标志的式样、种类。","opts":["式样、内","格式、内容","编号、内容","格式、种类"],"ans":"B","src":{"label":"《汇编》第40页","text":"情况等因素，对获证产品及其生产企业进行跟踪检查的分类管理，确定合理的跟踪检查频次。第三章认证证书和认证标志第二十条市场监管总局统一规定强制性产品认证证书（以下简称认证证书）的格式、内容和强制性产品认证标志（以下简称认证标志）的式样、种类。第二十一条认证证书应当包括以下基本内容：（一）认证委托人名称、地址；（二）产品生产者（制造商）名称、地址；（三）被委托生产企业名称、地址（需要时）；（四）产品名称和产品系列、规格、型号；（五）认证依据；（六）认证模式（需要时）；"}},{"id":406,"type":0,"num":407,"stem":"认证机构完成产品型式试验和工厂检查后，对符合认证要求的，一般情况下自受理认证委托起（）内向认证委托人出具认证证书。","opts":["90 天","45 天","60 天","30 天"],"ans":"A","src":{"label":"《汇编》第38页","text":"实验室及其有关人员应当对其作出的检测报告内容以及检测结论负责，对样品真实性有疑义的，应当向认证机构说明情况，并作出相应处理。第十五条需要进行工厂检查的，认证机构应当委派具有国家注册资格的强制性产品认证检查员，对产品生产企业的质量保证能力、生产产品与型式试验样品的一致性等情况，依照具体产品认证规则进行检查。认证机构及其强制性产品认证检查员应当对检查结论负责。第十六条认证机构完成产品型式试验和工厂检查后，对符合认证要求的，一般情况下自受理认证委托起90 天内向认证委托人出具认证证书。"}},{"id":407,"type":0,"num":408,"stem":"为保护国家安全、防止欺诈行为、保护人体健康或者安全、保护动植物生命或者健康、保护环境，国家规定的相关产品必须经过认证，并标注（）后，方可出厂、销售、进口或者在其他经营活动中使用。","opts":["认证证书","认证标准","认证编号","认证标志"],"ans":"D","src":{"label":"《汇编》第32页","text":"强制性产品认证管理规定第一章总则第一条为规范强制性产品认证工作，提高认证有效性，维护国家、社会和公共利益，根据《中华人民共和国认证认可条例》（以下简称认证认可条例）等法律、行政法规以及国家有关规定，制定本规定。第二条为保护国家安全、防止欺诈行为、保护人体健康或者安全、保护动植物生命或者健康、保护环境，国家规定的相关产品必须经过认证（以下简称强制性产品认证），并标注认证标志后，方可出厂、销售、进口或者在其他经营活动中使用。"}},{"id":408,"type":0,"num":409,"stem":"认证委托人对认证机构的认证决定有异议的，可以向（）提出申诉。","opts":["行业协会","认可机构","认证机构","市场监督管理部门"],"ans":"C","src":{"label":"《汇编》第54页","text":"第四十六条从事强制性产品认证活动的人员出具虚假或者不实结论，编造虚假或者不实文件、记录的，予以撤销执业资格；自撤销之日起5 年内，中国认证认可协会认证人员注册机构不再受理其注册申请。第四十七条认证委托人对认证机构的认证决定有异议的，可以向认证机构提出申诉。第四十八条任何单位和个人对强制性产品认证活动中的违法违规行为，有权向市场监督管理部门举报，市场监督管理部门应当及时调查处理，并为举报人保密。第五章罚则第四十九条列入目录的产品未经认证，擅自出厂、销售、进口或者在其他经营活动中使用的，由县级以上地方市场监督管理部门依照认证认可条例第六十六条规定予以处罚。"}},{"id":409,"type":0,"num":410,"stem":"对不符合认证要求的，认证机构应当（）通知认证委托人，并说明理由。","opts":["公告","口头","电话","书面"],"ans":"D","src":{"label":"《汇编》第38页","text":"实验室及其有关人员应当对其作出的检测报告内容以及检测结论负责，对样品真实性有疑义的，应当向认证机构说明情况，并作出相应处理。第十五条需要进行工厂检查的，认证机构应当委派具有国家注册资格的强制性产品认证检查员，对产品生产企业的质量保证能力、生产产品与型式试验样品的一致性等情况，依照具体产品认证规则进行检查。认证机构及其强制性产品认证检查员应当对检查结论负责。第十六条认证机构完成产品型式试验和工厂检查后，对符合认证要求的，一般情况下自受理认证委托起90 天内向认证委托人出具认证证书。"}},{"id":410,"type":0,"num":411,"stem":"有下列情形之一的，认证机构应当（）认证证书，并对外公布：认证证书有效期届满，认证委托人未申请延续使用的。","opts":["撤销","注销","暂停","收回"],"ans":"B","src":{"label":"《汇编》第43页","text":"43（五）其他应当变更的情形。第二十五条认证委托人需要扩展其获证产品覆盖范围的，应当向认证机构申请认证证书的扩展，认证机构应当核查扩展产品与原获证产品的一致性，确认原认证结果对扩展产品的有效性。经确认合格后，可以根据认证委托人的要求单独出具认证证书或者重新出具认证证书。认证机构可以按照认证规则的要求，针对差异性补充进行产品型式试验或者工厂检查。第二十六条有下列情形之一的，认证机构应当注销认证证书，并对外公布：（一）认证证书有效期届满，认证委托人未申请延续使用的；（二）获证产品不再生产的；（三）获证产品型号已列入国家明令淘汰或者禁止生产的产品目录的；"}},{"id":411,"type":0,"num":412,"stem":"有下列情形之一的，认证机构应当按照认证规则规定的期限（）认证证书，并对外公布：产品适用的认证依据或者认证规则发生变更，规定期限内产品未符合变更要求的。","opts":["吊销","撤销","暂停","注销"],"ans":"C","src":{"label":"《汇编》第44页","text":"44（四）认证委托人申请注销的；（五）其他依法应当注销的情形。第二十七条有下列情形之一的，认证机构应当按照认证规则规定的期限暂停认证证书，并对外公布：（一）产品适用的认证依据或者认证规则发生变更，规定期限内产品未符合变更要求的；（二）跟踪检查中发现认证委托人违反认证规则等规定的；（三）无正当理由拒绝接受跟踪检查或者跟踪检查发现产品不能持续符合认证要求的；（四）认证委托人申请暂停的；（五）其他依法应当暂停的情形。"}},{"id":412,"type":0,"num":413,"stem":"认证委托人需要扩展其获证产品覆盖范围的，应当向认证机构申请认证证书的（）。","opts":["变更","延续","更新","扩展"],"ans":"D","src":{"label":"《汇编》第43页","text":"43（五）其他应当变更的情形。第二十五条认证委托人需要扩展其获证产品覆盖范围的，应当向认证机构申请认证证书的扩展，认证机构应当核查扩展产品与原获证产品的一致性，确认原认证结果对扩展产品的有效性。经确认合格后，可以根据认证委托人的要求单独出具认证证书或者重新出具认证证书。认证机构可以按照认证规则的要求，针对差异性补充进行产品型式试验或者工厂检查。第二十六条有下列情形之一的，认证机构应当注销认证证书，并对外公布：（一）认证证书有效期届满，认证委托人未申请延续使用的；（二）获证产品不再生产的；（三）获证产品型号已列入国家明令淘汰或者禁止生产的产品目录的；"}},{"id":413,"type":0,"num":414,"stem":"国家对实施强制性产品认证的产品，统一产品目录，统一技术规范的强制性要求、标准和合格评定程序，统一认证标志，统一（）。","opts":["认证证书","认证机构","认证模式","收费标准"],"ans":"D","src":{"label":"《汇编》第33页","text":"督管理和综合协调。县级以上地方市场监督管理部门负责所辖区域内强制性产品认证活动的监督管理工作。第四条国家对实施强制性产品认证的产品，统一产品目录（以下简称目录），统一技术规范的强制性要求、标准和合格评定程序，统一认证标志，统一收费标准。市场监管总局会同国务院有关部门制定和调整目录，目录由市场监管总局发布,并会同有关方面共同实施。第五条国家鼓励开展平等互利的强制性产品认证国际互认活动，互认活动应当在市场监管总局或者其授权的有关部门对外签署的国际互认协议框架内进行。"}},{"id":414,"type":0,"num":415,"stem":"委托其他企业生产列入目录产品的，委托企业或者被委托企业（）向认证机构进行认证委托。","opts":["均可以","只有委托企业可以","只有被委托企业可以","均不可以"],"ans":"A","src":{"label":"《汇编》第36页","text":"36（十二）其他规定。第十条列入目录产品的生产者或者销售者、进口商（以下统称认证委托人）应当委托经市场监管总局指定的认证机构（以下简称认证机构）对其生产、销售或者进口的产品进行认证。委托其他企业生产列入目录产品的，委托企业或者被委托企业均可以向认证机构进行认证委托。第十一条认证委托人应当按照具体产品认证规则的规定，向认证机构提供相关技术材料。销售者、进口商作为认证委托人时，还应当向认证机构提供销售者与生产者或者进口商与生产者订立的相关合同副本。"}},{"id":415,"type":0,"num":416,"stem":"县级以上地方市场监督管理部门负责对所辖区域内强制性产品认证活动实施监督检查，对违法行为进行查处。列入目录内的产品未经认证，但尚未出厂、销售的，县级以上地方市场监督管理部门应当（）其产品生产企业及时进行强制性产品认证。","opts":["处罚","告诫","警告","责令"],"ans":"B","src":{"label":"《汇编》第48页","text":"市场监管总局建立获证产品及其生产者公布制度，向社会公布监督检查结果。第三十七条县级以上地方市场监督管理部门负责对所辖区域内强制性产品认证活动实施监督检查，对违法行为进行查处。列入目录内的产品未经认证，但尚未出厂、销售的，县级以上地方市场监督管理部门应当告诫其产品生产企业及时进行强制性产品认证。第三十八条县级以上地方市场监督管理部门进行强制性产品认证监督检查时，可以依法进入生产经营场所实施现场检查，查阅、复制有关合同、票据、帐薄以及其他资料，查封、扣押未经认证的产品或者不符合认证要求的产品。"}},{"id":416,"type":0,"num":417,"stem":"认证标志基本图案中\"CCC\"为\"中国强制性认证\"的英文名称\"（）\"的英文缩写。","opts":["China Certification Center","China Compulsory Certification","China Compulsory Certificate","China Consumer Certification"],"ans":"B","src":{"label":"《汇编》第46页","text":"基本图案中“CCC”为“中国强制性认证”的英文名称“ChinaCompulsoryCertification”的英文缩写。第三十一条在认证标志基本图案的右侧标注认证种类，由代表该产品认证种类的英文单词的缩写字母组成。市场监管总局根据强制性产品认证工作的需要，制定有关认证种类标注的具体要求。第三十二条认证委托人应当建立认证标志使用管理制度，对认证标志的使用情况如实记录和存档，按照认证规则规定在产品及其包装、广告、产品介绍等宣传材料中正确使用和"}},{"id":417,"type":0,"num":418,"stem":"从事强制性产品认证活动的机构及其人员，对其从业活动中所知悉的（）负有保密义务。","opts":["技术秘密和经营信息","商业秘密及生产技术、工艺等技术秘密和信息","商业秘密和个人隐私","国家秘密和商业秘密"],"ans":"B","src":{"label":"《汇编》第33页","text":"督管理和综合协调。县级以上地方市场监督管理部门负责所辖区域内强制性产品认证活动的监督管理工作。第四条国家对实施强制性产品认证的产品，统一产品目录（以下简称目录），统一技术规范的强制性要求、标准和合格评定程序，统一认证标志，统一收费标准。市场监管总局会同国务院有关部门制定和调整目录，目录由市场监管总局发布,并会同有关方面共同实施。第五条国家鼓励开展平等互利的强制性产品认证国际互认活动，互认活动应当在市场监管总局或者其授权的有关部门对外签署的国际互认协议框架内进行。"}},{"id":418,"type":0,"num":419,"stem":"伪造、变造、出租、出借、冒用、买卖或者转让认证证书的，由县级以上地方市场监督管理部门责令其改正，处（）罚款。","opts":["2 万元","3 万元以下","3 万元","5 万元"],"ans":"C","src":{"label":"《汇编》第56页","text":"制性产品认证证明》，并依照认证认可条例第六十六条规定予以处罚。第五十三条伪造、变造、出租、出借、冒用、买卖或者转让认证证书的，由县级以上地方市场监督管理部门责令其改正，处3 万元罚款。转让或者倒卖认证标志的，由县级以上地方市场监督管理部门责令其改正，处3 万元以下罚款。第五十四条有下列情形之一的，由县级以上地方市场监督管理部门责令其改正，处3 万元以下的罚款：（一）违反本规定第十三条第一款规定，认证委托人提供的样品与实际生产的产品不一致的；（二）违反本规定第二十四条规定，未按照规定向认证机构申请认证证书变更，擅自出"}},{"id":419,"type":0,"num":420,"stem":"为规范强制性产品认证工作，提高认证有效性，维护国家、社会和公共利益，根据（）等法律、行政法规以及国家有关规定，制定本规定。","opts":["《中华人民共和国产品质量法》","《中华人民共和国认证认可条例》","《中华人民共和国行政许可法》","《中华人民共和国标准化法》"],"ans":"B","src":{"label":"《汇编》第32页","text":"强制性产品认证管理规定第一章总则第一条为规范强制性产品认证工作，提高认证有效性，维护国家、社会和公共利益，根据《中华人民共和国认证认可条例》（以下简称认证认可条例）等法律、行政法规以及国家有关规定，制定本规定。第二条为保护国家安全、防止欺诈行为、保护人体健康或者安全、保护动植物生命或者健康、保护环境，国家规定的相关产品必须经过认证（以下简称强制性产品认证），并标注认证标志后，方可出厂、销售、进口或者在其他经营活动中使用。"}},{"id":420,"type":0,"num":421,"stem":"认证机构应当通过现场产品检测或者检查、市场产品抽样检测或者检查、质量保证能力检查等方式，对获证产品及其生产企业实施分类管理和有效的（）。","opts":["定期检查","年度检查","跟踪检查","复评审"],"ans":"C","src":{"label":"《汇编》第39页","text":"认证机构及其有关人员应当对其作出的认证结论负责。第十七条认证机构应当通过现场产品检测或者检查、市场产品抽样检测或者检查、质量保证能力检查等方式，对获证产品及其生产企业实施分类管理和有效的跟踪检查，控制并验证获证产品与型式试验样品的一致性、生产企业的质量保证能力持续符合认证要求。第十八条认证机构应当对跟踪检查全过程作出完整记录，归档留存，保证认证过程和结果具有可追溯性。对于不能持续符合认证要求的，认证机构应当根据相应情形作出予以暂停或者撤销认证证书的处理，并予公布。"}},{"id":421,"type":0,"num":422,"stem":"认证委托人应当保证其提供的样品与（）一致，认证机构应当对认证委托人提供样品的真实性进行审查。","opts":["已获证产品","申报产品","实际生产的产品","型式试验样品"],"ans":"C","src":{"label":"《汇编》第37页","text":"托企业订立的相关合同副本。第十二条认证机构受理认证委托后，应当按照具体产品认证规则的规定，安排产品型式试验和工厂检查。第十三条认证委托人应当保证其提供的样品与实际生产的产品一致，认证机构应当对认证委托人提供样品的真实性进行审查。认证机构应当按照认证规则的要求，根据产品特点和实际情况，采取认证委托人送样、现场抽样或者现场封样后由认证委托人送样等抽样方式，委托经市场监管总局指定的实验室（以下简称实验室）对样品进行产品型式试验。第十四条实验室对样品进行产品型式试验，应当确保检测结论的真实、准确，并对检测全过程作出完整记录，归档留存，保证检测过程和结果的记录具有可追溯性，配合认证机构对获证产品进行有效的跟踪检查。"}},{"id":422,"type":0,"num":423,"stem":"认证委托人应当建立（）管理制度，对认证标志的使用情况如实记录和存档。","opts":["产品质量管理","认证档案管理","认证标志使用","认证证书管理"],"ans":"C","src":{"label":"《汇编》第46页","text":"基本图案中“CCC”为“中国强制性认证”的英文名称“ChinaCompulsoryCertification”的英文缩写。第三十一条在认证标志基本图案的右侧标注认证种类，由代表该产品认证种类的英文单词的缩写字母组成。市场监管总局根据强制性产品认证工作的需要，制定有关认证种类标注的具体要求。第三十二条认证委托人应当建立认证标志使用管理制度，对认证标志的使用情况如实记录和存档，按照认证规则规定在产品及其包装、广告、产品介绍等宣传材料中正确使用和"}},{"id":423,"type":0,"num":424,"stem":"认证机构受理认证委托后，应当按照具体产品认证规则的规定，安排产品（）和工厂检查。","opts":["设计鉴定","抽样检测","型式试验","质量检查"],"ans":"C","src":{"label":"《汇编》第37页","text":"托企业订立的相关合同副本。第十二条认证机构受理认证委托后，应当按照具体产品认证规则的规定，安排产品型式试验和工厂检查。第十三条认证委托人应当保证其提供的样品与实际生产的产品一致，认证机构应当对认证委托人提供样品的真实性进行审查。认证机构应当按照认证规则的要求，根据产品特点和实际情况，采取认证委托人送样、现场抽样或者现场封样后由认证委托人送样等抽样方式，委托经市场监管总局指定的实验室（以下简称实验室）对样品进行产品型式试验。第十四条实验室对样品进行产品型式试验，应当确保检测结论的真实、准确，并对检测全过程作出完整记录，归档留存，保证检测过程和结果的记录具有可追溯性，配合认证机构对获证产品进行有效的跟踪检查。"}},{"id":424,"type":0,"num":425,"stem":"市场监管总局对认证机构、实验室的认证、检测活动实施（）监督检查和不定期的专项监督检查。","opts":["年度","季度","半年度","月度"],"ans":"A","src":{"label":"《汇编》第47页","text":"标注认证标志。第三十三条任何单位和个人不得伪造、变造、冒用、买卖和转让认证证书和认证标志。第四章监督管理第三十四条市场监管总局对认证机构、实验室的认证、检测活动实施年度监督检查和不定期的专项监督检查。第三十五条认证机构应当将获证产品的认证委托人、获证产品及其生产企业，以及认证证书被注销、暂停或者撤销的信息向市场监管总局和省级市场监督管理部门进行通报。第三十六条市场监管总局统一计划，采取定期或者不定期的方式对获证产品进行监督检查。"}},{"id":425,"type":0,"num":426,"stem":"需要进行工厂检查的，认证机构应当委派具有（）的强制性产品认证检查员，对产品生产企业的质量保证能力、生产产品与型式试验样品的一致性等情况，依照具体产品认证规则进行检查。","opts":["高级工程师职称","五年以上从业经历","国家注册资格","认可机构认可"],"ans":"C","src":{"label":"《汇编》第38页","text":"实验室及其有关人员应当对其作出的检测报告内容以及检测结论负责，对样品真实性有疑义的，应当向认证机构说明情况，并作出相应处理。第十五条需要进行工厂检查的，认证机构应当委派具有国家注册资格的强制性产品认证检查员，对产品生产企业的质量保证能力、生产产品与型式试验样品的一致性等情况，依照具体产品认证规则进行检查。认证机构及其强制性产品认证检查员应当对检查结论负责。第十六条认证机构完成产品型式试验和工厂检查后，对符合认证要求的，一般情况下自受理认证委托起90 天内向认证委托人出具认证证书。"}},{"id":426,"type":0,"num":427,"stem":"转让或者倒卖认证标志的，由县级以上地方市场监督管理部门责令其改正，处（）罚款。","opts":["2 万元以下","3 万元以下","5 万元以下","3 万元"],"ans":"B","src":{"label":"《汇编》第56页","text":"制性产品认证证明》，并依照认证认可条例第六十六条规定予以处罚。第五十三条伪造、变造、出租、出借、冒用、买卖或者转让认证证书的，由县级以上地方市场监督管理部门责令其改正，处3 万元罚款。转让或者倒卖认证标志的，由县级以上地方市场监督管理部门责令其改正，处3 万元以下罚款。第五十四条有下列情形之一的，由县级以上地方市场监督管理部门责令其改正，处3 万元以下的罚款：（一）违反本规定第十三条第一款规定，认证委托人提供的样品与实际生产的产品不一致的；（二）违反本规定第二十四条规定，未按照规定向认证机构申请认证证书变更，擅自出"}},{"id":427,"type":0,"num":428,"stem":"有下列情形之一的，列入目录产品的生产者、进口商、销售商或者其代理人可以向（）提出免予办理强制性产品认证申请。","opts":["海关","市场监管总局","所在地市场监督管理部门","认证机构"],"ans":"C","src":{"label":"《汇编》第50页","text":"织驻华机构及其外交人员的自用物品；（二）香港、澳门特别行政区政府驻大陆官方机构及其工作人员的自用物品；（三）入境人员随身从境外带入境内的自用物品；（四）外国政府援助、赠送的物品；（五）其他依法无需办理强制性产品认证的情形。第四十二条有下列情形之一的，列入目录产品的生产者、进口商、销售商或者其代理人可以向所在地市场监督管理部门提出免予办理强制性产品认证申请，提交相关证明材料、责任担保书、产品符合性声明（包括型式试验报告）等资料，并根据需要进行产品检测，经批准取得《免予办理强制性产品认证证明》后，方可进口，并按照申报用途使用：（一）为科研、测试所需的产品；"}},{"id":428,"type":0,"num":429,"stem":"（）主管全国强制性产品认证工作，负责全国强制性产品认证工作的组织实施、监督管理和综合协调。","opts":["国务院认证认可监督管理部门","国家标准化管理委员会","国家市场监督管理总局","中国认证认可协会"],"ans":"A","src":{"label":"《汇编》第32页","text":"强制性产品认证管理规定第一章总则第一条为规范强制性产品认证工作，提高认证有效性，维护国家、社会和公共利益，根据《中华人民共和国认证认可条例》（以下简称认证认可条例）等法律、行政法规以及国家有关规定，制定本规定。第二条为保护国家安全、防止欺诈行为、保护人体健康或者安全、保护动植物生命或者健康、保护环境，国家规定的相关产品必须经过认证（以下简称强制性产品认证），并标注认证标志后，方可出厂、销售、进口或者在其他经营活动中使用。"}},{"id":429,"type":0,"num":430,"stem":"市场监管总局统一计划，采取定期或者不定期的方式对获证产品进行监督检查。获证产品生产者、销售者、进口商和经营活动使用者（）拒绝监督检查。","opts":["可以","不得","经批准可以","应当"],"ans":"B","src":{"label":"《汇编》第47页","text":"标注认证标志。第三十三条任何单位和个人不得伪造、变造、冒用、买卖和转让认证证书和认证标志。第四章监督管理第三十四条市场监管总局对认证机构、实验室的认证、检测活动实施年度监督检查和不定期的专项监督检查。第三十五条认证机构应当将获证产品的认证委托人、获证产品及其生产企业，以及认证证书被注销、暂停或者撤销的信息向市场监管总局和省级市场监督管理部门进行通报。第三十六条市场监管总局统一计划，采取定期或者不定期的方式对获证产品进行监督检查。"}},{"id":430,"type":0,"num":431,"stem":"市场监管总局会同（）制定和调整目录，目录由市场监管总局发布，并会同有关方面共同实施。","opts":["国务院有关部门","省级市场监督管理部门","认可机构","行业协会"],"ans":"A","src":{"label":"《汇编》第33页","text":"督管理和综合协调。县级以上地方市场监督管理部门负责所辖区域内强制性产品认证活动的监督管理工作。第四条国家对实施强制性产品认证的产品，统一产品目录（以下简称目录），统一技术规范的强制性要求、标准和合格评定程序，统一认证标志，统一收费标准。市场监管总局会同国务院有关部门制定和调整目录，目录由市场监管总局发布,并会同有关方面共同实施。第五条国家鼓励开展平等互利的强制性产品认证国际互认活动，互认活动应当在市场监管总局或者其授权的有关部门对外签署的国际互认协议框架内进行。"}},{"id":431,"type":0,"num":432,"stem":"自认证证书注销、撤销之日起或者认证证书暂停期间，不符合认证要求的产品，（）出厂、销售、进口或者在其他经营活动中使用。","opts":["经批准可以","限期停止","可以继续","不得继续"],"ans":"D","src":{"label":"《汇编》第45页","text":"45（二）跟踪检查中发现获证产品与认证委托人提供的样品不一致的；（三）认证证书暂停期间，认证委托人未采取整改措施或者整改后仍不合格的；（四）认证委托人以欺骗、贿赂等不正当手段获得认证证书的；（五）其他依法应当撤销的情形。第二十九条获证产品被注销、暂停或者撤销认证证书的，认证机构应当确定不符合认证要求的产品类别和范围。自认证证书注销、撤销之日起或者认证证书暂停期间，不符合认证要求的产品，不得继续出厂、销售、进口或者在其他经营活动中使用。"}},{"id":432,"type":0,"num":433,"stem":"列入目录产品的生产者或者销售者、进口商（以下统称（））应当委托经市场监管总局指定的认证机构对其生产、销售或者进口的产品进行认证。","opts":["认证对象","认证申请人","获证企业","认证委托人"],"ans":"D","src":{"label":"《汇编》第36页","text":"36（十二）其他规定。第十条列入目录产品的生产者或者销售者、进口商（以下统称认证委托人）应当委托经市场监管总局指定的认证机构（以下简称认证机构）对其生产、销售或者进口的产品进行认证。委托其他企业生产列入目录产品的，委托企业或者被委托企业均可以向认证机构进行认证委托。第十一条认证委托人应当按照具体产品认证规则的规定，向认证机构提供相关技术材料。销售者、进口商作为认证委托人时，还应当向认证机构提供销售者与生产者或者进口商与生产者订立的相关合同副本。"}},{"id":433,"type":0,"num":434,"stem":"获证产品的关键元器件、规格和型号，以及涉及整机安全或者电磁兼容的设计、结构、工艺和材料或者原材料生产企业等发生变更的，经（）合格后，变更认证证书。","opts":["认证机构重新检测","认证机构确认","认证机构工厂检查","认证机构核实"],"ans":"A","src":{"label":"《汇编》第42页","text":"证机构根据不同情况作出相应处理：（一）获证产品命名方式改变导致产品名称、型号变化或者获证产品的生产者、生产企业名称、地址名称发生变更的，经认证机构核实后，变更认证证书；（二）获证产品型号变更，但不涉及安全性能和电磁兼容内部结构变化；或者获证产品减少同种产品型号的，经认证机构确认后，变更认证证书；（三）获证产品的关键元器件、规格和型号，以及涉及整机安全或者电磁兼容的设计、结构、工艺和材料或者原材料生产企业等发生变更的，经认证机构重新检测合格后，变更认证证书；（四）获证产品生产企业地点或者其质量保证体系、生产条件等发生变更的，经认证机构重新工厂检查合格后，变更认证证书；"}},{"id":434,"type":0,"num":435,"stem":"强制性产品认证基本规范、认证规则由（）制定、发布。","opts":["国务院认证认可监督管理部门","国家标准化管理委员会","市场监管总局","认证机构"],"ans":"C","src":{"label":"《汇编》第34页","text":"义务。第二章认证实施第七条强制性产品认证基本规范、认证规则由市场监管总局制定、发布。第八条强制性产品认证应当适用以下单一认证模式或者多项认证模式的组合，具体模式包括：（一）设计鉴定；（二）型式试验；（三）生产现场抽取样品检测或者检查；（四）市场抽样检测或者检查；（五）企业质量保证能力和产品一致性检查；（六）获证后的跟踪检查。"}},{"id":435,"type":0,"num":436,"stem":"强制性产品认证模式中，（）是指对产品按规定的检测要求进行检验，以证明其符合规定要求的认证活动。","opts":["获证后的跟踪检查","型式试验","设计鉴定","市场抽样检测"],"ans":"B","src":null},{"id":436,"type":0,"num":437,"stem":"依据《强制性产品认证工厂检查员行为规范》附件“十条严禁” 事项，严禁未实施检查出具检查结论，或者编造、篡改、隐匿检查记录，出具（）的检查结论。","opts":["客观公正","虚假或者与实际情况不符","问题导向","风险优先"],"ans":"B","src":null},{"id":437,"type":0,"num":438,"stem":"依据《强制性产品认证工厂检查员行为规范》，工厂检查结束时，检查员应当向受检查方反馈检查情况，客观说明检查发现的问题，并明确告知受检查方工厂检查结论由（）在认证决定环节确定。","opts":["现场检查组组长","认证机构","受检查企业技术负责人","中国认证认可协会"],"ans":"B","src":null},{"id":438,"type":0,"num":439,"stem":"依据《强制性产品认证工厂检查员行为规范》，检查员与受检查方存在利益关系时，应当主动向所属认证机构（），不得隐瞒或者参与相关检查活动。","opts":["申请延期检查","申请回避","申请更换受检方","申请简化检查流程"],"ans":"B","src":null},{"id":439,"type":0,"num":440,"stem":"依据《强制性产品认证工厂检查员行为规范》，实习检查员的检查工作（）计入检查人日数。","opts":["可以","不得","经企业同意后可以","经协会备案后可以"],"ans":"B","src":null},{"id":440,"type":0,"num":441,"stem":"依据《国务院关于加强质量认证体系建设促进全面质量管理的意见》，发挥强制性认证（）作用。","opts":["“拉高线”","“保底线”","评优","市场奖励"],"ans":"B","src":{"label":"《汇编》第129页","text":"国务院关于加强质量认证体系建设促进全面质量管理的意见国发〔2018〕3 号各省、自治区、直辖市人民政府，国务院各部委、各直属机构：质量认证是市场经济条件下加强质量管理、提高市场效率的基础性制度。近年来，我国质量认证制度不断完善，行业机构蓬勃发展，国际交流合作不断深化。同时，还存在认证服务供给不足、认证评价活动亟需规范、社会认知与应用程度不高等问题。为深入推进供给侧结构性改革和“放管服”改革，全面实施质量强国战略，贯彻落实《中共中央国务院关于开展质量提升行动的指导意见》，现就加强质量认证体系建设、促进全面质量管理提出以下意见。"}},{"id":441,"type":0,"num":442,"stem":"依据《国务院关于加强质量认证体 c":{"label":"《汇编》第80页","text":"属于认证新领域，国务院认证认可监督管理部门尚未制定认证规则的，认证机构可以自行制定认证规则，并在认证规则发布后30 日内，将认证规则相关信息报国务院认证认可监督管理部门备案。第十一条认证机构有下列情形之一的，应当自变更之日起30 日内，向国务院认证认可监督管理部门申请办理《认证机构批准书》变更手续：（一）缩小批准认证领域的；（二）变更法人性质、股东、注册资本的；（三）合并或者分立的；（四）变更名称、住所、法定代表人的。"}},{"id":506,"type":1,"num":8,"stem":"认证机构资质审批程序中，下列哪些说法符合本办法规定？","opts":["申请人应当向国务院认证认可监督管理部门提出申请，提交符合规定条件的相关证明文件，并对其真实性、有效性、合法性负责","国务院认证认可监督管理部门应当对申请人提交的证明文件进行初审，并自收到之日起5 日内作出受理或者不予受理的书面决定","对申请材料不齐全或者不符合法定形式的，应当一次性告知申请人需要补正的全部内容","决定批准的，向申请人出具《认证机构批准书》；决定不予批准的，应当书面通知申请人，并说明理由"],"ans":"ABCD","src":{"label":"《汇编》第79页","text":"对申请人提交的证明文件进行初审，并自收到之日起5 日内作出受理或者不予受理的书面决定。对申请材料不齐全或者不符合法定形式的，应当一次性告知申请人需要补正的全部内容。（三）国务院认证认可监督管理部门应当自受理认证机构资质申请之日起45 日内，作出是否批准的决定。决定批准的，向申请人出具《认证机构批准书》。决定不予批准的，应当书面通知申请人，并说明理由。需要对申请人的认证、检测、检查等技术能力进行专家评审的，专家评审时间不得超过30 日。评审时间不计算在审批期限内。第十条国务院认证认可监督管理部门制定、调整和公布认证领域目录，认证机构应当在批准的认证领域内，按照认证基本规范、认证规则从事认证活动。"}},{"id":507,"type":1,"num":9,"stem":"依据CNCA-00C-002:2009《强制性产品认证实施规则中涉及ODM 模式的补充规定》，关于认证证书的暂停、恢复、撤销、注销，下列说法正确的有（）。","opts":["对不满足本规定要求的ODM 生产厂及制造商，指定认证机构应根据相关规定采取通知其整改、暂停或撤销认证证书的措施","当ODM 生产厂或任一ODM 制造商由于ODM 产品或工厂检查不合格认证证书被暂停或撤销时，指定认证机构应同时暂停或撤销所有相关的ODM 认证证书，并通知认证证书持证人","当某一ODM 制造商因连续12 个月未批量委托ODM 生产厂生产认证产品而造成不能满足证后年度监督检查要求时，指定认证机构应暂停标有该ODM 制造商的产品认证证书，并通知认证证书持证人","当ODM 初始认证证书由于其它原因（非产品检测或工厂检查不合格）而被暂停/注销/撤销时，指定认证机构应同时暂停/注销/撤销所有相关的ODM 认证证书，并通知认证证书持证人"],"ans":"ABCD","src":{"label":"《汇编》第165页","text":"效控制的能力。7.7 ODM 制造商应保留ODM 生产厂认证产品接收记录。8.认证证书的暂停、恢复、撤销、注销8.1 对不满足本规定要求的ODM 生产厂及制造商，指定认证机构应根据相关规定采取通知其整改、暂停或撤销认证证书的措施。8.2 当ODM 生产厂或任一ODM 制造商由于ODM 产品或工厂检查不合格认证证书被暂停或撤销时，指定认证机构应同时暂停或撤销所有相关的ODM 认证证书，并通知认证证书持证人。8.3 当某一ODM 制造商因连续12 个月未批量委托ODM 生产厂生产认证产品而造成不能满足证后年度监督检查要求时，指定认证机构应暂停标有该ODM 制造商的产品认证证书，并通知认证证书持证人。"}},{"id":508,"type":1,"num":10,"stem":"依据CNCA-00C-002:2009《强制性产品认证实施规则中涉及ODM 模式的补充规定》，关于以ODM 模式获得的产品认证证书及相关事项，下列说法正确的有（）。","opts":["证书的有效期为ODM 协议规定的有效期","证书有效期不能超过5 年","ODM 认证实施活动原则上应在同一认证机构进行","本规定由国家认监委负责解释（二）其他多选题（290 题）"],"ans":"ABCD","src":{"label":"《汇编》第167页","text":"进行现场检查及监督检查。核查人日数不应超过0.5 人日。9.2 指定认证机构在对ODM 生产厂监 标志或放行：(a)未获认证的强制性产品认证目录内产品；(b)获证后的变更需经认证机构确认，但未"}},{"id":539,"type":1,"num":41,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，工厂质量保证能力要求规定：工厂是产品质量的责任主体，其质量保证能力应持续符合认证要求，生产的产品应符合标准要求，并保证认证产品与型式试验样品一致。工厂应接受并配合认证机构依据本实施规则及相关产品认证实施规则/细则所实施的（）。","opts":["各类工厂现场检查","市场检查","抽样检测","产品设计评审"],"ans":"ABC","src":{"label":"《汇编》第217页","text":"标准要求，并保证认证产品与型式试验样品一致。工厂应接受并配合认证机构依据本实施规则及相关产品认证实施规则/细则所实施的各类工厂现场检查、市场检查、抽样检测。3.1 职责和资源3.1.1 职责工厂应规定与认证要求有关的各类人员职责、权限及相互关系，并在本组织管理层中指定质量负责人，无论该成员在其它方面的职责如何，应使其具有以下方面的职责和权限：(a)确保本文件的要求在工厂得到有效地建立、实施和保持；(b)确保产品一致性以及产品与标准的符合性；(c)正确使用CCC 证书和标志，确保加施CCC 标志产品的证书状态持续有效。"}},{"id":540,"type":1,"num":42,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，关于认证技术负责人，下列说法正确的有（）。","opts":["属于生产者和/或生产企业内部人员","掌握认证依据标准要求","依据产品认证实施规则/细则规定的职责范围，对认证产品变更进行确认批准并承担相应责任","可以由认证机构人员担任"],"ans":"ABC","src":{"label":"《汇编》第215页","text":"据之一。2.术语和定义2.1 认证技术负责人属于生产者和/或生产企业内部人员，掌握认证依据标准要求，依据产品认证实施规则/细则规定的职责范围，对认证产品变更进行确认批准并承担相应责任的人。2.2 认证产品一致性（产品一致性）生产的认证产品与型式试验样品保持一致，产品一致性的具体要求由产品认证实施规则/细则规定。2.3 例行检验为剔除生产过程中偶然性因素造成的不合格品，通常在生产的最终阶段，对认证产品进行的100%检验。"}},{"id":541,"type":1,"num":43,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，关于生产过程控制中的关键监视测量装置和检验试验仪器设备，下列说法正确的有（）。","opts":["对于生产过程控制中的关键监视测量装置，工厂应根据产品认证实施规则/细则的要求进行管理","用于确定所生产的认证产品符合规定要求的检验试验仪器设备应按规定的周期进行校准或检定","校准或检定周期可按仪器设备的使用频率、前次校准情况等设定","校准或检定应溯源至国家或国际基准"],"ans":"ABCD","src":{"label":"《汇编》第224页","text":"或检定，校准或检定周期可按仪器设备的使用频率、前次校准情况等设定；对内部校准的，工厂应规定校准方法、验收准则和校准周期等；校准或检定应溯源至国家或国际基准。仪器设备的校准或检定状态应能被使用及管理人员方便识别。工厂应保存仪器设备的校准或检定记录。对于委托外部机构进行的校准或检定活动，工厂应确保外部机构的能力满足校准或检定要求，并保存相关能力评价结果。注：对于生产过程控制中的关键监视测量装置，工厂应根据产品认证实施规则/细则的要求进行管理。3.6.3 功能检查必要时，工厂应按规定要求对例行检验设备实施功能检查。"}},{"id":542,"type":1,"num":44,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，关于检验试验仪器设备的基本要求，下列说法正确的有（）。","opts":["工厂应配备足够的检验试验仪器设备","确保在采购、生产制造、最终检验试验等环节中使用的仪器设备能力满足认证产品批量生产时的检验试验要求","检验试验人员应能正确使用仪器设备，掌握检验试验要求并有效实施","检验试验人员无需掌握检验试验要求"],"ans":"ABC","src":{"label":"《汇编》第223页","text":"程序应符合规定要求，程序的内容应包括检验频次、项目、内容、方法、判定等。工厂应实施并保存相关检验记录。对于委托外部机构进行的检验，工厂应确保外部机构的能力满足检验要求，并保存相关能力的评价结果，如实验室认可证明等。3.6 检验试验仪器设备3.6.1 基本要求工厂应配备足够的检验试验仪器设备，确保在采购、生产制造、最终检验试验等环节中使用的仪器设备能力满足认证产品批量生产时的检验试验要求。检验试验人员应能正确使用仪器设备，掌握检验试验要求并有效实施。"}},{"id":543,"type":1,"num":45,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，工厂应从（）等适用的质量环节，对产品一致性进行控制，以确保产品持续符合认证依据标准要求。","opts":["产品设计（设计变更）、工艺和资源","采购、生产制造","检验","产品防护与交付"],"ans":"ABCD","src":{"label":"《汇编》第227页","text":"付等适用的质量环节，对产品一致性进行控制，以确保产品持续符合认证依据标准要求。3.10 产品防护与交付工厂在采购、生产制造、检验等环节所进行的产品防护，如标识、搬运、包装、贮存、保护等应符合规定要求。必要时，工厂应按规定要求对产品的交付过程进行控制。3.11CCC 证书和标志工厂对CCC 证书和标志的管理及使用应符合《强制性产品认证管理规定》、《强制性产品认证标志管理办法》等规定。对于统一印制的标准规格CCC 标志或采用印刷、模压等方式加施的CCC 标志，工厂应保存使用记录。对于下列产品，不得加施CCC 标志或放行：(a)未获认证的强制性产品认证目录内产品；(b)获证后的变更需经认证机构确认，但未"}},{"id":544,"type":1,"num":46,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，关于生产过程控制，下列说法正确的有（）。","opts":["工厂应对影响认证产品质量的关键工序进行识别","关键工序操作人员应具备相应的能力","如果关键工序没有文件规定就不能保证认证产品质量时，则应制定相应的作业指导书","产品生产过程如对环境条件有要求，工厂应保证工作环境满足规定要求"],"ans":"ABCD","src":{"label":"《汇编》第222页","text":"相应的能力；关键工序的控制应确保认证产品与标准的符合性、产品一致性；如果关键工序没有文件规定就不能保证认证产品质量时，则应制定相应的作业指导书，使生产过程受控。3.4.2 产品生产过程如对环境条件有要求,工厂应保证工作环境满足规定要求。3.4.3 必要时，工厂应对适宜的过程参数进行监视、测量。3.4.4 工厂应建立并保持对生产设备的维护保养制度，以确保设备的能力持续满足生产要求。3.4.5 必要时，工厂应按规定要求在生产的适当阶段对产品及其特性进行检查、监视、测量，以确保产品与标准的符合性及产品一致性。"}},{"id":545,"type":1,"num":47,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，工厂应保存关键件采购、使用等记录，如（）等。","opts":["进货单","出入库单","台帐","员工考勤记录"],"ans":"ABC","src":{"label":"《汇编》第213页","text":"编号：CNCA-00C-005强制性产品认证实施规则工厂质量保证能力要求2014-01-02 发布2014-09-01 实施中国国家认证认可监督管理委员会发布"}},{"id":546,"type":1,"num":48,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，关于检验试验仪器设备的校准、检定，下列说法正确的有（）。","opts":["用于确定所生产的认证产品符合规定要求的检验试验仪器设备应按规定的周期进行校准或检定","校准或检定周期可按仪器设备的使用频率、前次校准情况等设定","校准或检定应溯源至国家或国际基准","仪器设备的校准或检定状态应能被使用及管理人员方便识别"],"ans":"ABCD","src":{"label":"《汇编》第224页","text":"或检定，校准或检定周期可按仪器设备的使用频率、前次校准情况等设定；对内部校准的，工厂应规定校准方法、验收准则和校准周期等；校准或检定应溯源至国家或国际基准。仪器设备的校准或检定状态应能被使用及管理人员方便识别。工厂应保存仪器设备的校准或检定记录。对于委托外部机构进行的校准或检定活动，工厂应确保外部机构的能力满足校准或检定要求，并保存相关能力评价结果。注：对于生产过程控制中的关键监视测量装置，工厂应根据产品认证实施规则/细则的要求进行管理。
