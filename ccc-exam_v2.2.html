el":"《汇编》第247页","text":"2474.2CCC 产品质量监督信息CCC 产品质量监督信息由指定认证机构向地方质检两局报送，报送内容主要包括CCC 认证工厂检查计划以及证书暂停、撤销、注销等信息，报送内容详见附件3。工厂检查计划数据通过CCC 证书执法查询系统报送，每周上报一次。证书暂停、撤销、注销等信息由指定认证机构直接报送地方质检两局，每月上报一次。4.3CCC 认证产品质量风险信息CCC 认证产品质量风险信息由地方质检两局报送，报送内容主要包括获证产品省级监督抽查结果及产品抽查不合格信息、获证产品质量安全事故等信息和CCC 免办数据。"}},{"id":808,"type":2,"num":10,"stem":"CCC 质量分析数据由指定认证机构、实验室、认证认可协会每年11 月5 日前通过认监委\"强制性产品认证质量分析信息化系统\"报送。","opts":null,"ans":"正确","src":{"label":"《汇编》第246页","text":"246（国认信技函〔2009〕3 号）要求上报认监委CCC 证书数据库。4.1.2CCC 质量分析数据CCC 质量分析数据由指定认证机构、实验室、认证认可协会每年11 月5 日前通过认监委“强制性产品认证质量分析信息化系统”（cccq.cnca.cn）报送，数据统计周期为上一年度11 月1 日至当年10 月31 日，报送内容详见附件1。具体要求见《关于加强强制性产品认证基础数据和质量数据统计上报工作的通知》（国认证〔2012〕42 号）。4.1.3 指定实验室检测质量评价数据指定实验室检测质量评价数据由指定认证机构向认监委认证监管部每季度报送一次，报送时间为季度后第一个月的15 日之前，数据统计周期为上一季度的数据/信息，报送内容详见附件2。"}},{"id":809,"type":2,"num":11,"stem":"依据CNCA-00C-006:2014《强制性产品认证实施规则工厂检查通用要求》，指定试验由检查组在生产企业现场抽取认证产品并根据认证依据标准选定项目，由生产企业人员所进行的试验。","opts":null,"ans":"正确","src":{"label":"《汇编》第232页","text":"为评价认证产品的一致性、产品与标准的符合性，检查组在生产企业现场抽取认证产品并根据认证依据标准选定项目，由生产企业人员所进行的试验。3.工厂检查活动的准则(a)客观、公正、公开、保密；(b)以产品一致性、产品与标准的符合性为关注焦点；(c)获取认证产品及工厂的真实状况；(d)选取具有代表性的检查样本；(e)得出基于风险评估的工厂检查结论判定。4.工厂检查要求认证机构应依据工厂质量保证能力要求并结合产品及行业特点，明确并公布工厂检查要求。"}},{"id":810,"type":2,"num":12,"stem":"依据CNCA-00C-006:2014《强制性产品认证实施规则工厂检查通用要求》，工厂检查活动的准则包括客观、公正、公开、保密。","opts":null,"ans":"正确","src":{"label":"《汇编》第229页","text":"编号：CNCA-00C-006强制性产品认证实施规则工厂检查通用要求2014-01-02 发布2014-09-01 实施中国国家认证认可监督管理委员会发布"}},{"id":811,"type":2,"num":13,"stem":"依据CNCA-00C-006:2014《强制性产品认证实施规则工厂检查通用要求》，对于预先通知的工厂检查，认证机构应在现场检查前与生产企业约定工厂检查时间、确认工厂检查范围和计划安排。","opts":null,"ans":"正确","src":{"label":"《汇编》第234页","text":"活动和过程，应特别关注。在认证批准后，认证机构应确保工厂检查场所界限的完整性、准确性，为选取具有代表性的检查样本提供必要条件。6.确定工厂检查的方式、内容和检查组认证机构应根据工厂检查的具体目的确定其实施方式和内容，如预先通知或不通知的工厂检查、从工厂/市场/使用场所获取样品、抽样或买样，以及工厂检查的条款、各条款的检查重点、产品一致性检查、指定试验、监督抽样等。认证机构应根据工厂检查的具体目的、方式和内容，确定具备相应能力的检查组成员，并为其提供完整、准确、实时更新的工厂检查所需资料和信息。"}},{"id":812,"type":2,"num":14,"stem":"依据CNCA-00C-006:2014《强制性产品认证实施规则工厂检查通用要求》，当认证产品的制造涉及多个场所时，工厂检查的场所界限应至少包括例行检验、加施产品铭牌和CCC 标志环节所在场所。","opts":null,"ans":"正确","src":{"label":"《汇编》第231页","text":"2312.术语和定义《强制性产品认证实施规则工厂质量保证能力要求》（简称工厂质量保证能力要求）中确立的以及下列术语和定义适用于本实施规则。2.1 工厂检查对工厂质量保证能力、产品一致性和产品与标准的符合性所进行的评价活动。工厂检查范围包括产品范围和场所界限。注：产品范围指认证产品。场所界限指与产品认证质量相关的场所、部门、活动和过程；当认证产品的制造涉及多个场所时，工厂检查的场所界限应至少包括例行检验、加施产品铭牌和CCC 标志环节所在场所，必要时还应到其余场所（如关键工序）进一步检查，即延伸检查。"}},{"id":813,"type":2,"num":15,"stem":"依据CNCA-00C-006:2014《强制性产品认证实施规则工厂检查通用要求》，指定试验结果不合格（原则上）不属于工厂检查不通过的情形。","opts":null,"ans":"错误","src":{"label":"《汇编》第229页","text":"编号：CNCA-00C-006强制性产品认证实施规则工厂检查通用要求2014-01-02 发布2014-09-01 实施中国国家认证认可监督管理委员会发布"}},{"id":814,"type":2,"num":16,"stem":"依据CNCA-00C-006:2014《强制性产品认证实施规则工厂检查通用要求》，严重不符合项指认证产品在生产制造或检验过程中产生严重的质量问题，以及产品结构、关键件等与认证批准结果不一致且较为严重的不符合项。","opts":null,"ans":"正确","src":{"label":"《汇编》第238页","text":"厂检查不通过”四种。其中，“书面验证通过”指存在不符合项，工厂在规定的期限内采取纠正措施，报认证机构书面验证有效后，工厂检查通过；“现场验证通过”指存在不符合项，工厂在规定的期限内采取纠正措施，认证机构现场验证有效后，工厂检查通过。工厂检查不符合项分为一般不符合项和严重不符合项两类。其中，一般不符合项指可能对产品认证质量产生轻微影响的不符合项；严重不符合项指认证产品在生产制造或检验过程中产生严重的质量问题，以及产品结构、关键件等与认证批准结果不一致且较为严重的不符合项。"}},{"id":815,"type":2,"num":17,"stem":"依据CNCA-00C-006:2014《强制性产品认证实施规则工厂检查通用要求》，工厂检查是指对工厂质量保证能力、产品一致性和产品与标准的符合性所进行的评价活动。","opts":null,"ans":"正确","src":{"label":"《汇编》第231页","text":"2312.术语和定义《强制性产品认证实施规则工厂质量保证能力要求》（简称工厂质量保证能力要求）中确立的以及下列术语和定义适用于本实施规则。2.1 工厂检查对工厂质量保证能力、产品一致性和产品与标准的符合性所进行的评价活动。工厂检查范围包括产品范围和场所界限。注：产品范围指认证产品。场所界限指与产品认证质量相关的场所、部门、活动和过程；当认证产品的制造涉及多个场所时，工厂检查的场所界限应至少包括例行检验、加施产品铭牌和CCC 标志环节所在场所，必要时还应到其余场所（如关键工序）进一步检查，即延伸检查。"}},{"id":816,"type":2,"num":18,"stem":"依据CNCA-00C-006:2014《强制性产品认证实施规则工厂检查通用要求》，工厂检查结论通常分为“工厂检查通过”、“现场验证通过”、“工厂检查不通过”三种。","opts":null,"ans":"错误","src":{"label":"《汇编》第237页","text":"对于工厂委托相关方印刷、模压CCC 标志的，如机动车灯具生产企业委托配光镜生产者将CCC 标志模压在配光镜表面等，认证机构应重点关注以下方面的风险，采取适当和必要的措施使风险可控：(a)相关方加施CCC 标志的活动是否受控并符合规定要求；(b)加施CCC 标志的不合格品的非预期使用或交付；(c)加施CCC 标志的合格品是否仅用于向生产企业交付；(d)相关方所印刷、模压CCC 标志的产品是否在强制性产品认证目录内。11.工厂检查结论判定11.1 工厂检查结论和不符合项分类工厂检查结论通常分为“工厂检查通过”、“书面验证通过”、“现场验证通过”、“工"}},{"id":817,"type":2,"num":19,"stem":"依据CNCA-00C-006:2014《强制性产品认证实施规则工厂检查通用要求》，同一工厂涵盖不同工厂专业类别时，工厂检查可以合并实施一次。","opts":null,"ans":"错误","src":{"label":"《汇编》第229页","text":"编号：CNCA-00C-006强制性产品认证实施规则工厂检查通用要求2014-01-02 发布2014-09-01 实施中国国家认证认可监督管理委员会发布"}},{"id":818,"type":2,"num":20,"stem":"依据CNCA-00C-006:2014《强制性产品认证实施规则工厂检查通用要求》，工厂检查范围仅指产品范围。","opts":null,"ans":"错误","src":{"label":"《汇编》第229页","text":"编号：CNCA-00C-006强制性产品认证实施规则工厂检查通用要求2014-01-02 发布2014-09-01 实施中国国家认证认可监督管理委员会发布"}},{"id":819,"type":2,"num":21,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，用于确定所生产的认证产品符合规定要求的检验试验仪器设备进行校准或检定，无需溯源至国家或国际基准。","opts":null,"ans":"错误","src":{"label":"《汇编》第213页","text":"编号：CNCA-00C-005强制性产品认证实施规则工厂质量保证能力要求2014-01-02 发布2014-09-01 实施中国国家认证认可监督管理委员会发布"}},{"id":820,"type":2,"num":22,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，对于委托外部机构进行的检验，工厂应确保外部机构的能力满足检验要求，并保存相关能力的评价结果，如实验室认可证明等。","opts":null,"ans":"正确","src":{"label":"《汇编》第223页","text":"程序应符合规定要求，程序的内容应包括检验频次、项目、内容、方法、判定等。工厂应实施并保存相关检验记录。对于委托外部机构进行的检验，工厂应确保外部机构的能力满足检验要求，并保存相关能力的评价结果，如实验室认可证明等。3.6 检验试验仪器设备3.6.1 基本要求工厂应配备足够的检验试验仪器设备，确保在采购、生产制造、最终检验试验等环节中使用的仪器设备能力满足认证产品批量生产时的检验试验要求。检验试验人员应能正确使用仪器设备，掌握检验试验要求并有效实施。"}},{"id":821,"type":2,"num":23,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，工厂无需对影响认证产品质量的关键工序进行识别。","opts":null,"ans":"错误","src":{"label":"《汇编》第213页","text":"编号：CNCA-00C-005强制性产品认证实施规则工厂质量保证能力要求2014-01-02 发布2014-09-01 实施中国国家认证认可监督管理委员会发布"}},{"id":822,"type":2,"num":24,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，工厂获知其认证产品存在重大质量问题时（如国家级和省级监督抽查不合格等），应及时通知认证机构。","opts":null,"ans":"正确","src":{"label":"《汇编》第226页","text":"问题时（如国家级和省级监督抽查不合格等），应及时通知认证机构。3.8 内部质量审核工厂应建立文件化的内部质量审核程序，确保工厂质量保证能力的持续符合性、产品一致性以及产品与标准的符合性。对审核中发现的问题，工厂应采取适当的纠正措施、预防措施。工厂应保存内部质量审核结果。3.9 认证产品的变更及一致性控制工厂应建立并保持文件化的程序，对可能影响产品一致性及产品与标准的符合性的变更（如工艺、生产条件、关键件和产品结构等）进行控制，程序应符合规定要求。变更应得到认证机构或认证技术负责人批准后方可实施，工厂应保存相关记录。"}},{"id":823,"type":2,"num":25,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，例行检验是指为验证认证产品是否持续符合认证依据标准所进行的抽样检验。","opts":null,"ans":"错误","src":{"label":"《汇编》第216页","text":"品认证实施规则/细则的要求，实施抽样检验。2.4 确认检验为验证认证产品是否持续符合认证依据标准所进行的抽样检验。2.5 关键件定期确认检验为验证关键件的质量特性是否持续符合认证依据标准和/或技术要求所进行的定期抽样检验。注：关键件是对产品满足认证依据标准要求起关键作用的元器件、零部件、原材料等的统称。2.6 功能检查为判断检验试验仪器设备的预期功能是否满足规定要求所进行的检查。"}},{"id":824,"type":2,"num":26,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，质量负责人应具有充分的能力胜任本职工作，质量负责人可同时担任认证技术负责人。","opts":null,"ans":"正确","src":{"label":"《汇编》第213页","text":"编号：CNCA-00C-005强制性产品认证实施规则工厂质量保证能力要求2014-01-02 发布2014-09-01 实施中国国家认证认可监督管理委员会发布"}},{"id":825,"type":2,"num":27,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，与质量相关的记录保存期应满足法律法规的要求，确保在本次检查中能够获得前次检查后的记录，且至少不低于12 个月。","opts":null,"ans":"错误","src":{"label":"《汇编》第219页","text":"品一致性的主要内容，工厂应有必要的图纸、样板、关键件清单、工艺文件、作业指导书等设计文件，并确保文件的持续有效性。3.2.2 工厂应确保文件的充分性、适宜性及使用文件的有效版本。3.2.3 工厂应确保记录的清晰、完整、可追溯，以作为产品符合规定要求的证据。与质量相关的记录保存期应满足法律法规的要求，确保在本次检查中能够获得前次检查后的记录，且至少不低于24 个月。3.2.4 工厂应识别并保存与产品认证相关的重要文件和质量信息，如型式试验报告、工厂检查结果、CCC 证书状态信息（有效、暂停、撤销、注销等）、认证变更批准信息、监督抽样检测报告、产品质量投诉及处理结果等。"}},{"id":826,"type":2,"num":28,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，产品生产过程如对环境条件有要求，工厂应保证工作环境满足规定要求。","opts":null,"ans":"正确","src":{"label":"《汇编》第213页","text":"编号：CNCA-00C-005强制性产品认证实施规则工厂质量保证能力要求2014-01-02 发布2014-09-01 实施中国国家认证认可监督管理委员会发布"}},{"id":827,"type":2,"num":29,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，对于采购、生产制造、检验等环节中发现的不合格品，无需采取标识、隔离、处置等措施。","opts":null,"ans":"错误","src":{"label":"《汇编》第225页","text":"时，应对这些产品重新检测。工厂应规定操作人员在发现仪器设备功能失效时需采取的措施。工厂应保存功能检查结果及仪器设备功能失效时所采取措施的记录。3.7 不合格品的控制3.7.1 对于采购、生产制造、检验等环节中发现的不合格品，工厂应采取标识、隔离、处置等措施，避免不合格品的非预期使用或交付。返工或返修后的产品应重新检验。3.7.2 对于国家级和省级监督抽查、产品召回、顾客投诉及抱怨等来自外部的认证产品不合格信息，工厂应分析不合格产生的原因，并采取适当的纠正措施。"}},{"id":828,"type":2,"num":30,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，返工或返修后的产品应重新检验。","opts":null,"ans":"正确","src":{"label":"《汇编》第213页","text":"编号：CNCA-00C-005强制性产品认证实施规则工厂质量保证能力要求2014-01-02 发布2014-09-01 实施中国国家认证认可监督管理委员会发布"}},{"id":829,"type":2,"num":31,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，工厂是产品质量的责任主体，其质量保证能力应持续符合认证要求，生产的产品应符合标准要求，并保证认证产品与型式试验样品一致。","opts":null,"ans":"正确","src":{"label":"《汇编》第216页","text":"品认证实施规则/细则的要求，实施抽样检验。2.4 确认检验为验证认证产品是否持续符合认证依据标准所进行的抽样检验。2.5 关键件定期确认检验为验证关键件的质量特性是否持续符合认证依据标准和/或技术要求所进行的定期抽样检验。注：关键件是对产品满足认证依据标准要求起关键作用的元器件、零部件、原材料等的统称。2.6 功能检查为判断检验试验仪器设备的预期功能是否满足规定要求所进行的检查。"}},{"id":830,"type":2,"num":32,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，对于委托分包方生产的关键部件、组件、分总成、总成、半成品等，工厂应按采购关键件进行控制，以确保所分包的产品持续满足规定要求。","opts":null,"ans":"正确","src":{"label":"《汇编》第221页","text":"证书状态的有效。(b)没有获得相关证书的关键件，其定期确认检验应符合产品认证实施规则/细则的要求。(c)工厂自身制定控制方案，其控制效果不低于3.3.2.2(a)或(b)的要求。3.3.2.3 当从经销商、贸易商采购关键件时，工厂应采取适当措施以确保采购关键件的一致性并持续满足其技术要求。对于委托分包方生产的关键部件、组件、分总成、总成、半成品等，工厂应按采购关键件进行控制，以确保所分包的产品持续满足规定要求。对于自产的关键件，按3.4 进行控制。3.4 生产过程控制3.4.1 工厂应对影响认证产品质量的工序（简称关键工序）进行识别，所识别的关键工序应符合规定要求。"}},{"id":831,"type":2,"num":33,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，对于采购的关键件，工厂应识别并在采购文件中明确其技术要求，该技术要求还应确保最终产品满足认证要求。","opts":null,"ans":"正确","src":{"label":"《汇编》第220页","text":"对于采购的关键件，工厂应识别并在采购文件中明确其技术要求，该技术要求还应确保最终产品满足认证要求。工厂应建立、保持关键件合格生产者/生产企业名录并从中采购关键件，工厂应保存关键件采购、使用等记录，如进货单、出入库单、台帐等。3.3.2 关键件的质量控制3.2.2.1 工厂应建立并保持文件化的程序，在进货（入厂）时完成对采购关键件的技术要求进行验证和/或检验并保存相关记录。3.3.2.2 对于采购关键件的质量特性，工厂应选择适当的控制方式以确保持续满足关键件的技术要求，以及最终产品满足认证要求，并保存相关记录。"}},{"id":832,"type":2,"num":34,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，工厂无需建立文件化的内部质量审核程序。","opts":null,"ans":"错误","src":{"label":"《汇编》第213页","text":"编号：CNCA-00C-005强制性产品认证实施规则工厂质量保证能力要求2014-01-02 发布2014-09-01 实施中国国家认证认可监督管理委员会发布"}},{"id":833,"type":2,"num":35,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，认证技术负责人属于生产者和/或生产企业内部人员，掌握认证依据标准要求，依据产品认证实施规则/细则规定的职责范围，对认证产品变更进行确认批准并承担相应责任。","opts":null,"ans":"正确","src":{"label":"《汇编》第215页","text":"据之一。2.术语和定义2.1 认证技术负责人属于生产者和/或生产企业内部人员，掌握认证依据标准要求，依据产品认证实施规则/细则规定的职责范围，对认证产品变更进行确认批准并承担相应责任的人。2.2 认证产品一致性（产品一致性）生产的认证产品与型式试验样品保持一致，产品一致性的具体要求由产品认证实施规则/细则规定。2.3 例行检验为剔除生产过程中偶然性因素造成的不合格品，通常在生产的最终阶段，对认证产品进行的100%检验。"}},{"id":834,"type":2,"num":36,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，认证产品的变更应得到认证机构或认证技术负责人批准后方可实施，工厂应保存相关记录。","opts":null,"ans":"正确","src":{"label":"《汇编》第226页","text":"问题时（如国家级和省级监督抽查不合格等），应及时通知认证机构。3.8 内部质量审核工厂应建立文件化的内部质量审核程序，确保工厂质量保证能力的持续符合性、产品一致性以及产品与标准的符合性。对审核中发现的问题，工厂应采取适当的纠正措施、预防措施。工厂应保存内部质量审核结果。3.9 认证产品的变更及一致性控制工厂应建立并保持文件化的程序，对可能影响产品一致性及产品与标准的符合性的变更（如工艺、生产条件、关键件和产品结构等）进行控制，程序应符合规定要求。变更应得到认证机构或认证技术负责人批准后方可实施，工厂应保存相关记录。"}},{"id":835,"type":2,"num":37,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，仪器设备的校准或检定状态应能被使用及管理人员方便识别。","opts":null,"ans":"正确","src":{"label":"《汇编》第224页","text":"或检定，校准或检定周期可按仪器设备的使用频率、前次校准情况等设定；对内部校准的，工厂应规定校准方法、验收准则和校准周期等；校准或检定应溯源至国家或国际基准。仪器设备的校准或检定状态应能被使用及管理人员方便识别。工厂应保存仪器设备的校准或检定记录。对于委托外部机构进行的校准或检定活动，工厂应确保外部机构的能力满足校准或检定要求，并保存相关能力评价结果。注：对于生产过程控制中的关键监视测量装置，工厂应根据产品认证实施规则/细则的要求进行管理。3.6.3 功能检查必要时，工厂应按规定要求对例行检验设备实施功能检查。"}},{"id":836,"type":2,"num":38,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，工厂在采购、生产制造、检验等环节所进行的产品防护，如标识、搬运、包装、贮存、保护等应符合规定要求。","opts":null,"ans":"正确","src":{"label":"《汇编》第227页","text":"付等适用的质量环节，对产品一致性进行控制，以确保产品持续符合认证依据标准要求。3.10 产品防护与交付工厂在采购、生产制造、检验等环节所进行的产品防护，如标识、搬运、包装、贮存、保护等应符合规定要求。必要时，工厂应按规定要求对产品的交付过程进行控制。3.11CCC 证书和标志工厂对CCC 证书和标志的管理及使用应符合《强制性产品认证管理规定》、《强制性产品认证标志管理办法》等规定。对于统一印制的标准规格CCC 标志或采用印刷、模压等方式加施的CCC 标志，工厂应保存使用记录。对于下列产品，不得加施CCC 标志或放行：(a)未获认证的强制性产品认证目录内产品；(b)获证后的变更需经认证机构确认，但未"}},{"id":837,"type":2,"num":39,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，工厂应建立并保持对生产设备的维护保养制度，以确保设备的能力持续满足生产要求。","opts":null,"ans":"正确","src":{"label":"《汇编》第222页","text":"相应的能力；关键工序的控制应确保认证产品与标准的符合性、产品一致性；如果关键工序没有文件规定就不能保证认证产品质量时，则应制定相应的作业指导书，使生产过程受控。3.4.2 产品生产过程如对环境条件有要求,工厂应保证工作环境满足规定要求。3.4.3 必要时，工厂应对适宜的过程参数进行监视、测量。3.4.4 工厂应建立并保持对生产设备的维护保养制度，以确保设备的能力持续满足生产要求。3.4.5 必要时，工厂应按规定要求在生产的适当阶段对产品及其特性进行检查、监视、测量，以确保产品与标准的符合性及产品一致性。"}},{"id":838,"type":2,"num":40,"stem":"依据CNCA-00C-005:2014《强制性产品认证实施规则工厂质量保证能力要求》，未获认证的强制性产品认证目录内产品可以加施CCC 标志并放行。","opts":null,"ans":"错误","src":{"label":"《汇编》第213页","text":"编号：CNCA-00C-005强制性产品认证实施规则工厂质量保证能力要求2014-01-02 发布2014-09-01 实施中国国家认证认可监督管理委员会发布"}},{"id":839,"type":2,"num":41,"stem":"依据CNCA-00C-004:2013《强制性产品认证实施规则生产企业检测资源及其他认证结果的利用》，同一工厂同一项目利用工厂资源检测连续三年的，原则上应送样至指定实验室检测，避免系统性风险。","opts":null,"ans":"错误","src":{"label":"《汇编》第202页","text":"202(c)仅为一个批量生产，以后不再生产的产品；或(d)其他特殊情况。2.1.2 获证后监督抽样检测：各类CCC认证产品2.1.3 证书扩展和变更时补充的差异测试：各类CCC认证产品2.1.4 同一工厂同一项目利用工厂资源检测连续五年的，原则上应送样至指定实验室检测，避免系统性风险。2.2 实施方式根据工厂实验室的设备资源、人力资源和软资源的综合情况，结合产品特点，利用工厂检测资源进行样品检测分为TMP、WMT两种方式。"}},{"id":840,"type":2,"num":42,"stem":"依据CNCA-00C-004:2013《强制性产品认证实施规则生产企业检测资源及其他认证结果的利用》，获证后监督抽样检测利用工厂检测资源适用于各类CCC 认证产品。（","opts":null,"ans":"正确","src":{"label":"《汇编》第199页","text":"编号：CNCA-00C-004强制性产品认证实施规则生产企业检测资源及其他认证结果的利用2013-09-24 发布2013-10-01 实施中国国家认证认可监督管理委员会发布"}},{"id":841,"type":2,"num":43,"stem":"依据CNCA-00C-004:2013《强制性产品认证实施规则生产企业检测资源及其他认证结果的利用》，利用工厂检测资源进行样品检测，并不免除、减轻或转移《强制性产品认证管理规定》中规定的指定实验室、认证机构对检测结果、认证结果应负的责任。","opts":null,"ans":"正确","src":{"label":"《汇编》第59页","text":"构成犯罪的，依法追究刑事责任。第五十九条对于强制性产品认证活动中的其他违法行为，依照有关法律、行政法规的规定予以处罚。第六章附则第六十条强制性产品认证应当依照国家有关规定收取费用。第六十一条本规定由市场监管总局负责解释。"}},{"id":842,"type":2,"num":44,"stem":"依据CNCA-00C-004:2013《强制性产品认证实施规则生产企业检测资源及其他认证结果的利用》，本规则中所指的工厂检测资源为申请强制性产品认证制造商或生产企业100%自有资源，获得认可且与工厂在同一城市或临近。","opts":null,"ans":"正确","src":{"label":"《汇编》第200页","text":"2000 引言为缩短强制性产品认证及检测周期，降低认证检测费用，减轻工厂负担，避免重复评价，在认证风险可控、保证认证质量的前提下，对符合特定要求的情况下，且生产企业（以下简称工厂）实验室的检测资源（如人员、设施等）具备了相应产品及特定项目的检测能力、申请强制性产品认证的产品可能已经获得其他认证或工厂已经获得体系认证，强制性产品认证可利用工厂自身检测资源替代在CCC指定实验室进行样品检测全部或部分检测项目，或可承认其他认证相同内容部分的评价结果（检测、检查或审查结果）。为规范上述两类活动，制定本实施规则。本规则中所指的工厂检测资源为申请强制性产品认证制造商或生产企业100%自有资源，获得认可且与工厂在同一城市或临近（以下简"}},{"id":843,"type":2,"num":45,"stem":"依据CNCA-00C-004:2013《强制性产品认证实施规则生产企业检测资源及其他认证结果的利用》，为了减轻企业负担，工厂实验室审核与现场检测可合并进行。审核组先进行实验室能力审核，合格后进行检测。","opts":null,"ans":"正确","src":{"label":"《汇编》第209页","text":"序，明确在实施过程中各方的具体职责，并与指定实验室、工厂实验室签署相关的协议，对保密、工程师的安全责任等相关事宜做出安排。为了减轻企业负担，工厂实验室审核与现场检测可合并进行。审核组先进行实验室能力审核，合格后进行检测。为避免多个认证机构对同一工厂实验室没必要的重复评审，各指定认证机构应相互协调，鼓励建立在协调的技术要求和评审程序基础上的相互承认机制。利用工厂检测资源进行检测，仍应按原指定实验室任务分配原则。2.7 收费TMP检测费按照已报国家发改委备案的《强制性产品认证的产品检测费标准》的50%与实验室能力的审查、现场检测的工时人日数费用相比较的上限收取（最高不得超过检测总费用100%）。"}},{"id":844,"type":2,"num":46,"stem":"依据CNCA-00C-004:2013《强制性产品认证实施规则生产企业检测资源及其他认证结果的利用》，对利用自愿性认证结果而减免的项目及内容，指定认证机构及指定实验室无需对照国家有关收费规定在认证及检测环节中予以免除或减少收费。","opts":null,"ans":"错误","src":{"label":"《汇编》第212页","text":"指定认证机构应建立利用其他认证结果的管理程序，保存利用其他认证结果活动记录，并每年度将利用其他认证结果的情况（作为年度工作总结的一部分内容）报认监委。3.4 收费对利用自愿性认证结果而减免的项目及内容，指定认证机构及指定实验室应对照国家有关收费规定在认证及检测环节中予以免除或减少收费。"}},{"id":845,"type":2,"num":47,"stem":"依据CNCA-00C-004:2013《强制性产品认证实施规则生产企业检测资源及其他认证结果的利用》，TMP 方式是指指定实验室利用工厂实验室检测设备目击检测方式。","opts":null,"ans":"错误","src":{"label":"《汇编》第199页","text":"编号：CNCA-00C-004强制性产品认证实施规则生产企业检测资源及其他认证结果的利用2013-09-24 发布2013-10-01 实施中国国家认证认可监督管理委员会发布"}},{"id":846,"type":2,"num":48,"stem":"依据CNCA-00C-004:2013《强制性产品认证实施规则生产企业检测资源及其他认证结果的利用》，利用工厂检测资源进行检测，仍应按原指定实验室任务分配原则。（","opts":null,"ans":"正确","src":{"label":"《汇编》第199页","text":"编号：CNCA-00C-004强制性产品认证实施规则生产企业检测资源及其他认证结果的利用2013-09-24 发布2013-10-01 实施中国国家认证认可监督管理委员会发布"}},{"id":847,"type":2,"num":49,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，认证机构应根据生产企业分类等级确定其产品实施强制性认证时适用的认证模式，并将必要的方案及信息在认证实施后告知认证委托人。","opts":null,"ans":"错误","src":{"label":"《汇编》第177页","text":"发布。对生产企业分类管理信息进行分析评估后，认证机构应对生产企业分类等级确定和调整的决定进行审核。认证机构根据生产企业分类等级确定其产品实施强制性认证时适用的认证模式，并将必要的方案及信息在认证实施前告知认证委托人。认证实施过程中，如有相关质量信息影响到生产企业分类等级结果的，认证机构应及时对认证模式做出调整。对初次申请认证、尚未获得任何质量信息的生产企业，认证机构根据认证风险评估结果确定其初次认证分类等级和相应的认证模式。生产企业分类管理等级确定/调整后应告知生产企业或（必要时）相关方。"}},{"id":848,"type":2,"num":50,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，认证机构在受理认证申请时，应通过国家认监委信息平台主动获得相关生产企业及产品的获证信息。","opts":null,"ans":"正确","src":{"label":"《汇编》第181页","text":"传递认证机构受理认证申请时，应通过国家认监委信息平台主动获得相关生产企业及产品的获证信息。认证机构间应建立生产企业分类管理信息通报和传递机制。当同一家生产企业同时在两家或两家以上认证机构申请认证的，当其中一家认证机构发现获证产品及企业存在安全隐患、需予以重点监控的，该认证机构应将相关信息及时通报其他认证机构，必要时抄送国家认监委。当同一家生产企业在不同认证机构间转换认证证书的，受理新申请的认证机构应主动获得相关企业质量信息并向原发证机构核实生产企业分类管理情况，原发证认证机构应予如实提供。"}},{"id":849,"type":2,"num":51,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，生产企业分类等级仅作为认证机构对生产企业管理的依据。企业不得在市场推广、宣传等活动中使用认证机构对其的分类管理的结果，以免误导消费者。","opts":null,"ans":"正确","src":{"label":"《汇编》第173页","text":"设置，应结合具体产品及行业特点做出规定。原则上，同一实施规则下的分类条件及分类级别保持一致。生产企业分类管理不应针对生产企业规模、产能等设置任何歧视性分类条件。生产企业分类等级仅作为认证机构对生产企业管理的依据。企业不得在市场推广、宣传等活动中使用认证机构对其的分类管理的结果，以免误导消费者。3.2 生产企业分类涉及的质量信息生产企业分类涉及的质量信息至少应包括认证实施各环节，以及各级政府、社会、媒体、公众等方面公布或反映的质量信息。3.2.1 认证实施获得的质量信息认证实施获得的质量信息包括认证机构在发证前的认证实施以及获证后监督各环节所获取的生产企业和产品质量信息。"}},{"id":850,"type":2,"num":52,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，对于诚信缺失的生产企业，认证机构可在具体实施用的认证模式中选择任何必要认证要素，以控制并促进认证结果能够持续符合认证要求。","opts":null,"ans":"正确","src":{"label":"《汇编》第192页","text":"1924.3 认证模式与生产企业分类管理基本认证模式确定的前提是生产企业诚信自律、有效管理、稳定生产，而认证机构实际使用的认证模式则可基于生产企业分类管理做出进一步调整。认证机构在对生产企业进行分类管理评价过程中，若有证据、信息能够证明生产企业存在诚信缺失、产品质量管理存在风险等情况时，认证机构有必要在具体实施用的认证模式中增加认证要素控制认证风险。4.3.1 生产企业诚信缺失生产企业诚信自律是实施强制性产品认证的基础。对于诚信缺失的生产企业，认证机构可在具体实施用的认证模式中选择任何必要认证要素，以控制并促进认证结果能够持续符合认证要求。"}},{"id":851,"type":2,"num":53,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，本实施规则所称的生产企业分类管理，是指针对同类别产品的生产企业，认证机构根据其生产企业质量保证能力、诚信守法状况及所生产产品的质量状况等与质量相关的信息进行综合评价，对生产企业进行分类。","opts":null,"ans":"正确","src":{"label":"《汇编》第170页","text":"170(b)基于基本认证模式，认证机构针对生产企业所生产的产品选择和确定具体实施用认证模式的通用要求。2. 术语和定义2.1 生产企业分类管理本实施规则所称的生产企业分类管理，是指针对同类别产品的生产企业，认证机构根据其生产企业质量保证能力、诚信守法状况及所生产产品的质量状况等与质量相关的信息进行综合评价，对生产企业进行分类，从而对不同类别生产企业所生产的产品在认证模式选择、单元划分原则和获证后监督等方面实施差异化管理，以实现控制认证风险、提高认证活动的质量和效率、确保获证产品持续符合认证要求的目标。"}},{"id":852,"type":2,"num":54,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，对于初次获证的生产企业，当认证方案中未涉及初始工厂检查环节的，认证机构一般可在获证后6 个月内或首次生产时实施第一次跟踪检查。","opts":null,"ans":"错误","src":{"label":"《汇编》第183页","text":"1834.1.3 获证后的跟踪检查获证后的跟踪检查也称为跟踪检查，其属于“获证后监督”的认证要素之一。跟踪检查可采取预先通知或不通知生产企业的方式进行。基于生产企业分类管理的结果，跟踪检查的频次和要求可由认证机构在认证方案中做出差异化安排。对于初次获证的生产企业，当认证方案中未涉及初始工厂检查环节的，认证机构一般可在获证后3 个月内或首次生产时实施第一次跟踪检查。4.1.4 生产现场抽取样品检测或者检查生产现场抽取样品检测或者检查也称为工厂抽样检测或者检查。"}},{"id":853,"type":2,"num":55,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，当同一家生产企业同时在两家或两家以上认证机构申请认证的，当其中一家认证机构发现获证产品及企业存在安全隐患、需予以重点监控的，该认证机构应将相关信息及时通报其他认证机构，必要时抄送国家认监委。","opts":null,"ans":"正确","src":{"label":"《汇编》第181页","text":"传递认证机构受理认证申请时，应通过国家认监委信息平台主动获得相关生产企业及产品的获证信息。认证机构间应建立生产企业分类管理信息通报和传递机制。当同一家生产企业同时在两家或两家以上认证机构申请认证的，当其中一家认证机构发现获证产品及企业存在安全隐患、需予以重点监控的，该认证机构应将相关信息及时通报其他认证机构，必要时抄送国家认监委。当同一家生产企业在不同认证机构间转换认证证书的，受理新申请的认证机构应主动获得相关企业质量信息并向原发证机构核实生产企业分类管理情况，原发证认证机构应予如实提供。"}},{"id":854,"type":2,"num":56,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，市场抽样检测或者检查是认证机构对获得认证证书并已出厂、销售、进口的产品所进行的抽样检测或者检查，应作为获证后监督的一种有效手段。","opts":null,"ans":"正确","src":{"label":"《汇编》第184页","text":"市场抽样检测或者检查是认证机构对获得认证证书并已出厂、销售、进口的产品所进行的抽样检测或者检查，应作为获证后监督的一种有效手段。对于需要通过进行市场抽样检测或者检查的方式实施获证后监督的产品，认证机构应设计方案以保证能够从市场中抽取到一定比例的获证产品进行检测或者检查。4.1.6 设计鉴定设计鉴定是依据相关标准采用验证比较、验证评估的方式，证明产品符合认证依据标准要求的评价活动。根据判定结果的可靠性，设计鉴定可以替代全部或部分型式试验项目。4.2 基本认证模式的确定基本认证模式是在对产品风险定级的基础上，考虑认证可操作性、经济性等因素综合确定的。"}},{"id":855,"type":2,"num":57,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，认证机构在发证前进行的企业质量保证能力/产品一致性检查不可以采取预先不通知生产企业的方式进行。","opts":null,"ans":"错误","src":{"label":"《汇编》第182页","text":"类管理制度。国家认监委结合日常管理和专项监督对生产企业分类管理情况进行核查。4. 认证模式的选择与确定4.1 认证要素及使用认证模式由型式试验、企业质量保证能力和产品一致性检查、获证后的跟踪检查、生产现场抽取样品检测或者检查、市场抽样检测或者检查、设计鉴定等认证要素组成。4.1.1 型式试验型式试验主要用于那些需要基于检测完成认证评价的产品。4.1.2 企业质量保证能力和产品一致性检查认证机构在发证前进行的企业质量保证能力/产品一致性检查也可称为初始工厂检查。"}},{"id":856,"type":2,"num":58,"stem":"依据CNCA-00C-003:2013《强制性产品认证实施规则生产企业分类管理、认证模式选择与确定》，生产企业分类管理可以针对生产企业规模、产能等设置歧视性分类条件。","opts":null,"ans":"错误","src":{"label":"《汇编》第168页","text":"编号：CNCA-00C-003强制性产品认证实施规则生产企业分类管理、认证模式选择与确定2013-09-24 发布2013-10-01 实施中国国家认证认可监督管理委员会发布"}},{"id":857,"type":2,"num":59,"stem":"依据CNCA-00C-001:2008《强制性产品认证证书注销、暂停、撤销实施规则》，对被撤销认证证书的产品，任何认证机构在3 个月内不得受理该产品的认证委托。","opts":null,"ans":"错误","src":{"label":"《汇编》第154页","text":"154（1）自认证证书撤销之日起，不得出厂、销售、进口或者在其他经营活动中使用认证证书覆盖的产品。认证机构须根据证书撤销原因评价产品可能存在的安全隐患，对可能对人体健康和生命安全造成损害的，应依照有关规定及时向质检部门进行通报或采取相应措施。（2）认证证书被撤销后，不能以任何理由恢复。经过整改后，认证委托人可以向认证机构重新申请认证。对被撤销认证证书的产品，相应产品型式试验报告和工厂检查报告不再有效。任何认证机构在6 个月内不得受理该产品的认证委托。认证机构受理持有产品型式试验报告和工厂检查报告的认证申请时，要制定严格的审核程序，认真确认申请认证的产品是否已被撤销认证证书，相应的产品型式试验报告和工厂检查报告是否有效。"}},{"id":858,"type":2,"num":60,"stem":"依据CNCA-00C-001:2008《强制性产品认证证书注销、暂停、撤销实施规则》，本规则发布之前由国家认监委所制定的有关CCC 认证实施规则等规范性文件，以及各认证机构自行制定的有关技术性、程序性文件，若与本规则不相符的，应以原文件为准。","opts":null,"ans":"错误","src":{"label":"《汇编》第146页","text":"附件：强制性产品认证证书注销、暂停、撤销实施规则1 目的为规范和明确强制性产品认证（以下简称CCC 认证）活动中有关认证证书的注销、暂停、撤销条件及其有关事项，统一各指定强制性产品认证机构（以下简称认证机构）相关活动，制定本规则。2 适用范围本规则适用于各认证机构在CCC 认证过程中涉及的证书注销、暂停、撤销等有关活动。本规则发布之前由国家认证认可监督管理委员会（以下简称国家认监委）所制定的有关CCC认证实施规则等规范性文件，以及各认证机构"}},{"id":859,"type":2,"num":61,"stem":"依据CNCA-00C-001:2008《强制性产品认证证书注销、暂停、撤销实施规则》，认证委托人在认证证书暂停期限内，可向认证机构提出恢复申请；认证人根据认证机构相关规定通过整改并符合相关要求的，认证机构应当恢复其认证证书。","opts":null,"ans":"正确","src":{"label":"《汇编》第151页","text":"成损害的，应依照有关规定及时向质检部门进行通报或采取相应措施。（2）由于生产的季节性、按订单生产等可接受的原因，由认证委托人提出暂停认证证书的，认证证书暂停期限最长为12 个月，且需至少提前1 个月提出申请。除此情形外，由于上述5.1 条其他原因暂停认证证书的，证书暂停期限最长为3 个月。暂停时间自认证机构签发暂停通知书之日算起。6 暂停认证证书的恢复6.1对由于5.1 条款各情形被暂停的认证证书，认证机构须向认证委托人告知证书暂停的原因、期限，并根据暂停原因明确恢复证书的相关要求。"}},{"id":860,"type":2,"num":62,"stem":"依据CNCA-00C-001:2008《强制性产品认证证书注销、暂停、撤销实施规则》，本规则适用于各认证机构在CCC 认证过程中涉及的证书注销、暂停、撤销等有关活动。","opts":null,"ans":"正确","src":{"label":"《汇编》第146页","text":"附件：强制性产品认证证书注销、暂停、撤销实施规则1 目的为规范和明确强制性产品认证（以下简称CCC 认证）活动中有关认证证书的注销、暂停、撤销条件及其有关事项，统一各指定强制性产品认证机构（以下简称认证机构）相关活动，制定本规则。2 适用范围本规则适用于各认证机构在CCC 认证过程中涉及的证书注销、暂停、撤销等有关活动。本规则发布之前由国家认证认可监督管理委员会（以下简称国家认监委）所制定的有关CCC认证实施规则等规范性文件，以及各认证机构"}},{"id":861,"type":2,"num":63,"stem":"依据CNCA-00C-001:2008《强制性产品认证证书注销、暂停、撤销实施规则》，自认证证书注销之日起，不得继续出厂、进口认证证书覆盖的产品，已经出厂、进口的认证证书覆盖的产品可以继续销售或者在其他经营活动中使用。","opts":null,"ans":"正确","src":{"label":"《汇编》第148页","text":"者禁止生产的产品目录的；（4）认证委托人申请注销的；（5）其他应当注销认证证书的情形。4.2认证证书注销的有关规定（1）自认证证书注销之日起，不得继续出厂、进口认证证书覆盖的产品，已经出厂、进口的认证证书覆盖的产品可以继续销售或者在其他经营活动中使用。（2）认证证书被注销后，不能以任何理由予以恢复，认证委托人可以向认证机构重新申请认证。被注销认证证书对应产品的型式试验报告和工厂检查报告不再有效。5 认证证书的暂停5.1当出现以下情形之一的，认证机构应当暂停认证证书：（1）认证委托人/相关方（包括生产者、销售者、进口商、生产厂，下同）违反国家法"}},{"id":862,"type":2,"num":64,"stem":"依据CNCA-00C-001:2008《强制性产品认证证书注销、暂停、撤销实施规则》，认证证书被撤销后，不能以任何理由恢复。经过整改后，认证委托人可以向认证机构重新申请认证。","opts":null,"ans":"正确","src":{"label":"《汇编》第154页","text":"154（1）自认证证书撤销之日起，不得出厂、销售、进口或者在其他经营活动中使用认证证书覆盖的产品。认证机构须根据证书撤销原因评价产品可能存在的安全隐患，对可能对人体健康和生命安全造成损害的，应依照有关规定及时向质检部门进行通报或采取相应措施。（2）认证证书被撤销后，不能以任何理由恢复。经过整改后，认证委托人可以向认证机构重新申请认证。对被撤销认证证书的产品，相应产品型式试验报告和工厂检查报告不再有效。任何认证机构在6 个月内不得受理该产品的认证委托。认证机构受理持有产品型式试验报告和工厂检查报告的认证申请时，要制定严格的审核程序，认真确认申请认证的产品是否已被撤销认证证书，相应的产品型式试验报告和工厂检查报告是否有效。"}},{"id":863,"type":2,"num":65,"stem":"依据CNCA-00C-001:2008《强制性产品认证证书注销、暂停、撤销实施规则》，认证委托人如对认证证书的注销、暂停（含恢复）、撤销有异议的，可以向国家认监委或相关认证机构提出申诉。","opts":null,"ans":"正确","src":{"label":"《汇编》第157页","text":"停（含恢复）、撤销有异议的，可以向国家认监委或相关认证机构提出申诉。"}},{"id":864,"type":2,"num":66,"stem":"依据CNCA-00C-001:2008《强制性产品认证证书注销、暂停、撤销实施规则》，认证机构可以擅自放宽本规则关于认证证书注销、暂停、撤销的条件。","opts":null,"ans":"错误","src":{"label":"《汇编》第144页","text":"国家认监委2008 年第19 号公告关于国家认监委发布《强制性产品认证证书注销、暂停、撤销实施规则》的公告为规范强制性产品认证活动，进一步明确强制性产品认证证书注销、暂停、撤销条件，加强对强制性产品认证证书的有效管理，根据《中华人民共和国认证认可条例》和《强制性产品认证管理规定》的相关要求，国家认监委制定了《强制性产品认证证书注销、暂停、撤销实施规则》，现予以公布，并自发布之日起施行，请各有关单位遵照执行。"}},{"id":865,"type":2,"num":67,"stem":"依据CNCA-00C-001:2008《强制性产品认证证书注销、暂停、撤销实施规则》，认证证书暂停期间应视为无效，暂停期间内不得出厂、进口认证证书覆盖的产品。","opts":null,"ans":"正确","src":{"label":"《汇编》第150页","text":"150（6）认证委托人/相关方不配合国家有关部门或认证机构依据CCC 认证实施规则在市场或销售场所抽取样品进行检测的；（7）认证证书的信息（如申请人/生产者/生产厂的名称或地址，获证产品型号或规格等）发生变更或有证据表明生产厂的组织结构、质量保证体系发生重大变化，认证委托人未向认证机构申请变更批准或备案的；（8）由于生产的季节性、按订单生产等原因，认证委托人申请暂停认证证书的；（9）其他应当暂停认证证书的情形。5.2认证证书暂停的有关规定（1）认证证书暂停期间应视为无效，暂停期间内不得出厂、进口认证证书覆盖的产品，对于已经出厂、进口的认证证书覆盖产品，认证机构须根据证书暂停原因评价产品可能存在的安全隐患，对可能对人体健康和生命安全造"}},{"id":866,"type":2,"num":68,"stem":"依据CNCA-00C-001:2008《强制性产品认证证书注销、暂停、撤销实施规则》，认证证书被注销后，可以以任何理由予以恢复。","opts":null,"ans":"错误","src":{"label":"《汇编》第144页","text":"国家认监委2008 年第19 号公告关于国家认监委发布《强制性产品认证证书注销、暂停、撤销实施规则》的公告为规范强制性产品认证活动，进一步明确强制性产品认证证书注销、暂停、撤销条件，加强对强制性产品认证证书的有效管理，根据《中华人民共和国认证认可条例》和《强制性产品认证管理规定》的相关要求，国家认监委制定了《强制性产品认证证书注销、暂停、撤销实施规则》，现予以公布，并自发布之日起施行，请各有关单位遵照执行。"}},{"id":867,"type":2,"num":69,"stem":"除国务院认证认可监督管理部门确定的认可机构外，其他任何单位不得直接或者变相从事认可活动；其他单位直接或者变相从事认可活动的，其认可结果无效。","opts":null,"ans":"正确","src":{"label":"《汇编》第16页","text":"时的认证、检查、检测服务，不得拖延，不得歧视、刁难委托人，不得牟取不当利益。指定的认证机构不得向其他机构转让指定的认证业务。第三十五条指定的认证机构、实验室开展国际互认活动，应当在国务院认证认可监督管理部门或者经授权的国务院有关部门对外签署的国际互认协议框架内进行。第四章认可第三十六条国务院认证认可监督管理部门确定的认可机构（以下简称认可机构），独立开展认可活动。除国务院认证认可监督管理部门确定的认可机构外，其他任何单位不得直接或者变相从事认可活动。其他单位直接或者变相从事认可活动的，其认可结果无效。"}},{"id":868,"type":2,"num":70,"stem":"认证机构可以与行政机关存在利益关系。","opts":null,"ans":"错误","src":{"label":"《汇编》第10页","text":"第十三条认证机构不得与行政机关存在利益关系。认证机构不得接受任何可能对认证活动的客观公正产生影响的资助；不得从事任何可能对认证活动的客观公正产生影响的产品开发、营销等活动。认证机构不得与认证委托人存在资产、管理方面的利益关系。第十四条认证人员从事认证活动，应当在一个认证机构执业，不得同时在两个以上认证机构执业。第十五条向社会出具具有证明作用的数据和结果的检查机构、实验室，应当具备有关法律、行政法规规定的基本条件和能力，并依法经认定后，方可从事相应活动，认定结果由国务院认证认可监督管理部门公布。"}},{"id":869,"type":2,"num":71,"stem":"境内的认证机构、检查机构、实验室取得境外认可机构认可的，应当向国务院认证认可监督管理部门备案。","opts":null,"ans":"正确","src":{"label":"《汇编》第19页","text":"认可的机构进行复评审，以验证其是否持续符合认可条件。取得认可的机构和人员不再符合认可条件的，认可机构应当撤销认可证书，并予公布。取得认可的机构的从业人员和主要负责人、设施、自行制定的认证规则等与认可条件相关的情况发生变化的，应当及时告知认可机构。第四十八条认可机构不得接受任何可能对认可活动的客观公正产生影响的资助。第四十九条境内的认证机构、检查机构、实验室取得境外认可机构认可的，应当向国务院认证认可监督管理部门备案。第五章监督管理第五十条国务院认证认可监督管理部门可以采取组织同行评议，向被认证企业征求意见，对认证活动和认证结果进行抽查，要求认证机构以及与认证有关的检查机构、实验室报告业务活动情况的方式，对其遵守本条例的情况进行监督。"}},{"id":870,"type":2,"num":72,"stem":"认可机构可以接受任何可能对认可活动的客观公正产生影响的资助。","opts":null,"ans":"错误","src":{"label":"《汇编》第19页","text":"认可的机构进行复评审，以验证其是否持续符合认可条件。取得认可的机构和人员不再符合认可条件的，认可机构应当撤销认可证书，并予公布。取得认可的机构的从业人员和主要负责人、设施、自行制定的认证规则等与认可条件相关的情况发生变化的，应当及时告知认可机构。第四十八条认可机构不得接受任何可能对认可活动的客观公正产生影响的资助。第四十九条境内的认证机构、检查机构、实验室取得境外认可机构认可的，应当向国务院认证认可监督管理部门备案。第五章监督管理第五十条国务院认证认可监督管理部门可以采取组织同行评议，向被认证企业征求意见，对认证活动和认证结果进行抽查，要求认证机构以及与认证有关的检查机构、实验室报告业务活动情况的方式，对其遵守本条例的情况进行监督。"}},{"id":871,"type":2,"num":73,"stem":"指定的认证机构可以向其他机构转让指定的认证业务。","opts":null,"ans":"错误","src":{"label":"《汇编》第16页","text":"时的认证、检查、检测服务，不得拖延，不得歧视、刁难委托人，不得牟取不当利益。指定的认证机构不得向其他机构转让指定的认证业务。第三十五条指定的认证机构、实验室开展国际互认活动，应当在国务院认证认可监督管理部门或者经授权的国务院有关部门对外签署的国际互认协议框架内进行。第四章认可第三十六条国务院认证认可监督管理部门确定的认可机构（以下简称认可机构），独立开展认可活动。除国务院认证认可监督管理部门确定的认可机构外，其他任何单位不得直接或者变相从事认可活动。其他单位直接或者变相从事认可活动的，其认可结果无效。"}},{"id":872,"type":2,"num":74,"stem":"认证人员从事认证活动，应当在一个认证机构执业，不得同时在两个以上认证机构执业。","opts":null,"ans":"正确","src":{"label":"《汇编》第10页","text":"第十三条认证机构不得与行政机关存在利益关系。认证机构不得接受任何可能对认证活动的客观公正产生影响的资助；不得从事任何可能对认证活动的客观公正产生影响的产品开发、营销等活动。认证机构不得与认证委托人存在资产、管理方面的利益关系。第十四条认证人员从事认证活动，应当在一个认证机构执业，不得同时在两个以上认证机构执业。第十五条向社会出具具有证明作用的数据和结果的检查机构、实验室，应当具备有关法律、行政法规规定的基本条件和能力，并依法经认定后，方可从事相应活动，认定结果由国务院认证认可监督管理部门公布。"}},{"id":873,"type":2,"num":75,"stem":"本条例所称认可，是指由认可机构对认证机构、检查机构、实验室以及从事评审、审核等认证活动人员的能力和执业资格，予以承认的合格评定活动。","opts":null,"ans":"正确","src":{"label":"《汇编》第7页","text":"范、相关技术规范的强制性要求或者标准的合格评定活动。本条例所称认可，是指由认可机构对认证机构、检查机构、实验室以及从事评审、审核等认证活动人员的能力和执业资格，予以承认的合格评定活动。第三条在中华人民共和国境内从事认证认可活动，应当遵守本条例。第四条国家实行统一的认证认可监督管理制度。国家对认证认可工作实行在国务院认证认可监督管理部门统一管理、监督和综合协调下，各有关方面共同实施的工作机制。第五条国务院认证认可监督管理部门应当依法对认证培训机构、认证咨询机构的活动加强监督管理。第六条认证认可活动应当遵循客观独立、公开公正、诚实信用的原则。"}},{"id":874,"type":2,"num":76,"stem":"列入目录的产品，必须经国务院认证认可监督管理部门指定的认证机构进行认证。","opts":null,"ans":"正确","src":{"label":"《汇编》第14页","text":"和合格评定程序，统一标志，统一收费标准。统一的产品目录（以下简称目录）由国务院认证认可监督管理部门会同国务院有关部门制定、调整，由国务院认证认可监督管理部门发布，并会同有关方面共同实施。第二十九条列入目录的产品，必须经国务院认证认可监督管理部门指定的认证机构进行认证。列入目录产品的认证标志，由国务院认证认可监督管理部门统一规定。第三十条列入目录的产品，涉及进出口商品检验目录的，应当在进出口商品检验时简化检验手续。第三十一条国务院认证认可监督管理部门指定的从事列入目录产品认证活动的认证机构以及与认证有关的实验室（以下简称指定的认证机构、实验室），应当是长期从事相关业务、无不良记录，且已经依照本条例的规定取得认可、具备从事相关认证活动能力的机构。"}},{"id":875,"type":2,"num":77,"stem":"列入目录的产品未经认证，擅自出厂、销售、进口或者在其他经营活动中使用的，责令限期改正，处5 万元以上20 万元以下的罚款。","opts":null,"ans":"正确","src":{"label":"《汇编》第26页","text":"第六十五条认证机构、检查机构、实验室取得境外认可机构认可，未向国务院认证认可监督管理部门备案的，给予警告，并予公布。第六十六条列入目录的产品未经认证，擅自出厂、销售、进口或者在其他经营活动中使用的，责令限期改正，处5 万元以上20 万元以下的罚款；未经认证的违法产品货值金额不足1 万元的，处货值金额2 倍以下的罚款；有违法所得的，没收违法所得。第六十七条认可机构有下列情形之一的，责令改正；情节严重的，对主要负责人和负有责任的人员撤职或者解聘：（一）对不符合认可条件的机构和人员予以认可的；（二）发现取得认可的机构和人员不符合认可条件，不及时撤销认可证书，并予公布的；（三）接受可能对认可活动的客观公正产生影响的资助的。"}},{"id":876,"type":2,"num":78,"stem":"本条例所称认证，是指由认证机构证明产品、服务、管理体系符合相关技术规范、相关技术规范的强制性要求或者标准的合格评定活动。","opts":null,"ans":"正确","src":{"label":"《汇编》第6页","text":"中华人民共和国认证认可条例（2023 年修订版）（2003 年9 月3 日中华人民共和国国务院令第390 号公布根据2016 年2 月6 日《国务院关于修改部分行政法规的决定》第一次修订根据2020 年11 月29 日《国务院关于修改和废止部分行政法规的决定》第二次修订根据2023 年7 月20 日《国务院关于修改和废止部分行政法规的决定》第三次修订）)第一章总则第一条为了规范认证认可活动，提高产品、服务的质量和管理水平，促进经济和社会的发展，制定本条例。"}},{"id":877,"type":2,"num":79,"stem":"认证机构不得以委托人未参加认证咨询或者认证培训等为理由，拒绝提供本认证机构业务范围内的认证服务。","opts":null,"ans":"正确","src":{"label":"《汇编》第11页","text":"第十七条认证机构应当按照认证基本规范、认证规则从事认证活动。认证基本规范、认证规则由国务院认证认可监督管理部门制定；涉及国务院有关部门职责的，国务院认证认可监督管理部门应当会同国务院有关部门制定。属于认证新领域，前款规定的部门尚未制定认证规则的，认证机构可以自行制定认证规则，并报国务院认证认可监督管理部门备案。第十八条任何法人、组织和个人可以自愿委托依法设立的认证机构进行产品、服务、管理体系认证。第十九条认证机构不得以委托人未参加认证咨询或者认证培训等为理由，拒绝提供本认证机构业务范围内的认证服务，也不得向委托人提出与认证活动无关的要求或者限制条件。第二十条认证机构应当公开认证基本规范、认证规则、收费标准等信息。"}},{"id":878,"type":2,"num":80,"stem":"认证机构自行制定的认证标志的式样、文字和名称，不得与国家推行的认证标志相同或者近似。","opts":null,"ans":"正确","src":{"label":"《汇编》第13页","text":"关文字、符号，误导公众认为其产品、服务已通过认证。第二十五条认证机构可以自行制定认证标志。认证机构自行制定的认证标志的式样、文字和名称，不得违反法律、行政法规的规定，不得与国家推行的认证标志相同或者近似，不得妨碍社会管理，不得有损社会道德风尚。第二十六条认证机构应当对其认证的产品、服务、管理体系实施有效的跟踪调查，认证的产品、服务、管理体系不能持续符合认证要求的，认证机构应当暂停其使用直至撤销认证证书，并予公布。第二十七条为了保护国家安全、防止欺诈行为、保护人体健康或者安全、保护动植物生命或者健康、保护环境，国家规定相关产品必须经过认证的，应当经过认证并标注认证标志后，方可出厂、销售、进口或者在其他经营活动中使用。"}},{"id":879,"type":2,"num":81,"stem":"认证人员自被撤销执业资格之日起5 年内，认可机构不再受理其注册申请。（","opts":null,"ans":"正确","src":{"label":"《汇编》第29页","text":"第七十二条认证人员自被撤销执业资格之日起5 年内，认可机构不再受理其注册申请。第七十三条认证机构未对其认证的产品实施有效的跟踪调查，或者发现其认证的产品不能持续符合认证要求，不及时暂停或者撤销认证证书和要求其停止使用认证标志给消费者造成损失的，与生产者、销售者承担连带责任。第七章附则第七十四条药品生产、经营企业质量管理规范认证，实验动物质量合格认证，军工产品的认证，以及从事军工产品校准、检测的实验室及其人员的认可，不适用本条例。依照本条例经批准的认证机构从事矿山、危险化学品、烟花爆竹生产经营单位管理体系认证，由国务院安全生产监督管理部门结合安全生产的特殊要求组织；从事矿山、危险化学品、烟花爆竹生产经营单位安全生产综合评价的认证机构，经国务院安全生产监督管理部门推荐，方可取得认可机构的认可。"}},{"id":880,"type":2,"num":82,"stem":"未经批准擅自从事认证活动的，予以取缔，处10 万元以上50 万元以下的罚款，有违法所得的，没收违法所得。","opts":null,"ans":"正确","src":{"label":"《汇编》第21页","text":"事项询问认可机构、认证机构、检查机构、实验室的主要负责人，调查了解情况，给予告诫，有关人员应当积极配合。第五十四条县级以上地方人民政府市场监督管理部门在国务院认证认可监督管理部门的授权范围内，依照本条例的规定对认证活动实施监督管理。国务院认证认可监督管理部门授权的县级以上地方人民政府市场监督管理部门，以下称地方认证监督管理部门。第五十五条任何单位和个人对认证认可违法行为，有权向国务院认证认可监督管理部门和地方认证监督管理部门举报。国务院认证认可监督管理部门和地方认证监督管理部门应当及时调查处理，并为举报人保密。第六章法律责任第五十六条未经批准擅自从事认证活动的，予以取缔，处10 万元以上50 万元以下的罚款，有违法所得的，没收违法所得。"}},{"id":881,"type":2,"num":83,"stem":"认证结论经认证人员签字后，由认证机构负责人签署。","opts":null,"ans":"正确","src":{"label":"《汇编》第12页","text":"检查、检测活动，应当完成认证基本规范、认证规则规定的程序，确保认证、检查、检测的完整、客观、真实，不得增加、减少、遗漏程序。认证机构以及与认证有关的检查机构、实验室应当对认证、检查、检测过程作出完整记录，归档留存。第二十二条认证机构及其认证人员应当及时作出认证结论，并保证认证结论的客观、真实。认证结论经认证人员签字后，由认证机构负责人签署。认证机构及其认证人员对认证结果负责。第二十三条认证结论为产品、服务、管理体系符合认证要求的，认证机构应当及时向委托人出具认证证书。第二十四条获得认证证书的，应当在认证范围内使用认证证书和认证标志，不得利用产品、服务认证证书、认证标志和相关文字、符号，误导公众认为其管理体系已通过认证，也不得利用管理体系认证证书、认证标志和相"}},{"id":882,"type":2,"num":84,"stem":"从事评审、审核等认证活动的人员，应当经认可机构注册后，方可从事相应的认证活动。","opts":null,"ans":"正确","src":{"label":"《汇编》第17页","text":"第三十八条从事评审、审核等认证活动的人员，应当经认可机构注册后，方可从事相应的认证活动。第三十九条认可机构应当具有与其认可范围相适应的质量体系，并建立内部审核制度，保证质量体系的有效实施。第四十条认可机构根据认可的需要，可以选聘从事认可评审活动的人员。从事认可评审活动的人员应当是相关领域公认的专家，熟悉有关法律、行政法规以及认可规则和程序，具有评审所需要的良好品德、专业知识和业务能力。第四十一条认可机构委托他人完成与认可有关的具体评审业务的，由认可机构对评审结论负责。第四十二条认可机构应当公开认可条件、认可程序、收费标准等信息。认可机构受理认可申请，不得向申请人提出与认可活动无关的要求或者限制条件。"}},{"id":883,"type":2,"num":85,"stem":"因产品存在缺陷造成损害要求赔偿的诉讼时效期间为二年，自当事人知道或者应当知道其权益受到损害时起计算。","opts":null,"ans":"正确","src":null},{"id":884,"type":2,"num":86,"stem":"销售者应当采取措施，保持销售产品的质量。","opts":null,"ans":"正确","src":null},{"id":885,"type":2,"num":87,"stem":"伪造产品产地的，伪造或者冒用他人厂名、厂址的，伪造或者冒用认证标志等质量标志的，责令改正，没收违法生产、销售的产品，并处违法生产、销售产品货值金额等值以上的罚款。","opts":null,"ans":"错误","src":null},{"id":886,"type":2,"num":88,"stem":"生产者生产产品，不得掺杂、掺假，不得以假充真、以次充好，不得以不合格产品冒充合格产品。","opts":null,"ans":"正确","src":{"label":"《汇编》第5页","text":"行认证后的跟踪检查；对不符合认证标准而使用认证标志的，要求其改正；情节严重的，取消其使用认证标志的资格。第三十条生产者不得伪造产地，不得伪造或者冒用他人的厂名、厂址。第三十一条生产者不得伪造或者冒用认证标志等质量标志。"}},{"id":887,"type":2,"num":89,"stem":"国家鼓励推行科学的质量管理方法，鼓励企业产品质量达到并且超过行业标准、国家标准和国际标准。","opts":null,"ans":"正确","src":null},{"id":888,"type":2,"num":90,"stem":"本法所称产品是指经过加工、制作，用于销售的产品；建设工程不适用本法规定。","opts":null,"ans":"正确","src":null},{"id":889,"type":2,"num":91,"stem":"对依法进行的产品质量监督检查，生产者、销售者可以拒绝。","opts":null,"ans":"错误","src":null},{"id":890,"type":2,"num":92,"stem":"根据监督抽查的需要，可以对产品进行检验；检验抽取样品的数量不得超过检验的合理需要，并可以向被检查人收取检验费用。","opts":null,"ans":"错误","src":{"label":"《汇编》第3页","text":"律的规定执行。国家监督抽查的产品，地方不得另行重复抽查；上级监督抽查的产品，下级不得另行重复抽查。根据监督抽查的需要，可以对产品进行检验。检验抽取样品的数量不得超过检验的合理需要，并不得向被检查人收取检验费用。监督抽查所需检验费用按照国务院规定列支。生产者、销售者对抽查检验的结果有异议的，可以自收到检验结果之日起十五日内向实施监督抽查的产品质量监督部门或者其上级产品质量监督部门申请复检，由受理复检的产品质量监督部门作出复检结论。第十七条依照本法规定进行监督抽查的产品质量不合格的，由实施监督抽查的产品质量监督部门责令其生产者、销售者限期改正。逾期不改正的，由省级以上人民政府产品质量监督部门予以公告；公告后经复查仍不合格的，责令停业，限期整顿；整顿期满后经复查产品"}},{"id":891,"type":2,"num":93,"stem":"裸装的食品和其他根据产品的特点难以附加标识的裸装产品，可以不附加产品标识。","opts":null,"ans":"正确","src":null},{"id":892,"type":2,"num":94,"stem":"产品质量应当检验合格，可以以不合格产品冒充合格产品。","opts":null,"ans":"错误","src":{"label":"《汇编》第1页","text":"中华人民共和国产品质量法（摘录）第四条生产者、销售者依照本法规定承担产品质量责任。第五条禁止伪造或者冒用认证标志等质量标志；禁止伪造产品的产地，伪造或者冒用他人的厂名、厂址；禁止在生产、销售的产品中掺杂、掺假，以假充真，以次充好。第十二条产品质量应当检验合格，不得以不合格产品冒充合格产品。第十四条国家根据国际通用的质量管理标准，推行企业质量体系认证制度。企业根据自愿原则可以向国务院产品质量监督部门认可的或者国务院产品质量监督部门授权的部门认可的认证机构申请企业质量体系认证。"}},{"id":893,"type":2,"num":95,"stem":"强制性标准文本应当免费向社会公开；国家推动免费向社会公开推荐性标准文本。","opts":null,"ans":"正确","src":null},{"id":894,"type":2,"num":96,"stem":"国务院有关行政主管部门、设区的市级以上地方人民政府标准化行政主管部门未依照本法规定对标准进行编号、复审或者备案的，国务院标准化行政主管部门应当要求其说明情况，并限期改正。","opts":null,"ans":"正确","src":null},{"id":895,"type":2,"num":97,"stem":"国家标准分为强制性标准、推荐性标准；行业标准、地方标准是推荐性标准。","opts":null,"ans":"正确","src":null},{"id":896,"type":2,"num":98,"stem":"标准化工作的监督、管理人员滥用职权、玩忽职守、徇私舞弊的，依法给予处分；构成犯罪的，依法追究刑事责任。","opts":null,"ans":"正确","src":{"label":"《汇编》第27页","text":"第六十八条认可机构有下列情形之一的，责令改正；对主要负责人和负有责任的人员给予警告：（一）受理认可申请，向申请人提出与认可活动无关的要求或者限制条件的；（二）未在公布的时间内完成认可活动，或者未公开认可条件、认可程序、收费标准等信息的；（三）发现取得认可的机构不当使用认可证书和认可标志，不及时暂停其使用或者撤销认可证书并予公布的；（四）未对认可过程作出完整记录，归档留存的。第六十九条国务院认证认可监督管理部门和地方认证监督管理部门及其工作人员，滥用职权、徇私舞弊、玩忽职守，有下列行为之一的，对直接负责的主管人员和其他直接责任人员，依法给予降级或者撤职的行政处分；构成犯罪的，依法追究刑事责任：（一）不按照本条例规定的条件和程序，实施批准和指定的；"}},{"id":897,"type":2,"num":99,"stem":"企业研制新产品、改进产品，进行技术改造，应当符合本法规定的标准化要求。","opts":null,"ans":"正确","src":null},{"id":898,"type":2,"num":100,"stem":"强制性标准必须执行，国家鼓励采用推荐性标准。","opts":null,"ans":"正确","src":null},{"id":899,"type":2,"num":101,"stem":"国家鼓励社会团体、企业制定高于推荐性标准相关技术要求的团体标准、企业标准。","opts":null,"ans":"正确","src":null},{"id":900,"type":2,"num":102,"stem":"不符合推荐性标准的产品、服务，不得生产、销售、进口或者提供。","opts":null,"ans":"错误","src":null},{"id":901,"type":2,"num":103,"stem":"推荐性国家标准由国务院标准化行政主管部门制定。","opts":null,"ans":"正确","src":null},{"id":902,"type":2,"num":104,"stem":"标准信息公共服务平台由国家免费向社会开放，企业公开其执行的标准可以自行选择是否公开。","opts":null,"ans":"错误","src":null},{"id":903,"type":2,"num":105,"stem":"依据《认证证书和认证标志管理办法》，获得认证的产品、服务、管理体系发生重大变化时，获得认证的组织和个人应当向认证机构申请变更，未变更或者经认证机构调查发现不符合认证要求的，不得继续使用该认证证书。","opts":null,"ans":"正确","src":{"label":"《汇编》第101页","text":"等活动中正确使用认证证书和有关信息。获得认证的产品、服务、管理体系发生重大变化时，获得认证的组织和个人应当向认证机构申请变更，未变更或者经认证机构调查发现不符合认证要求的，不得继续使用该认证证书。第十一条认证机构应当建立认证证书管理制度，对获得认证的组织和个人使用认证证书的情况实施有效跟踪调查，对不能符合认证要求的，应当暂停其使用直至撤销认证证书，并予以公布；对撤销或者注销的认证证书予以收回；无法收回的，予以公布。第十二条不得利用产品认证证书和相关文字、符号误导公众认为其服务、管理体系通过认证；不得利用服务认证证书和相关文字、符号误导公众认为其产品、管理体系通过认证；不得利用管理体系认证证书和相关文字、符号，误导公众认为其产品、服务通过认证。"}},{"id":904,"type":2,"num":106,"stem":"依据《认证证书和认证标志管理办法》，属于认证机构自行制定的认证标志。","opts":null,"ans":"错误","src":{"label":"《汇编》第107页","text":"应当责令其改正，处以3 万元罚款。第二十七条违反本办法规定，非法买卖或者转让认证证书的，县级以上地方市场监督管理部门责令其改正，处以3 万元罚款；认证机构向未通过认证的认证委托人出卖或转让认证证书的，依照条例第六十一条规定处罚。第二十八条认证机构自行制定的认证标志违反本办法第十五条规定的，依照条例第六十条规定处罚；违反其他法律、行政法规规定的，依照其他法律、行政法规处罚。第二十九条认证机构发现其认证的产品、服务、管理体系不能持续符合认证要求，不及时暂停其使用认证证书和认证标志，或者不及时撤销认证证书或者停止其使用认证标志的，依照条例第五十九条规定处罚。"}},{"id":905,"type":2,"num":107,"stem":"依据《认证证书和认证标志管理办法》，强制性认证标志和认证机构自行制定的认证标志属于国家专有认证标志。","opts":null,"ans":"错误","src":{"label":"《汇编》第102页","text":"第三章认证标志第十三条认证标志分为强制性认证标志和自愿性认证标志。自愿性认证标志包括国家统一的自愿性认证标志和认证机构自行制定的认证标志。强制性认证标志和国家统一的自愿性认证标志属于国家专有认证标志。认证机构自行制定的认证标志是指认证机构专有的认证标志。第十四条强制性认证标志和国家统一的自愿性认证标志的制定和使用，由国家市场监督管理总局依法规定，并予以公布。第十五条认证机构自行制定的认证标志的式样（包括使用的符号）、文字和名称，应当遵守以下规定：（一）不得与强制性认证标志、国家统一"}},{"id":906,"type":2,"num":108,"stem":"依据《认证证书和认证标志管理办法》，未通过认证，但在其产品或者产品包装上、广告等其他宣传中，使用虚假文字表明其通过认证的，县级以上地方市场监督管理部门应当按伪造、冒用认证标志的违法行为进行处罚。","opts":null,"ans":"正确","src":{"label":"《汇编》第106页","text":"证证书和认证标志使用等相关信息，以便于公众进行查询和社会监督。第二十四条任何单位和个人对伪造、冒用、转让和非法买卖认证证书和认证标志等违法、违规行为可以向市场监督管理部门举报。第五章罚则第二十五条违反本办法第十二条规定，对混淆使用认证证书和认证标志的，县级以上地方市场监督管理部门应当责令其限期改正，逾期不改的处以2 万元以下罚款。未通过认证，但在其产品或者产品包装上、广告等其他宣传中，使用虚假文字表明其通过认证的，县级以上地方市场监督管理部门应当按伪造、冒用认证标志的违法行为进行处罚。"}},{"id":907,"type":2,"num":109,"stem":"依据《认证证书和认证标志管理办法》，国家市场监督管理总局依法负责所辖区域内的认证证书和认证标志的监督检查工作。","opts":null,"ans":"错误","src":{"label":"《汇编》第98页","text":"服务、管理体系通过认证所获得的证明性文件。认证证书包括产品认证证书、服务认证证书和管理体系认证证书。本办法所称的认证标志是指证明产品、服务、管理体系通过认证的专有符号、图案或者符号、图案以及文字的组合。认证标志包括产品认证标志、服务认证标志和管理体系认证标志。第三条本办法适用于认证证书和认证标志的制定、发布、使用和监督检查。第四条国家市场监督管理总局依法负责认证证书和认证标志的管理、监督和综合协调工作。"}},{"id":908,"type":2,"num":110,"stem":"依据《认证证书和认证标志管理办法》，禁止伪造、冒用、转让和非法买卖认证证书和认证标志。","opts":null,"ans":"正确","src":{"label":"《汇编》第105页","text":"况下方可在产品的包装上标注管理体系认证标志。第四章监督检查第二十一条国家市场监督管理总局组织县级以上地方市场监督管理部门对认证证书和认证标志的使用情况实施监督检查，对伪造、冒用、转让和非法买卖认证证书和认证标志的违法行为依法予以查处。第二十二条国家市场监督管理总局对认证机构的认证证书和认证标志管理情况实施监督检查。认证机构应当对其认证证书和认证标志的管理情况向国家市场监督管理总局提供年度报告。"}},{"id":909,"type":2,"num":111,"stem":"依据《认证及认证培训、咨询人员管理办法》，新领域没有注册制度，机构可以自行开展人员执业，不需要确认。","opts":null,"ans":"错误","src":{"label":"《汇编》第119页","text":"认证及认证培训、咨询人员管理办法第一条为规范认证及认证培训、咨询人员的执业行为，加强对认证市场的管理，根据《中华人民共和国认证认可条例》，制定本办法。第二条本办法所称的认证及认证培训、咨询人员，是指管理体系认证审核员、产品认证检查员、认证培训教员和认证咨询师等从事认证及认证培训、咨询活动的人员，以及认证及认证培训、咨询机构的业务管理人员。本办法所称认证及认证培训、咨询人员执业，是指受聘于认证及认证培训、咨询机构的人员从事的认证及认证培训、咨询和业务管理的活动。"}},{"id":910,"type":2,"num":112,"stem":"依据《认证及认证培训、咨询人员管理办法》，被停止执业、撤销执业资格的人员应当对外予以公布。","opts":null,"ans":"正确","src":{"label":"《汇编》第128页","text":"销执业资格之日起5 年内，中国认证人员与培训机构国家认可委员会不再受理其注册申请。第二十条国家市场监督管理总局对被停止执业、撤销执业资格的认证及认证培训、咨询人员予以公布。"}},{"id":911,"type":2,"num":113,"stem":"依据《认证及认证培训、咨询人员管理办法》，认证咨询机构的执业人员不得从事认证活动。","opts":null,"ans":"正确","src":{"label":"《汇编》第122页","text":"专职认证及认证培训、咨询人员是指将认证及认证培训、咨询和有关业务管理活动作为本职工作，与1 个认证、认证培训或者认证咨询机构签订劳务合同，并固定在该机构工作的人员；兼职认证及认证培训、咨询人员是指在不脱离本职工作的情况下与1 个认证、认证培训或者认证咨询机构签订劳务合同，从事认证、认证培训或者认证咨询活动的人员。国家公务员不得从事认证、认证咨询和认证培训活动。第八条认证人员从事认证活动应当在1 个认证机构执业，不得同时在2 个或者2 个以上认证机构执业。在认证机构执业的专职或者兼职认证人员，具备相关认证培训教员资格的，经所在认证机构与认证培训机构签订合同后，可以在1 个认证培训机构从事认证培训活动。"}},{"id":912,"type":2,"num":114,"stem":"依据《认证及认证培训、咨询人员管理办法》，认证人员取得培训教员资质，经签约后，可以在一个培训机构开展培训。","opts":null,"ans":"正确","src":{"label":"《汇编》第118页","text":"认证及认证培训、咨询人员管理办法（2004 年5 月24 日国家质量监督检验检疫总局令第61 号公布根据2022 年9 月29 日国家市场监督管理总局令第61 号修订）"}},{"id":913,"type":2,"num":115,"stem":"认证机构违反规定，增加、减少、遗漏程序要求的，依照《认证认可条例》第六十条的规定进行处罚；认证机构被责令停业整顿的，停业整顿期限为6 个月。","opts":null,"ans":"正确","src":{"label":"《汇编》第95页","text":"认证机构被责令停业整顿的，停业整顿期限为6个月，期间不得从事认证活动。认证机构增加、减少、遗漏程序要求，情节轻微且不影响认证结论的客观、真实或者认证有效性的，应当责令其限期改正。逾期未改正或者经改正仍不符合要求的，依照前款规定进行处罚。第四十条认证机构违反本办法第十八条规定，出具虚假或者严重失实认证结论的，依照《认证认可条例》第六十二条的规定进行处罚。第四十一条认证机构违反《认证认可条例》等有关法律、行政法规规定的，依照相关规定追究其法律责任。"}},{"id":914,"type":2,"num":116,"stem":"本办法自2018 年1 月1 日起施行。","opts":null,"ans":"正确","src":{"label":"《汇编》第96页","text":"舞弊、玩忽职守等违法行为的，依法给予行政处分；构成犯罪的，依法追究刑事责任。第六章附则第四十三条本办法中国务院认证认可监督管理部门实施行政许可的期限以工作日计算，不含法定节假日。第四十四条香港、澳门和台湾地区在大陆的投资企业取得认证机构资质，依照本办法第八条的规定办理，并遵守本办法规定。第四十五条本办法由国务院认证认可监督管理部门负责解释。第四十六条本办法自2018 年1 月1 日起施行。国家质检总局2011 年7 月20 日公布的《认证机构管理办法》、2015 年5 月11 日公布的《国家质量监督检验检疫总局关于修改〈认证机构管理办法〉的决定》同时废止。"}},{"id":915,"type":2,"num":117,"stem":"认证机构可以在批准范围外从事认证活动。","opts":null,"ans":"错误","src":{"label":"《汇编》第11页","text":"第十七条认证机构应当按照认证基本规范、认证规则从事认证活动。认证基本规范、认证规则由国务院认证认可监督管理部门制定；涉及国务院有关部门职责的，国务院认证认可监督管理部门应当会同国务院有关部门制定。属于认证新领域，前款规定的部门尚未制定认证规则的，认证机构可以自行制定认证规则，并报国务院认证认可监督管理部门备案。第十八条任何法人、组织和个人可以自愿委托依法设立的认证机构进行产品、服务、管理体系认证。第十九条认证机构不得以委托人未参加认证咨询或者认证培训等为理由，拒绝提供本认证机构业务范围内的认证服务，也不得向委托人提出与认证活动无关的要求或者限制条件。第二十条认证机构应当公开认证基本规范、认证规则、收费标准等信息。"}},{"id":916,"type":2,"num":118,"stem":"取得认证机构资质，应当符合的条件包括注册资本不得少于人民币300 万元、有10名以上相应领域的专职认证人员。","opts":null,"ans":"正确","src":{"label":"《汇编》第8页","text":"第八条从事认证认可活动的机构及其人员，对其所知悉的国家秘密和商业秘密负有保密义务。第二章认证机构第九条取得认证机构资质，应当经国务院认证认可监督管理部门批准，并在批准范围内从事认证活动。未经批准，任何单位和个人不得从事认证活动。第十条取得认证机构资质，应当符合下列条件：（一）取得法人资格；（二）有固定的场所和必要的设施；（三）有符合认证认可要求的管理制度；（四）注册资本不得少于人民币300 万元；（五）有10 名以上相应领域的专职认证人员。"}},{"id":917,"type":2,"num":119,"stem":"本办法根据《中华人民共和国认证认可条例》等有关法律、行政法规的规定制定。","opts":null,"ans":"正确","src":{"label":"《汇编》第30页","text":"第七十五条认证认可收费，应当符合国家有关价格法律、行政法规的规定。第七十六条认证培训机构、认证咨询机构的管理办法由国务院认证认可监督管理部门制定。第七十七条本条例自2003 年11 月1 日起施行。"}},{"id":918,"type":2,"num":120,"stem":"认证机构应当在每年3 月底之前向国务院认证认可监督管理部门提交上一年度工作报告和社会责任报告，并保证其真实、有效。","opts":null,"ans":"正确","src":{"label":"《汇编》第86页","text":"保存具有法律效力的原件。第二十三条认证机构应当及时向国务院认证认可监督管理部门报送以下信息，并保证其真实、有效：（一）认证计划信息；（二）与认证结果相关的认证活动、认证人员、认证对象信息；（三）认证证书的有效、暂停、注销或者撤销状态信息；（四）设立承担其认证活动的分支机构信息。认证机构在获得批准的认证领域内，与境外认证机构签订认证结果仅在境外使用的分包合约，应当自签订分包合约之日起10 日内向国务院认证认可监督管理部门报送信息。"}},{"id":919,"type":2,"num":121,"stem":"认证记录和认证资料应当真实、准确，归档留存时间为认证证书有效期届满或者被注销、撤销之日起2 年以上，认证记录应当使用中文。","opts":null,"ans":"正确","src":{"label":"《汇编》第85页","text":"确使用认证证书和认证标志，对未按照规定使用的，认证机构应当采取有效的纠正措施。第二十一条认证机构应当对其认证的产品、服务、管理体系实施有效的跟踪监督。不能持续符合认证要求的，认证机构应当在确认相关情况后5 日内，暂停认证对象相应的认证证书。暂停期限届满仍不符合要求的，应当撤销其相应认证证书。暂停期限按照认证规则的相关规定执行。第二十二条认证机构应当对认证过程做出完整记录，保留相应认证资料。认证记录和认证资料应当真实、准确，归档留存时间为认证证书有效期届满或者被注销、撤销之日起2 年以上，认证记录应当使用中文。"}},{"id":920,"type":2,"num":122,"stem":"本办法所称认证机构，是指依法取得资质，对产品、服务和管理体系是否符合标准、相关技术规范要求，独立进行合格评定的具有法人资格的证明机构。","opts":null,"ans":"正确","src":{"label":"《汇编》第76页","text":"认证机构管理办法（2017 年11 月14 日国家质量监督检验检疫总局令第193 号公布，根据2020 年10 月23日国家市场监督管理总局令第31 号修订）第一章总则第一条为了加强对认证机构的监督管理，规范认证活动，提高认证有效性，根据《中华人民共和国认证认可条例》（以下简称《认证认可条例》）等有关法律、行政法规的规定，制定本办法。第二条本办法所称认证机构，是指依法取得资质，对产品、服务和管理体系是否符合标准、相关技术规范要求，独立进行合格评定的具有法人资格的证明机构。"}},{"id":921,"type":2,"num":123,"stem":"隐瞒有关情况或者提供虚假材料申请认证机构资质的，国务院认证认可监督管理部门不予受理或者不予批准，并给予警告；申请人在1 年内不得再次申请认证机构资质。","opts":null,"ans":"正确","src":{"label":"《汇编》第93页","text":"材料申请认证机构资质的，国务院认证认可监督管理部门不予受理或者不予批准，并给予警告；申请人在1 年内不得再次申请认证机构资质。第三十七条认证机构有下列情形之一的，国务院认证认可监督管理部门应当责令其限期改正，给予警告并予公布：（一）未依照本办法第十条第二款规定，将认证规则相关信息报国务院认证认可监督管理部门备案的；（二）未依照本办法第十一条规定，办理变更手续的；（三）未依照本办法第十四条规定，认证人员能力不能持续符合国家职业资格的相关要求，或者聘用国家法律法规和国家政策禁止或者限制从事认证活动的人员的；（四）未依照本办法第二十三条、第二十"}},{"id":922,"type":2,"num":124,"stem":"《认证机构批准书》有效期为6 年。","opts":null,"ans":"正确","src":{"label":"《汇编》第80页","text":"属于认证新领域，国务院认证认可监督管理部门尚未制定认证规则的，认证机构可以自行制定认证规则，并在认证规则发布后30 日内，将认证规则相关信息报国务院认证认可监督管理部门备案。第十一条认证机构有下列情形之一的，应当自变更之日起30 日内，向国务院认证认可监督管理部门申请办理《认证机构批准书》变更手续：（一）缩小批准认证领域的；（二）变更法人性质、股东、注册资本的；（三）合并或者分立的；（四）变更名称、住所、法定代表人的。"}},{"id":923,"type":2,"num":125,"stem":"依据《认监委关于强制性产品认证依据用标准修订时有关要求的公告》（2012 年第4 号），各申请强制性产品认证的组织或已获强制性产品认证的组织，应按照受理认证或发证的指定认证机构发布的实施方案进行认证申请或换版申请。","opts":null,"ans":"正确","src":{"label":"《汇编》第280页","text":"详细、准确的关于标准主要变化情况的相关信息。三、对于新修订的认证依据用标准将引起强制性产品认证的有关政策、目录范围改变的情况，由我委统一发布相关要求的公告。四、标准修订后的认证收费须执行国家发改委规定的现行有效的收费标准。五、各申请强制性产品认证的组织或已获强制性产品认证的组织，应按照受理认证或发证的指定认证机构发布的实施方案进行认证申请或换版申请。六、各相关指定实验室应在执行新版标准前，向我委认证监管部上报依据新版标准检测能力情况，以及获得实验室资质认定和认可的情况。"}},{"id":924,"type":2,"num":126,"stem":"依据《认监委关于强制性产品认证依据用标准修订时有关要求的公告》（2012 ，但不能超过5 年。"}},{"id":934,"type":2,"num":136,"stem":"依据CNCA-00C-002:2009《强制性产品认证实施规则中涉及ODM 模式的补充规定》，本规定适用于ODM 模式强制性产品认证的实施及管理，不包括安防、消防类产品。","opts":null,"ans":"正确","src":{"label":"《汇编》第160页","text":"强制性产品认证实施规则中涉及ODM 模式的补充规定1.目的为规范和明确强制性产品认证(以下简称CCC 认证)ODM 模式开展认证活动中的有关事项和要求，加强对ODM 模式强制性产品认证实施过程和结果的控制，确保强制性产品认证有效性，制定本规定。2.适用范围及定义本规定适用于ODM 模式强制性产品认证（不包括安防、消防类产品）的实施及管理。ODM模式相关定义如下：ODM 生产厂：利用同一质量保证能力要求、同一产品设计、生产过程控制及检验要求等，为一个或多个制造商设计、加工、生产相同产"}},{"id":935,"type":2,"num":137,"stem":"依据CNCA-00C-002:2009《强制性产品认证实施规则中涉及ODM 模式的补充规定》，对于因产品或工厂检查不合格而被暂停的ODM 认证证书的恢复申请，须由ODM 初始认证证书持证人提出。在指定认证机构按相关程序批准恢复ODM 初始认证证书后，其它ODM 认证证书持证人方可提交证书恢复申请。","opts":null,"ans":"正确","src":{"label":"《汇编》第166页","text":"产品检测或工厂检查不合格）而被暂停/注销/撤销时，指定认证机构应同时暂停/注销/撤销所有相关的ODM 认证证书，并通知认证证书持证人。8.5 当与认证产品相关的ODM 初始认证证书发生变更，其它ODM 认证证书持证人未按5.2条款要求申请认证变更并获得批准的，指定认证机构应暂停相关ODM 认证证书，并通知认证证书持证人。8.6 对于因产品或工厂检查不合格而被暂停的ODM 认证证书的恢复申请，须由ODM 初始认证证书持证人提出。在指定认证机构按相关程序批准恢复ODM 初始认证证书后，其它ODM认证证书持证人方可提交证书恢复申请。"}},{"id":936,"type":2,"num":138,"stem":"依据CNCA-00C-002:2009《强制性产品认证实施规则中涉及ODM 模式的补充规定》，当ODM 生产厂连续12 个月未批量生产协议制造商的ODM 认证产品，ODM 生产厂应在1 个月内向指定认证机构备案。","opts":null,"ans":"正确","src":{"label":"《汇编》第163页","text":"证证书持证人提出，经认证机构按相关程序批准后，其它ODM 认证证书持证人须在一个月内提交认证变更申请。6.ODM 生产厂的认证管理要求6.1ODM 生产厂应保留与ODM 制造商关于ODM 产品认证及生产的相关记录，具体如下：1) 生产厂与制造商之间的相关ODM 协议。2) 生产厂为其制造商生产ODM 认证产品的相关记录。包括：生产日期、生产数量等。3) 制造商产品质量反馈记录（必要时）。4) 生产厂对ODM 制造商生产产品的出厂检验记录。5) 生产厂接受ODM 制造商产品的记录，适用时包括：CCC 认证标志、包装、铭牌等。"}},{"id":937,"type":2,"num":139,"stem":"依据CNCA-00C-002:2009《强制性产品认证实施规则中涉及ODM 模式的补充规定》，以ODM 认证方式获得认证证书的持有人，不得将认证结果作为其它生产厂申请认证的依据。","opts":null,"ans":"正确","src":{"label":"《汇编》第162页","text":"制造商的ODM 协议。2)ODM 生产厂与ODM 制造商关于认证与产品质量安全责任的相关协议。3)ODM 产品铭牌（外部标识）、说明书。4)ODM 初始认证产品认证证书及型式试验报告复印件。5)其它必要资料。4.2 指定认证机构对认证委托人提交的资料按相关程序进行受理并核查其真实性，根据相关规定核查合格后颁发认证证书。指定认证机构应确保ODM 认证证书及认证结果的真实性和可追溯性。5.ODM 认证证书的变更5.1 以ODM 认证方式获得认证证书的持有人，不得将认证结果作为其它生产厂申请认证的依据。"}},{"id":938,"type":2,"num":140,"stem":"依据CNCA-00C-002:2009《强制性产品认证实施规则中涉及ODM 模式的补充规定》，当ODM 生产厂或任一ODM 制造商由于ODM 产品或工厂检查不合格认证证书被暂停或撤销时，指定认证机构应同时暂停或撤销所有相关的ODM 认证证书，并通知认证证书持证人。","opts":null,"ans":"正确","src":{"label":"《汇编》第165页","text":"效控制的能力。7.7 ODM 制造商应保留ODM 生产厂认证产品接收记录。8.认证证书的暂停、恢复、撤销、注销8.1 对不满足本规定要求的ODM 生产厂及制造商，指定认证机构应根据相关规定采取通知其整改、暂停或撤销认证证书的措施。8.2 当ODM 生产厂或任一ODM 制造商由于ODM 产品或工厂检查不合格认证证书被暂停或撤销时，指定认证机构应同时暂停或撤销所有相关的ODM 认证证书，并通知认证证书持证人。8.3 当某一ODM 制造商因连续12 个月未批量委托ODM 生产厂生产认证产品而造成不能满足证后年度监督检查要求时，指定认证机构应暂停标有该ODM 制造商的产品认证证书，并通知认证证书持证人。"}},{"id":939,"type":2,"num":141,"stem":"依据《强制性产品认证检查员管理办法》，检查员注册证书终身有效，不需要年度确认。","opts":null,"ans":"错误","src":{"label":"《汇编》第109页","text":"强制性产品认证检查员管理办法国家认监委公告[2004]年第29 号《强制性产品认证检查员管理办法》经2004 年11 月23 日国家认监委主任办公会议审议通过，现予公告，自2005 年3 月1 日起施行。"}},{"id":940,"type":2,"num":142,"stem":"依据《强制性产品认证检查员管理办法》，检查员年度确认不通过，仍然可以继续从事检查活动。","opts":null,"ans":"错误","src":{"label":"《汇编》第109页","text":"强制性产品认证检查员管理办法国家认监委公告[2004]年第29 号《强制性产品认证检查员管理办法》经2004 年11 月23 日国家认监委主任办公会议审议通过，现予公告，自2005 年3 月1 日起施行。"}},{"id":941,"type":2,"num":143,"stem":"依据《强制性产品认证检查员管理办法》，任何单位个人有权举报检查员违法违规行为，受理部门应当为举报人保密。","opts":null,"ans":"正确","src":{"label":"《汇编》第115页","text":"会应当对其进行年度确认。第十六条指定的强制性产品认证机构、检查机构应当建立强制性产品认证检查员管理制度，对强制性产品认证检查员的选用、业务培训、年度考核等进行严格管理，并将上述管理情况报国家认监委备案。第十七条国家认监委应当对强制性产品认证检查员进行监督检查，监督方式可以采取通过问卷调查和专项检查等形式。第十八条任何单位和个人对强制性产品认证检查员在检查活动中的违法违规行为，有权向国家认监委和地方认证监督管理部门举报。国家认监委和地方认证监督管理部门应当及时调查处理，并为举报人保密。"}},{"id":942,"type":2,"num":144,"stem":"依据《强制性产品认证检查员管理办法》，特定领域检查员，可制定补充注册规定，报国家认监委备案后实施。","opts":null,"ans":"正确","src":{"label":"《汇编》第109页","text":"强制性产品认证检查员管理办法国家认监委公告[2004]年第29 号《强制性产品认证检查员管理办法》经2004 年11 月23 日国家认监委主任办公会议审议通过，现予公告，自2005 年3 月1 日起施行。"}},{"id":943,"type":2,"num":145,"stem":"依据《强制性产品认证检查员管理办法》，高级检查员注册除年限外，还需要检查及组长工作经历。","opts":null,"ans":"正确","src":{"label":"《汇编》第109页","text":"强制性产品认证检查员管理办法国家认监委公告[2004]年第29 号《强制性产品认证检查员管理办法》经2004 年11 月23 日国家认监委主任办公会议审议通过，现予公告，自2005 年3 月1 日起施行。"}},{"id":944,"type":2,"num":146,"stem":"依据《强制性产品认证检查员管理办法》，检查员可以在未被指定的机构委派下独立开展CCC 工厂检查。","opts":null,"ans":"错误","src":{"label":"《汇编》第109页","text":"强制性产品认证检查员管理办法国家认监委公告[2004]年第29 号《强制性产品认证检查员管理办法》经2004 年11 月23 日国家认监委主任办公会议审议通过，现予公告，自2005 年3 月1 日起施行。"}},{"id":945,"type":2,"num":147,"stem":"依据《强制性产品认证机构和实验室管理办法》，指定认证机构不得歧视、刁难认证委托人，不得牟取不当利益。","opts":null,"ans":"正确","src":{"label":"《汇编》第71页","text":"的实验室签署书面协议，明确各自的权利义务和法律责任，并保证其使用的实验室的检测活动符合国家强制性产品认证规范和认证规则的要求，保证其使用的实验室（包括同一法人内的）享有平等权利和履行同等义务。第二十七条指定的认证机构、实验室为同一个法人时，指定的机构应当制订相关管理制度并保证其持续有效运行，保证认证、检测活动独立实施，保证认证人员、检测人员独立开展活动。第二十八条指定的认证机构、实验室应当在指定的业务范围内从事强制性产品认证活动，保证为认证委托人提供及时、有效的认证、检测服务，不得歧视、刁难认证委托人，不得牟取不当利益。"}},{"id":946,"type":2,"num":148,"stem":"依据《强制性产品认证机构和实验室管理办法》，本办法适用于中国境内强制性产品认证机构、实验室的指定和监督管理。","opts":null,"ans":"正确","src":{"label":"《汇编》第61页","text":"强制性产品认证机构和实验室管理办法第一章总则第一条为规范强制性产品认证机构、实验室的管理，合理利用社会资源，保证强制性产品认证制度的有效实施，根据《中华人民共和国认证认可条例》（以下简称条例）的规定，制定本办法。第二条本办法所称的强制性产品认证机构、实验室是指从事强制性产品认证以及相关活动的认证机构、实验室。第三条本办法适用于中华人民共和国境内的强制性产品认证机构、实验室的指定和监督管理。"}},{"id":947,"type":2,"num":149,"stem":"依据《强制性产品认证机构和实验室管理办法》，指定机构提交年度工作报告是法定义务。","opts":null,"ans":"正确","src":{"label":"《汇编》第60页","text":"国家质检总局第65 号令强制性产品认证机构和实验室管理办法（2004 年6 月23 日国家质量监督检验检疫总局令第65 号公布根据2022 年9 月29 日国家市场监督管理总局令第61 号修订）。"}},{"id":948,"type":2,"num":150,"stem":"依据《强制性产品认证机构和实验室管理办法》，未经国家市场监督管理总局指定，实验室也可以从事强制性产品认证相关检测活动。","opts":null,"ans":"错误","src":{"label":"《汇编》第60页","text":"国家质检总局第65 号令强制性产品认证机构和实验室管理办法（2004 年6 月23 日国家质量监督检验检疫总局令第65 号公布根据2022 年9 月29 日国家市场监督管理总局令第61 号修订）。"}},{"id":949,"type":2,"num":151,"stem":"依据《强制性产品认证机构和实验室管理办法》，专家委员会属于常设机构，评审结束继续保留。","opts":null,"ans":"错误","src":{"label":"《汇编》第60页","text":"国家质检总局第65 号令强制性产品认证机构和实验室管理办法（2004 年6 月23 日国家质量监督检验检疫总局令第65 号公布根据2022 年9 月29 日国家市场监督管理总局令第61 号修订）。"}},{"id":950,"type":2,"num":152,"stem":"依据《强制性产品认证机构和实验室管理办法》，有利害关系的专家委员会成员必须回避评审。","opts":null,"ans":"正确","src":{"label":"《汇编》第60页","text":"国家质检总局第65 号令强制性产品认证机构和实验室管理办法（2004 年6 月23 日国家质量监督检验检疫总局令第65 号公布根据2022 年9 月29 日国家市场监督管理总局令第61 号修订）。"}},{"id":951,"type":2,"num":153,"stem":"依据《强制性产品认证机构和实验室管理办法》，指定机构国际互认活动可以不受国内监管框架约束。","opts":null,"ans":"错误","src":{"label":"《汇编》第60页","text":"国家质检总局第65 号令强制性产品认证机构和实验室管理办法（2004 年6 月23 日国家质量监督检验检疫总局令第65 号公布根据2022 年9 月29 日国家市场监督管理总局令第61 号修订）。"}},{"id":952,"type":2,"num":154,"stem":"依据《强制性产品认证机构和实验室管理办法》，指定机构可以利用强制认证资格随意开发自愿性认证业务，不需要区分。","opts":null,"ans":"错误","src":{"label":"《汇编》第60页","text":"国家质检总局第65 号令强制性产品认证机构和实验室管理办法（2004 年6 月23 日国家质量监督检验检疫总局令第65 号公布根据2022 年9 月29 日国家市场监督管理总局令第61 号修订）。"}},{"id":953,"type":2,"num":155,"stem":"依据《强制性产品认证机构和实验室管理办法》，指定机构因虚假证明被撤销指定，3 年内不得再次申请指定。","opts":null,"ans":"正确","src":{"label":"《汇编》第60页","text":"国家质检总局第65 号令强制性产品认证机构和实验室管理办法（2004 年6 月23 日国家质量监督检验检疫总局令第65 号公布根据2022 年9 月29 日国家市场监督管理总局令第61 号修订）。"}},{"id":954,"type":2,"num":156,"stem":"依据《强制性产品认证机构和实验室管理办法》，国家市场监督管理总局可以组织同行评议，并且公布评议结果。","opts":null,"ans":"正确","src":{"label":"《汇编》第60页","text":"国家质检总局第65 号令强制性产品认证机构和实验室管理办法（2004 年6 月23 日国家质量监督检验检疫总局令第65 号公布根据2022 年9 月29 日国家市场监督管理总局令第61 号修订）。"}},{"id":955,"type":2,"num":157,"stem":"依据《强制性产品认证机构服务工作规范指南》，认证机构可以服务费、会员制等方式提供便利化或者差别化认证服务。","opts":null,"ans":"错误","src":{"label":"《强制性产品认证机构服务工作规范指南》第1页","text":"强制性产品认证机构服务工作规范指南  为进一步规范强制性产品认证（CCC 认证）指定认证机构（以下简称认证机构）服务活动，提高CCC 认证实施过程中的服务质量，压实认证机构发证主体责任，推动CCC 认证制度的权威性、公信力和友好性提升，现制定工作规范指南如下：  一、依法提供认证服务 （一）认证机构应当严格遵守《中华人民共和国认证认可条例》《强制性产品认证管理规定》《强制性产品认证机构和实验室管理办法》《认证机构管理办法》《认证及认证培训、咨询人员管理办法》《强制性产品认证检查员管理办法》等行政法规、部门规章和行政规范性文件的规定，合法合规提供必要的政策解读宣贯和程序指导服务，不得影响CCC 认证的公正性、有效性。"}},{"id":956,"type":2,"num":158,"stem":"依据《强制性产品认证机构服务工作规范指南》，认证机构应当建立完整的服务留存制度，对服务合同、服务记录、辅导性文件及相关证明材料进行真实、准确、完整的记录和存档，确保服务全过程可追溯、可核查。","opts":null,"ans":"正确","src":{"label":"《强制性产品认证机构服务工作规范指南》第5页","text":"四、建立长效服务机制  （十九）认证机构应当规范CCC 认证收费行为，认证费用及相关检测费用应当在认证机构、认证委托人、生产者、生产企业和承担检测任务的实验室之间直接结算，不得通过第三方中介代理机构代收或者转付。  （二十）认证机构应当建立合理的成本测算机制，依据核算情况确定、公开认证收费标准，并严格按照标准执行。 （二十一）认证机构应当加强中介代理机构管理，在认证实施过程中发现中介代理机构代写委托资料、体系文件或者记录，派员参与或者干预工厂检查活动等情形，应当立即终止当前的认证活动，直到中介代理机构不再参与本条款所提及的相关活动后方可恢复认证活动。 （二十二）认证机构应当通过信息化手段加强服务过程管理，建立完整的服务留存制度，对服务合同、服务记录、辅导性文件及相关证明材料进行真实、准确、完整的记录和存档，确保服务全过程可追溯、可核查。"}},{"id":957,"type":2,"num":159,"stem":"认证委托人对认证机构的认证决定有异议的，可以向认证机构提出申诉。","opts":null,"ans":"正确","src":{"label":"《汇编》第54页","text":"第四十六条从事强制性产品认证活动的人员出具虚假或者不实结论，编造虚假或者不实文件、记录的，予以撤销执业资格；自撤销之日起5 年内，中国认证认可协会认证人员注册机构不再受理其注册申请。第四十七条认证委托人对认证机构的认证决定有异议的，可以向认证机构提出申诉。第四十八条任何单位和个人对强制性产品认证活动中的违法违规行为，有权向市场监督管理部门举报，市场监督管理部门应当及时调查处理，并为举报人保密。第五章罚则第四十九条列入目录的产品未经认证，擅自出厂、销售、进口或者在其他经营活动中使用的，由县级以上地方市场监督管理部门依照认证认可条例第六十六条规定予以处罚。"}},{"id":958,"type":2,"num":160,"stem":"认证机构、实验室被责令停业整顿的，停业整顿期间不得从事指定范围内的强制性产品认证、检测活动。","opts":null,"ans":"正确","src":{"label":"《汇编》第52页","text":"停业整顿期间不得从事指定范围内的强制性产品认证、检测活动：（一）增加、减少、遗漏或者变更认证基本规范、认证规则规定的程序的；（二）未对其认证的产品实施有效的跟踪调查，或者发现其认证的产品不能持续符合认证要求，不及时暂停或者撤销认证证书并予以公布的；（三）未对认证、检测过程作出完整记录，归档留存，情节严重的；（四）使用未取得相应资质的人员从事认证、检测活动的，情节严重的；（五）未对认证委托人提供样品的真实性进行有效审查的；（六）阻挠、干扰监管部门认证执法检查的；（七）对不属于目录内产品进行强制性产"}},{"id":959,"type":2,"num":161,"stem":"任何单位和个人不得伪造、变造、冒用、买卖和转让认证证书和认证标志。","opts":null,"ans":"正确","src":{"label":"《汇编》第47页","text":"标注认证标志。第三十三条任何单位和个人不得伪造、变造、冒用、买卖和转让认证证书和认证标志。第四章监督管理第三十四条市场监管总局对认证机构、实验室的认证、检测活动实施年度监督检查和不定期的专项监督检查。第三十五条认证机构应当将获证产品的认证委托人、获证产品及其生产企业，以及认证证书被注销、暂停或者撤销的信息向市场监管总局和省级市场监督管理部门进行通报。第三十六条市场监管总局统一计划，采取定期或者不定期的方式对获证产品进行监督检查。"}},{"id":960,"type":2,"num":162,"stem":"指定的认证机构可以向其他机构转让指定的强制性产品认证业务。","opts":null,"ans":"错误","src":{"label":"《汇编》第70页","text":"第四章行为规范第二十三条经国家市场监督管理总局指定的强制性产品认证机构、实验室（以下简称指定的认证机构、实验室）应当在指定范围内按照认证基本规范和认证规则的要求为认证委托人提供服务，不得转让或者变相转让指定的认证、检测业务。第二十四条指定的认证机构、实验室应当制订管理制度和程序，对强制性产品认证、检测活动和自愿性产品认证、委托检测活动明确区分，不得利用其指定的资格，开发或者从事自愿性产品认证以及检测业务。第二十五条指定的认证机构在对外宣传中应当严格区分强制性产品认证业务与自愿性产品认证业务。"}},{"id":961,"type":2,"num":163,"stem":"认证证书有效期为5 年；认证证书有效期届满，需要延续使用的，认证委托人应当在认证证书有效期届满前90 天内申请办理。","opts":null,"ans":"正确","src":{"label":"《汇编》第41页","text":"41（七）发证日期和有效期限；（八）发证机构；（九）证书编号；（十）其他需要标注的内容。第二十二条认证证书有效期为5 年。认证机构应当根据其对获证产品及其生产企业的跟踪检查的情况，在认证证书上注明年度检查有效状态的查询网址和电话。认证证书有效期届满，需要延续使用的，认证委托人应当在认证证书有效期届满前90 天内申请办理。第二十三条获证产品及其销售包装上标注认证证书所含内容的，应当与认证证书的内容相一致，并符合国家有关产品标识标注管理规定。"}},{"id":962,"type":2,"num":164,"stem":"认证标志基本图案中\"CCC\"为\"中国强制性认证\"的英文名称\"China CompulsoryCertification\"的英文缩写。","opts":null,"ans":"正确","src":{"label":"《汇编》第46页","text":"基本图案中“CCC”为“中国强制性认证”的英文名称“ChinaCompulsoryCertification”的英文缩写。第三十一条在认证标志基本图案的右侧标注认证种类，由代表该产品认证种类的英文单词的缩写字母组成。市场监管总局根据强制性产品认证工作的需要，制定有关认证种类标注的具体要求。第三十二条认证委托人应当建立认证标志使用管理制度，对认证标志的使用情况如实记录和存档，按照认证规则规定在产品及其包装、广告、产品介绍等宣传材料中正确使用和"}},{"id":963,"type":2,"num":165,"stem":"本规定根据《中华人民共和国认证认可条例》等法律、行政法规以及国家有关规定制定。","opts":null,"ans":"正确","src":{"label":"《汇编》第6页","text":"中华人民共和国认证认可条例（2023 年修订版）（2003 年9 月3 日中华人民共和国国务院令第390 号公布根据2016 年2 月6 日《国务院关于修改部分行政法规的决定》第一次修订根据2020 年11 月29 日《国务院关于修改和废止部分行政法规的决定》第二次修订根据2023 年7 月20 日《国务院关于修改和废止部分行政法规的决定》第三次修订）)第一章总则第一条为了规范认证认可活动，提高产品、服务的质量和管理水平，促进经济和社会的发展，制定本条例。"}},{"id":964,"type":2,"num":166,"stem":"委托其他企业生产列入目录产品的，只有委托企业可以向认证机构进行认证委托。","opts":null,"ans":"错误","src":{"label":"《汇编》第36页","text":"36（十二）其他规定。第十条列入目录产品的生产者或者销售者、进口商（以下统称认证委托人）应当委托经市场监管总局指定的认证机构（以下简称认证机构）对其生产、销售或者进口的产品进行认证。委托其他企业生产列入目录产品的，委托企业或者被委托企业均可以向认证机构进行认证委托。第十一条认证委托人应当按照具体产品认证规则的规定，向认证机构提供相关技术材料。销售者、进口商作为认证委托人时，还应当向认证机构提供销售者与生产者或者进口商与生产者订立的相关合同副本。"}},{"id":965,"type":2,"num":167,"stem":"认证机构或者实验室以欺骗、贿赂等不正当手段获得指定的，由市场监管总局撤销指定；自被撤销指定之日起3 年内不得再次申请指定。","opts":null,"ans":"正确","src":{"label":"《汇编》第53页","text":"品认证的；（八）其他违反法律法规规定的。第四十四条有下列情形之一的，市场监管总局根据利害关系人的请求或者依据职权，可以撤销对认证机构、实验室的指定：（一）工作人员滥用职权、玩忽职守作出指定决定的；（二）超越法定职权作出指定决定的；（三）违反法定程序作出指定决定的；（四）对不具备指定资格的认证机构、实验室准予指定的；（五）依法可以撤销指定决定的其他情形。第四十五条认证机构或者实验室以欺骗、贿赂等不正当手段获得指定的，由市场监管总局撤销指定，并予以公布。"}},{"id":966,"type":2,"num":168,"stem":"国家对实施强制性产品认证的产品，统一产品目录，统一技术规范的强制性要求、标准和合格评定程序，统一认证标志，统一收费标准。","opts":null,"ans":"正确","src":{"label":"《汇编》第33页","text":"督管理和综合协调。县级以上地方市场监督管理部门负责所辖区域内强制性产品认证活动的监督管理工作。第四条国家对实施强制性产品认证的产品，统一产品目录（以下简称目录），统一技术规范的强制性要求、标准和合格评定程序，统一认证标志，统一收费标准。市场监管总局会同国务院有关部门制定和调整目录，目录由市场监管总局发布,并会同有关方面共同实施。第五条国家鼓励开展平等互利的强制性产品认证国际互认活动，互认活动应当在市场监管总局或者其授权的有关部门对外签署的国际互认协议框架内进行。"}},{"id":967,"type":2,"num":169,"stem":"本规定自2009 年9 月1 日起施行；国家质检总局2001 年12 月3 日公布的《强制性产品认证管理规定》同时废止。","opts":null,"ans":"正确","src":{"label":"《汇编》第59页","text":"构成犯罪的，依法追究刑事责任。第五十九条对于强制性产品认证活动中的其他违法行为，依照有关法律、行政法规的规定予以处罚。第六章附则第六十条强制性产品认证应当依照国家有关规定收取费用。第六十一条本规定由市场监管总局负责解释。"}},{"id":968,"type":2,"num":170,"stem":"国家市场监督管理总局主管全国强制性产品认证工作，负责全国强制性产品认证工作的组织实施、监督管理和综合协调。","opts":null,"ans":"正确","src":{"label":"《汇编》第32页","text":"强制性产品认证管理规定第一章总则第一条为规范强制性产品认证工作，提高认证有效性，维护国家、社会和公共利益，根据《中华人民共和国认证认可条例》（以下简称认证认可条例）等法律、行政法规以及国家有关规定，制定本规定。第二条为保护国家安全、防止欺诈行为、保护人体健康或者安全、保护动植物生命或者健康、保护环境，国家规定的相关产品必须经过认证（以下简称强制性产品认证），并标注认证标志后，方可出厂、销售、进口或者在其他经营活动中使用。"}},{"id":969,"type":2,"num":171,"stem":"自认证证书注销、撤销之日起或者认证证书暂停期间，不符合认证要求的产品，不得继续出厂、销售、进口或者在其他经营活动中使用。","opts":null,"ans":"正确","src":{"label":"《汇编》第45页","text":"45（二）跟踪检查中发现获证产品与认证委托人提供的样品不一致的；（三）认证证书暂停期间，认证委托人未采取整改措施或者整改后仍不合格的；（四）认证委托人以欺骗、贿赂等不正当手段获得认证证书的；（五）其他依法应当撤销的情形。第二十九条获证产品被注销、暂停或者撤销认证证书的，认证机构应当确定不符合认证要求的产品类别和范围。自认证证书注销、撤销之日起或者认证证书暂停期间，不符合认证要求的产品，不得继续出厂、销售、进口或者在其他经营活动中使用。"}},{"id":970,"type":2,"num":172,"stem":"认证机构完成产品型式试验和工厂检查后，对符合认证要求的，一般情况下自受理认证委托起90 天内向认证委托人出具认证证书。","opts":null,"ans":"正确","src":{"label":"《汇编》第38页","text":"实验室及其有关人员应当对其作出的检测报告内容以及检测结论负责，对样品真实性有疑义的，应当向认证机构说明情况，并作出相应处理。第十五条需要进行工厂检查的，认证机构应当委派具有国家注册资格的强制性产品认证检查员，对产品生产企业的质量保证能力、生产产品与型式试验样品的一致性等情况，依照具体产品认证规则进行检查。认证机构及其强制性产品认证检查员应当对检查结论负责。第十六条认证机构完成产品型式试验和工厂检查后，对符合认证要求的，一般情况下自受理认证委托起90 天内向认证委托人出具认证证书。"}},{"id":971,"type":2,"num":173,"stem":"从事强制性产品认证活动的人员出具虚假或者不实结论，编造虚假或者不实文件、记录的，予以撤销执业资格；自撤销之日起5 年内，中国认证认可协会认证人员注册机构不再受理其注册申请。","opts":null,"ans":"正确","src":{"label":"《汇编》第54页","text":"第四十六条从事强制性产品认证活动的人员出具虚假或者不实结论，编造虚假或者不实文件、记录的，予以撤销执业资格；自撤销之日起5 年内，中国认证认可协会认证人员注册机构不再受理其注册申请。第四十七条认证委托人对认证机构的认证决定有异议的，可以向认证机构提出申诉。第四十八条任何单位和个人对强制性产品认证活动中的违法违规行为，有权向市场监督管理部门举报，市场监督管理部门应当及时调查处理，并为举报人保密。第五章罚则第四十九条列入目录的产品未经认证，擅自出厂、销售、进口或者在其他经营活动中使用的，由县级以上地方市场监督管理部门依照认证认可条例第六十六条规定予以处罚。"}},{"id":972,"type":2,"num":174,"stem":"列入目录产品的生产者或者销售者、进口商应当委托经市场监管总局指定的认证机构对其生产、销售或者进口的产品进行认证。","opts":null,"ans":"正确","src":{"label":"《汇编》第36页","text":"36（十二）其他规定。第十条列入目录产品的生产者或者销售者、进口商（以下统称认证委托人）应当委托经市场监管总局指定的认证机构（以下简称认证机构）对其生产、销售或者进口的产品进行认证。委托其他企业生产列入目录产品的，委托企业或者被委托企业均可以向认证机构进行认证委托。第十一条认证委托人应当按照具体产品认证规则的规定，向认证机构提供相关技术材料。销售者、进口商作为认证委托人时，还应当向认证机构提供销售者与生产者或者进口商与生产者订立的相关合同副本。"}},{"id":973,"type":2,"num":175,"stem":"依据《强制性产品认证工厂检查员行为规范》，检查员遇到受检查方干扰、威胁或者不当利益诱导时，有权中止检查并向认证机构报 <script>
/* ================= 状态管理 ================= */
const LS_KEY = 'ccc_exam_state_v1';
const TYPE_NAME = ['单选题', '多选题', '判断题'];
const TYPE_TAG = ['', 'green', 'amber'];

let state = loadState();
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY));
    if (s && s.wrong && s.fav && s.done) return s;
  } catch (e) {}
  return { wrong: {}, fav: [], done: {}, records: [], plog: [] };
}
function save() { localStorage.setItem(LS_KEY, JSON.stringify(state)); }

const byId = {}; QB.forEach(q => byId[q.id] = q);
const typePool = t => QB.filter(q => q.type === t);

/* ================= 通用工具 ================= */
const $ = s => document.querySelector(s);
const main = $('#main');
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function typeOf(q) { return TYPE_NAME[q.type]; }
function fullAnswer(q) {
  if (q.type === 2) return q.ans;
  return q.ans.split('').join('、');
}
function fmtTime(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function fmtDuration(sec) {
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${m}分${s ? s + '秒' : ''}`;
}

/* ================= 视图路由 ================= */
let view = 'home';
const navBtns = document.querySelectorAll('#nav button');
navBtns.forEach(b => b.onclick = () => switchView(b.dataset.view));
function switchView(v) {
  if (exam.active && v !== 'exam') { if (!confirm('正在考试中，离开将自动放弃本场考试，确定离开吗？')) return; stopTimer(); exam.active = false; }
  view = v;
  navBtns.forEach(b => b.classList.toggle('active', b.dataset.view === v));
  $('#panelToggle').classList.add('hidden'); $('#panel').classList.remove('open'); $('#panelMask').classList.remove('open');
  ({ home: renderHome, practice: () => startPractice('seq'), random: () => startPractice('rand'), unpracticed: renderUnpracticed,
     exam: renderExam, wrong: () => renderBook('wrong'), fav: () => renderBook('fav'), log: renderLog })[v]();
  window.scrollTo(0, 0);
}

/* ================= 首页 ================= */
function renderHome() {
  const doneIds = Object.keys(state.done).length;
  const rightN = Object.values(state.done).filter(v => v === 'right').length;
  const wrongN = Object.keys(state.wrong).length;
  const rate = doneIds ? Math.round(rightN / doneIds * 100) : 0;
  main.innerHTML = `
  <div class="card">
    <h2 class="section-title">学习概况</h2>
    <div class="stat-grid">
      <div class="stat"><b>${QB.length}</b><span>题库总量</span></div>
      <div class="stat"><b>${doneIds}</b><span>已练习题</span></div>
      <div class="stat"><b style="color:var(--blue)">${QB.length - doneIds}</b><span>未练习题</span></div>
      <div class="stat"><b style="color:var(--green)">${rate}%</b><span>练习正确率</span></div>
      <div class="stat"><b style="color:var(--red)">${wrongN}</b><span>错题数</span></div>
      <div class="stat"><b style="color:#f59e0b">${state.fav.length}</b><span>收藏数</span></div>
      <div class="stat"><b>${state.records.length}</b><span>模拟考试次数</span></div>
    </div>
    <div class="mode-grid">
      <div class="mode-card" onclick="switchView('practice')"><h3>顺序练习</h3><p>按题库顺序逐题练习，覆盖全部 999 题（单选 499、多选 300、判断 200），可随时筛选题型。</p></div>
      <div class="mode-card" onclick="switchView('random')"><h3>随机练习</h3><p>全库乱序抽题练习，检验真实掌握程度。</p></div>
      <div class="mode-card" onclick="switchView('exam')"><h3>模拟考试</h3><p>随机抽取 50 道单选（每题 1 分）+ 20 道多选（每题 2 分，全对才得分）+ 10 道判断（每题 1 分），满分 100 分，限时 90 分钟，交卷自动判分。</p></div>
      <div class="mode-card" onclick="switchView('wrong')"><h3>错题本 <span class="tag red">${wrongN}</span></h3><p>自动收录做错的题目，记录错误次数，可反复重做。</p></div>
      <div class="mode-card" onclick="switchView('fav')"><h3>收藏题 <span class="tag amber">${state.fav.length}</span></h3><p>收藏重点、易错题目，集中复习。</p></div>
      <div class="mode-card" onclick="switchView('log')"><h3>答题记录</h3><p>查看历次模拟考试成绩与练习答题明细。</p></div>
    </div>
  </div>
  <div class="card">
    <h2 class="section-title">数据管理</h2>
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <button class="btn" onclick="exportData()">导出答题数据</button>
      <label class="btn ghost" style="cursor:pointer">导入答题数据<input type="file" accept=".json,application/json" style="display:none" onchange="importData(event)"></label>
    </div>
    <p style="color:var(--muted);font-size:13px;margin-top:10px;line-height:1.7">答题数据保存在当前浏览器的本地存储中，更换浏览器、更换电脑或从预览网页换成本地文件打开时数据不会跟随。先在旧页面点「导出答题数据」保存备份文件，再在新页面点「导入答题数据」选择该文件即可迁移。导入时会自动合并：做过的题保留做对的记录，错题取最大错误次数，收藏、考试与答题记录全部合并。</p>
  </div>`;
}

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'CCC刷题数据备份.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function importData(ev) {
  const f = ev.target.files && ev.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const s = JSON.parse(r.result);
      if (!s || typeof s !== 'object' || (!s.done && !s.wrong)) throw new Error('bad');
      const done = { ...state.done };
      for (const [k, v] of Object.entries(s.done || {})) {
        if (done[k] !== 'right') done[k] = v;
      }
      const wrong = { ...state.wrong };
      for (const [k, v] of Object.entries(s.wrong || {})) {
        wrong[k] = Math.max(wrong[k] || 0, v | 0);
      }
      state = {
        done,
        wrong,
        fav: [...new Set([...state.fav, ...(Array.isArray(s.fav) ? s.fav : [])])],
        records: [...state.records, ...(Array.isArray(s.records) ? s.records : [])],
        plog: [...state.plog, ...(Array.isArray(s.plog) ? s.plog : [])]
      };
      save();
      renderHome();
      alert('导入成功：已合并 ' + Object.keys(done).length + ' 条练习记录、' + state.fav.length + ' 道收藏、' + state.records.length + ' 次考试记录。');
    } catch (e) {
      alert('导入失败：所选文件不是有效的答题数据备份。');
    }
    ev.target.value = '';
  };
  r.readAsText(f);
}

/* ================= 练习 ================= */
let pc = null; // 练习上下文 {list, idx, mode, filter, results:{}}
function startPractice(mode, presetList, bookType) {
  if (!presetList) {
    let pool = QB;
    pc = { mode, bookType: bookType || null, filter: 'all', list: null, idx: 0, results: {}, pending: {} };
    pc.list = (mode === 'rand') ? shuffle(pool).map(q => q.id) : pool.map(q => q.id);
  } else {
    pc = presetList;
  }
  pc.idx = Math.min(pc.idx || 0, pc.list.length - 1);
  renderPractice();
}
function filteredCount() {
  if (pc.filter === 'all') return pc.list.length;
  return pc.list.filter(id => byId[id].type === +pc.filter).length;
}
function renderPractice() {
  $('#panelToggle').classList.remove('hidden');
  const ids = pc.filter === 'all' ? pc.list : pc.list.filter(id => byId[id].type === +pc.filter);
  if (!ids.length) { main.innerHTML = `<div class="card"><div class="empty-tip">当前范围内没有题目<br><button class="btn ghost mt16" onclick="switchView('home')">返回首页</button></div></div>`; return; }
  if (pc.idx >= ids.length) pc.idx = ids.length - 1;
  const q = byId[ids[pc.idx]];
  const total = ids.length, cur = pc.idx + 1;
  const res = pc.results[q.id]; // {sel, ok}
  const isFav = state.fav.includes(q.id);
  const wrongCnt = state.wrong[q.id] || 0;

  let optsHtml = '';
  if (q.type === 2) {
    const jSel = res ? null : new Set([pc.pending[q.id] || '']);
    ['正确', '错误'].forEach(v => {
      const cls = res ? (v === q.ans ? 'right' : (res.sel === v ? 'wrong' : 'locked'))
                      : (jSel.has(v) ? 'sel' : '');
      optsHtml += `<div class="opt ${cls} ${res ? 'locked' : ''}" ${res ? '' : `onclick="selJudge('${v}')"`}><span class="key">${v === '正确' ? '√' : '×'}</span><span>${v}</span></div>`;
    });
  } else {
    const keys = ['A', 'B', 'C', 'D', 'E', 'F'].slice(0, q.opts.length);
    const selSet = res ? new Set(res.sel.split('')) : new Set((pc.pending[q.id] || '').split(''));
    keys.forEach((k, i) => {
      let cls = '';
      if (res) {
        if (q.ans.includes(k)) cls = 'right';
        else if (selSet.has(k)) cls = 'wrong';
        cls += ' locked';
      } else if (selSet.has(k)) cls = 'sel';
      optsHtml += `<div class="opt ${cls}" ${res ? '' : `onclick="selOpt('${k}')"`}><span class="key">${k}</span><span>${esc(q.opts[i])}</span></div>`;
    });
  }

  let explainHtml = '';
  if (res) {
    explainHtml = buildExplain(q, res.ok);
    if (pc.bookType === 'wrong' && res.ok && state.wrong[q.id]) {
      explainHtml += `<div class="mt8"><button class="btn green sm" onclick="removeWrong(${q.id})">答对了，移出错题本</button></div>`;
    }
  }

  main.innerHTML = `
  <div class="practice-top">
    <div>
      <span class="tag ${TYPE_TAG[q.type]}">${typeOf(q)}</span>
      <span class="tag">第 ${cur} / ${total} 题</span>
      ${wrongCnt ? `<span class="tag red">错 ${wrongCnt} 次</span>` : ''}
      <span style="color:var(--sub);font-size:13px;">（题库第 ${q.num} 题）</span>
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
      ${['all','0','1','2'].map(f => `<button class="btn sm ghost ${pc.filter===f?'active':''}" style="${pc.filter===f?'background:#0f172a;color:#fff':''}" onclick="setFilter('${f}')">${f==='all'?'全部':TYPE_NAME[+f]}</button>`).join('')}
      <button class="fav-btn ${isFav ? 'on' : ''}" onclick="toggleFav(${q.id})" title="收藏">★</button>
    </div>
  </div>
  <div class="progress-wrap"><div class="progress-bar" style="width:${cur/total*100}%"></div></div>
  <div class="card">
    <div class="q-stem">${esc(q.stem)}</div>
    ${optsHtml}
    <div id="explainSlot">${explainHtml}</div>
    <div class="practice-nav">
      <button class="btn ghost" onclick="navQ(-1)" ${cur <= 1 ? 'disabled' : ''}>上一题</button>
      <div style="display:flex;gap:10px;">
        ${!res ? `<button class="btn green" id="submitBtn" onclick="submitAns()" ${!pc.pending[q.id] ? 'disabled' : ''}>提交答案</button>` : ''}
        <button class="btn" onclick="navQ(1)" ${cur >= total ? 'disabled' : ''}>下一题</button>
      </div>
    </div>
  </div>`;
  renderPanel(ids);
}
function setFilter(f) { pc.filter = f; pc.idx = 0; renderPractice(); }
function currentIds() { return pc.filter === 'all' ? pc.list : pc.list.filter(id => byId[id].type === +pc.filter); }
function navQ(d) {
  const ids = currentIds();
  pc.idx = Math.max(0, Math.min(ids.length - 1, pc.idx + d));
  renderPractice();
}
function jumpTo(i) {
  pc.idx = i;
  $('#panel').classList.remove('open'); $('#panelMask').classList.remove('open');
  renderPractice(); window.scrollTo(0, 0);
}
function selOpt(k) {
  const q = byId[currentIds()[pc.idx]];
  const set = new Set((pc.pending[q.id] || '').split('').filter(Boolean));
  if (q.type === 0) { set.clear(); set.add(k); }
  else { set.has(k) ? set.delete(k) : set.add(k); }
  pc.pending[q.id] = [...set].sort().join('');
  renderPractice();
}
function selJudge(v) { const q = byId[currentIds()[pc.idx]]; pc.pending[q.id] = v; renderPractice(); }
function submitAns() {
  const ids = currentIds();
  const q = byId[ids[pc.idx]];
  const sel = pc.pending[q.id] || '';
  if (!sel) return;
  const ok = sel === q.ans;
  delete pc.pending[q.id];
  pc.results[q.id] = { sel, ok };
  state.done[q.id] = ok ? 'right' : 'wrong';
  if (!ok) state.wrong[q.id] = (state.wrong[q.id] || 0) + 1;
  state.plog.unshift({ t: Date.now(), id: q.id, ok, mode: pc.mode });
  if (state.plog.length > 600) state.plog.length = 600;
  save();
  renderPractice();
}
function removeWrong(id) { delete state.wrong[id]; save(); renderPractice(); }
function toggleFav(id) {
  const i = state.fav.indexOf(id);
  i >= 0 ? state.fav.splice(i, 1) : state.fav.push(id);
  save(); renderPractice();
}
function buildExplain(q, ok) {
  const src = q.src
    ? `<div class="mt8"><span class="src-label">【答案来源】${esc(q.src.label)}</span><div class="src-text mt8">${esc(q.src.text)}</div></div>`
    : `<div class="mt8 src-none">【答案来源】本题所涉条文未收录于所提供的两份来源文件（《强制性产品认证机构服务工作规范指南》及《强制性产品认证“应知应会”法律法规政策文件知识汇编》），答案以题库为准。</div>`;
  return `<div class="explain">
    <div class="ans-line" style="color:${ok ? 'var(--green)' : 'var(--red)'}">${ok ? '回答正确' : '回答错误'}　正确答案：${fullAnswer(q)}</div>
    ${src}
  </div>`;
}

/* ================= 题号面板 ================= */
function togglePanel() { $('#panel').classList.toggle('open'); $('#panelMask').classList.toggle('open'); }
function renderPanel(ids) {
  const grid = $('#numGrid');

}

function bookPractice(kind, rand, startId) {
  let ids = kind === 'wrong' ? Object.keys(state.wrong).map(Number) : state.fav.slice();

  if (startId != null) { ids = [startId, ...ids.filter(x => x !== startId)]; }
  startPractice(kind, { mode: kind, bookType: kind, filter: 'all', list: ids, idx: 0, results: {}, pending: {} });
}

/* ================= 模拟考试 ================= */
const EXAM_MIN = 90;
let exam = { active: false, paper: [], answers: {}, endAt: 0, timerId: null, startAt: 0 };
function renderExam() {
  if (exam.active) { renderExamQ(); return; }
  if (exam.result) { renderExamResult(); return; }
  main.innerHTML = `
  <div class="card exam-banner">
    <h2>强制性产品认证法律法规及典型案例 · 模拟考试</h2>
    <div class="exam-info">
      <span>单选题 50 题 × 1 分 = 50 分</span>
      <span>多选题 20 题 × 2 分 = 40 分（全对才得分）</span>
      <span>判断题 10 题 × 1 分 = 10 分</span>
      <span>满分 100 分 · 限时 ${EXAM_MIN} 分钟</span>
    </div>
    <div class="mt16"><button class="btn green" style="padding:12px 40px;font-size:16px;" onclick="startExam()">开始考试</button></div>
    <div class="mt8" style="font-size:12px;opacity:.85;">题目随机抽取；考试过程中可随时交卷；倒计时结束自动交卷。</div>
  </div>`;
}
function startExam() {
  const paper = [
    ...shuffle(typePool(0)).slice(0, 50).map(q => q.id),
    ...shuffle(typePool(1)).slice(0, 20).map(q => q.id),
    ...shuffle(typePool(2)).slice(0, 10).map(q => q.id)
  ];
  exam = { active: true, paper, answers: {}, idx: 0, startAt: Date.now(), endAt: Date.now() + EXAM_MIN * 60000, timerId: null, result: null };
  $('#panelToggle').classList.remove('hidden');
  exam.timerId = setInterval(tick, 500);
  renderExamQ();
}
function stopTimer() { if (exam.timerId) clearInterval(exam.timerId); exam.timerId = null; }
function tick() {
  const left = exam.endAt - Date.now();
  const el = $('#timer');
  if (el) {
    const m = Math.max(0, Math.floor(left / 60000)), s = Math.max(0, Math.floor(left % 60000 / 1000));
    el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    el.classList.toggle('danger', left < 5 * 60000);
  }
  if (left <= 0) { submitExam(true); }
}
function renderExamQ() {
  const ids = exam.paper;
  const q = byId[ids[exam.idx]];
  const answered = Object.keys(exam.answers).length;
  let optsHtml = '';
  if (q.type === 2) {
    ['正确', '错误'].forEach(v => {
      const sel = exam.answers[q.id] === v;
      optsHtml += `<div class="opt ${sel ? 'sel' : ''}" onclick="examSel('${v}')"><span class="key">${v === '正确' ? '√' : '×'}</span><span>${v}</span></div>`;
    });
  } else {
    const keys = ['A','B','C','D','E','F'].slice(0, q.opts.length);
    const selSet = new Set((exam.answers[q.id] || '').split('').filter(Boolean));
    keys.forEach((k, i) => {
      optsHtml += `<div class="opt ${selSet.has(k) ? 'sel' : ''}" onclick="examSel('${k}')"><span class="key">${k}</span><span>${esc(q.opts[i])}</span></div>`;
    });
  }
  main.innerHTML = `
  <div class="practice-top">
    <div><span class="tag ${TYPE_TAG[q.type]}">${typeOf(q)}</span><span class="tag">第 ${exam.idx+1} / ${ids.length} 题</span>

    <div class="timer" id="timer"></div>
  </div>
  <div class="progress-wrap"><div class="progress-bar" style="width:${(exam.idx+1)/ids.length*100}%"></div></div>
  <div class="card">
    <div class="q-stem">${esc(q.stem)}</div>
    ${optsHtml}
    <div class="practice-nav">
      <button class="btn ghost" onclick="examNav(-1)" ${exam.idx<=0?'disabled':''}>上一题</button>
      <div style="display:flex;gap:10px;">
        <button class="btn ghost" onclick="examNav(1)" ${exam.idx>=ids.length-1?'disabled':''}>下一题</button>
        <button class="btn red" onclick="submitExam(false)">交卷</button>
      </div>
    </div>
  </div>`;
  renderExamPanel(); tick();
}
function examSel(v) {
  const q = byId[exam.paper[exam.idx]];
  if (q.type === 0) exam.answers[q.id] = v;
  else if (q.type === 1) {
    const set = new Set((exam.answers[q.id] || '').split('').filter(Boolean));
    set.has(v) ? set.delete(v) : set.add(v);
    exam.answers[q.id] = [...set].sort().join('');
  } else exam.answers[q.id] = v;
  renderExamQ();
}
function examNav(d) { exam.idx = Math.max(0, Math.min(exam.paper.length - 1, exam.idx + d)); renderExamQ(); window.scrollTo(0,0); }
function renderExamPanel() {
  $('#numGrid').innerHTML = exam.paper.map((id, i) => {
    const done = !!exam.answers[id];
    let cls = done ? 'right' : '';
    if (i === exam.idx) cls += ' current';
    return `<div class="num-cell ${cls}" style="${done?'background:var(--blue);':''}" onclick="examJump(${i})">${i+1}</div>`;
  }).join('');
