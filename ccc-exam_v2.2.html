  if (legend) legend.innerHTML = `<span><i class="dot" style="background:var(--blue)"></i>已答</span><span><i class="dot" style="background:var(--gray)"></i>未答</span><span><i class="dot" style="background:#fff;border:1.5px solid var(--blue)"></i>当前</span>`;
}
function examJump(i) { exam.idx = i; $('#panel').classList.remove('open'); $('#panelMask').classList.remove('open'); renderExamQ(); window.scrollTo(0,0); }

function submitExam(auto) {
  const left = exam.endAt - Date.now();
  const unanswered = exam.paper.filter(id => !exam.answers[id]).length;
  if (!auto && unanswered > 0 && !confirm(`还有 ${unanswered} 题未作答，确定交卷吗？`)) return;
  if (!auto && unanswered === 0 && !confirm('确定交卷吗？')) return;
  stopTimer();
  let sRight = 0, mRight = 0, mHalf = 0, jRight = 0;
  const detail = exam.paper.map(id => {
    const q = byId[id]; const sel = exam.answers[id] || ''; const ok = sel === q.ans;
    if (q.type === 0) { if (ok) sRight++; }
    else if (q.type === 1) { if (ok) mRight++; }
    else { if (ok) jRight++; }
    if (!ok) state.wrong[id] = (state.wrong[id] || 0) + 1;
    state.done[id] = ok ? 'right' : 'wrong';
    return { id, sel, ok };
  });
  const score = sRight * 1 + mRight * 2 + jRight * 1;
  exam.result = { detail, score, sRight, mRight, jRight, unanswered, timeUsed: EXAM_MIN * 60 - Math.max(0, Math.round(left / 1000)) };
  exam.active = false;
  state.records.unshift({ t: Date.now(), score, sRight, mRight, jRight, answered: 80 - unanswered, timeUsed: exam.result.timeUsed });
  if (state.records.length > 100) state.records.length = 100;
  save();
  renderExamResult();
}
function renderExamResult() {
  $('#panelToggle').classList.add('hidden');
  const r = exam.result;
  const passTxt = r.score >= 60 ? '恭喜，及格！' : '未及格，继续加油！';
  main.innerHTML = `
  <div class="card exam-banner">
    <h2>考试成绩</h2>
    <div class="score-big">${r.score}<span style="font-size:20px;"> 分</span></div>
    <div style="font-size:15px;">${passTxt}　用时 ${fmtDuration(r.timeUsed)}　未答 ${r.unanswered} 题</div>
    <div class="exam-info">
      <span>单选：${r.sRight} / 50（得 ${r.sRight} 分）</span>
      <span>多选：${r.mRight} / 20（得 ${r.mRight * 2} 分）</span>
      <span>判断：${r.jRight} / 10（得 ${r.jRight} 分）</span>
    </div>
    <div class="mt16" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
      <button class="btn green" onclick="exam={result:null};renderExam()">再考一次</button>
      <button class="btn ghost" style="background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.4);" onclick="examReview()">回顾试卷</button>
    </div>
  </div>
  <div class="card mt16">
    <h2 class="section-title">本次答卷</h2>
    <div class="num-grid" style="grid-template-columns:repeat(10,1fr);">
      ${r.detail.map((d, i) => `<div class="num-cell ${d.ok ? 'right' : 'wrong'}" onclick="examReview(${i})" style="font-size:12px;">${i+1}</div>`).join('')}
    </div>
    <div class="legend mt8" style="font-size:12px;color:var(--sub);display:flex;gap:14px;">
      <span><i class="dot" style="background:var(--green)"></i>答对</span>
      <span><i class="dot" style="background:var(--red)"></i>答错/未答</span>
      <span>点击题号可查看解析</span>
    </div>
  </div>`;
}
let reviewIdx = 0;
function examReview(i) {
  if (i != null) reviewIdx = i;
  const r = exam.result; if (!r) return;
  const d = r.detail[reviewIdx];
  const q = byId[d.id];
  let optsHtml = '';
  if (q.type === 2) {
    ['正确','错误'].forEach(v => {
      let cls = v === q.ans ? 'right' : (d.sel === v ? 'wrong' : 'locked');
      optsHtml += `<div class="opt ${cls} locked"><span class="key">${v==='正确'?'√':'×'}</span><span>${v}</span></div>`;
    });
  } else {
    const keys = ['A','B','C','D','E','F'].slice(0, q.opts.length);
    const selSet = new Set((d.sel || '').split(''));
    keys.forEach((k, i2) => {
      let cls = q.ans.includes(k) ? 'right' : (selSet.has(k) ? 'wrong' : 'locked');
      optsHtml += `<div class="opt ${cls} locked"><span class="key">${k}</span><span>${esc(q.opts[i2])}</span></div>`;
    });
  }
  main.innerHTML = `
  <div class="practice-top">
    <div><span class="tag ${TYPE_TAG[q.type]}">${typeOf(q)}</span><span class="tag">回顾 第 ${reviewIdx+1} / ${r.detail.length} 题</span>
    <span class="tag ${d.ok ? 'green' : 'red'}">${d.ok ? '答对' : '答错'}</span></div>
    <button class="btn ghost sm" onclick="renderExamResult()">返回成绩页</button>
  </div>
  <div class="card">
    <div class="q-stem">${esc(q.stem)}</div>
    ${optsHtml}
    ${buildExplain(q, d.ok)}
    <div class="practice-nav">
      <button class="btn ghost" onclick="examReview(${Math.max(0, reviewIdx-1)})" ${reviewIdx<=0?'disabled':''}>上一题</button>
      <button class="btn" onclick="examReview(${Math.min(r.detail.length-1, reviewIdx+1)})" ${reviewIdx>=r.detail.length-1?'disabled':''}>下一题</button>
    </div>
  </div>`;
  window.scrollTo(0,0);
}

/* ================= 答题记录 ================= */
function renderLog() {
  const recs = state.records;
  const plog = state.plog.slice(0, 200);
  main.innerHTML = `
  <div class="card mb12">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
      <h2 class="section-title" style="margin:0;">模拟考试记录（${recs.length}）</h2>
      ${recs.length ? `<button class="btn red sm" onclick="if(confirm('确定清空全部考试记录？')){state.records=[];save();renderLog();}">清空</button>` : ''}
    </div>
    ${recs.length ? `<table class="log mt8"><tr><th>#</th><th>考试时间</th><th>成绩</th><th>单选(对/50)</th><th>多选(对/20)</th><th>判断(对/10)</th><th>已答</th><th>用时</th></tr>
    ${recs.map((r, i) => `<tr>
      <td>${i+1}</td><td>${fmtTime(r.t)}</td>
      <td style="font-weight:700;color:${r.score>=60?'var(--green)':'var(--red)'}">${r.score} 分</td>
      <td>${r.sRight}</td><td>${r.mRight}</td><td>${r.jRight}</td><td>${r.answered}/80</td><td>${fmtDuration(r.timeUsed)}</td>
    </tr>`).join('')}</table>` : '<div class="empty-tip">还没有模拟考试记录</div>'}
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h2 class="section-title" style="margin:0;">练习答题明细（最近 ${plog.length} 条）</h2>
      ${plog.length ? `<button class="btn red sm" onclick="if(confirm('确定清空练习明细？')){state.plog=[];save();renderLog();}">清空</button>` : ''}
    </div>
    ${plog.length ? `<table class="log mt8"><tr><th>时间</th><th>题型</th><th>题号</th><th>题干</th><th>结果</th></tr>
    ${plog.map(p => { const q = byId[p.id]; return `<tr>
      <td style="white-space:nowrap;">${fmtTime(p.t)}</td><td>${typeOf(q)}</td><td>${q.num}</td>
      <td style="max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(q.stem)}</td>
      <td style="color:${p.ok?'var(--green)':'var(--red)'};font-weight:700;">${p.ok?'对':'错'}</td>
    </tr>`; }).join('')}</table>` : '<div class="empty-tip">还没有练习答题记录</div>'}
  </div>`;
}

renderHome();

</script>
