<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2027届SH中考英语考纲词汇学习</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--pri:#3b6fd4;--ok:#2e9e5b;--bad:#d64545;--gray:#9aa0ad;--line:#e3e6ee;--txt:#222;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);font-size:16px}
header{position:sticky;top:0;background:#2c4a86;color:#fff;z-index:10}
header .ttl{padding:10px 14px 2px;font-size:15px;font-weight:700}
nav{display:grid;grid-template-columns:repeat(4,1fr);}
nav button{background:none;border:none;color:#cfe0ff;padding:11px 2px;font-size:13px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;text-align:center;}
nav button.on{border-bottom-color:#ffd54a;color:#fff;font-weight:700;}
@media (max-width:360px){nav button{font-size:12px;padding:10px 1px;}}
main{max-width:760px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{font-size:17px;margin-bottom:10px}
h3{font-size:15px;margin:14px 0 8px}
.pos{display:inline-block;background:#eef3fd;color:var(--pri);border-radius:6px;padding:2px 8px;font-size:13px;margin-left:8px;vertical-align:middle}
.big{font-size:30px;font-weight:700;letter-spacing:.5px;overflow-wrap:anywhere}
.zh{font-size:20px;line-height:1.7;overflow-wrap:anywhere}
.hint{color:var(--gray);font-size:14px;margin-top:6px}
input[type=text]{width:100%;padding:12px;font-size:17px;border:1.5px solid var(--line);border-radius:10px;margin-top:10px}
input[type=text]:focus{outline:none;border-color:var(--pri)}
.btn{display:inline-block;background:var(--pri);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:15px;cursor:pointer;margin:10px 8px 0 0}
.btn.sec{background:#fff;color:var(--pri);border:1.5px solid var(--pri)}
.btn.gray{background:#fff;color:#555;border:1.5px solid var(--line)}
.btn.danger{background:#fff;color:var(--bad);border:1.5px solid var(--bad)}
.btn:disabled{opacity:.4;cursor:default}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.opts button{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;font-size:16px;cursor:pointer;line-height:1.5}
.opts button.sel{border-color:var(--pri);background:#eef3fd}
.opts button.ok{border-color:var(--ok);background:#e8f6ee;color:var(--ok);font-weight:700}
.opts button.bad{border-color:var(--bad);background:#fdecec;color:var(--bad)}
.fb{margin-top:14px;border-radius:10px;padding:12px 14px;display:none;line-height:1.8}
.fb.ok{display:block;background:#e8f6ee;border:1px solid #b9e2c9}
.fb.bad{display:block;background:#fdecec;border:1px solid #f3c1c1}
.fb .ans{font-weight:700}
.small{font-size:13px;color:var(--gray)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(26px,1fr));gap:3px;margin-top:8px}
.grid i{display:block;height:24px;border-radius:4px;background:#d7dae2;cursor:pointer}
.grid i.g{background:var(--ok)}.grid i.r{background:var(--bad)}
.legend{display:flex;gap:14px;font-size:13px;color:#555;margin-top:6px;flex-wrap:wrap}
.legend em{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
details.map{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
details.map summary{cursor:pointer;font-size:14px;color:var(--pri);font-weight:600}
.row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:#d7dae2;flex:0 0 auto}
.dot.g{background:var(--ok)}.dot.r{background:var(--bad)}
.tag{background:#eef3fd;color:var(--pri);font-size:12px;border-radius:5px;padding:1px 7px;flex:0 0 auto}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{flex:1;padding:9px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:14px;cursor:pointer}
.tabs button.on{border-color:var(--pri);color:var(--pri);font-weight:700;background:#eef3fd}
.stat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
@media (max-width:560px){.stat4{grid-template-columns:repeat(3,1fr)}}
.stat .it{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.stat .it b{display:block;font-size:22px;margin-top:4px}
select{padding:8px;border-radius:8px;border:1.5px solid var(--line);font-size:14px}
.chip{display:inline-block;background:#f0f1f5;border-radius:16px;padding:5px 12px;margin:3px;font-size:14px;cursor:pointer}
.chip:hover{background:#e2e5ee}
.chip.on{background:var(--pri);color:#fff}
.chip.syn{background:#e8f6ee;color:var(--ok)}
.chip.sim{background:#fff6e0;color:#a07b00}
.chip.fam{background:#eef3fd;color:var(--pri)}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:99}
.modal{background:#fff;border-radius:14px;padding:22px;max-width:320px;width:88%;text-align:center}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:99;display:none}
.mono{font-variant-numeric:tabular-nums}
.kbd{background:#f0f1f5;border-radius:6px;padding:2px 8px;font-family:ui-monospace,Consolas,monospace}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.tile{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:20px 8px 15px;text-align:center;cursor:pointer}
.tile:active{border-color:var(--pri);background:#f6f9ff}
.tile b{display:block;font-size:16px;margin-bottom:7px}
.bk-btn{position:absolute;right:0;top:-4px;margin:0;padding:6px 14px;font-size:13px}
.card h2{position:relative;padding-right:60px}
.card h3{position:relative;padding-right:60px}
</style>
</head>

function load(){

      ["q","w"].forEach(k=>{S[k]=Object.assign(mkeys0(),S[k]||{});delete S[k].e2c;});

}
function backup(tag){

}

/* ---------- 工具 ---------- */
const $ = s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",2200);}
function normEn(s){return (s||"").toLowerCase().replace(/[^a-z0-9]/g,"");}
function forms(e){const f=[e.w].concat(e.v||[]);if(e.w.indexOf("/")>=0)f.push.apply(f,e.w.split("/"));return f.map(normEn);}
function synMembers(e){if(!e.syn)return [];return EN.filter(o=>o.syn===e.syn);}
function gradeEn(e,input){
  const n=normEn(input);if(!n)return false;
  if(forms(e).indexOf(n)>=0)return true;
  if(e.syn){const cats=e.cats;for(let k=0;k<EN.length;k++){const o=EN[k];
    if(o.syn===e.syn&&o.cats.some(c=>cats.indexOf(c)>=0)&&forms(o).indexOf(n)>=0)return true;}}
  return false;
}
function fmtT(t){const d=new Date(t);return (d.getMonth()+1)+"-"+String(d.getDate()).padStart(2,"0")+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function sample(arr,n){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a.slice(0,n);}
function typeLabel(e){return e.type==="phrase"?"短语":e.type==="abbr"?"abbr.":e.type==="proper"?"专有名词":e.pos;}
function markResult(mod,i,ok,u,a,redo,qk){
  qk=qk||mod;if(!S.q[qk])S.q[qk]={};
  S.q[qk][i]=ok?"g":"r";
  if((mod==="phr"||mod==="sim")&&S.q[mod])S.q[mod][i]=ok?"g":"r";
  const w=S.w[mod];
  if(!ok){if(!w[i])w[i]={c:0,t:0,last:0};w[i].c++;w[i].t=Date.now();w[i].last=0;}
  else if(w[i])w[i].last=1;
  S.log.push({t:Date.now(),mod:mod,i:i,w:BY[i].w,u:u,a:a,ok:ok?1:0,redo:redo?1:0});
  if(S.log.length>3000)S.log=S.log.slice(-3000);
  save();
}
function isFavQ(mod,i){return S.f.q.some(x=>x.mod===mod&&x.i===i);}
function toggleFavQ(mod,i,sub){
  const k=S.f.q.findIndex(x=>x.mod===mod&&x.i===i);
  if(k>=0){S.f.q.splice(k,1);toast("已取消收藏");}else{S.f.q.push({mod:mod,i:i,t:Date.now(),sub:sub});toast("已收藏本题");}
  save();
}
function isFavC(i){return S.f.c.some(x=>x.i===i);}
function toggleFavC(i){
  const k=S.f.c.findIndex(x=>x.i===i);

}

/* ---------- 训练模块 ---------- */
let sess=null; // {mod,idx,redo,redoList,redoPtr}
function stemHtml(e,qt){
  if(MC1.indexOf(qt)>=0)return '<div class="big">'+esc(e.w)+'<span class="pos">'+esc(typeLabel(e))+'</span></div>';
  const zh=e.m.join("；");
  let h='<div class="zh">'+esc(zh)+'<span class="pos">'+esc(typeLabel(e))+'</span></div>';
  if(qt==="sp"||qt==="ps"||qt==="ss")h+='<div class="hint">首字母提示：<span class="kbd">'+esc(e.hint)+'</span></div>';
  return h;
}
function optionsFor(e,qt){
  if(MC1.indexOf(qt)>=0){
    if(qt==="sm1"){
      const sims=e.sim.map(i=>BY[i]).filter(o=>o&&o.i!==e.i);
      const ds=sample(sims,3);
      if(ds.length<3){const extra=sample(EN.filter(o=>o.i!==e.i&&o.syn!==e.syn&&sims.indexOf(o)<0&&o.cats.some(c=>e.cats.indexOf(c)>=0)),6);
        for(const x of extra){if(ds.length>=3)break;if(ds.indexOf(x)<0)ds.push(x);}}
      return ds.slice(0,3).map(o=>o.m.join("；"));
    }
    const base=(qt==="pm1")?PHR:EN;
    let pool=base.filter(o=>o.i!==e.i&&o.syn!==e.syn&&o.m.join(";")!==e.m.join(";"));
    if(qt==="m1"){const p2=pool.filter(o=>o.cats.some(c=>e.cats.indexOf(c)>=0));if(p2.length>=3)pool=p2;}
    return sample(pool,3).map(o=>o.m.join("；"));
  }
  // 选词类
  if(qt==="sm2"){
    const sims=e.sim.map(i=>BY[i]).filter(o=>o&&o.i!==e.i);
    const ds=sample(sims,3);
    if(ds.length<3){const extra=sample(EN.filter(o=>o.i!==e.i&&o.syn!==e.syn&&sims.indexOf(o)<0),10);
      for(const x of extra){if(ds.length>=3)break;if(ds.indexOf(x)<0)ds.push(x);}}
    return ds.slice(0,3).map(o=>o.w);
  }
  if(qt==="pm2")return sample(PHR.filter(o=>o.i!==e.i),3).map(o=>o.w);
  // m2
  let pool=EN.filter(o=>o.i!==e.i&&o.syn!==e.syn&&o.cats.some(c=>e.cats.indexOf(c)>=0));
  const sims=e.sim||[];
  const prefer=pool.filter(o=>sims.indexOf(o.i)>=0);
  const pick=sample(prefer,3);
  for(const o of sample(pool,10)){if(pick.length>=3)break;if(pick.indexOf(o)<0)pick.push(o);}
  return sample(pick.slice(0,3),3).map(o=>o.w);
}
function enterTrain(mod,entryIdx,back){
  sess={mod:mod,idx:entryIdx,rand:!!(S.set&&S.set.rand&&S.set.rand[mod]),back:back||"study"};
  if(sess.rand){ensureOrder();sess.idx=sess.order.indexOf(entryIdx);}
  curNav=mod;
  render();

}
function trainGo(mod,idx){
  enterTrain(mod,idx,"study");
}
function ensureOrder(){
  const L=qlist(sess.mod);
  if(!sess.order||sess.order.length!==L.length){
    sess.order=[];for(let i=0;i<L.length;i++)sess.order.push(i);
    for(let i=sess.order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=sess.order[i];sess.order[i]=sess.order[j];sess.order[j]=t;}
  }
}
function curEntry(){
  if(sess.redo){const it=sess.redoList[sess.redoPtr];return BY[it.i];}
  const L=qlist(sess.mod);
  const idx=(sess.rand&&sess.order)?sess.order[sess.idx]:sess.idx;
  return L[idx];
}
function qType(){
  if(sess.redo){const it=sess.redoList[sess.redoPtr];return it.sub||it.mod||sess.mod;}
  if(sess.mod==="phr"||sess.mod==="sim")return sess.sub;
  return sess.mod;
}
function trainTitle(qt,mod){

  if(sess.mod==="phr"||sess.mod==="sim")return MODNAME[sess.mod]+" · "+MODNAME[qt];

}

  $("#nextb").onclick=()=>nav(1);
  // 测验中返回已答过的题目时恢复作答状态，防止重复计分
  if(sess&&sess.quiz){
    const res=(sess.quizRes||[]).find(r=>r.mod+":"+r.i===mod+":"+e.i);
    if(res){
      if(isMC){
        ob._done=true;
        const correct=$("#correct").value;
        ob.querySelectorAll("button").forEach(b=>{
          b.disabled=true;
          const v=b.getAttribute("data-v");
          if(v===correct)b.classList.add("ok");
          else if(v===res.u)b.classList.add("bad");
        });
      }else if(inp){inp.value=res.u;inp.disabled=true;}
      const sb=$("#submit");sb.disabled=true;sb.textContent="已提交";
      const fb=$("#fb");fb.className="fb "+(res.ok?"ok":"bad");fb.innerHTML=feedbackHtml(e,qt,res.ok,res.u);
    }
  }
  bindMap();
}
function nav(d){
  if(sess.redo){
    let p=sess.redoPtr+d;
    if(p>=sess.redoList.length){if(sess.quiz){showQuizFinishModal();return;}toast("已到最后一题");return;}
    if(p<0){toast("已经是第一题");return;}
    sess.redoPtr=p;renderTrain();return;
  }
  const L=qlist(sess.mod);
  let idx=sess.idx+d;
  if(idx<0){toast("已经是第一题");return;}
  if(idx>=L.length){toast("已经是最后一题");return;}
  sess.idx=idx;renderTrain();
}
function feedbackHtml(e,qt,ok,u){
  let h=ok?'<div>✅ 回答正确！</div>':'<div>❌ 回答错误，你的答案：<b>'+esc(u||"（未作答）")+'</b></div>';
  if(MC1.indexOf(qt)>=0){
    h+='<div class="ans">'+esc(e.w)+' <span class="pos">'+esc(typeLabel(e))+'</span>：'+esc(e.m.join("；"))+'</div>';
  }else{
    const syn=synMembers(e);
    if(syn.length>1)h+='<div>同义英文：'+syn.map(o=>'<b>'+esc(o.w)+'</b>').join("、")+'</div>';
    h+='<div class="ans">'+esc(e.w)+'：'+esc(e.m.join("；"))+'</div>';
  }
  if(e.v&&e.v.length)h+='<div class="small">变体：'+esc(e.v.join("、"))+'</div>';
  return h;
}
function doSubmit(){
  const mod=sessMod(),e=curEntry(),qt=qType();
  const isMC=MC1.indexOf(qt)>=0||MC2.indexOf(qt)>=0;
  let u="",ok=false;
  if(isMC){
    const ob=$("#opts");if(!ob||ob._done)return;
    const sel=ob.querySelector("button.sel");if(!sel){toast("请先选择一个选项");return;}
    u=sel.getAttribute("data-v");
    const correct=$("#correct").value;
    ok=(u===correct);
    ob._done=true;
    ob.querySelectorAll("button").forEach(b=>{
      b.disabled=true;
      if(b.getAttribute("data-v")===correct)b.classList.add("ok");
      else if(b===sel)b.classList.add("bad");
    });
  }else{
    const inp=$("#ans");u=inp.value.trim();
    if(!u){toast("请先作答");return;}
    ok=gradeEn(e,u);
    inp.disabled=true;
  }
  const btn=$("#submit");btn.disabled=true;btn.textContent="已提交";
  const ansText=e.w+(e.v&&e.v.length?"（"+e.v.join("、")+"）":"");
  const qk=(mod==="phr"||mod==="sim")?(qt||mod):mod;
  markResult(mod,e.i,ok,u,ansText,!!sess.redo,qk);
  if(sess.redo){if(!sess.rlMap)sess.rlMap={};sess.rlMap[mod+":"+e.i]=ok?"g":"r";}
  if((mod==="phr"||mod==="sim")&&S.w[mod][e.i])S.w[mod][e.i].sub=qt;
  if(sess.quiz){
    const key=mod+":"+e.i,ex=(sess.quizRes||[]).find(r=>r.mod+":"+r.i===key);
    if(ex){ex.ok=ok;ex.u=u;}else sess.quizRes.push({mod:mod,i:e.i,ok:ok,u:u});
  }
  const fb=$("#fb");fb.className="fb "+(ok?"ok":"bad");fb.innerHTML=feedbackHtml(e,qt,ok,u);
  refreshMap(mod);
  if(sess.redo&&ok&&!sess.noModal)showRedoModal(mod,e.i);
}
function sessMod(){
  return (sess&&sess.redo)?(sess.redoList[sess.redoPtr].mod||sess.mod):sess.mod;
}
/* 进度图读取的题号状态键：短语/形近按子题型独立记录 */
function mapQk(mod){
  if(sess&&(sess.mod==="phr"||sess.mod==="sim")){
    if(sess.sub)return sess.sub;
    if(sess.redo&&sess.redoList[sess.redoPtr]&&sess.redoList[sess.redoPtr].sub)return sess.redoList[sess.redoPtr].sub;
  }
  return mod;
}
function mapHtml(mod){
  let cells="",total,done=0,label;
  if(sess&&sess.redo&&sess.mod!=="phr"&&sess.mod!=="sim"){
    total=sess.redoList.length;
    cells=sess.redoList.map((it,k)=>{
      const m0=it.mod||sess.mod;
      const c=(sess.rlMap&&sess.rlMap[m0+":"+it.i])||"";
      if(c)done++;
      return '<i data-k="'+k+'" class="'+c+'" title="'+MODNAME[m0]+" · 题"+it.i+" · "+esc(BY[it.i].w)+'"></i>';
    }).join("");
    label="错题进度（"+done+" / "+total+"）";
  }else if(sess&&sess.redo&&sess.redoList&&(sess.mod==="phr"||sess.mod==="sim")){
    const st=S.q[mapQk(mod)];
    total=sess.redoList.length;done=Object.keys(st).length;
    cells=sess.redoList.map((it,k)=>{
      return '<i data-k="'+k+'" class="'+(st[it.i]||"")+'" title="第 '+(k+1)+' 题 · 题'+it.i+" · "+esc(BY[it.i].w)+'"></i>';
    }).join("");
    label="题号进度图（"+done+" / "+total+"）";
  }else{
    const L=qlist(mod);
    const st=S.q[mapQk(mod)];total=L.length;done=Object.keys(st).length;
    const seq=(sess&&sess.rand&&sess.order)?sess.order:null;
    for(let p=0;p<L.length;p++){
      const li=seq?seq[p]:p;const c=st[L[li].i];
      cells+='<i data-i="'+L[li].i+'"'+(seq?' data-p="'+p+'"':'')+' class="'+(c||"")+'" title="'+(seq?"第 "+(p+1)+" 题 · ":"")+L[li].i+". "+esc(L[li].w)+'"></i>';
    }
    label="题号进度图（"+done+" / "+total+"）";
  }
  return '<details class="map" id="mapbox"><summary>'+label+'</summary>'+
    '<div class="legend"><span><em style="background:#2e9e5b"></em>最近一次做对</span><span><em style="background:#d64545"></em>最近一次做错</span><span><em style="background:#d7dae2"></em>未做</span></div>'+
    '<div class="grid" id="qgrid" style="max-height:260px;overflow:auto">'+cells+'</div></details>';
}
function refreshMap(mod){
  const box=$("#mapbox");if(!box)return;
  const grid=box.querySelector("#qgrid");if(!grid)return;
  if(sess&&sess.redo&&sess.mod!=="phr"&&sess.mod!=="sim"){
    const total=sess.redoList.length;let done=0;
    grid.querySelectorAll("i").forEach(el=>{
      const it=sess.redoList[parseInt(el.getAttribute("data-k"),10)];
      const c=(sess.rlMap&&sess.rlMap[(it.mod||sess.mod)+":"+it.i])||"";
      if(c)done++;
      el.className=c;
    });
    box.querySelector("summary").textContent="错题进度（"+done+" / "+total+"）";
    return;
  }
  const st=S.q[mapQk(mod)];
  const isSubSess=!!(sess&&sess.redo&&sess.redoList&&(sess.mod==="phr"||sess.mod==="sim"));
  box.querySelector("summary").textContent="题号进度图（"+Object.keys(st).length+" / "+(isSubSess?sess.redoList.length:qlist(mod).length)+"）";
  grid.querySelectorAll("i").forEach(el=>{
    const dk=el.getAttribute("data-k");
    if(dk!==null&&isSubSess){
      const it=sess.redoList[parseInt(dk,10)];
      el.className=st[it.i]||"";
      return;
    }
    const i=el.getAttribute("data-i");
    el.className=st[i]||"";
  });
}
function bindMap(){
  const g=$("#qgrid");
  if(g)g.onclick=ev=>{
    const t=ev.target.closest("i");if(!t||!sess)return;
    const di=t.getAttribute("data-i");
    if(di){
      const dp=t.getAttribute("data-p");
      if(dp!==null&&!sess.redo){sess.idx=parseInt(dp,10);renderTrain();$("#mapbox").open=true;return;}
      const L=qlist(sess.mod);
      let pos=L.findIndex(x=>x.i===parseInt(di,10));
      if(pos<0)return;
      if(sess.redo){sess.redoPtr=pos;renderTrain();$("#mapbox").open=true;return;}
      if(sess.rand&&sess.order)pos=sess.order.indexOf(pos);
      sess.idx=pos;
      renderTrain();
      $("#mapbox").open=true;
      return;
    }
    if(sess.redo){sess.redoPtr=parseInt(t.getAttribute("data-k"),10);renderTrain();$("#mapbox").open=true;return;}
  };
}
function showRedoModal(mod,i){
  const mask=document.createElement("div");mask.className="modal-mask";
  mask.innerHTML='<div class="modal"><div style="font-size:16px;margin-bottom:6px">✅ 答对了！</div><div class="small" style="margin-bottom:14px">是否将此题移出错题本？</div>'+
    '<button class="btn" id="m-out">移出错题本</button><button class="btn gray" id="m-keep">仍保留为错题</button></div>';

  mask.querySelector("#m-out").onclick=()=>{delete S.w[mod][i];save();toast("已移出错题本");mask.remove();};
  mask.querySelector("#m-keep").onclick=()=>{toast("已保留");mask.remove();};
}

/* ---------- 综合测验 ---------- */
let quizCfg={n:20,types:{c2e:true,m1:true,m2:true,sp:true,phr:false,sim:false},scope:"all",scopeSub:""};
function quizScopeOk(e){
  const s=quizCfg.scope;
  if(s==="all")return true;
  if(s==="wrong")return ALLMODS.some(m=>S.w[m][e.i]);
  if(s==="fav")return S.f.q.some(x=>x.i===e.i)||isFavC(e.i);
  if(s==="undone")return !ALLMODS.some(m=>S.q[m][e.i]);
  if(s==="pos")return e.cats.indexOf(quizCfg.scopeSub)>=0;
  if(s==="letter")return e.w.toLowerCase().charAt(0)===quizCfg.scopeSub;
  return true;
}
function renderQuizSetup(){
  let h='<div class="card"><h2>综合测验<button class="btn gray bk-btn" id="backbtn">‹ 返回</button></h2>'+
    '<div class="small" style="margin-bottom:8px">自定义题量、题型与范围，最后一题提交后生成成绩报告；测验错题会计入对应模块错题本</div>'+
    '<h3>题量</h3><select id="qn">'+[10,20,30,50].map(n=>'<option value="'+n+'"'+(quizCfg.n===n?" selected":"")+">"+n+" 题</option>").join("")+'</select>'+
    '<h3>题型</h3><div>'+ALLMODS.map(m=>'<span class="chip'+(quizCfg.types[m]?" on":"")+'" data-tp="'+m+'" style="user-select:none">'+MODNAME[m]+"</span>").join("")+'</div>'+
    '<h3>范围</h3><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><select id="qscope">'+
    [["all","全部词条"],["wrong","仅错题"],["fav","仅收藏"],["undone","仅未做"],["pos","按词性"],["letter","按首字母"]].map(x=>'<option value="'+x[0]+'"'+(quizCfg.scope===x[0]?" selected":"")+">"+x[1]+"</option>").join("")+'</select>'+
    '<span id="qscope2"></span></div>'+
    '<div><button class="btn" id="qstart">开始测验</button></div></div>';
  $("#view").innerHTML=h;
  $("#backbtn").onclick=()=>go("study");
  function scope2(){
    const box=$("#qscope2");
    if(quizCfg.scope==="pos"){
      if(!quizCfg.scopeSub)quizCfg.scopeSub="n";
      const POSL=[["n","名词"],["v","动词"],["adj","形容词"],["adv","副词"],["prep","介词"],["conj","连词"],["pron","代词"],["modal","情态动词"],["phr","短语"]];
      box.innerHTML='<select id="qpos">'+POSL.map(x=>'<option value="'+x[0]+'"'+(quizCfg.scopeSub===x[0]?" selected":"")+">"+x[1]+"</option>").join("")+'</select>';
      $("#qpos").onchange=ev=>{quizCfg.scopeSub=ev.target.value;};
    }else if(quizCfg.scope==="letter"){
      if(!quizCfg.scopeSub)quizCfg.scopeSub="a";
      box.innerHTML='<select id="qltr">'+"abcdefghijklmnopqrstuvwxyz".split("").map(c=>'<option'+(quizCfg.scopeSub===c?" selected":"")+">"+c+"</option>").join("")+'</select>';
      $("#qltr").onchange=ev=>{quizCfg.scopeSub=ev.target.value;};
    }else box.innerHTML="";
  }
  scope2();
  $("#qscope").onchange=ev=>{quizCfg.scope=ev.target.value;quizCfg.scopeSub="";scope2();};
  $("#qn").onchange=ev=>{quizCfg.n=parseInt(ev.target.value,10);};
  $("#view").querySelectorAll("[data-tp]").forEach(c=>c.onclick=()=>{
    const m=c.getAttribute("data-tp");
    quizCfg.types[m]=!quizCfg.types[m];
    c.className="chip"+(quizCfg.types[m]?" on":"")+"";
  });
  $("#qstart").onclick=startQuiz;
}
function startQuiz(){
  const mods=ALLMODS.filter(m=>quizCfg.types[m]);
  if(!mods.length){toast("请至少选择一种题型");return;}
  const PHRS=["pm1","pm2","ps"],SIMS=["sm1","sm2","ss"];
  const byWord={};
  mods.forEach(m=>{
    qlist(m).forEach(e=>{
      if(!quizScopeOk(e))return;
      const sub=m==="phr"?PHRS[Math.floor(Math.random()*3)]:m==="sim"?SIMS[Math.floor(Math.random()*3)]:undefined;
      (byWord[e.i]=byWord[e.i]||[]).push({i:e.i,mod:m,sub:sub});
    });
  });
  const words=Object.keys(byWord);
  const usedSyn={},picked=[];
  for(const wi of sample(words,words.length)){
    const e=BY[wi];
    const key=e.syn?("s"+e.syn):("i"+wi);
    if(usedSyn[key])continue;
    usedSyn[key]=1;
    const opts=byWord[wi];
    picked.push(opts[Math.floor(Math.random()*opts.length)]);
    if(picked.length>=quizCfg.n)break;
  }
  if(!picked.length){toast("范围内没有可出的题目");return;}
  enterList("quiz",picked,"quiz",{quiz:true,noModal:true,quizRes:[]});
}
function quizUnanswered(){
  const done={};
  (sess.quizRes||[]).forEach(r=>{done[r.mod+":"+r.i]=1;});
  const out=[];
  sess.redoList.forEach(it=>{
    const m0=it.mod||sess.mod;
    if(done[m0+":"+it.i])return;
    done[m0+":"+it.i]=1;
    out.push({mod:m0,i:it.i});
  });
  return out;
}
function showQuizFinishModal(){
  const left=quizUnanswered();
  const answered=(sess.quizRes||[]).length;
  const mask=document.createElement("div");mask.className="modal-mask";
  mask.innerHTML='<div class="modal"><div style="font-size:16px;margin-bottom:6px">确认完成测验？</div>'+
    '<div class="small" style="margin-bottom:14px">已作答 '+answered+" / "+sess.redoList.length+" 题"+(left.length?"，还有 "+left.length+" 题未作答，未作答将按答错计。":"。全部题目已作答。")+'</div>'+
    '<button class="btn" id="m-ok">确认</button><button class="btn gray" id="m-go">继续做</button></div>';
  document.body.appendChild(mask);
  mask.querySelector("#m-ok").onclick=()=>{
    left.forEach(x=>{
      const e=BY[x.i];
      const ansText=e.w+(e.v&&e.v.length?"（"+e.v.join("、")+"）":"");
      markResult(x.mod,x.i,false,"",ansText,true);
      sess.quizRes.push({mod:x.mod,i:x.i,ok:false,u:""});
    });
    mask.remove();
    renderQuizReport();
  };
  mask.querySelector("#m-go").onclick=()=>{mask.remove();};
}
function renderQuizReport(){
  const res=sess.quizRes||[];
  const ok=res.filter(r=>r.ok).length;
  const acc=res.length?Math.round(ok/res.length*100):0;
  let h='<div class="card"><h2>测验报告<button class="btn gray bk-btn" id="backbtn">‹ 返回</button></h2>'+
    '<div class="stat">'+
    '<div class="it"><span class="small">题目数</span><b>'+res.length+'</b></div>'+
    '<div class="it"><span class="small">答对</span><b>'+ok+'</b></div>'+
    '<div class="it"><span class="small">正确率</span><b>'+acc+'%</b></div></div>';
  const wrong=res.filter(r=>!r.ok);
  if(wrong.length){
    h+='<h3>错题（'+wrong.length+'）</h3>'+wrong.map(r=>'<div class="row"><span class="dot r"></span><span class="tag">'+MODNAME[r.mod]+'</span><b>'+esc(BY[r.i].w)+'</b><span class="small">你的答案：'+esc(r.u||"—")+' · 正解：'+esc(BY[r.i].w)+'</span></div>').join("");
  }else h+='<div class="small" style="margin-top:10px">全部答对，太棒了 🎉</div>';
  h+='<div><button class="btn" id="qagain">再测一次</button>'+(wrong.length?'<button class="btn sec" id="qwrong">重测本次错题</button>':"")+'</div></div>';
  $("#view").innerHTML=h;
  curNav="quiz";
  if(location.hash!=="#quiz")location.hash="quiz";
  $("#backbtn").onclick=()=>go("quiz");
  $("#qagain").onclick=()=>go("quiz");
  const qw=$("#qwrong");
  if(qw)qw.onclick=()=>{
    const PHRS=["pm1","pm2","ps"],SIMS=["sm1","sm2","ss"];
    const items=wrong.map(r=>({i:r.i,mod:r.mod,sub:r.mod==="phr"?PHRS[Math.floor(Math.random()*3)]:r.mod==="sim"?SIMS[Math.floor(Math.random()*3)]:undefined}));
    enterList("quiz",items,"quiz",{quiz:true,noModal:true,quizRes:[]});
  };
}

/* ---------- 错题重练 ---------- */
let redoFilter="all";
function renderRedo(){
  let items=[];
  ALLMODS.forEach(m=>{Object.keys(S.w[m]).forEach(i=>{
    const w=S.w[m][i];if(!BY[i])return;
    items.push({mod:m,i:parseInt(i,10),c:w.c,t:w.t,last:w.last});
  });});
  if(redoFilter!=="all")items=items.filter(x=>x.mod===redoFilter);
  items.sort((a,b)=>b.c-a.c||b.t-a.t);
  let h='<div class="card"><h2>错题重练<button class="btn gray bk-btn" id="backbtn">‹ 返回</button></h2><div class="small" style="margin-bottom:8px">各训练模块独立错题本，共 '+items.length+' 题</div>';
  h+='<div style="margin-bottom:8px"><select id="rfilter"><option value="all">全部模块</option>'+ALLMODS.map(m=>'<option value="'+m+'"'+(redoFilter===m?" selected":"")+">"+MODNAME[m]+"</option>").join("")+'</select></div>';
  if(!items.length)h+='<div class="small">暂无错题 🎉</div>';
  h+=items.map((x,k)=>{
    const e=BY[x.i];
    const dot=S.q[x.mod][x.i]||"";
    return '<div class="row"><span class="dot '+dot+'"></span><span class="tag">'+MODNAME[x.mod]+'</span>'+
      "<b>"+esc(e.w)+'</b><span class="pos">'+esc(typeLabel(e))+'</span>'+
      '<span class="small">'+esc(e.m.slice(0,2).join("；"))+'</span>'+
      '<span class="small">错 '+x.c+' 次 · '+(x.last?"最后答对":"最后答错")+" · "+fmtT(x.t)+'</span>'+
      '<span style="flex:1"></span><button class="btn sec" data-k="'+k+'" style="margin:0">重练</button></div>';
  }).join("");
  h+="</div>";
  $("#view").innerHTML=h;
  $("#backbtn").onclick=()=>go("study");
  $("#rfilter").onchange=ev=>{redoFilter=ev.target.value;renderRedo();};

let logFilter="all",logShown=15;
function dayKey(t){const d=new Date(t);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function streakDays(){
  const days={};S.log.forEach(r=>days[dayKey(r.t)]=1);
  let n=0;const d=new Date();
  if(!days[dayKey(d.getTime())])d.setDate(d.getDate()-1);
  while(days[dayKey(d.getTime())]){n++;d.setDate(d.getDate()-1);}
  return n;
}
function totalDays(){const days={};S.log.forEach(r=>days[dayKey(r.t)]=1);return Object.keys(days).length;}
function renderHome(){
  const total=S.log.length;
  const okN=S.log.filter(r=>r.ok).length;
  const today=dayKey(Date.now());
  const todayN=S.log.filter(r=>dayKey(r.t)===today).length;
  const now=Date.now(),day=86400000;
  function acc(since){const rs=S.log.filter(r=>r.t>=since);if(!rs.length)return null;return Math.round(rs.filter(r=>r.ok).length/rs.length*100);}
  const a7=acc(now-7*day),a30=acc(now-30*day);
  let wrongN=0;ALLMODS.forEach(m=>wrongN+=Object.keys(S.w[m]).length);
  const perMod=ALLMODS.map(m=>{
    const rs=S.log.filter(r=>r.mod===m);
    const done=Object.keys(S.q[m]).length,mtotal=qlist(m).length;
    const pct=mtotal?Math.round(done/mtotal*100):0;
    const accTxt=rs.length?Math.round(rs.filter(r=>r.ok).length/rs.length*100)+"%":"—";
    return '<div class="it"><span class="small">'+MODNAME[m]+'</span><b>'+accTxt+'</b>'+
      '<div style="background:#eef0f5;border-radius:6px;height:8px;margin:6px 0 4px"><div style="background:var(--pri);border-radius:6px;height:8px;width:'+pct+'%"></div></div>'+
      '<span class="small">已完成 '+done+" / "+mtotal+"</span></div>";
  }).join("");
  let h='<div class="card"><h2>首页 · 学习轨迹</h2><div class="stat stat3">'+
    '<div class="it"><span class="small">总答题数</span><b>'+total+'</b></div>'+
    '<div class="it"><span class="small">总正确率</span><b>'+(total?Math.round(okN/total*100)+"%":"—")+'</b></div>'+
    '<div class="it"><span class="small">错题数</span><b>'+wrongN+'</b></div>'+
    '<div class="it"><span class="small">收藏数</span><b>'+(S.f.q.length+S.f.c.length)+'</b></div>'+
    '<div class="it"><span class="small">今日答题</span><b>'+todayN+'</b></div>'+
    '<div class="it"><span class="small">连续学习</span><b>'+streakDays()+' 天</b></div>'+
    '<div class="it"><span class="small">学习总天数</span><b>'+totalDays()+' 天</b></div>'+
    '<div class="it"><span class="small">近 7 天正确率</span><b>'+(a7===null?"—":a7+"%")+'</b></div>'+
    '<div class="it"><span class="small">近 30 天正确率</span><b>'+(a30===null?"—":a30+"%")+'</b></div></div><div class="stat stat4">'+perMod+'</div>';
  // 近 7 日答题量（显示在最近记录上方）
  const days=[];
  for(let k=6;k>=0;k--){const d=new Date(now-k*day);days.push({label:(d.getMonth()+1)+"/"+d.getDate(),n:S.log.filter(r=>dayKey(r.t)===dayKey(d.getTime())).length});}
  const maxN=Math.max(1,days.reduce((m,x)=>Math.max(m,x.n),0));
  h+='<h3>近 7 日答题量</h3><div style="display:flex;gap:6px;height:96px;margin:6px 0 2px">'+
    days.map(x=>'<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end"><div title="'+x.n+' 题" style="background:var(--pri);border-radius:3px;height:'+Math.max(3,Math.round(x.n/maxN*64))+'px"></div><div class="small" style="text-align:center;font-size:11px;margin-top:2px">'+x.label+"<br>"+x.n+"</div></div>").join("")+"</div>";
  let rsAll=logFilter==="all"?S.log:S.log.filter(r=>r.mod===logFilter);
  h+='<h3>最近记录（共 '+rsAll.length+' 条，每次显示 15 条）</h3><div style="margin-bottom:8px"><select id="lfilter"><option value="all">全部模块</option>'+ALLMODS.map(m=>'<option value="'+m+'"'+(logFilter===m?" selected":"")+">"+MODNAME[m]+"</option>").join("")+'</select></div>';
  const rs=rsAll.slice(-logShown).reverse();
  if(!rs.length)h+='<div class="small">暂无记录</div>';
  h+=rs.map(r=>'<div class="row"><span class="dot '+(r.ok?"g":"r")+'"></span><span class="small mono">'+fmtT(r.t)+'</span><span class="tag">'+MODNAME[r.mod]+'</span>'+
    "<b>"+esc(r.w)+"</b>"+(r.redo?'<span class="tag">重练</span>':"")+
    '<span class="small">答：'+esc(r.u||"—")+" · "+(r.ok?"✅":"❌ 正解："+esc(r.a))+"</span></div>").join("");
  if(rsAll.length>rs.length)h+='<button class="btn sec" id="morelog">显示更多（还有 '+(rsAll.length-rs.length)+" 条）</button>";
  h+="</div>";
  $("#view").innerHTML=h;
  $("#lfilter").onchange=ev=>{logFilter=ev.target.value;logShown=15;renderHome();};
  const ml=$("#morelog");if(ml)ml.onclick=()=>{logShown+=15;renderHome();};
}

let webSel=null,webQuery="",webStack=[],webFilter={type:"",status:"",letter:""},webShown=100;
function renderWeb(){
  const TYPES=[["","全部类型"],["word","单词"],["phrase","短语"],["abbr","缩写"]];
  const STATUS=[["","全部状态"],["done","已做过"],["undone","未做过"],["wrong","有错"],["fav","已收藏"]];
  let h='<div class="card"><h2>词网联想</h2><div id="wtop">'+
    '<input type="text" id="wsearch" placeholder="搜索英文或中文…" autocomplete="off" value="'+esc(webQuery)+'">'+
    '<div style="margin:8px 0;display:flex;gap:8px;flex-wrap:wrap">'+
    '<select id="ftype">'+TYPES.map(x=>'<option value="'+x[0]+'"'+(webFilter.type===x[0]?" selected":"")+">"+x[1]+"</option>").join("")+'</select>'+
    '<select id="fstatus">'+STATUS.map(x=>'<option value="'+x[0]+'"'+(webFilter.status===x[0]?" selected":"")+">"+x[1]+"</option>").join("")+'</select>'+
    '<select id="fletter"><option value="">首字母</option>'+"abcdefghijklmnopqrstuvwxyz".split("").map(c=>'<option'+(webFilter.letter===c?" selected":"")+">"+c.toUpperCase()+"</option>").join("")+'</select></div>'+
    '<div id="wres"></div></div><div id="wdetail"></div></div>';
  $("#view").innerHTML=h;
  const inp=$("#wsearch");
  function hits(){
    const q=inp.value.trim().toLowerCase();
    return EN.filter(e=>{
      if(webFilter.type&&e.type!==webFilter.type)return false;
      if(webFilter.letter&&e.w.toLowerCase().charAt(0)!==webFilter.letter)return false;
      if(webFilter.status==="done"&&!ALLMODS.some(m=>S.q[m][e.i]))return false;
      if(webFilter.status==="undone"&&ALLMODS.some(m=>S.q[m][e.i]))return false;
      if(webFilter.status==="wrong"&&!ALLMODS.some(m=>S.w[m][e.i]))return false;
      if(webFilter.status==="fav"&&!isFavC(e.i)&&!S.f.q.some(x=>x.i===e.i))return false;
      if(q&&!(e.w.toLowerCase().indexOf(q)>=0||e.m.some(m=>m.indexOf(q)>=0)||e.pos.toLowerCase().indexOf(q)>=0))return false;
      return true;
    });
  }
  function draw(){
    webQuery=inp.value;
    if(!inp.value.trim()&&!webFilter.type&&!webFilter.status&&!webFilter.letter){$("#wres").innerHTML='<div class="small" style="margin-top:8px">输入关键词开始搜索（英文 / 中文 / 词性），或用下方筛选器浏览词表</div>';return;}
    const all=hits();
    const list=all.slice(0,webShown);
    let r='<div class="small" style="margin:8px 0">命中 '+all.length+' 条'+(all.length>list.length?"，显示前 "+list.length+" 条":"")+"</div>";
    r+=list.map(e=>{
      const dots=ALLMODS.map(m=>'<i class="dot '+(S.q[m][e.i]||"")+'" title="'+MODNAME[m]+'"></i>').join(" ");
      return '<div class="row" style="cursor:pointer" data-w="'+esc(e.w)+'">'+dots+'<b>'+esc(e.w)+'</b><span class="pos">'+esc(typeLabel(e))+'</span><span class="small">'+esc(e.m.slice(0,2).join("；"))+'</span></div>';
    }).join("");
    if(all.length>list.length)r+='<button class="btn sec" id="wmore">显示更多（还有 '+(all.length-list.length)+' 条）</button>';
    $("#wres").innerHTML=r;
    $("#wres").querySelectorAll("[data-w]").forEach(row=>row.onclick=()=>{webStack=[];showDetail(BY[EN.find(e=>e.w===row.getAttribute("data-w")).i]);});
    const wm=$("#wmore");if(wm)wm.onclick=()=>{webShown+=100;draw();};
  }
  inp.addEventListener("input",()=>{webShown=100;draw();});
  inp.addEventListener("keydown",ev=>{if(ev.key==="Enter"){const q=inp.value.trim().toLowerCase();const hit=EN.find(e=>e.w.toLowerCase()===q);if(hit){webStack=[];showDetail(hit);}}});
  $("#ftype").onchange=ev=>{webFilter.type=ev.target.value;webShown=100;draw();};
  $("#fstatus").onchange=ev=>{webFilter.status=ev.target.value;webShown=100;draw();};
  $("#fletter").onchange=ev=>{webFilter.letter=ev.target.value.toLowerCase();webShown=100;draw();};
  draw();
  if(webSel){const hit=EN.find(e=>e.w===webSel);if(hit)showDetail(hit);}
  webSel=null;
  inp.focus();
}

  h+=sec("短语家族",fam,"fam");

  h+='<div class="small" style="margin-top:14px">词表版本：'+EN.length+" 词条 · 数据保存在本浏览器 localStorage，换设备请用导出/导入迁移</div></div>";

    else if(k==="fav"){data={f:S.f};name="vocab-fav";}
    else{data={log:S.log};name="vocab-log";}
    const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name+"-"+new Date().toISOString().slice(0,10)+".json";a.click();
    toast("已导出");
  });
  $("#imp").onchange=ev=>{

    rd.onload=()=>{

        if(!confirm("导入将覆盖现有对应数据（导入前会自动备份当前数据）。确定继续吗？"))return;
        backup("导入前备份");

          if(d.log){S.log=d.log.slice(-3000);}
        }
        save();toast("导入成功");renderSet();
      }catch(e){alert("文件解析失败：不是有效的 JSON");}
    };
    rd.readAsText(f);
  };
  $("#view").querySelectorAll("[data-rs]").forEach(b=>b.onclick=()=>{
    const k=b.getAttribute("data-rs");
    if(!confirm("确定重置吗？当前数据会先自动备份。"))return;
    backup("重置前备份");
    if(k==="q")S.q=mkeys0();
    else if(k==="w")S.w=mkeys0();
    else if(k==="f")S.f={q:[],c:[]};
    else if(k==="log")S.log=[];
    else S=blank();
    save();toast("已重置");renderSet();
  });
  $("#view").querySelectorAll("[data-br]").forEach(b=>b.onclick=()=>{
    const bk=S.bk[parseInt(b.getAttribute("data-br"),10)];
    if(!confirm("恢复此备份？当前数据将被覆盖（也会先备份）。"))return;
    backup("恢复前备份");
    const keep=S.bk;S=Object.assign(blank(),JSON.parse(JSON.stringify(bk.data)));S.bk=keep;
    save();toast("已恢复");renderSet();
  });
  $("#view").querySelectorAll("[data-bd]").forEach(b=>b.onclick=()=>{
    S.bk.splice(parseInt(b.getAttribute("data-bd"),10),1);save();renderSet();toast("已删除备份");
  });
}

/* ---------- 路由 ---------- */
let curNav="";
const VIEWS=["home","study","web","set","c2e","m1","m2","sp","phr","sim","quiz","redo","fav"];
function go(name){
  curNav=name;
  sess=null;
  const nk=NAV_ALIAS[name]||name;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.getAttribute("data-m")===nk));
  if(name==="home"){logShown=15;renderHome();}
  else if(name==="study")renderStudy();
  else if(name==="web")renderWeb();
  else if(name==="set")renderSet();
  else if(name==="redo")renderRedo();
  else if(name==="fav")renderFav();
  else if(name==="quiz")renderQuizSetup();
  else if(name==="phr")renderSubPick("phr");
  else if(name==="sim")renderSubPick("sim");
  else{sess={mod:name,idx:0,rand:!!(S.set&&S.set.rand&&S.set.rand[name])};if(sess.rand)ensureOrder();renderTrain();}
  if(location.hash!=="#"+name)location.hash=name;
  window.scrollTo(0,0);
}
function render(){
  if(sess&&(sess.redo||sess.mod==="m1"||sess.mod==="m2"||sess.mod==="c2e"||sess.mod==="sp")){
    renderTrain();bindMap();
  }
}
window.addEventListener("hashchange",()=>{
  setTimeout(()=>{const n=location.hash.replace("#","");if(VIEWS.indexOf(n)>=0&&n!==curNav)go(n);},0);
});
$("#nav").innerHTML=NAVS.map(n=>'<button data-m="'+n[0]+'">'+n[1]+"</button>").join("");
$("#nav").addEventListener("click",ev=>{
  const b=ev.target.closest("button");if(!b)return;
  go(b.getAttribute("data-m"));
});
load();
const init=location.hash.replace("#","");
if(VIEWS.indexOf(init)>=0)go(init);else go("home");
</script>
